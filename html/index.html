<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">CREATE</button>
                    <button class="tab-btn" data-tab="lobby" data-locale="tab_list">LOBBY</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Main Content -->
                <main class="lobby-browser">
                    <!-- Tab: FFA & LOBBY List -->
                    <div id="tab-list-content">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </div>

                    <!-- Tab: Create Lobby -->
                    <div id="tab-create-content" style="display: none;">
                        <div class="create-form-wrapper">
                            <h2 data-locale="tab_create">CREATE CUSTOM LOBBY</h2>
                            <div class="form-container">
                                <div class="input-group">
                                    <label data-locale="lobby_name">LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label data-locale="map_select">MAP</label>
                                        <select id="map-select"></select>
                                    </div>
                                    <div class="input-group">
                                        <label data-locale="mode_select">MODE</label>
                                        <select id="mode-select">
                                            <option value="ffa">FFA</option>
                                            <option value="tdm">TEAM DEATHMATCH</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label data-locale="loadout_select">LOADOUT</label>
                                    <div id="loadout-checkboxes" class="checkbox-grid">
                                        <!-- Loadout checkboxes will be injected here -->
                                    </div>
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label><span data-locale="round_time">TIME (MIN)</span>: <span id="round-time-val">15</span></label>
                                        <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                    </div>
                                    <div class="input-group">
                                        <label><span data-locale="max_players">MAX PLAYERS</span>: <span id="max-players-val">16</span></label>
                                        <input type="range" id="max-players" min="2" max="32" step="1" value="16">
                                    </div>
                                </div>
                                <div class="input-row">
                                    <div class="input-group toggle-group">
                                        <label data-locale="vehicles_allowed">VEHICLES ALLOWED</label>
                                        <label class="switch">
                                            <input type="checkbox" id="vehicles-allowed">
                                            <span class="slider-round"></span>
                                        </label>
                                    </div>
                                    <div class="input-group toggle-group">
                                        <label data-locale="friendly_fire">FRIENDLY FIRE</label>
                                        <label class="switch">
                                            <input type="checkbox" id="friendly-fire">
                                            <span class="slider-round"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label><span data-locale="respawn_time">RESPAWN TIME (SEC)</span>: <span id="respawn-time-val">5</span></label>
                                        <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                    </div>
                                    <div class="input-group">
                                        <label><span data-locale="kill_limit">KILL LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                        <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                    </div>
                                </div>
                                <div class="btn-group">
                                    <button class="confirm-btn" id="btn-create-lobby" data-locale="btn_create">CREATE</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                    <button class="edit-settings-btn" id="btn-edit-settings" style="display: none;"><i class="fa-solid fa-gear"></i></button>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="players_header">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 data-locale="settings_header">SETTINGS</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red" data-locale="team_red">RED</button>
                            <button class="team-btn" data-team="random" id="btn-team-random" data-locale="random">RANDOM</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec" data-locale="spectator">SPECTATOR</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-left">
            <div class="hud-timer">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-round-timer">00:00</span>
            </div>
        </div>
        <div class="hud-top-right">
            <div class="hud-score-tdm" id="hud-tdm-scores" style="display: none;">
                <div class="score-box blue">
                    <span class="score-label">BLUE</span>
                    <span id="score-blue">0</span>
                </div>
                <div class="score-box red">
                    <span class="score-label">RED</span>
                    <span id="score-red">0</span>
                </div>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-weapon-info">
                <div class="ammo-count" id="hud-ammo">100</div>
                <div class="weapon-icon"><i class="fa-solid fa-gun"></i></div>
            </div>
            <div class="hud-stats-box">
                <div class="stat-item">
                    <span class="stat-label" data-locale="kills">KILLS</span>
                    <span id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label" data-locale="deaths">DEATHS</span>
                    <span id="hud-deaths">0</span>
                </div>
            </div>
        </div>
        <div class="hud-bottom-left">
            <div class="status-bars">
                <div class="bar-container health">
                    <div class="bar-fill" id="hud-health-fill" style="width: 100%;"></div>
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="bar-container armor">
                    <div class="bar-fill" id="hud-armor-fill" style="width: 100%;"></div>
                    <i class="fa-solid fa-shield"></i>
                </div>
            </div>
        </div>
        <div id="countdown-display" class="countdown-overlay" style="display: none;">10</div>
    </div>

    <!-- Scoreboard -->
    <div id="scoreboard" style="display: none;">
        <div class="scoreboard-content">
            <h2 data-locale="scoreboard_title">MATCH SCOREBOARD</h2>
            <div id="scoreboard-table-container"></div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title" data-locale="game_ended">MATCH ENDED</h1>
            <h2 id="winner-name">PLAYER WINS!</h2>
            <div id="match-stats-table"></div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_back_lobby">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu" data-locale="btn_back_menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
