<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESX FFA LOBBY SYSTEM</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- TAB 1 & 3: LOBBY BROWSER -->
                <div id="tab-browser" class="tab-content active">
                    <aside class="sidebar">
                        <div class="filter-group" id="filter-container">
                            <label><span data-locale="map_select">MAPS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span data-locale="filter_free_slots">FREE SLOTS</span></label>
                            <div class="toggle-switch">
                                <input type="checkbox" id="filter-free-slots">
                                <span class="slider"></span>
                            </div>
                        </div>
                        <div class="stats-sidebar" id="player-global-stats">
                            <h3 data-locale="score">STATS</h3>
                            <div class="stat-row">
                                <span data-locale="kills">Kills</span>
                                <span id="stat-kills">0</span>
                            </div>
                            <div class="stat-row">
                                <span data-locale="deaths">Tode</span>
                                <span id="stat-deaths">0</span>
                            </div>
                            <div class="stat-row">
                                <span data-locale="kd_ratio">K/D</span>
                                <span id="stat-kd">0.00</span>
                            </div>
                        </div>
                    </aside>

                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </main>
                </div>

                <!-- TAB 2: CREATE LOBBY -->
                <div id="tab-create" class="tab-content">
                    <div class="create-form-container">
                        <div class="form-grid">
                            <div class="form-section">
                                <div class="input-group">
                                    <label data-locale="lobby_name">LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                                </div>
                                <div class="input-group">
                                    <label data-locale="map_select">MAP</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="mode_select">MODE</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="loadout_select">LOADOUT</label>
                                    <select id="loadout-select" multiple size="5"></select>
                                    <small style="color: var(--text-muted); font-size: 10px; margin-top: 5px;">(STRG + KLICK FÜR MEHRFACHAUSWAHL)</small>
                                </div>
                            </div>
                            <div class="form-section">
                                <div class="input-group">
                                    <label><span data-locale="round_time">TIME</span>: <span id="round-time-val">15</span></label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="max_players">MAX PLAYERS</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="respawn_time">RESPAWN</span>: <span id="respawn-time-val">5</span></label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="kill_limit">KILL LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                                <div class="toggle-row">
                                    <div class="toggle-group">
                                        <label data-locale="vehicles_allowed">VEHICLES</label>
                                        <div class="toggle-switch">
                                            <input type="checkbox" id="vehicles-allowed">
                                            <span class="slider"></span>
                                        </div>
                                    </div>
                                    <div class="toggle-group">
                                        <label data-locale="friendly_fire">FRIENDLY FIRE</label>
                                        <div class="toggle-switch">
                                            <input type="checkbox" id="friendly-fire">
                                            <span class="slider"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="create-btn" id="btn-create-lobby" data-locale="btn_create">CREATE LOBBY</button>
                            <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">CANCEL</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                    <div class="host-controls" id="host-settings-btn" style="display: none;">
                        <i class="fa-solid fa-gear"></i>
                    </div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <div class="lobby-info-summary" id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red" data-locale="team_red">RED</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec" data-locale="spectator">SPECTATOR</button>
                            <button class="team-btn" data-team="random" id="btn-team-random" data-locale="random">RANDOM</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" data-locale-placeholder="chat_placeholder" placeholder="SEND MESSAGE...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">LEAVE</button>
                            <button class="cancel-btn" id="btn-close-lobby" style="display: none;" data-locale="btn_close_lobby">CLOSE LOBBY</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer" id="hud-timer">00:00</div>
            <div class="hud-tdm-score" id="hud-tdm-score" style="display: none;">
                <span class="score-blue">0</span>
                <span class="score-divider">:</span>
                <span class="score-red">0</span>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-stats-box">
                <div class="hud-stat">
                    <span class="label" data-locale="kills">KILLS</span>
                    <span class="value" id="hud-kills">0</span>
                </div>
                <div class="hud-stat">
                    <span class="label" data-locale="deaths">DEATHS</span>
                    <span class="value" id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-weapon-box">
                <div class="ammo-count" id="hud-ammo">0 / 0</div>
                <div class="weapon-icon" id="hud-weapon-icon">
                    <i class="fa-solid fa-gun"></i>
                </div>
            </div>
        </div>
        <div class="hud-bottom-left">
            <div class="bars-container">
                <div class="bar-wrapper">
                    <div class="bar-bg"></div>
                    <div class="bar-fill health" id="hud-health" style="width: 100%;"></div>
                </div>
                <div class="bar-wrapper">
                    <div class="bar-bg"></div>
                    <div class="bar-fill armor" id="hud-armor" style="width: 0%;"></div>
                </div>
            </div>
        </div>
        <div id="big-countdown" class="big-text" style="display: none;">10</div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title" data-locale="game_ended">MATCH ENDED</h1>
            <h2 id="winner-name-wrap"><span id="winner-name">PLAYER</span> <span data-locale="winner_suffix">WINS!</span></h2>

            <div class="winner-stats-container">
                <div id="match-stats-table"></div>
            </div>

            <div class="map-voting-section">
                <h3 data-locale="map_voting">VOTE FOR NEXT MAP</h3>
                <div class="map-votes" id="map-voting-container">
                    <!-- Dynamic map buttons -->
                </div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_ready">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu" data-locale="btn_leave">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
