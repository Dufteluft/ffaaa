<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESX FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome für Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header mit 3-Tab Struktur -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1 & 3: Lobby Browser (Geteiltes Layout) -->
                <div id="lobby-browser-tab" class="tab-content active">
                    <div class="browser-layout">
                        <aside class="sidebar">
                            <div class="filter-group">
                                <label data-locale="map_select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                                <select id="filter-maps">
                                    <option value="all">ALL MAPS</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label data-locale="loadout_select">WEAPONS <i class="fa-solid fa-chevron-down"></i></label>
                                <select id="filter-weapons">
                                    <option value="all">ALL WEAPONS</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label data-locale="max_players">PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                                <select id="filter-players">
                                    <option value="all">ANY</option>
                                    <option value="not-full">NOT FULL</option>
                                </select>
                            </div>

                            <div class="player-stats-sidebar">
                                <h3 data-locale="score">STATISTIKEN</h3>
                                <div class="stat-row">
                                    <span data-locale="kills">Kills</span>
                                    <span id="stat-kills">0</span>
                                </div>
                                <div class="stat-row">
                                    <span data-locale="deaths">Tode</span>
                                    <span id="stat-deaths">0</span>
                                </div>
                                <div class="stat-row">
                                    <span data-locale="kd_ratio">K/D</span>
                                    <span id="stat-kd">0.00</span>
                                </div>
                            </div>
                        </aside>

                        <main class="lobby-list-area">
                            <div class="lobby-list" id="lobby-list-container">
                                <!-- Lobbys werden hier dynamisch eingefügt -->
                            </div>
                        </main>
                    </div>
                </div>

                <!-- Tab 2: Lobby Erstellen -->
                <div id="create-lobby-tab" class="tab-content">
                    <div class="create-container">
                        <h2 data-locale="tab_create">NEUE LOBBY ERSTELLEN</h2>
                        <div class="create-form">
                            <div class="form-section">
                                <div class="input-group">
                                    <label data-locale="lobby_name">LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="Name eingeben...">
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label data-locale="map_select">MAP</label>
                                        <select id="map-select"></select>
                                    </div>
                                    <div class="input-group">
                                        <label data-locale="mode_select">MODUS</label>
                                        <select id="mode-select">
                                            <option value="ffa">FFA</option>
                                            <option value="tdm">TEAM DEATHMATCH</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label data-locale="loadout_select">LOADOUT</label>
                                    <select id="loadout-select" multiple class="multi-select"></select>
                                    <small>Halte STRG für Mehrfachauswahl</small>
                                </div>
                            </div>

                            <div class="form-section">
                                <div class="input-row">
                                    <div class="input-group">
                                        <label><span data-locale="round_time">RUNDENZEIT</span>: <span id="round-time-val">15</span>m</label>
                                        <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                    </div>
                                    <div class="input-group">
                                        <label><span data-locale="max_players">MAX SPIELER</span>: <span id="max-players-val">16</span></label>
                                        <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                    </div>
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label><span data-locale="respawn_time">RESPAWN ZEIT</span>: <span id="respawn-time-val">5</span>s</label>
                                        <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                    </div>
                                    <div class="input-group">
                                        <label><span data-locale="kill_limit">KILL LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                        <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                    </div>
                                </div>
                                <div class="toggle-row">
                                    <div class="toggle-group">
                                        <label data-locale="vehicles_allowed">FAHRZEUGE</label>
                                        <label class="switch">
                                            <input type="checkbox" id="vehicles-allowed">
                                            <span class="slider round"></span>
                                        </label>
                                    </div>
                                    <div class="toggle-group">
                                        <label data-locale="friendly_fire">FRIENDLY FIRE</label>
                                        <label class="switch">
                                            <input type="checkbox" id="friendly-fire">
                                            <span class="slider round"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="create-actions">
                                <button class="btn-primary" id="btn-create-lobby" data-locale="btn_create">ERSTELLEN</button>
                                <button class="btn-secondary" id="btn-cancel-create" data-locale="btn_cancel">ABBRECHEN</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lobby Wartebereich -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-waiting-card">
                <div class="waiting-header">
                    <h2 id="lobby-display-name">LOBBY NAME</h2>
                    <div class="lobby-status-tag" id="lobby-status-tag">WARTEN...</div>
                </div>

                <div class="waiting-body">
                    <div class="player-list-area">
                        <h3 data-locale="tab_list">SPIELER</h3>
                        <div id="player-list-container">
                            <!-- Spieler-Items werden hier eingefügt -->
                        </div>
                    </div>

                    <div class="lobby-settings-area">
                        <div class="settings-editor" id="settings-editor">
                            <!-- Host-Einstellungen werden hier geladen -->
                        </div>

                        <div class="team-management">
                            <h3 data-locale="mode_select">TEAM AUSWAHL</h3>
                            <div class="team-btns">
                                <button class="team-btn blue" data-team="blue" data-locale="team_blue">BLAU</button>
                                <button class="team-btn red" data-team="red" data-locale="team_red">ROT</button>
                                <button class="team-btn spec" data-team="spectator" data-locale="spectator">ZUSCHAUER</button>
                            </div>
                        </div>

                        <div class="lobby-chat-container">
                            <div id="lobby-chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="lobby-chat-input" placeholder="Nachricht senden...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="waiting-footer">
                    <button class="btn-ready" id="btn-lobby-ready" data-locale="btn_ready">BEREIT</button>
                    <button class="btn-start" id="btn-lobby-start" style="display: none;" data-locale="btn_start">STARTEN</button>
                    <button class="btn-danger" id="btn-lobby-leave" data-locale="btn_leave">VERLASSEN</button>
                    <!-- Nur für Host -->
                    <button class="btn-danger" id="btn-lobby-close" style="display: none;">LOBBY SCHLIEẞEN</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Gameplay HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-container">
            <!-- Obere Leiste: Zeit & Score -->
            <div class="hud-top">
                <div class="hud-timer">
                    <i class="fa-solid fa-clock"></i>
                    <span id="hud-time">00:00</span>
                </div>
                <div class="hud-score-container" id="hud-tdm-score" style="display: none;">
                    <div class="score-team blue">
                        <span class="score-val" id="score-blue">0</span>
                    </div>
                    <div class="score-divider">VS</div>
                    <div class="score-team red">
                        <span class="score-val" id="score-red">0</span>
                    </div>
                </div>
            </div>

            <!-- Mitte rechts: Kill Stats -->
            <div class="hud-stats-side">
                <div class="hud-stat-item">
                    <span class="stat-label" data-locale="kills">KILLS</span>
                    <span class="stat-value" id="hud-kills">0</span>
                </div>
                <div class="hud-stat-item">
                    <span class="stat-label" data-locale="deaths">TODE</span>
                    <span class="stat-value" id="hud-deaths">0</span>
                </div>
            </div>

            <!-- Unten rechts: Waffen & Munition -->
            <div class="hud-bottom-right">
                <div class="hud-weapon-info">
                    <div class="ammo-count">
                        <span id="hud-ammo-clip">0</span>
                    </div>
                    <div class="weapon-icon">
                        <i class="fa-solid fa-gun"></i>
                    </div>
                </div>
            </div>

            <!-- Unten links: Gesundheit & Rüstung -->
            <div class="hud-bottom-left">
                <div class="bars-container">
                    <div class="hud-bar-wrapper health">
                        <div class="hud-bar-inner" id="hud-health-bar" style="width: 100%;"></div>
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div class="hud-bar-wrapper armor">
                        <div class="hud-bar-inner" id="hud-armor-bar" style="width: 0%;"></div>
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                </div>
            </div>

            <!-- Countdown Overlay -->
            <div id="hud-countdown" class="hud-countdown-overlay" style="display: none;">
                <div class="countdown-number" id="countdown-number">10</div>
                <div class="countdown-text" data-locale="waiting_for_players">BEREITMACHEN!</div>
            </div>
        </div>
    </div>

    <!-- Sieger-Bildschirm -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-container">
            <h1 class="winner-title" data-locale="game_ended">MATCH BEENDET</h1>
            <div class="winner-announcement">
                <span id="winner-name">SPIELERNAME</span>
                <span data-locale="winner" class="wins-suffix"> GEWINNT!</span>
            </div>

            <div class="match-stats-table">
                <div class="stats-header">
                    <span data-locale="tab_list">SPIELER</span>
                    <span data-locale="kills">KILLS</span>
                    <span data-locale="deaths">TODE</span>
                    <span data-locale="kd_ratio">K/D</span>
                </div>
                <div id="winner-stats-body">
                    <!-- Stats Zeilen -->
                </div>
            </div>

            <!-- Map Voting -->
            <div class="map-voting-section">
                <h3 data-locale="map_select">NÄCHSTE MAP WÄHLEN</h3>
                <div class="map-votes-grid" id="map-voting-container">
                    <!-- Maps zum Voten -->
                </div>
            </div>

            <div class="winner-actions">
                <button class="btn-primary" id="btn-win-back-lobby">ZURÜCK ZUR LOBBY</button>
                <button class="btn-secondary" id="btn-win-main-menu">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
