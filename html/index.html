<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <header class="main-header">
                <h1 class="header-title" data-i18n="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-i18n="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-i18n="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="custom" data-i18n="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <aside class="sidebar" id="sidebar-filters">
                    <div class="filter-group">
                        <label><span data-i18n="map_select">MAPS</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label><span data-i18n="loadout_select">WEAPONS</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label><span data-i18n="max_players">PLAYERS</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>
                </aside>

                <main class="lobby-browser">
                    <!-- Tab: FFA & Custom Lobbys -->
                    <div class="lobby-list" id="lobby-list-container"></div>

                    <!-- Tab: Create Lobby (Inline) -->
                    <div id="create-lobby-tab" class="creation-panel" style="display: none;">
                        <h2 data-i18n="tab_create">LOBBY ERSTELLEN</h2>
                        <div class="creation-grid">
                            <div class="input-group">
                                <label data-i18n="lobby_name">LOBBY NAME</label>
                                <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label data-i18n="map_select">MAP</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label data-i18n="mode_select">MODE</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label data-i18n="loadout_select">LOADOUT</label>
                                <div class="loadout-grid" id="loadout-checkboxes">
                                    <!-- Checkboxes will be injected here -->
                                </div>
                                <select id="loadout-select-simple"></select>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span data-i18n="round_time">TIME</span>: <span id="round-time-val">15</span>m</label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span data-i18n="max_players">MAX PLAYERS</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                            </div>
                            <div class="toggle-row">
                                <div class="toggle-group">
                                    <label data-i18n="vehicles_allowed">Vehicles</label>
                                    <label class="switch">
                                        <input type="checkbox" id="toggle-vehicles">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="toggle-group">
                                    <label data-i18n="friendly_fire">Friendly Fire</label>
                                    <label class="switch">
                                        <input type="checkbox" id="toggle-ff">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span data-i18n="respawn_time">RESPAWN</span>: <span id="respawn-time-val">5</span>s</label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span data-i18n="kill_limit">KILL LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="confirm-btn" id="btn-create-lobby-action" data-i18n="btn_create">CREATE</button>
                                <button class="cancel-btn" id="btn-reset-create" data-i18n="btn_cancel">RESET</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Lobby Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                    <div class="lobby-status-tag" id="lobby-status-text">WAITING FOR PLAYERS...</div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-i18n="tab_list">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <div class="settings-header">
                            <h3 data-i18n="tab_create">SETTINGS</h3>
                            <button id="btn-edit-settings" class="icon-btn" style="display: none;"><i class="fa-solid fa-gear"></i></button>
                        </div>
                        <div id="lobby-info-summary" class="info-grid"></div>

                        <div class="team-selection" id="team-selector">
                            <button class="team-btn" data-team="blue" data-i18n="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" data-i18n="team_red">RED</button>
                            <button class="team-btn" data-team="spectator" data-i18n="spectator">SPECTATOR</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-i18n="btn_ready">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-i18n="btn_start">START</button>
                            <button class="close-btn" id="btn-close-lobby" style="display: none;">LOBBY SCHLIESSEN</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-i18n="btn_leave">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- In-Game HUD -->
        <div id="game-hud" class="hud-container" style="display: none;">
            <div class="hud-top">
                <div class="timer-box">
                    <i class="fa-solid fa-clock"></i>
                    <span id="hud-timer">15:00</span>
                </div>
                <div class="score-container" id="hud-score-tdm" style="display: none;">
                    <div class="team-score blue">
                        <span class="team-label">BLUE</span>
                        <span id="score-blue">0</span>
                    </div>
                    <div class="score-divider">VS</div>
                    <div class="team-score red">
                        <span id="score-red">0</span>
                        <span class="team-label">RED</span>
                    </div>
                </div>
            </div>
            <div class="hud-bottom-left">
                <div class="stat-item">
                    <span class="stat-label" data-i18n="kills">KILLS</span>
                    <span class="stat-value" id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label" data-i18n="deaths">DEATHS</span>
                    <span class="stat-value" id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-bottom-right">
                <div class="vitals-container">
                    <div class="vital-bar armor"><div id="bar-armor" style="width: 50%;"></div></div>
                    <div class="vital-bar health"><div id="bar-health" style="width: 100%;"></div></div>
                </div>
                <div class="ammo-box">
                    <i class="fa-solid fa-gun"></i>
                    <span id="hud-ammo">30 / 120</span>
                </div>
            </div>
            <div class="countdown-overlay" id="hud-countdown" style="display: none;">
                <div class="countdown-number">10</div>
            </div>
        </div>

        <!-- Winner Screen & Map Voting -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 data-i18n="game_ended">MATCH ENDED</h1>
                <h2 id="winner-name">PLAYER WINS!</h2>

                <div class="winner-content">
                    <div class="stats-table-wrapper">
                        <table id="match-stats-table">
                            <thead>
                                <tr>
                                    <th data-i18n="kills">NAME</th>
                                    <th data-i18n="kills">KILLS</th>
                                    <th data-i18n="deaths">DEATHS</th>
                                    <th data-i18n="kd_ratio">K/D</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>

                    <div class="map-voting-section">
                        <h3 data-i18n="map_select">VOTE NEXT MAP</h3>
                        <div class="map-voting-grid" id="map-voting-grid">
                            <!-- Map items will be injected here -->
                        </div>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="confirm-btn" id="btn-back-to-lobby" data-i18n="tab_ffa">BACK TO LOBBY</button>
                    <button class="cancel-btn" id="btn-back-to-menu" data-i18n="btn_cancel">MAIN MENU</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
