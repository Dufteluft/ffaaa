<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" id="menu-title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="tab-ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="tab-create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="tab-list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Left Panel: Filters -->
                <aside class="sidebar" id="sidebar-filters">
                    <div class="filter-group">
                        <label id="label-maps">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALLE MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="label-players">SPIELER <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ALLE</option>
                            <option value="free">NUR FREIE PLÄTZE</option>
                        </select>
                    </div>
                    <button class="create-btn" id="btn-sidebar-create">LOBBY ERSTELLEN</button>
                </aside>

                <!-- Main Content: Lobby List -->
                <main class="lobby-browser">
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Entries will be injected here -->
                    </div>

                    <!-- Create Lobby Form (Integrated into the second tab) -->
                    <div id="create-lobby-form" style="display: none;">
                        <div class="form-container">
                            <div class="input-group">
                                <label id="label-lobby-name">LOBBY NAME</label>
                                <input type="text" id="lobby-name" placeholder="NAME EINGEBEN...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label id="label-map-select">MAP</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label id="label-mode-select">MODUS</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label id="label-loadout-select">WAFFEN-LOADOUT</label>
                                <div id="loadout-checkbox-grid" class="checkbox-grid">
                                    <!-- Checkboxes will be injected here -->
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span id="label-round-time">RUNDENZEIT (MIN)</span>: <span id="round-time-val">15</span></label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span id="label-max-players">MAX. SPIELER</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label id="label-vehicles-allowed">FAHRZEUGE ERLAUBT</label>
                                    <label class="switch">
                                        <input type="checkbox" id="vehicles-allowed">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="input-group">
                                    <label id="label-friendly-fire">FREUNDLICHES FEUER</label>
                                    <label class="switch">
                                        <input type="checkbox" id="friendly-fire">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span id="label-respawn-time">RESPAWN-ZEIT (SEK)</span>: <span id="respawn-time-val">5</span></label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span id="label-kill-limit">KILL-LIMIT ZUM SIEG</span>: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="confirm-btn" id="btn-create-lobby">LOBBY ERSTELLEN</button>
                                <button class="cancel-btn" id="btn-cancel-create">ABBRECHEN</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title-display">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="label-players-list">SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 id="label-settings">EINSTELLUNGEN</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection" id="team-selection-area">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">TEAM BLAU</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">TEAM ROT</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">ZUSCHAUER</button>
                            <button class="team-btn" data-team="random" id="btn-team-random">ZUFALL</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="NACHRICHT SENDEN...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">SPIEL STARTEN</button>
                            <button class="leave-btn" id="btn-leave-lobby">LOBBY VERLASSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 id="label-game-ended">RUNDE BEENDET!</h1>
                <h2 id="winner-display"><span id="winner-name">SPIELER</span> <span id="winner-suffix">GEWINNT!</span></h2>

                <div class="match-stats-container">
                    <div id="match-stats-table"></div>
                </div>

                <div class="map-voting-section">
                    <h3 id="label-next-map">NÄCHSTE MAP WÄHLEN</h3>
                    <div class="map-voting-grid" id="map-voting-grid">
                        <!-- Map votes will be injected here -->
                    </div>
                </div>

                <div class="btn-group">
                    <button class="confirm-btn" id="btn-back-to-lobby">ZURÜCK ZUR LOBBY</button>
                    <button class="cancel-btn" id="btn-back-to-menu">HAUPTMENÜ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-container">
            <div class="hud-top-left">
                <div class="hud-timer">
                    <i class="fa-solid fa-clock"></i> <span id="hud-time">15:00</span>
                </div>
                <div class="tdm-scores" id="hud-tdm-scores" style="display: none;">
                    <div class="score-box blue"><span id="score-blue">0</span></div>
                    <div class="score-box red"><span id="score-red">0</span></div>
                </div>
            </div>
            <div class="hud-bottom-right">
                <div class="hud-stats">
                    <div class="stat-item">
                        <span class="stat-label">KILLS</span>
                        <span class="stat-value" id="hud-kills">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">DEATHS</span>
                        <span class="stat-value" id="hud-deaths">0</span>
                    </div>
                </div>
                <div class="hud-bars">
                    <div class="bar-container health">
                        <div class="bar-fill" id="hud-health" style="width: 100%;"></div>
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div class="bar-container armor">
                        <div class="bar-fill" id="hud-armor" style="width: 0%;"></div>
                        <i class="fa-solid fa-shield"></i>
                    </div>
                    <div class="ammo-display">
                        <i class="fa-solid fa-gun"></i> <span id="hud-ammo">30 / 120</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
