<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Main Content -->
                <main class="lobby-browser">
                    <!-- Tab 1 & 3: Lobby List -->
                    <div id="lobby-list-view" class="tab-content">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </div>

                    <!-- Tab 2: Create Lobby -->
                    <div id="create-lobby-view" class="tab-content" style="display: none;">
                        <div class="create-form-container">
                            <h2 data-locale="tab_create">LOBBY ERSTELLEN</h2>
                            <div class="form-grid">
                                <div class="input-group">
                                    <label data-locale="lobby_name">LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="Enter name...">
                                </div>
                                <div class="input-group">
                                    <label data-locale="map_select">MAP AUSWÄHLEN</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="mode_select">SPIELMODUS</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="loadout_select">WAFFEN-LOADOUT (MULTI-SELECT)</label>
                                    <div class="loadout-grid" id="loadout-checkboxes">
                                        <!-- Categories injected via JS -->
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="round_time">RUNDENZEIT</span>: <span id="round-time-val">15</span> Min</label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="max_players">MAX. SPIELER</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                                <div class="input-group toggle-group">
                                    <label data-locale="vehicles_allowed">FAHRZEUGE ERLAUBT</label>
                                    <label class="switch">
                                        <input type="checkbox" id="vehicles-allowed">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="input-group toggle-group">
                                    <label data-locale="friendly_fire">FREUNDLICHES FEUER</label>
                                    <label class="switch">
                                        <input type="checkbox" id="friendly-fire">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="respawn_time">RESPAWN-ZEIT</span>: <span id="respawn-time-val">5</span> Sek</label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="kill_limit">KILL-LIMIT ZUM SIEG</span>: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="confirm-btn" id="btn-create-lobby" data-locale="btn_create">LOBBY ERSTELLEN</button>
                                <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">ABBRECHEN</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="players">SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 data-locale="tab_settings">EINSTELLUNGEN</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red" data-locale="team_red">RED</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec" data-locale="spectator">SPECTATOR</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="Nachricht senden...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">VERLASSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-right">
            <div class="hud-timer">
                <i class="fa-solid fa-clock"></i> <span id="hud-time">00:00</span>
            </div>
            <div class="hud-stats">
                <div class="hud-stat-item">
                    <span class="label" data-locale="kills">KILLS</span>
                    <span class="value" id="hud-kills">0</span>
                </div>
                <div class="hud-stat-item tdm-only" style="display: none;">
                    <span class="label" data-locale="score">SCORE</span>
                    <span class="value"><span id="score-blue" style="color: #2196f3;">0</span> : <span id="score-red" style="color: #f44336;">0</span></span>
                </div>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="weapon-info">
                <div class="ammo-count" id="hud-ammo">0</div>
                <div class="weapon-name" id="hud-weapon-name">WEAPON</div>
            </div>
            <div class="status-bars">
                <div class="bar-container">
                    <div class="bar health-bar" id="hud-health-bar"></div>
                </div>
                <div class="bar-container">
                    <div class="bar armor-bar" id="hud-armor-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title" data-locale="game_ended">MATCH ENDED</h1>
            <h2 id="winner-name">PLAYER WINS!</h2>
            <div id="match-stats-table"></div>

            <div class="map-voting" id="map-voting-section">
                <h3 data-locale="map_vote">NÄCHSTE MAP WÄHLEN</h3>
                <div class="voting-grid" id="voting-grid">
                    <!-- Maps injected via JS -->
                </div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_back_lobby">ZURÜCK ZUR LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu" data-locale="btn_menu">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
