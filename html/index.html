<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- TAB 1: FFA Lobby & TAB 3: Offene Lobbys (Shared Browser) -->
                <div id="tab-browser" class="tab-content active">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label><span data-locale="map_select">MAPS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group" id="free-slots-filter" style="display: none;">
                            <label><span data-locale="filter_free_slots">Only Free Slots</span></label>
                            <div class="toggle-container">
                                <input type="checkbox" id="filter-players">
                                <span class="toggle-slider"></span>
                            </div>
                        </div>
                    </aside>

                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </main>
                </div>

                <!-- TAB 2: Lobby Erstellen -->
                <div id="tab-create" class="tab-content">
                    <div class="create-form-container">
                        <div class="form-grid">
                            <div class="input-group">
                                <label data-locale="lobby_name">LOBBY NAME</label>
                                <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                            </div>
                            <div class="input-group">
                                <label data-locale="map_select">MAP</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">MODE</label>
                                <select id="mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">TEAM DEATHMATCH</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label data-locale="loadout_select">LOADOUT</label>
                                <select id="loadout-select" multiple></select>
                                <small>Hold Ctrl to select multiple</small>
                            </div>
                            <div class="input-group">
                                <label><span data-locale="round_time">TIME (MIN)</span>: <span id="round-time-val">15</span></label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">MAX PLAYERS</span>: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                            </div>
                            <div class="input-group">
                                <label data-locale="vehicles_allowed">VEHICLES ALLOWED</label>
                                <div class="toggle-container">
                                    <input type="checkbox" id="vehicles-allowed">
                                    <span class="toggle-slider"></span>
                                </div>
                            </div>
                            <div class="input-group">
                                <label data-locale="friendly_fire">FRIENDLY FIRE</label>
                                <div class="toggle-container">
                                    <input type="checkbox" id="friendly-fire">
                                    <span class="toggle-slider"></span>
                                </div>
                            </div>
                            <div class="input-group">
                                <label><span data-locale="respawn_time">RESPAWN TIME</span>: <span id="respawn-time-val">5</span>s</label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">KILL LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="create-btn" id="btn-create-lobby" data-locale="btn_create">CREATE</button>
                            <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">CANCEL</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>SETTINGS</h3>
                        <div id="lobby-info-summary"></div>
                        <div id="lobby-settings-editor" style="display: none;">
                            <div class="input-group">
                                <label data-locale="kill_limit">KILL LIMIT</label>
                                <input type="number" id="edit-kill-limit" class="small-input">
                            </div>
                            <div class="input-group">
                                <label data-locale="respawn_time">RESPAWN TIME</label>
                                <input type="number" id="edit-respawn-time" class="small-input">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label data-locale="friendly_fire">FF</label>
                                    <input type="checkbox" id="edit-friendly-fire">
                                </div>
                                <div class="input-group">
                                    <label data-locale="vehicles_allowed">VEH</label>
                                    <input type="checkbox" id="edit-vehicles-allowed">
                                </div>
                            </div>
                            <button class="confirm-btn" id="btn-save-settings">SAVE</button>
                        </div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red" data-locale="team_red">RED</button>
                            <button class="team-btn" data-team="random" id="btn-team-random" data-locale="random">RANDOM</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec" data-locale="spectator">SPECTATOR</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">LEAVE</button>
                            <button class="cancel-btn" id="btn-close-lobby" style="display: none;" data-locale="btn_close_lobby">CLOSE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD (Will be hidden/shown based on script) -->
    <div id="game-hud" style="display: none;">
        <div id="hud-top">
            <div id="hud-timer">00:00</div>
            <div id="hud-tdm-score" style="display: none;">
                <span id="score-blue">0</span> - <span id="score-red">0</span>
            </div>
        </div>
        <div id="hud-bottom-right">
            <div class="hud-stat"><i class="fa-solid fa-crosshairs"></i> <span id="hud-kills">0</span></div>
            <div class="hud-stat"><i class="fa-solid fa-skull"></i> <span id="hud-deaths">0</span></div>
            <div class="hud-ammo"><i class="fa-solid fa-bullet"></i> <span id="hud-ammo">0</span></div>
        </div>
        <div id="hud-bottom-left">
            <div class="hud-bar-container">
                <div id="hud-health-bar" class="hud-bar"></div>
            </div>
            <div class="hud-bar-container">
                <div id="hud-armor-bar" class="hud-bar"></div>
            </div>
        </div>
        <div id="big-countdown">10</div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title" data-locale="game_ended">MATCH ENDED</h1>
            <h2 id="winner-name">PLAYER WINS!</h2>
            <div id="match-stats-table"></div>

            <div class="map-voting" id="map-voting-container">
                <h3>VOTE NEXT MAP</h3>
                <div class="vote-options" id="vote-options"></div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
