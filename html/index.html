<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div id="main-container" class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa">FFA LOBBY</button>
                    <button class="tab-btn" data-tab="create">LOBBY ERSTELLEN</button>
                    <button class="tab-btn" data-tab="list">OFFENE LOBBYS</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Left Panel: Filters (Visible in FFA and List tabs) -->
                <aside class="sidebar" id="sidebar-filters">
                    <div class="filter-group">
                        <label>MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>WEAPONS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>
                </aside>

                <!-- Main Content -->
                <main class="main-content-area">
                    <!-- Lobby Browser (Tab 1 & 3) -->
                    <div id="lobby-browser" class="tab-content active">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </div>

                    <!-- Create Lobby (Tab 2) -->
                    <div id="create-lobby-tab" class="tab-content">
                        <div class="create-form-container">
                            <div class="form-scroll">
                                <div class="input-group">
                                    <label>LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label>MAP</label>
                                        <select id="map-select"></select>
                                    </div>
                                    <div class="input-group">
                                        <label>MODE</label>
                                        <select id="mode-select">
                                            <option value="ffa">FFA</option>
                                            <option value="tdm">TEAM DEATHMATCH</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="input-group">
                                    <label>WAFFEN-LOADOUT</label>
                                    <div class="loadout-grid" id="loadout-checkbox-grid">
                                        <!-- Checkboxes will be injected here -->
                                    </div>
                                </div>

                                <div class="input-row">
                                    <div class="input-group">
                                        <label>RUNDENZEIT (MIN): <span id="round-time-val">15</span></label>
                                        <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                    </div>
                                    <div class="input-group">
                                        <label>MAX. SPIELER: <span id="max-players-val">16</span></label>
                                        <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                    </div>
                                </div>

                                <div class="input-row">
                                    <div class="input-group">
                                        <label>RESPAWN-ZEIT (SEK): <span id="respawn-time-val">5</span></label>
                                        <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                    </div>
                                    <div class="input-group">
                                        <label>KILL-LIMIT: <span id="kill-limit-val">0</span></label>
                                        <input type="range" id="kill-limit" min="0" max="50" step="5" value="0">
                                        <small>(0 = Deaktiviert)</small>
                                    </div>
                                </div>

                                <div class="toggle-row">
                                    <div class="toggle-group">
                                        <label>FAHRZEUGE ERLAUBT</label>
                                        <label class="switch">
                                            <input type="checkbox" id="vehicles-toggle">
                                            <span class="slider round"></span>
                                        </label>
                                    </div>
                                    <div class="toggle-group">
                                        <label>FREUNDLICHES FEUER</label>
                                        <label class="switch">
                                            <input type="checkbox" id="friendly-fire-toggle">
                                            <span class="slider round"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="confirm-btn" id="btn-create-lobby">LOBBY ERSTELLEN</button>
                                <button class="cancel-btn" id="btn-cancel-create">ABBRECHEN</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                    <div class="lobby-status-tag">WARTEN AUF SPIELER...</div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3>SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <div class="settings-header">
                            <h3>EINSTELLUNGEN</h3>
                            <button id="btn-edit-settings" class="icon-btn" style="display: none;"><i class="fa-solid fa-pen-to-square"></i></button>
                        </div>
                        <div id="lobby-info-summary" class="info-grid"></div>

                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">TEAM BLAU</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">TEAM ROT</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">ZUSCHAUER</button>
                        </div>

                        <div class="lobby-chat-wrapper">
                            <div class="lobby-chat">
                                <div id="chat-messages"></div>
                                <div class="chat-input-area">
                                    <input type="text" id="chat-input" placeholder="NACHRICHT SENDEN...">
                                    <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                                </div>
                            </div>
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">SPIEL STARTEN</button>
                            <button class="close-btn" id="btn-close-lobby" style="display: none;">LOBBY SCHLIEẞEN</button>
                            <button class="leave-btn" id="btn-leave-lobby">LOBBY VERLASSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <div class="winner-header">
                    <h1 id="winner-title">RUNDE BEENDET</h1>
                    <h2 id="winner-name">SPIELER GEWINNT!</h2>
                </div>

                <div class="winner-content">
                    <div class="stats-container">
                        <div id="match-stats-table"></div>
                    </div>

                    <div class="voting-container">
                        <h3>NÄCHSTE MAP WÄHLEN</h3>
                        <div class="map-voting-grid" id="map-voting-grid">
                            <!-- Map voting items will be injected here -->
                        </div>
                    </div>
                </div>

                <div class="winner-actions">
                    <button class="confirm-btn" id="btn-back-to-lobby">ZURÜCK ZUR LOBBY</button>
                    <button class="cancel-btn" id="btn-back-to-menu">HAUPTMENÜ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-center">
            <div class="hud-timer" id="hud-timer">15:00</div>
        </div>

        <div class="hud-bottom-right">
            <div class="hud-stats-row">
                <div class="hud-stat-box">
                    <span class="hud-stat-label">KILLS</span>
                    <span class="hud-stat-value" id="hud-kills">0</span>
                </div>
                <div class="hud-stat-box">
                    <span class="hud-stat-label">DEATHS</span>
                    <span class="hud-stat-value" id="hud-deaths">0</span>
                </div>
            </div>

            <div class="hud-weapon-info">
                <div class="hud-ammo" id="hud-ammo">30/90</div>
                <div class="hud-weapon-name" id="hud-weapon-name">STURMGEWEHR</div>
            </div>

            <div class="hud-bars">
                <div class="hud-bar-container health">
                    <div class="hud-bar-fill" id="hud-health-fill" style="width: 100%;"></div>
                </div>
                <div class="hud-bar-container armor">
                    <div class="hud-bar-fill" id="hud-armor-fill" style="width: 50%;"></div>
                </div>
            </div>
        </div>

        <div class="hud-bottom-left">
            <div class="hud-team-score" id="hud-team-score" style="display: none;">
                <div class="team-score blue">
                    <span class="label">BLAU</span>
                    <span class="value" id="hud-score-blue">0</span>
                </div>
                <div class="team-score red">
                    <span class="label">ROT</span>
                    <span class="value" id="hud-score-red">0</span>
                </div>
            </div>
        </div>

        <div class="hud-kill-feed" id="hud-kill-feed"></div>
    </div>

    <!-- Countdown Overlay -->
    <div id="countdown-overlay" class="overlay" style="display: none; background: rgba(0,0,0,0.5); backdrop-filter: none;">
        <div class="countdown-number" id="countdown-number">10</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
