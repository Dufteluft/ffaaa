<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container" id="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" id="l-menu-title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="l-tab-ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="l-tab-create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="l-tab-list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Left Panel: Filters (Only visible on FFA and List tabs) -->
                <aside class="sidebar" id="sidebar">
                    <div class="filter-group">
                        <label id="l-map-select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="l-loadout-select">WEAPONS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="l-max-players">PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>

                    <button class="create-btn" id="btn-quick-join">QUICK JOIN</button>
                </aside>

                <!-- Main Content -->
                <main class="main-content">
                    <!-- Lobby Browser (FFA & Open Lobbies) -->
                    <div id="lobby-browser-view" class="tab-view active">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </div>

                    <!-- Create Lobby View -->
                    <div id="create-lobby-view" class="tab-view">
                        <div class="create-form">
                            <div class="input-group full">
                                <label id="l-lobby-name">LOBBY NAME</label>
                                <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label id="l-map-select-create">MAP</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label id="l-mode-select">MODE</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label id="l-loadout-select-create">LOADOUT</label>
                                <div class="loadout-grid" id="loadout-checkboxes">
                                    <!-- Checkboxes will be injected here -->
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label id="l-round-time">TIME (MIN): <span id="round-time-val">15</span></label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label id="l-max-players-create">MAX PLAYERS: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label id="l-vehicles-allowed">VEHICLES</label>
                                    <div class="toggle-wrapper">
                                        <input type="checkbox" id="vehicles-allowed" class="toggle-input">
                                        <label for="vehicles-allowed" class="toggle-label"></label>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label id="l-friendly-fire">FRIENDLY FIRE</label>
                                    <div class="toggle-wrapper">
                                        <input type="checkbox" id="friendly-fire" class="toggle-input">
                                        <label for="friendly-fire" class="toggle-label"></label>
                                    </div>
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label id="l-respawn-time">RESPAWN (SEK): <span id="respawn-time-val">5</span></label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label id="l-kill-limit">KILL LIMIT: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="confirm-btn" id="btn-create-lobby-action">CREATE LOBBY</button>
                                <button class="cancel-btn" id="btn-cancel-create">CANCEL</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="l-players-title">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 id="l-settings-title">SETTINGS</h3>
                        <div id="lobby-info-summary" class="lobby-info-summary"></div>

                        <div class="host-edit-area" id="host-edit-controls" style="display: none;">
                            <!-- Host can edit settings here -->
                             <button class="edit-btn" id="btn-edit-settings"><i class="fa-solid fa-gear"></i> EDIT SETTINGS</button>
                        </div>

                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">RED</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">SPECTATOR</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">START</button>
                            <button class="close-btn" id="btn-close-lobby" style="display: none;">CLOSE</button>
                            <button class="leave-btn" id="btn-leave-lobby">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" class="hud-container" style="display: none;">
        <div class="hud-top-right">
            <div class="hud-timer-box">
                <span id="hud-timer">15:00</span>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="hud-weapon-box">
                <div class="hud-ammo-row">
                    <span id="hud-ammo">30</span>
                    <span class="hud-ammo-label">AMMO</span>
                </div>
            </div>
            <div class="hud-stats-row">
                <div class="hud-stat-item">
                    <span class="hud-stat-label">KILLS:</span>
                    <span id="hud-kills">0</span>
                </div>
                <div class="hud-stat-item">
                    <span class="hud-stat-label">DEATHS:</span>
                    <span id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-team-scores" id="hud-tdm-scores" style="display: none;">
                <div class="team-score blue">
                    <div class="team-label">BLUE</div>
                    <div id="hud-score-blue">0</div>
                </div>
                <div class="team-score red">
                    <div class="team-label">RED</div>
                    <div id="hud-score-red">0</div>
                </div>
            </div>
        </div>

        <div class="hud-bottom-center">
            <div class="hud-bars">
                <div class="hud-bar-container armor">
                    <div class="hud-bar-fill" id="hud-armor-fill" style="width: 50%;"></div>
                </div>
                <div class="hud-bar-container health">
                    <div class="hud-bar-fill" id="hud-health-fill" style="width: 100%;"></div>
                    <span id="hud-health-percent">100%</span>
                </div>
            </div>
        </div>

        <div id="hud-countdown" class="hud-countdown" style="display: none;">
            10
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title-text">RUNDE BEENDET</h1>
            <h2 id="winner-name-display"><span id="winner-name-val">PLAYER</span> GEWINNT!</h2>

            <div class="stats-container">
                <div id="match-stats-table"></div>
            </div>

            <div class="map-voting-section">
                <h3 id="l-vote-map">NÄCHSTE MAP WÄHLEN</h3>
                <div class="map-grid" id="map-vote-grid"></div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby-winner">ZURÜCK ZUR LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu-winner">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
