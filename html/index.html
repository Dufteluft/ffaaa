<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container" id="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" id="l-menu-title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="l-tab-ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="l-tab-create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="l-tab-list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Sidebar (nur bei Lobbyliste sichtbar) -->
                <aside class="sidebar" id="sidebar">
                    <div class="filter-group">
                        <label id="l-map-select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="l-loadout-select">WEAPONS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="l-max-players">PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>
                </aside>

                <!-- Main Content Area -->
                <main class="lobby-browser">
                    <!-- Tab: FFA & Offene Lobbys -->
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Einträge werden hier dynamisch eingefügt -->
                    </div>

                    <!-- Tab: Lobby erstellen -->
                    <div id="create-lobby-tab" class="create-view" style="display: none;">
                        <div class="form-container">
                            <div class="input-group">
                                <label id="l-lobby-name">LOBBY NAME</label>
                                <input type="text" id="lobby-name" placeholder="...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label id="l-map-select-2">MAP</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label id="l-mode-select">MODE</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label id="l-loadout-select-2">WAFFEN-LOADOUT</label>
                                <div class="checkbox-grid" id="loadout-grid">
                                    <!-- Checkboxen für Waffen-Kategorien -->
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span id="l-round-time">ROUND TIME</span>: <span id="round-time-val">15</span>m</label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span id="l-max-players-2">MAX PLAYERS</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group toggle-group">
                                    <label id="l-vehicles-allowed">VEHICLES</label>
                                    <label class="switch">
                                        <input type="checkbox" id="vehicles-allowed">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="input-group toggle-group">
                                    <label id="l-friendly-fire">FRIENDLY FIRE</label>
                                    <label class="switch">
                                        <input type="checkbox" id="friendly-fire">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span id="l-respawn-time">RESPAWN</span>: <span id="respawn-time-val">5</span>s</label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span id="l-kill-limit">KILL LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="confirm-btn" id="btn-create-lobby-action">LOBBY ERSTELLEN</button>
                                <button class="cancel-btn" id="btn-cancel-create">ABBRECHEN</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                    <div id="host-controls" style="display: none;">
                         <button class="settings-btn" id="btn-edit-settings"><i class="fa-solid fa-gear"></i></button>
                    </div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3>SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>STATUS & TEAMS</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">TEAM BLAU</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">TEAM ROT</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">ZUSCHAUER</button>
                            <button class="team-btn" data-team="random" id="btn-team-random">ZUFALL</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input" placeholder="NACHRICHT SENDEN...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">SPIEL STARTEN</button>
                            <button class="leave-btn" id="btn-leave-lobby">LOBBY VERLASSEN</button>
                            <button class="close-lobby-btn" id="btn-close-lobby" style="display: none;">LOBBY SCHLIESSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <div class="winner-header">
                    <h1 id="winner-title">RUNDE BEENDET</h1>
                    <h2 id="winner-name-display">SPIELER GEWINNT!</h2>
                </div>

                <div class="winner-content">
                    <div class="stats-container">
                        <h3>STATISTIKEN</h3>
                        <div id="match-stats-table"></div>
                    </div>

                    <div class="voting-container">
                        <h3>NÄCHSTE MAP WÄHLEN</h3>
                        <div class="map-voting-grid" id="map-voting-grid">
                            <!-- Maps zum Voten -->
                        </div>
                    </div>
                </div>

                <div class="winner-actions">
                    <button class="confirm-btn" id="btn-back-to-lobby">ZURÜCK ZUR LOBBY</button>
                    <button class="cancel-btn" id="btn-back-to-menu">HAUPTMENÜ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="timer-box">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-timer">15:00</span>
            </div>
            <div class="score-box" id="hud-score-container" style="display: none;">
                <div class="team-score blue"><span id="score-blue">0</span></div>
                <div class="score-divider">VS</div>
                <div class="team-score red"><span id="score-red">0</span></div>
            </div>
        </div>

        <div class="hud-bottom-left">
            <div class="stat-item">
                <span class="stat-label">KILLS</span>
                <span class="stat-value" id="hud-kills">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">DEATHS</span>
                <span class="stat-value" id="hud-deaths">0</span>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="bars-container">
                <div class="hud-bar-wrapper">
                    <div class="hud-bar health">
                        <div class="hud-bar-fill" id="hud-health-fill" style="width: 100%;"></div>
                    </div>
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="hud-bar-wrapper">
                    <div class="hud-bar armor">
                        <div class="hud-bar-fill" id="hud-armor-fill" style="width: 0%;"></div>
                    </div>
                    <i class="fa-solid fa-shield"></i>
                </div>
            </div>
            <div class="ammo-container">
                <span id="hud-ammo">30</span>
                <i class="fa-solid fa-gun"></i>
            </div>
        </div>

        <div id="kill-feed"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
