<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <!-- Hauptmenü -->
        <div class="main-container" id="main-menu">
            <header class="main-header">
                <h1 class="header-title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa">FFA LOBBY</button>
                    <button class="tab-btn" data-tab="create">LOBBY ERSTELLEN</button>
                    <button class="tab-btn" data-tab="open">OFFENE LOBBYS</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- FFA Lobby Tab (Vordefinierte Matches) -->
                <div class="tab-content active" id="tab-ffa">
                    <div class="lobby-grid-container" id="default-lobby-list">
                        <!-- Vordefinierte Lobbys werden hier eingefügt -->
                    </div>
                </div>

                <!-- Lobby Erstellen Tab -->
                <div class="tab-content" id="tab-create">
                    <div class="create-form">
                        <div class="form-grid">
                            <div class="input-group full-width">
                                <label>LOBBY NAME</label>
                                <input type="text" id="create-name" placeholder="Name eingeben...">
                            </div>
                            <div class="input-group">
                                <label>MAP AUSWÄHLEN</label>
                                <select id="create-map"></select>
                            </div>
                            <div class="input-group">
                                <label>SPIELMODUS</label>
                                <select id="create-mode">
                                    <option value="ffa">FREE FOR ALL</option>
                                    <option value="tdm">TEAM DEATHMATCH</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label>WAFFEN-LOADOUT</label>
                                <select id="create-loadout"></select>
                            </div>
                            <div class="input-group">
                                <label>RUNDENZEIT (5-30 MIN): <span id="val-time">15</span></label>
                                <input type="range" id="create-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label>MAX. SPIELER (2-16): <span id="val-players">16</span></label>
                                <input type="range" id="create-players" min="2" max="16" step="1" value="16">
                            </div>
                            <div class="input-group">
                                <label>RESPAWN-ZEIT (3-10 SEK): <span id="val-respawn">5</span></label>
                                <input type="range" id="create-respawn" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label>KILL-LIMIT (0=AUS, 10-50): <span id="val-kills">30</span></label>
                                <input type="range" id="create-kills" min="0" max="50" step="5" value="30">
                            </div>
                            <div class="toggle-group">
                                <div class="toggle-item">
                                    <label>FAHRZEUGE ERLAUBT</label>
                                    <input type="checkbox" id="create-vehicles">
                                </div>
                                <div class="toggle-item">
                                    <label>FREUNDLICHES FEUER</label>
                                    <input type="checkbox" id="create-ff">
                                </div>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="btn btn-primary" id="btn-create-submit">LOBBY ERSTELLEN</button>
                            <button class="btn btn-secondary" id="btn-create-cancel">ABBRECHEN</button>
                        </div>
                    </div>
                </div>

                <!-- Offene Lobbys Tab -->
                <div class="tab-content" id="tab-open">
                    <div class="lobby-list" id="open-lobby-list">
                        <!-- Aktive Lobbys werden hier eingefügt -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Lobby Wartebereich -->
        <div class="overlay" id="lobby-waiting" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="waiting-lobby-name">LOBBY NAME</h2>
                    <div class="lobby-id">ID: <span id="waiting-lobby-id">0000</span></div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-side">
                        <h3>SPIELER (<span id="player-count">0</span>/<span id="max-player-count">0</span>)</h3>
                        <div class="player-list" id="waiting-player-list"></div>
                    </div>
                    <div class="settings-side">
                        <div class="lobby-info-box">
                            <div class="info-item"><span>MAP:</span> <span id="info-map">-</span></div>
                            <div class="info-item"><span>MODUS:</span> <span id="info-mode">-</span></div>
                            <div class="info-item"><span>WAFFEN:</span> <span id="info-loadout">-</span></div>
                        </div>

                        <div class="team-selection">
                            <h3>TEAM WÄHLEN</h3>
                            <div class="team-btns">
                                <button class="team-btn" data-team="blue" id="team-blue">BLAU</button>
                                <button class="team-btn" data-team="red" id="team-red">ROT</button>
                                <button class="team-btn" data-team="spectator" id="team-spec">ZUSCHAUER</button>
                            </div>
                        </div>

                        <div class="lobby-chat">
                            <div class="chat-messages" id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="Nachricht senden...">
                        </div>

                        <div class="lobby-actions">
                            <button class="btn btn-warning" id="btn-ready">BEREIT</button>
                            <button class="btn btn-success" id="btn-start" style="display: none;">SPIEL STARTEN</button>
                            <button class="btn btn-danger" id="btn-leave">LOBBY VERLASSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div class="overlay" id="winner-screen" style="display: none;">
            <div class="winner-card">
                <div class="winner-header">MATCH BEENDET</div>
                <div class="winner-name" id="winner-name">SPIELER GEWINNT!</div>
                <div class="stats-container" id="match-stats">
                    <!-- Tabelle wird via JS eingefügt -->
                </div>
                <div class="winner-actions">
                    <button class="btn btn-primary" id="btn-winner-menu">HAUPTMENÜ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- In-Game HUD -->
    <div id="hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-time">15:00</span>
            </div>
            <div class="hud-score" id="hud-tdm-score" style="display: none;">
                <span class="score-blue" id="hud-score-blue">0</span>
                <span class="score-divider">:</span>
                <span class="score-red" id="hud-score-red">0</span>
            </div>
        </div>
        <div class="hud-bottom">
            <div class="hud-stats">
                <div class="stat-item">
                    <span class="label">KILLS</span>
                    <span class="value" id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">TODE</span>
                    <span class="value" id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-bars">
                <div class="bar-container">
                    <div class="bar health" id="bar-health"></div>
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="bar-container">
                    <div class="bar armor" id="bar-armor"></div>
                    <i class="fa-solid fa-shield"></i>
                </div>
            </div>
            <div class="hud-ammo">
                <i class="fa-solid fa-gun"></i>
                <span id="hud-ammo">100</span>
            </div>
        </div>
        <div class="hud-countdown" id="hud-countdown" style="display: none;">
            <div class="countdown-circle">
                <span id="countdown-val">10</span>
            </div>
            <div class="countdown-text">STARTET IN...</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
