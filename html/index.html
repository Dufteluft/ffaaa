<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESX FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <aside class="sidebar">
                    <div class="filter-group">
                        <label>MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>WEAPONS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>

                    <div class="stats-sidebar" id="player-stats">
                        <h3 data-locale="score">Statistiken</h3>
                        <div class="stat-item">
                            <span data-locale="kills">Kills</span>: <span id="stat-kills">0</span>
                        </div>
                        <div class="stat-item">
                            <span data-locale="deaths">Tode</span>: <span id="stat-deaths">0</span>
                        </div>
                        <div class="stat-item">
                            <span data-locale="kd_ratio">K/D</span>: <span id="stat-kd">0.00</span>
                        </div>
                    </div>
                </aside>

                <main class="tab-content">
                    <!-- Tab 1: FFA Lobbies (Predefined) -->
                    <div id="tab-ffa" class="tab-pane active">
                        <div class="lobby-list" id="ffa-list"></div>
                    </div>

                    <!-- Tab 2: Create Lobby -->
                    <div id="tab-create" class="tab-pane">
                        <div class="create-form-container">
                            <div class="form-grid">
                                <div class="input-group">
                                    <label data-locale="lobby_name">Lobby Name</label>
                                    <input type="text" id="create-lobby-name" placeholder="Name eingeben...">
                                </div>
                                <div class="input-group">
                                    <label data-locale="map_select">Map auswählen</label>
                                    <select id="create-map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="mode_select">Spielmodus</label>
                                    <select id="create-mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">Team Deathmatch</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="loadout_select">Waffen-Loadout</label>
                                    <select id="create-loadout-select" multiple class="multi-select"></select>
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="round_time">Rundenzeit</span>: <span id="val-round-time">15</span>m</label>
                                    <input type="range" id="create-round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="max_players">Max. Spieler</span>: <span id="val-max-players">16</span></label>
                                    <input type="range" id="create-max-players" min="2" max="32" step="1" value="16">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="respawn_time">Respawn-Zeit</span>: <span id="val-respawn-time">5</span>s</label>
                                    <input type="range" id="create-respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="kill_limit">Kill-Limit</span>: <span id="val-kill-limit">30</span></label>
                                    <input type="range" id="create-kill-limit" min="0" max="100" step="10" value="30">
                                </div>
                                <div class="toggle-group">
                                    <div class="toggle-item">
                                        <label data-locale="vehicles_allowed">Fahrzeuge</label>
                                        <input type="checkbox" id="create-vehicles" class="toggle-checkbox">
                                    </div>
                                    <div class="toggle-item">
                                        <label data-locale="friendly_fire">Friendly Fire</label>
                                        <input type="checkbox" id="create-friendly-fire" class="toggle-checkbox">
                                    </div>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="btn-primary" id="btn-submit-create" data-locale="btn_create">Lobby erstellen</button>
                                <button class="btn-secondary" id="btn-reset-create" data-locale="btn_cancel">Abbrechen</button>
                            </div>
                        </div>
                    </div>

                    <!-- Tab 3: Open Lobbies (List) -->
                    <div id="tab-list" class="tab-pane">
                        <div class="lobby-list" id="open-list"></div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Room -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2>LOBBY: <span id="waiting-lobby-name">...</span></h2>
                    <div class="lobby-id">ID: <span id="waiting-lobby-id">0000</span></div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_list">Spieler</h3>
                        <div id="waiting-player-list"></div>
                    </div>
                    <div class="settings-section">
                        <div class="settings-editor-container" id="host-settings-editor">
                            <!-- Host can edit settings here -->
                        </div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" data-locale="team_blue">Blau</button>
                            <button class="team-btn" data-team="red" data-locale="team_red">Rot</button>
                            <button class="team-btn" data-team="spectator" data-locale="spectator">Zuschauer</button>
                            <button class="team-btn active" data-team="random" data-locale="random">Zufall</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="Nachricht senden...">
                        </div>
                        <div class="lobby-actions">
                            <button class="btn-ready" id="btn-toggle-ready" data-locale="btn_ready">Bereit</button>
                            <button class="btn-start" id="btn-start-match" style="display: none;" data-locale="btn_start">Starten</button>
                            <button class="btn-leave" id="btn-leave-match" data-locale="btn_leave">Verlassen</button>
                            <button class="btn-danger" id="btn-close-lobby" style="display: none;" data-locale="btn_close_lobby">Lobby schließen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Gameplay HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-right">
            <div class="match-timer" id="hud-timer">00:00</div>
            <div class="match-mode" id="hud-mode">FFA</div>
        </div>

        <div class="hud-bottom-right">
            <div class="weapon-info">
                <div class="ammo-count" id="hud-ammo">0</div>
                <div class="weapon-label" id="hud-weapon">WEAPON</div>
            </div>
            <div class="player-stats">
                <div class="stat-box">
                    <span class="label">KILLS</span>
                    <span class="value" id="hud-kills">0</span>
                </div>
                <div class="stat-box tdm-only" style="display: none;">
                    <span class="label">TEAM BLUE</span>
                    <span class="value" id="hud-score-blue">0</span>
                </div>
                <div class="stat-box tdm-only" style="display: none;">
                    <span class="label">TEAM RED</span>
                    <span class="value" id="hud-score-red">0</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom-center">
            <div class="health-bar-container">
                <div class="health-bar" id="hud-health" style="width: 100%;"></div>
                <div class="armor-bar" id="hud-armor" style="width: 0%;"></div>
            </div>
        </div>

        <div class="countdown-overlay" id="hud-countdown" style="display: none;">10</div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 data-locale="game_ended">RUNDE BEENDET</h1>
            <h2 id="winner-display-name">SPIELER <span data-locale="wins_suffix">GEWINNT!</span></h2>

            <div class="match-stats-container">
                <table id="winner-stats-table">
                    <thead>
                        <tr>
                            <th data-locale="lobby_name">NAME</th>
                            <th data-locale="kills">KILLS</th>
                            <th data-locale="deaths">TODE</th>
                            <th data-locale="kd_ratio">K/D</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="map-voting">
                <h3 data-locale="map_select">Nächste Map wählen:</h3>
                <div class="vote-options" id="map-vote-list"></div>
            </div>

            <div class="winner-actions">
                <button class="btn-primary" id="btn-winner-back-lobby" data-locale="back_to_lobby">Zurück zur Lobby</button>
                <button class="btn-secondary" id="btn-winner-back-menu" data-locale="back_to_menu">Hauptmenü</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
