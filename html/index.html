<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESX FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Hauptmenü -->
    <div id="app" style="display: none;">
        <div class="main-container">
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Sidebar Filter (Nur Sichtbar in Tab 1 & 3) -->
                <aside class="sidebar" id="sidebar-filters">
                    <div class="filter-group">
                        <label><span data-locale="map_select">MAP</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label><span data-locale="loadout_select">WAFFEN</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>
                </aside>

                <!-- Hauptbereich -->
                <main class="main-content">
                    <!-- Tab 1 & 3: Lobby Liste -->
                    <div id="lobby-list-view" class="tab-content active">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Einträge werden hier injiziert -->
                        </div>
                    </div>

                    <!-- Tab 2: Lobby Erstellen -->
                    <div id="create-lobby-view" class="tab-content">
                        <div class="create-form">
                            <div class="input-group">
                                <label data-locale="lobby_name">LOBBY NAME</label>
                                <input type="text" id="create-lobby-name" placeholder="ENTER NAME...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label data-locale="map_select">MAP</label>
                                    <select id="create-map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="mode_select">MODUS</label>
                                    <select id="create-mode-select">
                                        <option value="ffa">FFA (Alle gegen Alle)</option>
                                        <option value="tdm">Team Deathmatch</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label data-locale="loadout_select">LOADOUT (MULTI-SELECT)</label>
                                <div class="multi-select" id="create-loadout-select">
                                    <!-- Checkboxen werden hier injiziert -->
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span data-locale="round_time">ZEIT</span>: <span id="val-round-time">15</span> Min</label>
                                    <input type="range" id="create-round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="max_players">SPIELER</span>: <span id="val-max-players">16</span></label>
                                    <input type="range" id="create-max-players" min="2" max="32" step="1" value="16">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group toggle-group">
                                    <label data-locale="vehicles_allowed">FAHRZEUGE</label>
                                    <label class="switch">
                                        <input type="checkbox" id="create-vehicles">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="input-group toggle-group">
                                    <label data-locale="friendly_fire">FRIENDLY FIRE</label>
                                    <label class="switch">
                                        <input type="checkbox" id="create-ff">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span data-locale="respawn_time">RESPAWN</span>: <span id="val-respawn-time">5</span> Sek</label>
                                    <input type="range" id="create-respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="kill_limit">KILL LIMIT</span>: <span id="val-kill-limit">30</span></label>
                                    <input type="range" id="create-kill-limit" min="0" max="100" step="10" value="30">
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="confirm-btn" id="btn-submit-create" data-locale="btn_create">ERSTELLEN</button>
                                <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">ABBRECHEN</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Wartebereich -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2>LOBBY: <span id="waiting-lobby-name">NAME</span></h2>
                    <div class="lobby-id-badge">ID: <span id="waiting-lobby-id">0000</span></div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3>SPIELER (<span id="waiting-player-count">0</span>/<span id="waiting-max-players">0</span>)</h3>
                        <div id="waiting-player-list" class="scroll-list"></div>
                    </div>
                    <div class="settings-section">
                        <!-- Host Einstellungen Editor (nur für Host sichtbar) -->
                        <div id="host-settings-editor" style="display: none;">
                            <h3>EINSTELLUNGEN EDITIEREN</h3>
                            <div id="settings-editor-content"></div>
                        </div>
                        <!-- Spieler Info Anzeige (für Teilnehmer) -->
                        <div id="player-info-display">
                            <h3>LOBBY INFO</h3>
                            <div id="waiting-info-summary"></div>
                            <div class="team-selection">
                                <button class="team-btn" data-team="blue" data-locale="team_blue">BLAU</button>
                                <button class="team-btn" data-team="red" data-locale="team_red">ROT</button>
                                <button class="team-btn" data-team="spectator" data-locale="spectator">SPECTATOR</button>
                            </div>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages" class="scroll-list"></div>
                            <input type="text" id="chat-input" placeholder="NACHRICHT SENDEN...">
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-waiting-ready" data-locale="btn_ready">BEREIT</button>
                            <button class="start-btn" id="btn-waiting-start" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-waiting-leave" data-locale="btn_leave">VERLASSEN</button>
                            <button class="close-lobby-btn" id="btn-waiting-close" style="display: none;" data-locale="btn_close_lobby">SCHLIESSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Gameplay HUD -->
    <div id="gameplay-hud" style="display: none;">
        <div class="hud-top">
            <div class="match-info">
                <div class="timer" id="hud-timer">00:00</div>
                <div class="mode-label" id="hud-mode">FFA</div>
            </div>
            <div class="score-display" id="hud-score-container">
                <div class="score-item blue" id="hud-score-blue" style="display: none;">0</div>
                <div class="score-divider" style="display: none;">-</div>
                <div class="score-item red" id="hud-score-red" style="display: none;">0</div>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="player-stats-hud">
                <div class="stat-row">
                    <span data-locale="kills">KILLS</span>: <span id="hud-kills">0</span>
                </div>
                <div class="stat-row">
                    <span data-locale="deaths">TODE</span>: <span id="hud-deaths">0</span>
                </div>
            </div>
            <div class="weapon-hud">
                <div class="ammo-count" id="hud-ammo">0</div>
                <div class="weapon-icon"><i class="fa-solid fa-gun"></i></div>
            </div>
            <div class="health-armor-hud">
                <div class="bar-container armor">
                    <div class="bar-fill" id="hud-armor-fill" style="width: 0%;"></div>
                </div>
                <div class="bar-container health">
                    <div class="bar-fill" id="hud-health-fill" style="width: 100%;"></div>
                </div>
            </div>
        </div>

        <!-- Countdown -->
        <div id="game-countdown" class="countdown-overlay" style="display: none;">
            <div class="countdown-number" id="countdown-text">10</div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 data-locale="game_ended">RUNDE BEENDET</h1>
            <h2 id="winner-display-name">SPIELER <span data-locale="winner_suffix">GEWINNT!</span></h2>

            <div class="winner-stats-table">
                <table>
                    <thead>
                        <tr>
                            <th data-locale="score">NAME</th>
                            <th data-locale="kills">KILLS</th>
                            <th data-locale="deaths">TODE</th>
                            <th data-locale="kd_ratio">K/D</th>
                        </tr>
                    </thead>
                    <tbody id="winner-stats-body"></tbody>
                </table>
            </div>

            <!-- Map Voting -->
            <div class="map-voting">
                <h3>VOTE NÄCHSTE MAP</h3>
                <div class="vote-options" id="map-vote-options"></div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-winner-back" data-locale="back_to_lobby">ZURÜCK ZUR LOBBY</button>
                <button class="cancel-btn" id="btn-winner-menu" data-locale="main_menu">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
