<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="lobby" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Main Content -->
                <main class="lobby-browser">
                    <!-- Tab 1: FFA & Tab 3: Lobbies (Shared List Container) -->
                    <div id="tab-list-content" class="tab-content active">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </div>

                    <!-- Tab 2: Create Lobby -->
                    <div id="tab-create-content" class="tab-content" style="display: none;">
                        <div class="create-lobby-form">
                            <h2 data-locale="tab_create">Lobby erstellen</h2>
                            <div class="form-grid">
                                <div class="input-group">
                                    <label data-locale="lobby_name">Lobby Name</label>
                                    <input type="text" id="lobby-name" placeholder="...">
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label data-locale="map_select">Map auswählen</label>
                                        <select id="map-select"></select>
                                    </div>
                                    <div class="input-group">
                                        <label data-locale="mode_select">Spielmodus</label>
                                        <select id="mode-select">
                                            <option value="ffa">FFA</option>
                                            <option value="tdm">Team Deathmatch</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="input-group">
                                    <label data-locale="loadout_select">Waffen-Loadout</label>
                                    <div id="loadout-checkboxes" class="checkbox-grid">
                                        <!-- Will be populated by JS -->
                                    </div>
                                </div>

                                <div class="input-row">
                                    <div class="input-group">
                                        <label><span data-locale="round_time">Rundenzeit</span>: <span id="round-time-val">15</span></label>
                                        <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                    </div>
                                    <div class="input-group">
                                        <label><span data-locale="max_players">Max. Spieler</span>: <span id="max-players-val">16</span></label>
                                        <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                    </div>
                                </div>

                                <div class="input-row">
                                    <div class="input-group toggle-group">
                                        <label data-locale="vehicles_allowed">Fahrzeuge erlaubt</label>
                                        <label class="switch">
                                            <input type="checkbox" id="vehicles-allowed">
                                            <span class="slider round"></span>
                                        </label>
                                    </div>
                                    <div class="input-group toggle-group">
                                        <label data-locale="friendly_fire">Freundliches Feuer</label>
                                        <label class="switch">
                                            <input type="checkbox" id="friendly-fire">
                                            <span class="slider round"></span>
                                        </label>
                                    </div>
                                </div>

                                <div class="input-row">
                                    <div class="input-group">
                                        <label><span data-locale="respawn_time">Respawn-Zeit</span>: <span id="respawn-time-val">5</span></label>
                                        <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                    </div>
                                    <div class="input-group">
                                        <label><span data-locale="kill_limit">Kill-Limit zum Sieg</span>: <span id="kill-limit-val">30</span></label>
                                        <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                    </div>
                                </div>

                                <div class="btn-group">
                                    <button class="confirm-btn" id="btn-create-lobby" data-locale="btn_create">Lobby erstellen</button>
                                    <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">Abbrechen</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3>PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>SETTINGS</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">RED</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">SPECTATOR</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">START</button>
                            <button class="leave-btn" id="btn-leave-lobby">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer" id="hud-timer">15:00</div>
            <div class="hud-tdm-score" id="hud-tdm-score" style="display: none;">
                <span class="blue">0</span> : <span class="red">0</span>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-stats">
                <div class="stat-item"><i class="fa-solid fa-skull"></i> <span id="hud-kills">0</span></div>
                <div class="stat-item"><i class="fa-solid fa-bed"></i> <span id="hud-deaths">0</span></div>
            </div>
            <div class="hud-weapon">
                <i class="fa-solid fa-gun"></i> <span id="hud-ammo">0</span>
            </div>
            <div class="hud-bars">
                <div class="bar-container health"><div id="hud-health" class="bar-fill"></div></div>
                <div class="bar-container armor"><div id="hud-armor" class="bar-fill"></div></div>
            </div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title" data-locale="game_ended">MATCH BEENDET</h1>
            <h2 id="winner-name">SPIELER GEWINNT!</h2>
            <div id="match-stats-table"></div>

            <div class="map-voting">
                <h3 data-locale="map_select">Nächste Map wählen</h3>
                <div id="map-vote-list" class="vote-grid">
                    <!-- populated by JS -->
                </div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_back_lobby">ZURÜCK ZUR LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu" data-locale="btn_back_menu">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
