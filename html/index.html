<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" id="loc-menu-title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="loc-tab-ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="loc-tab-create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="loc-tab-list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab content container -->
                <div id="tab-ffa" class="tab-content active">
                    <main class="lobby-browser">
                        <div class="lobby-list" id="ffa-list-container">
                            <!-- Predefined lobbies will be injected here -->
                        </div>
                    </main>
                </div>

                <div id="tab-create" class="tab-content">
                    <div class="create-form-container">
                        <div class="form-grid">
                            <div class="form-left">
                                <div class="input-group">
                                    <label id="loc-lobby-name">Lobby Name</label>
                                    <input type="text" id="create-name" placeholder="Name eingeben...">
                                </div>
                                <div class="input-group">
                                    <label id="loc-map-select">Map auswählen</label>
                                    <select id="create-map"></select>
                                </div>
                                <div class="input-group">
                                    <label id="loc-mode-select">Spielmodus</label>
                                    <select id="create-mode">
                                        <option value="ffa">FFA (Alle gegen Alle)</option>
                                        <option value="tdm">Team Deathmatch</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <label id="loc-loadout-select">Waffen-Loadout</label>
                                    <div class="loadout-grid" id="loadout-grid">
                                        <!-- Multi-select checkboxes will be injected here -->
                                    </div>
                                </div>
                            </div>
                            <div class="form-right">
                                <div class="input-group">
                                    <label><span id="loc-round-time">Rundenzeit</span>: <span id="val-round-time">15</span> Min</label>
                                    <input type="range" id="create-round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span id="loc-max-players">Max. Spieler</span>: <span id="val-max-players">16</span></label>
                                    <input type="range" id="create-max-players" min="2" max="16" step="1" value="16">
                                </div>
                                <div class="input-group">
                                    <label><span id="loc-respawn-time">Respawn-Zeit</span>: <span id="val-respawn-time">5</span> Sek</label>
                                    <input type="range" id="create-respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span id="loc-kill-limit">Kill-Limit zum Sieg</span>: <span id="val-kill-limit">30</span></label>
                                    <input type="range" id="create-kill-limit" min="0" max="50" step="5" value="30">
                                    <small>(0 = deaktiviert)</small>
                                </div>
                                <div class="toggle-group">
                                    <div class="toggle-item">
                                        <label id="loc-vehicles-allowed">Fahrzeuge erlaubt</label>
                                        <input type="checkbox" id="create-vehicles" class="toggle-switch">
                                    </div>
                                    <div class="toggle-item">
                                        <label id="loc-friendly-fire">Freundliches Feuer</label>
                                        <input type="checkbox" id="create-friendly" class="toggle-switch">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="confirm-btn" id="btn-create-lobby-final">Lobby erstellen</button>
                            <button class="cancel-btn" id="btn-cancel-create">Abbrechen</button>
                        </div>
                    </div>
                </div>

                <div id="tab-list" class="tab-content">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label>MAPS <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all">ANY</option>
                                <option value="not-full">NOT FULL</option>
                            </select>
                        </div>
                    </aside>
                    <main class="lobby-browser">
                        <div class="lobby-list" id="open-list-container">
                            <!-- Open lobbies will be injected here -->
                        </div>
                    </main>
                </div>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="loc-players-header">SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 id="loc-settings-header">EINSTELLUNGEN</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="loc-team-blue">Team Blau</button>
                            <button class="team-btn" data-team="red" id="loc-team-red">Team Rot</button>
                            <button class="team-btn" data-team="spectator" id="loc-spectator">Zuschauer</button>
                            <button class="team-btn" data-team="random" id="loc-random">Zufall</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="Nachricht senden...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">Bereit</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">Spiel starten</button>
                            <button class="leave-btn" id="btn-leave-lobby">Lobby verlassen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="timer-box">
                <i class="fa-solid fa-clock"></i> <span id="hud-timer">15:00</span>
            </div>
            <div class="score-box" id="tdm-scores" style="display: none;">
                <span class="blue-score">0</span> : <span class="red-score">0</span>
            </div>
        </div>
        <div class="hud-bottom">
            <div class="stats-box">
                <div class="stat-item"><span id="loc-hud-kills">KILLS</span>: <span id="hud-kills">0</span></div>
                <div class="stat-item"><span id="loc-hud-deaths">TODE</span>: <span id="hud-deaths">0</span></div>
            </div>
            <div class="weapon-box">
                <div class="ammo-count" id="hud-ammo">100</div>
                <div class="health-armor-bars">
                    <div class="armor-bar"><div class="fill" id="hud-armor-fill"></div></div>
                    <div class="health-bar"><div class="fill" id="hud-health-fill"></div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title">RUNDE BEENDET!</h1>
            <h2 id="winner-name">SPIELER GEWINNT!</h2>
            <div id="match-stats-table"></div>

            <div class="map-voting" id="map-voting-container">
                <h3 id="loc-map-vote-header">NÄCHSTE MAP WÄHLEN</h3>
                <div class="vote-grid" id="vote-grid"></div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby">ZURÜCK ZUR LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
