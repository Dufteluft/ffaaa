<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="lobby" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- FFA TAB -->
                <div id="tab-ffa" class="tab-content active">
                    <div class="lobby-grid-container" id="ffa-presets-container">
                        <!-- Vordefinierte Lobbys werden hier eingefügt -->
                    </div>
                </div>

                <!-- CREATE TAB -->
                <div id="tab-create" class="tab-content">
                    <div class="create-form">
                        <div class="form-row">
                            <div class="input-group">
                                <label data-locale="lobby_name">Lobby Name</label>
                                <input type="text" id="create-name" placeholder="...">
                            </div>
                            <div class="input-group">
                                <label data-locale="map_select">Map auswählen</label>
                                <select id="create-map"></select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="input-group">
                                <label data-locale="mode_select">Spielmodus</label>
                                <select id="create-mode">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">Team Deathmatch</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label data-locale="loadout_select">Waffen-Loadout</label>
                                <div class="loadout-multi-select" id="create-loadout">
                                    <!-- Checkboxen werden dynamisch eingefügt -->
                                </div>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="input-group">
                                <label><span data-locale="round_time">Rundenzeit</span>: <span id="val-time">15</span></label>
                                <input type="range" id="create-time" min="5" max="30" step="1" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">Max. Spieler</span>: <span id="val-players">16</span></label>
                                <input type="range" id="create-players" min="2" max="16" step="1" value="16">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="input-group toggle-group">
                                <label data-locale="vehicles_allowed">Fahrzeuge erlaubt</label>
                                <label class="switch">
                                    <input type="checkbox" id="create-vehicles">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="input-group toggle-group">
                                <label data-locale="friendly_fire">Freundliches Feuer</label>
                                <label class="switch">
                                    <input type="checkbox" id="create-ff">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="input-group">
                                <label><span data-locale="respawn_time">Respawn-Zeit</span>: <span id="val-respawn">5</span></label>
                                <input type="range" id="create-respawn" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">Kill-Limit zum Sieg</span>: <span id="val-killlimit">30</span></label>
                                <input type="range" id="create-killlimit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="btn-confirm" id="btn-submit-create" data-locale="btn_create">Lobby erstellen</button>
                            <button class="btn-cancel" id="btn-cancel-create" data-locale="btn_cancel">Abbrechen</button>
                        </div>
                    </div>
                </div>

                <!-- LOBBY LIST TAB -->
                <div id="tab-lobby" class="tab-content">
                    <div class="lobby-filter-bar">
                        <input type="text" id="lobby-search" placeholder="Suche...">
                        <label class="filter-checkbox">
                            <input type="checkbox" id="filter-not-full"> Nur freie Plätze
                        </label>
                    </div>
                    <div class="lobby-list" id="custom-lobbies-container">
                        <!-- Custom Lobbys werden hier eingefügt -->
                    </div>
                </div>
            </div>
        </div>

        <!-- WAITING ROOM -->
        <div id="waiting-room" class="overlay" style="display: none;">
            <div class="waiting-card">
                <div class="waiting-header">
                    <h2 id="wait-lobby-name">Lobby Name</h2>
                    <div class="wait-lobby-info">
                        <span id="wait-map-label">Map</span> | <span id="wait-mode-label">Mode</span>
                    </div>
                </div>
                <div class="waiting-body">
                    <div class="player-section">
                    <h3 data-locale="col_name">Spieler</h3>
                        <div class="player-list" id="wait-player-list"></div>
                    </div>
                    <div class="controls-section">
                        <div class="host-settings-bar" id="host-settings-btn-container" style="display: none;">
                            <button class="team-btn" id="btn-edit-settings"><i class="fas fa-cog"></i> SETTINGS</button>
                        </div>
                        <div class="team-selector" id="wait-team-selector">
                            <button class="team-btn" data-team="blue" data-locale="team_blue">Blau</button>
                            <button class="team-btn" data-team="red" data-locale="team_red">Rot</button>
                            <button class="team-btn" data-team="random" data-locale="random">Zufall</button>
                        </div>
                        <div class="chat-area">
                            <div class="chat-messages" id="wait-chat-messages"></div>
                            <input type="text" id="wait-chat-input" placeholder="Nachricht...">
                        </div>
                        <div class="action-buttons">
                            <button class="btn-ready" id="btn-wait-ready" data-locale="btn_ready">Bereit</button>
                            <button class="btn-start" id="btn-wait-start" style="display: none;" data-locale="btn_start">Start</button>
                            <button class="btn-leave" id="btn-wait-leave" data-locale="btn_leave">Verlassen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer" id="hud-timer">00:00</div>
            <div class="hud-scores" id="hud-scores" style="display: none;">
                <span class="score-blue">0</span> : <span class="score-red">0</span>
            </div>
        </div>
        <div class="hud-bottom">
            <div class="hud-stats">
                <div class="stat-item">
                    <span class="stat-label" data-locale="kills">Kills</span>
                    <span class="stat-value" id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label" data-locale="deaths">Tode</span>
                    <span class="stat-value" id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-bars">
                <div class="bar-container">
                    <div class="bar-fill health" id="hud-health-bar" style="width: 100%;"></div>
                </div>
                <div class="bar-container">
                    <div class="bar-fill armor" id="hud-armor-bar" style="width: 0%;"></div>
                </div>
            </div>
            <div class="hud-weapon">
                <span id="hud-ammo">0 / 0</span>
            </div>
        </div>
    </div>

    <!-- WINNER SCREEN -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 data-locale="game_ended">Runde beendet!</h1>
            <h2 id="winner-display">Gewinner: Name</h2>

            <div class="scoreboard-container">
                <table id="winner-scoreboard">
                    <thead>
                        <tr>
                            <th data-locale="col_name">Name</th>
                            <th data-locale="kills">Kills</th>
                            <th data-locale="deaths">Tode</th>
                            <th data-locale="kd_ratio">K/D</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="map-voting" id="map-voting">
                <h3 data-locale="map_select">Nächste Map wählen</h3>
                <div class="vote-options" id="vote-options"></div>
            </div>

            <div class="winner-actions">
                <button class="btn-confirm" id="btn-winner-lobby" data-locale="btn_back_lobby">Zurück zur Lobby</button>
                <button class="btn-cancel" id="btn-winner-menu" data-locale="btn_back_menu">Hauptmenü</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
