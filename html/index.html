<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <header class="main-header">
                <h1 class="header-title l-menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active l-tab_ffa" data-tab="ffa">FFA Lobby</button>
                    <button class="tab-btn l-tab_create" data-tab="create">Lobby erstellen</button>
                    <button class="tab-btn l-tab_list" data-tab="list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1: FFA Lobby & Tab 3: Offene Lobbys (Share the same list view) -->
                <div id="tab-browser" class="tab-content active">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label><span class="l-map_select">Map auswählen</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span class="l-filter_not_full">Nur freie Plätze</span></label>
                            <input type="checkbox" id="filter-players">
                        </div>
                    </aside>
                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container"></div>
                    </main>
                </div>

                <!-- Tab 2: Lobby erstellen -->
                <div id="tab-create" class="tab-content">
                    <div class="create-form-container">
                        <div class="input-group">
                            <label class="l-lobby_name">Lobby Name</label>
                            <input type="text" id="create-name" placeholder="ENTER NAME...">
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label class="l-map_select">Map auswählen</label>
                                <select id="create-map"></select>
                            </div>
                            <div class="input-group">
                                <label class="l-mode_select">Spielmodus</label>
                                <select id="create-mode">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">TEAM DEATHMATCH</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-group">
                            <label class="l-loadout_select">Waffen-Loadout</label>
                            <div class="multi-select" id="create-loadout"></div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span class="l-round_time">Rundenzeit (Min)</span>: <span id="val-time">15</span></label>
                                <input type="range" id="create-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span class="l-max_players">Max. Spieler</span>: <span id="val-players">16</span></label>
                                <input type="range" id="create-players" min="2" max="16" step="1" value="16">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span class="l-respawn_time">Respawn-Zeit (Sek)</span>: <span id="val-respawn">5</span></label>
                                <input type="range" id="create-respawn" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span class="l-kill_limit">Kill-Limit zum Sieg</span>: <span id="val-killlimit">30</span></label>
                                <input type="range" id="create-killlimit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="toggle-group">
                                <label class="l-vehicles_allowed">Fahrzeuge erlaubt</label>
                                <input type="checkbox" id="create-vehicles">
                            </div>
                            <div class="toggle-group">
                                <label class="l-friendly_fire">Freundliches Feuer</label>
                                <input type="checkbox" id="create-friendlyfire">
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="confirm-btn l-btn_create" id="btn-create-submit">Lobby erstellen</button>
                            <button class="cancel-btn l-btn_cancel" id="btn-create-cancel">Abbrechen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2>LOBBY: <span id="lobby-title">Default</span></h2>
                    <div id="host-controls" style="display: none;">
                        <button class="icon-btn l-btn_close_lobby" id="btn-close-lobby">Lobby schließen</button>
                    </div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 class="l-tab_list">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <div class="team-selection">
                            <button class="team-btn l-team_blue" data-team="blue">Team Blau</button>
                            <button class="team-btn l-team_red" data-team="red">Team Rot</button>
                            <button class="team-btn l-spectator" data-team="spectator">Zuschauer</button>
                            <button class="team-btn l-random" data-team="random">Zufall</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn l-btn_ready" id="btn-ready-toggle">Bereit</button>
                            <button class="start-btn l-btn_start" id="btn-start-game" style="display: none;">Spiel starten</button>
                            <button class="leave-btn l-btn_leave" id="btn-leave-lobby">Lobby verlassen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer"><i class="fa-solid fa-clock"></i> <span id="hud-time">15:00</span></div>
            <div class="hud-scores" id="hud-tdm-scores" style="display: none;">
                <div class="score-blue">0</div>
                <div class="score-vs">VS</div>
                <div class="score-red">0</div>
            </div>
        </div>
        <div class="hud-bottom-left">
            <div class="hud-stat"><span class="l-kills">Kills</span>: <span id="hud-kills">0</span></div>
            <div class="hud-stat"><span class="l-deaths">Tode</span>: <span id="hud-deaths">0</span></div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-bars">
                <div class="hud-bar-container">
                    <div class="hud-bar-label l-health">LEBEN</div>
                    <div class="hud-bar bg-health"><div id="bar-health" style="width: 100%;"></div></div>
                </div>
                <div class="hud-bar-container">
                    <div class="hud-bar-label l-armor">RÜSTUNG</div>
                    <div class="hud-bar bg-armor"><div id="bar-armor" style="width: 50%;"></div></div>
                </div>
            </div>
            <div class="hud-ammo">
                <i class="fa-solid fa-gun"></i>
                <span id="hud-ammo">30/120</span>
            </div>
        </div>
        <div id="hud-countdown" style="display: none;">10</div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 class="l-game_ended">Runde beendet!</h1>
            <h2 id="winner-announcement">PLAYER <span class="l-winner_suffix">GEWINNT!</span></h2>

            <div class="match-results">
                <table id="winner-stats-table">
                    <thead>
                        <tr>
                            <th class="l-lobby_name">NAME</th>
                            <th class="l-kills">KILLS</th>
                            <th class="l-deaths">TODE</th>
                            <th class="l-kd_ratio">K/D</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="map-voting">
                <h3 class="l-vote_next_map">WÄHLE DIE NÄCHSTE MAP</h3>
                <div class="map-grid" id="map-voting-grid"></div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn l-btn_back_to_lobby" id="btn-winner-back">Zurück zur Lobby</button>
                <button class="cancel-btn l-btn_back_to_menu" id="btn-winner-menu">Hauptmenü</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
