<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa-presets" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create-lobby" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="open-lobbies" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Sidebar Filters (Shared between Presets and Open Lobbies) -->
                <aside class="sidebar" id="sidebar-filters">
                    <div class="filter-group">
                        <label><span data-locale="map_select">Map auswählen</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label><span data-locale="loadout_select">Waffen-Loadout</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label><span data-locale="max_players">Max. Spieler</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>

                    <div class="stats-box">
                        <h3 data-locale="score">Statistiken</h3>
                        <div class="stat-row">
                            <span data-locale="kills">Kills</span>
                            <span id="stat-kills">0</span>
                        </div>
                        <div class="stat-row">
                            <span data-locale="deaths">Tode</span>
                            <span id="stat-deaths">0</span>
                        </div>
                        <div class="stat-row">
                            <span data-locale="kd_ratio">K/D</span>
                            <span id="stat-kd">0.00</span>
                        </div>
                    </div>
                </aside>

                <main class="lobby-browser">
                    <!-- Tab 1: FFA Presets -->
                    <div id="tab-ffa-presets" class="tab-content active">
                        <div class="lobby-list" id="preset-list"></div>
                    </div>

                    <!-- Tab 2: Create Lobby -->
                    <div id="tab-create-lobby" class="tab-content">
                        <div class="creation-form">
                            <div class="input-group">
                                <label data-locale="lobby_name">Lobby Name</label>
                                <input type="text" id="create-name" placeholder="...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label data-locale="map_select">Map auswählen</label>
                                    <select id="create-map"></select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="mode_select">Spielmodus</label>
                                    <select id="create-mode">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label data-locale="loadout_select">Waffen-Loadout</label>
                                <select id="create-loadout"></select>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span data-locale="round_time">Rundenzeit</span>: <span id="val-time">15</span>m</label>
                                    <input type="range" id="create-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="max_players">Max. Spieler</span>: <span id="val-players">16</span></label>
                                    <input type="range" id="create-players" min="2" max="16" step="1" value="16">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span data-locale="respawn_time">Respawn-Zeit</span>: <span id="val-respawn">5</span>s</label>
                                    <input type="range" id="create-respawn" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="kill_limit">Kill-Limit</span>: <span id="val-kills">30</span></label>
                                    <input type="range" id="create-kills" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="toggle-row">
                                <div class="toggle-group">
                                    <label data-locale="vehicles_allowed">Fahrzeuge erlaubt</label>
                                    <input type="checkbox" id="create-vehicles">
                                </div>
                                <div class="toggle-group">
                                    <label data-locale="friendly_fire">Freundliches Feuer</label>
                                    <input type="checkbox" id="create-ff">
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="confirm-btn" id="btn-submit-create" data-locale="btn_create">Lobby erstellen</button>
                            </div>
                        </div>
                    </div>

                    <!-- Tab 3: Open Lobbies -->
                    <div id="tab-open-lobbies" class="tab-content">
                        <div class="lobby-list" id="open-list"></div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="waiting-lobby-name">LOBBY</h2>
                    <div class="lobby-badge" id="waiting-lobby-mode">FFA</div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">Spielerliste</h3>
                        <div id="waiting-player-list"></div>
                    </div>
                    <div class="settings-section">
                        <div class="host-controls" id="host-settings-editor">
                            <!-- Host can edit settings here -->
                        </div>
                        <div class="player-controls">
                            <div class="team-selection">
                                <button class="team-btn" data-team="blue" data-locale="team_blue">BLUE</button>
                                <button class="team-btn" data-team="red" data-locale="team_red">RED</button>
                                <button class="team-btn" data-team="spectator" data-locale="spectator">SPECTATOR</button>
                                <button class="team-btn" data-team="random" data-locale="random">RANDOM</button>
                            </div>
                            <div class="lobby-chat">
                                <div id="chat-messages"></div>
                                <input type="text" id="chat-input" placeholder="...">
                            </div>
                            <div class="lobby-actions">
                                <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">BEREIT</button>
                                <button class="start-btn" id="btn-start-match" style="display: none;" data-locale="btn_start">START</button>
                                <button class="leave-btn" id="btn-leave" data-locale="btn_leave">VERLASSEN</button>
                                <button class="close-btn" id="btn-close-lobby" style="display: none;" data-locale="btn_close_lobby">SCHLIEẞEN</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 id="winner-title" data-locale="game_ended">MATCH ENDED</h1>
                <h2 id="winner-display-name">PLAYER <span data-locale="wins_suffix">WINS!</span></h2>

                <div class="stats-table-wrapper">
                    <table id="winner-stats-table">
                        <thead>
                            <tr>
                                <th data-locale="tab_players">Spieler</th>
                                <th data-locale="kills">Kills</th>
                                <th data-locale="deaths">Tode</th>
                                <th data-locale="kd_ratio">K/D</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div class="map-voting">
                    <h3 data-locale="map_select">Nächste Map wählen</h3>
                    <div class="vote-options" id="vote-maps"></div>
                </div>

                <div class="btn-group">
                    <button class="confirm-btn" id="btn-win-lobby">BACK TO LOBBY</button>
                    <button class="cancel-btn" id="btn-win-menu">MAIN MENU</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Gameplay HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="timer-box">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-timer">00:00</span>
            </div>
            <div class="score-container" id="hud-scores" style="display: none;">
                <div class="score-team blue">
                    <span class="team-label" data-locale="team_blue">BLUE</span>
                    <span id="score-blue">0</span>
                </div>
                <div class="score-divider">VS</div>
                <div class="score-team red">
                    <span id="score-red">0</span>
                    <span class="team-label" data-locale="team_red">RED</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom-left">
            <div class="personal-stats">
                <div class="stat-item">
                    <span data-locale="kills">KILLS</span>
                    <span id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span data-locale="deaths">TODE</span>
                    <span id="hud-deaths">0</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="weapon-info">
                <span id="hud-ammo">0</span>
                <i class="fa-solid fa-gun"></i>
            </div>
            <div class="bars-container">
                <div class="bar-wrapper">
                    <div class="bar health"><div id="bar-health-inner"></div></div>
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="bar-wrapper">
                    <div class="bar armor"><div id="bar-armor-inner"></div></div>
                    <i class="fa-solid fa-shield"></i>
                </div>
            </div>
        </div>

        <div id="game-countdown" style="display: none;">10</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
