<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESX FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" id="loc-menu-title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="loc-tab-ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="loc-tab-create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="loc-tab-list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab: FFA & Open Lobbies -->
                <div id="lobby-list-view" class="tab-content active">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label id="loc-map-select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALLE MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group" id="filter-players-group">
                            <label id="loc-players">SPIELER <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all">ALLE</option>
                                <option value="free" id="loc-filter-free-slots">NUR FREIE PLÄTZE</option>
                            </select>
                        </div>
                    </aside>

                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </main>
                </div>

                <!-- Tab: Create Lobby -->
                <div id="create-lobby-view" class="tab-content">
                    <div class="create-form">
                        <div class="form-row">
                            <div class="input-group">
                                <label id="loc-lobby-name">LOBBY NAME</label>
                                <input type="text" id="create-name" placeholder="...">
                            </div>
                            <div class="input-group">
                                <label id="loc-map-select-2">MAP</label>
                                <select id="create-map"></select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="input-group">
                                <label id="loc-mode-select">MODUS</label>
                                <select id="create-mode">
                                    <option value="ffa">Free-for-All (FFA)</option>
                                    <option value="tdm">Team Deathmatch (TDM)</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label id="loc-loadout-select">WAFFEN-LOADOUT (MULTI-SELECT)</label>
                                <div class="multi-select-grid" id="create-loadouts">
                                    <!-- Waffen Kategorien Checkboxen -->
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="input-group">
                                <label><span id="loc-round-time">RUNDENZEIT</span>: <span id="val-time">15</span> MIN</label>
                                <input type="range" id="create-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span id="loc-max-players">MAX. SPIELER</span>: <span id="val-players">16</span></label>
                                <input type="range" id="create-maxplayers" min="2" max="16" step="1" value="16">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="input-group toggle-group">
                                <label id="loc-vehicles-allowed">FAHRZEUGE ERLAUBT?</label>
                                <label class="switch">
                                    <input type="checkbox" id="create-vehicles">
                                    <span class="slider-round"></span>
                                </label>
                            </div>
                            <div class="input-group toggle-group">
                                <label id="loc-friendly-fire">FREUNDLICHES FEUER</label>
                                <label class="switch">
                                    <input type="checkbox" id="create-ff">
                                    <span class="slider-round"></span>
                                </label>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="input-group">
                                <label><span id="loc-respawn-time">RESPAWN-ZEIT</span>: <span id="val-respawn">5</span> SEK</label>
                                <input type="range" id="create-respawn" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span id="loc-kill-limit">KILL-LIMIT</span>: <span id="val-kills">30</span></label>
                                <input type="range" id="create-killlimit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>

                        <div class="form-actions">
                            <button class="confirm-btn" id="btn-submit-create">LOBBY ERSTELLEN</button>
                            <button class="cancel-btn" id="btn-cancel-create">ABBRECHEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2>LOBBY: <span id="waiting-lobby-name">NAME</span></h2>
                    <div class="lobby-id-tag">ID: <span id="waiting-lobby-id">0000</span></div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="loc-players-list">SPIELER</h3>
                        <div id="waiting-player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 id="loc-settings">EINSTELLUNGEN</h3>
                        <div id="waiting-info-summary" class="info-grid"></div>

                        <div class="team-selection" id="team-selector-box">
                            <button class="team-btn" data-team="blue" id="loc-team-blue">BLAU</button>
                            <button class="team-btn" data-team="red" id="loc-team-red">ROT</button>
                            <button class="team-btn" data-team="spectator" id="loc-spectator">ZUSCHAUER</button>
                            <button class="team-btn" data-team="random" id="loc-random">ZUFALL</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="NACHRICHT SENDEN...">
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready">BEREIT</button>
                            <button class="start-btn" id="btn-start" style="display: none;">START</button>
                            <button class="close-btn" id="btn-close-lobby" style="display: none;">LOBBY SCHLIEẞEN</button>
                            <button class="leave-btn" id="btn-leave">VERLASSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen / Map Voting -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 id="loc-game-ended">RUNDE BEENDET!</h1>
                <h2 id="winner-announcement">SPIELER <span id="loc-winner-suffix">GEWINNT!</span></h2>

                <div class="stats-container">
                    <table id="match-stats-table">
                        <thead>
                            <tr>
                                <th id="loc-players-2">SPIELER</th>
                                <th id="loc-kills">KILLS</th>
                                <th id="loc-deaths">TODE</th>
                                <th id="loc-kd-ratio">K/D</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div class="map-voting-section" id="voting-box">
                    <h3 id="loc-map-voting">WÄHLE DIE NÄCHSTE MAP</h3>
                    <div class="map-votes-grid" id="map-voting-grid"></div>
                </div>

                <div class="btn-group">
                    <button class="confirm-btn" id="btn-vote-finish" style="display: none;">FERTIG</button>
                    <button class="cancel-btn" id="btn-exit-to-menu">HAUPTMENÜ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Gameplay HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-container">
            <div class="hud-top">
                <div class="timer-box">
                    <i class="fa-regular fa-clock"></i>
                    <span id="hud-timer">00:00</span>
                </div>
                <div class="score-box" id="hud-tdm-score" style="display: none;">
                    <span class="score-blue">0</span>
                    <span class="score-divider">:</span>
                    <span class="score-red">0</span>
                </div>
            </div>

            <div class="hud-bottom">
                <div class="hud-stats">
                    <div class="stat-item">
                        <span class="stat-label" id="loc-kills-2">KILLS</span>
                        <span class="stat-value" id="hud-kills">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label" id="loc-deaths-2">TODE</span>
                        <span class="stat-value" id="hud-deaths">0</span>
                    </div>
                </div>

                <div class="hud-bars">
                    <div class="bar-container health">
                        <div class="bar-fill" id="hud-health-bar" style="width: 100%;"></div>
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div class="bar-container armor">
                        <div class="bar-fill" id="hud-armor-bar" style="width: 0%;"></div>
                        <i class="fa-solid fa-shield"></i>
                    </div>
                </div>

                <div class="hud-ammo">
                    <i class="fa-solid fa-gun"></i>
                    <span id="hud-ammo">0</span>
                </div>
            </div>
        </div>

        <div id="kill-feed"></div>
        <div id="countdown-display" style="display: none;">10</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
