<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1: FFA Lobby & Tab 3: Offene Lobbys (shared browser) -->
                <main class="lobby-browser" id="browser-container">
                    <div class="browser-header" id="browser-filters" style="display: none;">
                        <div class="filter-item">
                            <label data-locale="max_players">Nur mit freien Plätzen</label>
                            <input type="checkbox" id="filter-free-slots">
                        </div>
                    </div>
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Entries will be injected here -->
                    </div>
                </main>

                <!-- Tab 2: Lobby erstellen -->
                <main class="create-lobby-container" id="create-container" style="display: none;">
                    <div class="form-grid">
                        <div class="input-group full-width">
                            <label data-locale="lobby_name">Lobby Name</label>
                            <input type="text" id="lobby-name" placeholder="...">
                        </div>
                        <div class="input-group">
                            <label data-locale="map_select">Map auswählen</label>
                            <select id="map-select"></select>
                        </div>
                        <div class="input-group">
                            <label data-locale="mode_select">Spielmodus</label>
                            <select id="mode-select">
                                <option value="ffa" data-locale="ffa">FFA</option>
                                <option value="tdm" data-locale="tdm">Team Deathmatch</option>
                            </select>
                        </div>
                        <div class="input-group full-width">
                            <label data-locale="loadout_select">Waffen-Loadout</label>
                            <select id="loadout-select" multiple size="5"></select>
                        </div>
                        <div class="input-group">
                            <label><span data-locale="round_time">Rundenzeit</span>: <span id="round-time-val">15</span> Min</label>
                            <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                        </div>
                        <div class="input-group">
                            <label><span data-locale="max_players">Max. Spieler</span>: <span id="max-players-val">16</span></label>
                            <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                        </div>
                        <div class="input-group">
                            <label><span data-locale="respawn_time">Respawn-Zeit</span>: <span id="respawn-time-val">5</span> Sek</label>
                            <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                        </div>
                        <div class="input-group">
                            <label><span data-locale="kill_limit">Kill-Limit zum Sieg</span>: <span id="kill-limit-val">30</span></label>
                            <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                        </div>
                        <div class="toggle-group">
                            <div class="toggle-item">
                                <label data-locale="vehicles_allowed">Fahrzeuge erlaubt?</label>
                                <input type="checkbox" id="vehicles-allowed">
                            </div>
                            <div class="toggle-item">
                                <label data-locale="friendly_fire">Freundliches Feuer</label>
                                <input type="checkbox" id="friendly-fire">
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="confirm-btn" id="btn-create-lobby" data-locale="btn_create">Lobby erstellen</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>


        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">Spielerliste</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <div class="settings-header">
                            <h3 data-locale="tab_create">Lobby Einstellungen</h3>
                            <div id="lobby-info-summary"></div>
                        </div>

                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red" data-locale="team_red">RED</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec" data-locale="spectator">SPECTATOR</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="...">
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="close-btn" id="btn-close-lobby" style="display: none;" data-locale="btn_close_lobby">CLOSE</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-item" id="hud-timer">00:00</div>
            <div class="hud-item" id="hud-tdm-score" style="display: none;">
                <span class="score-blue">0</span> - <span class="score-red">0</span>
            </div>
        </div>
        <div class="hud-bottom">
            <div class="hud-stats">
                <div class="stat-item"><i class="fa-solid fa-skull"></i> <span id="hud-kills">0</span></div>
                <div class="stat-item"><i class="fa-solid fa-cross"></i> <span id="hud-deaths">0</span></div>
            </div>
            <div class="hud-player-state">
                <div class="state-item"><i class="fa-solid fa-gun"></i> <span id="hud-ammo">0</span></div>
                <div class="state-item"><i class="fa-solid fa-heart"></i> <span id="hud-health">100</span></div>
                <div class="state-item"><i class="fa-solid fa-shield"></i> <span id="hud-armor">0</span></div>
            </div>
        </div>
    </div>

    <!-- Countdown Overlay -->
    <div id="big-countdown" style="display: none;">10</div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title">MATCH ENDED</h1>
            <h2 id="winner-name">PLAYER WINS!</h2>
            <div id="match-stats-table"></div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
