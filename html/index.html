<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <header class="main-header">
                <h1 class="header-title" id="l-menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="l-tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="l-tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="l-tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Sidebar (Visible only in Tab 1 and Tab 3) -->
                <aside class="sidebar" id="sidebar">
                    <div class="filter-group">
                        <label id="l-map_select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="l-loadout_select">WEAPONS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="l-max_players">PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>
                </aside>

                <!-- Main Content Area -->
                <main class="main-content">
                    <!-- Tab: FFA & List (Lobby Browser) -->
                    <div id="lobby-browser" class="tab-content active">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries injected by JS -->
                        </div>
                    </div>

                    <!-- Tab: Create Lobby -->
                    <div id="create-lobby-tab" class="tab-content">
                        <div class="create-form">
                            <div class="form-grid">
                                <div class="input-group full-width">
                                    <label id="l-lobby_name">LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                                </div>
                                <div class="input-group">
                                    <label id="l-map_select_2">MAP</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label id="l-mode_select">MODE</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                                <div class="input-group full-width">
                                    <label id="l-loadout_select_2">LOADOUT</label>
                                    <div class="checkbox-grid" id="loadout-checkboxes">
                                        <!-- Checkboxes injected by JS -->
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label id="l-round_time">ROUND TIME (MIN): <span id="round-time-val">15</span></label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label id="l-max_players_2">MAX PLAYERS: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                                <div class="input-group">
                                    <label id="l-respawn_time">RESPAWN TIME (SEC): <span id="respawn-time-val">5</span></label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label id="l-kill_limit">KILL LIMIT (0=OFF): <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                                <div class="input-group toggle-group">
                                    <label id="l-vehicles_allowed">VEHICLES</label>
                                    <label class="switch">
                                        <input type="checkbox" id="vehicles-toggle">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="input-group toggle-group">
                                    <label id="l-friendly_fire">FRIENDLY FIRE</label>
                                    <label class="switch">
                                        <input type="checkbox" id="ff-toggle">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="confirm-btn" id="btn-create-lobby-action">CREATE LOBBY</button>
                                <button class="cancel-btn" id="btn-cancel-create">CANCEL</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2>LOBBY: <span id="lobby-title-display">Default</span></h2>
                    <div class="lobby-id-badge">ID: <span id="lobby-id-display">0000</span></div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="l-players_title">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 id="l-settings_title">SETTINGS</h3>
                        <div id="lobby-settings-summary" class="settings-summary"></div>

                        <div id="host-edit-controls" style="display: none; margin-bottom: 15px;">
                            <div class="edit-row">
                                <select id="edit-map-select" class="small-select"></select>
                                <select id="edit-mode-select" class="small-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">TDM</option>
                                </select>
                            </div>
                            <div class="edit-row">
                                <button class="small-btn" id="btn-update-settings">UPDATE SETTINGS</button>
                            </div>
                        </div>

                        <div class="team-selection-area">
                            <label id="l-team_select">SELECT TEAM</label>
                            <div class="team-buttons">
                                <button class="team-btn blue" data-team="blue" id="l-team_blue">BLUE</button>
                                <button class="team-btn red" data-team="red" id="l-team_red">RED</button>
                                <button class="team-btn spec" data-team="spectator" id="l-spectator">SPECTATOR</button>
                                <button class="team-btn random" data-team="random" id="l-random">RANDOM</button>
                            </div>
                        </div>

                        <div class="lobby-chat-section">
                            <div id="chat-messages" class="chat-box"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>

                        <div class="lobby-footer-actions">
                            <button class="ready-btn" id="btn-ready-toggle">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">START MATCH</button>
                            <button class="close-btn" id="btn-close-lobby" style="display: none;">CLOSE LOBBY</button>
                            <button class="leave-btn" id="btn-leave-lobby">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- In-Game HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-right">
            <div class="timer-box">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-timer">15:00</span>
            </div>
            <div class="score-container" id="hud-scores" style="display: none;">
                <div class="score-box blue">
                    <span class="label">BLUE</span>
                    <span id="score-blue">0</span>
                </div>
                <div class="score-box red">
                    <span class="label">RED</span>
                    <span id="score-red">0</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="stats-box">
                <div class="stat-item">
                    <span class="label">KILLS</span>
                    <span id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">DEATHS</span>
                    <span id="hud-deaths">0</span>
                </div>
            </div>
            <div class="weapon-info">
                <div class="ammo-box">
                    <i class="fa-solid fa-gun"></i>
                    <span id="hud-ammo">100</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom-left">
            <div class="player-bars">
                <div class="bar-wrapper health">
                    <div class="bar-fill" id="health-bar" style="width: 100%;"></div>
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="bar-wrapper armor">
                    <div class="bar-fill" id="armor-bar" style="width: 100%;"></div>
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
            </div>
        </div>

        <div id="countdown-display" class="countdown-overlay" style="display: none;">
            <span id="countdown-number">10</span>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-container">
            <div class="winner-header">
                <h1 id="l-game_ended">MATCH ENDED</h1>
                <div class="winner-announcement">
                    <span id="l-winner">WINNER:</span>
                    <h2 id="winner-name-display">PLAYER_NAME</h2>
                </div>
            </div>

            <div class="winner-content">
                <div class="stats-table-wrapper">
                    <table id="winner-stats-table">
                        <thead>
                            <tr>
                                <th>NAME</th>
                                <th>KILLS</th>
                                <th>DEATHS</th>
                                <th>K/D</th>
                            </tr>
                        </thead>
                        <tbody id="stats-body"></tbody>
                    </table>
                </div>

                <div class="map-voting-section">
                    <h3>VOTE NEXT MAP</h3>
                    <div class="map-voting-grid" id="map-voting-grid">
                        <!-- Maps injected by JS -->
                    </div>
                </div>
            </div>

            <div class="winner-actions">
                <button class="confirm-btn" id="btn-winner-back-lobby">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-winner-main-menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
