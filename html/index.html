<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESX FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- TAB 1 & 3: LOBBY BROWSER -->
                <main class="lobby-browser" id="tab-browser">
                    <div class="browser-header">
                        <div class="search-box">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="lobby-search" placeholder="Suchen...">
                        </div>
                        <div class="filter-options">
                            <label class="toggle-container">
                                <input type="checkbox" id="filter-free-slots">
                                <span class="checkmark"></span>
                                <span class="toggle-label">Nur mit freien Plätzen</span>
                            </label>
                        </div>
                    </div>
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Entries injected by JS -->
                    </div>
                </main>

                <!-- TAB 2: CREATE LOBBY -->
                <main class="create-lobby-panel" id="tab-create" style="display: none;">
                    <div class="form-grid">
                        <div class="input-group">
                            <label data-locale="lobby_name">Lobby Name</label>
                            <input type="text" id="create-name" placeholder="Name eingeben...">
                        </div>
                        <div class="input-group">
                            <label data-locale="map_select">Map auswählen</label>
                            <select id="create-map"></select>
                        </div>
                        <div class="input-group">
                            <label data-locale="mode_select">Spielmodus</label>
                            <select id="create-mode">
                                <option value="ffa">FFA</option>
                                <option value="tdm">Team Deathmatch</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label data-locale="loadout_select">Waffen-Loadout</label>
                            <select id="create-loadout" multiple class="multi-select"></select>
                            <small>Halte STRG für Mehrfachauswahl</small>
                        </div>
                        <div class="slider-group">
                            <label><span data-locale="round_time">Rundenzeit</span>: <span id="val-time">15</span> Min</label>
                            <input type="range" id="create-time" min="5" max="30" step="5" value="15">
                        </div>
                        <div class="slider-group">
                            <label><span data-locale="max_players">Max. Spieler</span>: <span id="val-players">16</span></label>
                            <input type="range" id="create-players" min="2" max="16" step="1" value="16">
                        </div>
                        <div class="toggle-row">
                            <label class="toggle-container">
                                <input type="checkbox" id="create-vehicles">
                                <span class="checkmark"></span>
                                <span class="toggle-label" data-locale="vehicles_allowed">Fahrzeuge erlaubt</span>
                            </label>
                            <label class="toggle-container">
                                <input type="checkbox" id="create-ff">
                                <span class="checkmark"></span>
                                <span class="toggle-label" data-locale="friendly_fire">Freundliches Feuer</span>
                            </label>
                        </div>
                        <div class="slider-group">
                            <label><span data-locale="respawn_time">Respawn-Zeit</span>: <span id="val-respawn">5</span> Sek</label>
                            <input type="range" id="create-respawn" min="3" max="10" step="1" value="5">
                        </div>
                        <div class="slider-group">
                            <label><span data-locale="kill_limit">Kill-Limit zum Sieg</span>: <span id="val-kills">30</span></label>
                            <input type="range" id="create-kills" min="0" max="50" step="5" value="30">
                        </div>
                    </div>
                    <div class="create-actions">
                        <button class="create-btn" id="btn-submit-create" data-locale="btn_create">Lobby erstellen</button>
                        <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">Abbrechen</button>
                    </div>
                </main>
            </div>
        </div>

        <!-- WAITING AREA -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2>LOBBY: <span id="waiting-lobby-name">...</span></h2>
                    <div class="lobby-id-badge">ID: <span id="waiting-lobby-id">0000</span></div>
                </header>
                <div class="lobby-main-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">Spielerliste</h3>
                        <div id="waiting-player-list" class="styled-scroll"></div>
                    </div>
                    <div class="lobby-controls-section">
                        <div class="waiting-settings-summary" id="waiting-settings">
                            <!-- Injected by JS -->
                        </div>
                        <div class="team-selector" id="team-selector">
                            <button class="team-btn blue" data-team="blue" data-locale="team_blue">Team Blau</button>
                            <button class="team-btn red" data-team="red" data-locale="team_red">Team Rot</button>
                            <button class="team-btn spec" data-team="spectator" data-locale="spectator">Zuschauer</button>
                        </div>
                        <div class="lobby-chat-container">
                            <div id="lobby-chat-messages" class="chat-box styled-scroll"></div>
                            <div class="chat-input-row">
                                <input type="text" id="lobby-chat-input" placeholder="Nachricht schreiben...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>
                        <div class="waiting-actions">
                            <button class="ready-btn" id="btn-toggle-ready" data-locale="btn_ready">Bereit</button>
                            <button class="start-btn" id="btn-host-start" style="display: none;" data-locale="btn_start">Spiel starten</button>
                            <button class="leave-btn" id="btn-lobby-leave" data-locale="btn_leave">Lobby verlassen</button>
                            <button class="close-btn" id="btn-host-close" style="display: none;" data-locale="btn_close_lobby">Lobby schließen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer" id="hud-timer">15:00</div>
            <div class="hud-tdm-score" id="hud-tdm-score" style="display: none;">
                <span class="score-blue">0</span>
                <span class="score-divider">:</span>
                <span class="score-red">0</span>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-stats-row">
                <div class="stat-item"><i class="fa-solid fa-crosshairs"></i> <span id="hud-kills">0</span></div>
                <div class="stat-item"><i class="fa-solid fa-skull"></i> <span id="hud-deaths">0</span></div>
            </div>
            <div class="hud-weapon-info">
                <div id="hud-ammo">100/100</div>
            </div>
            <div class="hud-bars">
                <div class="bar-container health"><div class="bar-fill" id="hud-health"></div></div>
                <div class="bar-container armor"><div class="bar-fill" id="hud-armor"></div></div>
            </div>
        </div>
        <div id="big-countdown" style="display: none;">10</div>
    </div>

    <!-- WINNER SCREEN -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 data-locale="game_ended">Runde beendet!</h1>
            <h2 id="final-winner-name">GEWINNER: SPIELERNAME</h2>

            <div class="stats-scroll styled-scroll">
                <table class="winner-stats-table">
                    <thead>
                        <tr>
                            <th data-locale="tab_players">Spieler</th>
                            <th data-locale="kills">Kills</th>
                            <th data-locale="deaths">Tode</th>
                            <th data-locale="kd_ratio">K/D</th>
                        </tr>
                    </thead>
                    <tbody id="winner-stats-body"></tbody>
                </table>
            </div>

            <div class="map-voting-section">
                <h3 data-locale="map_voting">Map Voting</h3>
                <div id="map-vote-list" class="vote-grid"></div>
            </div>

            <div class="winner-actions">
                <button class="confirm-btn" id="btn-win-lobby" data-locale="btn_back_to_lobby">Zurück zur Lobby</button>
                <button class="cancel-btn" id="btn-win-menu" data-locale="btn_main_menu">Hauptmenü</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
