<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" id="ui-menu-title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="tab-ffa-label">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="tab-create-label">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="tab-list-label">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- TAB 1 & 3: Lobby Browser (Shared layout) -->
                <div id="tab-browser" class="tab-content active">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label id="label-filter-maps">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group" id="filter-free-slots-container" style="display: none;">
                            <div class="toggle-group">
                                <label id="label-filter-free">Freie Plätze</label>
                                <input type="checkbox" id="filter-free-slots">
                            </div>
                        </div>
                    </aside>

                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries injected here -->
                        </div>
                    </main>
                </div>

                <!-- TAB 2: Lobby Creation -->
                <div id="tab-create" class="tab-content">
                    <div class="create-form-container">
                        <div class="form-grid">
                            <div class="input-group full-width">
                                <label id="label-lobby-name">LOBBY NAME</label>
                                <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                            </div>
                            <div class="input-group">
                                <label id="label-map-select">MAP</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label id="label-mode-select">MODE</label>
                                <select id="mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">TEAM DEATHMATCH</option>
                                </select>
                            </div>
                            <div class="input-group full-width">
                                <label id="label-loadout-select">LOADOUT</label>
                                <select id="loadout-select" multiple></select>
                            </div>
                            <div class="input-group">
                                <label><span id="label-round-time">RUNDENZEIT</span>: <span id="round-time-val">15</span> Min</label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span id="label-max-players">MAX. SPIELER</span>: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                            </div>
                            <div class="input-group">
                                <label><span id="label-respawn-time">RESPAWN-ZEIT</span>: <span id="respawn-time-val">5</span> Sek</label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span id="label-kill-limit">KILL-LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                            <div class="toggle-group">
                                <label id="label-vehicles">FAHRZEUGE ERLAUBT</label>
                                <input type="checkbox" id="vehicles-allowed">
                            </div>
                            <div class="toggle-group">
                                <label id="label-friendly-fire">FREUNDLICHES FEUER</label>
                                <input type="checkbox" id="friendly-fire">
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="create-btn" id="btn-create-lobby">LOBBY ERSTELLEN</button>
                            <button class="cancel-btn" id="btn-cancel-create">ABBRECHEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                    <div class="lobby-id-badge">#<span id="display-lobby-id">0000</span></div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="label-players-list">SPIELERLISTE</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 id="label-settings">EINSTELLUNGEN</h3>
                        <div id="lobby-info-summary" class="settings-summary"></div>

                        <div class="team-selection" id="team-selection-area">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">BLAU</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">ROT</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">ZUSCHAUER</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="NACHRICHT SENDEN...">
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">START</button>
                            <button class="leave-btn" id="btn-leave-lobby">VERLASSEN</button>
                            <button class="cancel-btn" id="btn-close-lobby" style="display: none;">LOBBY SCHLIEẞEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer-container">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-timer">00:00</span>
            </div>
            <div class="hud-tdm-score" id="hud-tdm-score" style="display: none;">
                <span class="score-blue" id="score-blue">0</span>
                <span class="score-divider">:</span>
                <span class="score-red" id="score-red">0</span>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="hud-stats">
                <div class="stat-item">
                    <span class="stat-label">KILLS</span>
                    <span id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">DEATHS</span>
                    <span id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-weapon">
                <div class="ammo-info">
                    <i class="fa-solid fa-gun"></i>
                    <span id="hud-ammo">0</span>
                </div>
            </div>
            <div class="hud-bars">
                <div class="bar-container health">
                    <div class="bar-fill" id="hud-health" style="width: 100%;"></div>
                </div>
                <div class="bar-container armor">
                    <div class="bar-fill" id="hud-armor" style="width: 50%;"></div>
                </div>
            </div>
        </div>

        <div id="big-countdown" class="big-timer" style="display: none;">10</div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title-text">MATCH BEENDET</h1>
            <h2 id="winner-name-text">SPIELER GEWINNT!</h2>

            <div class="winner-stats-container">
                <div id="match-stats-table"></div>
            </div>

            <div class="map-voting-section">
                <h3 id="label-vote-map">WÄHLE DIE NÄCHSTE MAP</h3>
                <div class="map-vote-grid" id="map-vote-options">
                    <!-- Map options injected here -->
                </div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby">ZURÜCK ZUR LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
