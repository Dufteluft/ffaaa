<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div id="main-container" class="main-container">
            <header class="main-header">
                <h1 class="header-title" id="l-menu_title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="l-tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="list" id="l-tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <aside class="sidebar">
                    <div class="filter-group">
                        <label><span id="l-map_select">MAPS</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label><span id="l-loadout_select">WEAPONS</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label><span id="l-max_players">PLAYERS</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>

                    <button class="create-btn" id="open-create-btn">LOBBY ERSTELLEN</button>
                </aside>

                <main class="lobby-browser">
                    <div class="lobby-list" id="lobby-list-container">
                    </div>
                </main>
            </div>
        </div>

        <div id="create-lobby-view" class="main-container" style="display: none;">
            <header class="main-header">
                <h1 class="header-title" id="l-tab_create">LOBBY ERSTELLEN</h1>
            </header>
            <div class="form-wrapper">
                <div class="form-container">
                    <div class="input-group">
                        <label id="l-lobby_name">LOBBY NAME</label>
                        <input type="text" id="lobby-name-input" placeholder="ENTER NAME...">
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label id="l-map_select_2">MAP</label>
                            <select id="map-select"></select>
                        </div>
                        <div class="input-group">
                            <label id="l-mode_select">MODE</label>
                            <select id="mode-select">
                                <option value="ffa">FFA</option>
                                <option value="tdm">TEAM DEATHMATCH</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-group">
                        <label id="l-loadout_select_2">LOADOUT</label>
                        <select id="loadout-select"></select>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label><span id="l-round_time">TIME (MIN)</span>: <span id="round-time-val">15</span></label>
                            <input type="range" id="round-time-input" min="5" max="30" step="5" value="15">
                        </div>
                        <div class="input-group">
                            <label><span id="l-max_players_2">MAX PLAYERS</span>: <span id="max-players-val">16</span></label>
                            <input type="range" id="max-players-input" min="2" max="32" step="1" value="16">
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="toggle-group">
                            <label id="l-vehicles_allowed">VEHICLES</label>
                            <input type="checkbox" id="vehicles-toggle">
                        </div>
                        <div class="toggle-group">
                            <label id="l-friendly_fire">FRIENDLY FIRE</label>
                            <input type="checkbox" id="ff-toggle">
                        </div>
                    </div>
                    <div class="input-row">
                         <div class="input-group">
                            <label id="l-respawn_time">RESPAWN (SEK)</label>
                            <input type="range" id="respawn-time-input" min="3" max="10" step="1" value="5">
                        </div>
                        <div class="input-group">
                            <label id="l-kill_limit">KILL LIMIT</label>
                            <input type="range" id="kill-limit-input" min="0" max="50" step="5" value="30">
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="confirm-btn" id="btn-submit-create">ERSTELLEN</button>
                        <button class="cancel-btn" id="btn-cancel-create">ABBRECHEN</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="l-max_players_3">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>SETTINGS</h3>
                        <div id="lobby-info-summary" class="info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="l-team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="l-team_red">RED</button>
                            <button class="team-btn" data-team="spectator" id="l-spectator">SPECTATOR</button>
                            <button class="team-btn" data-team="random" id="l-random">RANDOM</button>
                        </div>
                        <div class="lobby-chat-wrapper">
                            <div id="chat-messages" class="chat-area"></div>
                            <div class="chat-input-row">
                                <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                                <button id="send-chat-btn"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">START</button>
                            <button class="leave-btn" id="btn-leave-lobby">VERLASSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="game-hud" class="hud-container" style="display: none;">
            <div class="hud-top">
                <div class="timer-box"><i class="fa-solid fa-clock"></i> <span id="hud-timer">15:00</span></div>
                <div class="score-box ffa-only">
                    <div class="score-item"><i class="fa-solid fa-crosshairs"></i> <span id="hud-kills">0</span></div>
                    <div class="score-item"><i class="fa-solid fa-skull"></i> <span id="hud-deaths">0</span></div>
                </div>
                <div class="score-box tdm-only" style="display: none;">
                    <div class="team-score blue-score"><span id="l-team_blue_2">BLUE</span>: <span id="hud-score-blue">0</span></div>
                    <div class="team-score red-score"><span id="l-team_red_2">RED</span>: <span id="hud-score-red">0</span></div>
                </div>
            </div>
            <div class="hud-bottom-right">
                <div class="stat-bar health-bar"><div id="health-progress" class="progress"></div><i class="fa-solid fa-heart"></i></div>
                <div class="stat-bar armor-bar"><div id="armor-progress" class="progress"></div><i class="fa-solid fa-shield"></i></div>
                <div class="ammo-box"><span id="hud-ammo">30</span> / <span id="hud-total-ammo">120</span></div>
            </div>
            <div id="countdown-display" class="countdown-text" style="display: none;">10</div>
        </div>

        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 id="l-game_ended">RUNDE BEENDET</h1>
                <h2 id="winner-announcement">PLAYER GEWINNT!</h2>
                <div id="match-stats-container" class="stats-container"></div>

                <div class="map-voting-section">
                    <h3>NEXT MAP VOTE</h3>
                    <div id="map-voting-grid" class="vote-grid"></div>
                </div>

                <div class="btn-group">
                    <button class="confirm-btn" id="btn-back-to-lobby">BACK TO LOBBY</button>
                    <button class="cancel-btn" id="btn-back-to-menu">MAIN MENU</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
