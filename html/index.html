<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <!-- Hauptmenü Container -->
        <div class="main-container">
            <header class="main-header">
                <h1 class="header-title l-menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active l-tab_ffa" data-tab="ffa">FFA Lobby</button>
                    <button class="tab-btn l-tab_create" data-tab="create">Lobby erstellen</button>
                    <button class="tab-btn l-tab_list" data-tab="list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab: FFA Lobbys & Offene Lobbys (Geteiltes Layout) -->
                <div id="tab-browser" class="tab-content active">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label><span class="l-map_select">Map auswählen</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span class="l-max_players">Max. Spieler</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all">ANY</option>
                                <option value="not-full" class="l-filter_full">Nur freie Plätze</option>
                            </select>
                        </div>
                        <button class="create-btn l-btn_create" id="sidebar-create-btn">Lobby erstellen</button>
                    </aside>
                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Lobbys werden hier injiziert -->
                        </div>
                    </main>
                </div>

                <!-- Tab: Lobby erstellen -->
                <div id="tab-create" class="tab-content">
                    <div class="create-form-container">
                        <div class="form-grid">
                            <div class="input-group">
                                <label class="l-lobby_name">Lobby Name</label>
                                <input type="text" id="lobby-name" placeholder="...">
                            </div>
                            <div class="input-group">
                                <label class="l-map_select">Map auswählen</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label class="l-mode_select">Spielmodus</label>
                                <select id="mode-select">
                                    <option value="ffa" class="l-ffa_mode">Alle gegen Alle</option>
                                    <option value="tdm" class="l-tdm_mode">Team Deathmatch</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label class="l-loadout_select">Waffen-Loadout</label>
                                <div class="loadout-grid" id="loadout-checkboxes">
                                    <!-- Checkboxen werden dynamisch geladen -->
                                </div>
                            </div>
                            <div class="input-group">
                                <label><span class="l-round_time">Rundenzeit (Min)</span>: <span id="round-time-val">15</span></label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span class="l-max_players">Max. Spieler</span>: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                            </div>
                            <div class="input-group">
                                <label><span class="l-respawn_time">Respawn-Zeit (Sek)</span>: <span id="respawn-time-val">5</span></label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span class="l-kill_limit">Kill-Limit zum Sieg</span>: <span id="kill-limit-val">30</span></label>
                                <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                            <div class="toggle-group">
                                <div class="toggle-item">
                                    <label class="l-vehicles_allowed">Fahrzeuge erlaubt</label>
                                    <input type="checkbox" id="vehicles-allowed" class="toggle-switch">
                                </div>
                                <div class="toggle-item">
                                    <label class="l-friendly_fire">Freundliches Feuer</label>
                                    <input type="checkbox" id="friendly-fire" class="toggle-switch">
                                </div>
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="confirm-btn l-btn_create" id="btn-create-lobby">Lobby erstellen</button>
                            <button class="cancel-btn l-btn_cancel" id="btn-cancel-create">Abbrechen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Wartebereich / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2>LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 class="l-players">Spieler</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>INFO</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn l-team_blue" data-team="blue">Team Blau</button>
                            <button class="team-btn l-team_red" data-team="red">Team Rot</button>
                            <button class="team-btn l-spectator" data-team="spectator">Zuschauer</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn l-btn_ready" id="btn-ready-toggle">Bereit</button>
                            <button class="start-btn l-btn_start" id="btn-start-game" style="display: none;">Spiel starten</button>
                            <button class="leave-btn l-btn_leave" id="btn-leave-lobby">Lobby verlassen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Gewinner Screen & Map Vote -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 class="l-game_ended">Runde beendet!</h1>
                <h2 id="winner-name">PLAYER <span class="l-winner_suffix">GEWINNT!</span></h2>

                <div id="match-stats-table"></div>

                <div class="map-vote-section">
                    <h3 class="l-map_vote">Nächste Map wählen</h3>
                    <div class="map-vote-grid" id="map-vote-options"></div>
                </div>

                <div class="btn-group">
                    <button class="cancel-btn l-tab_ffa" id="btn-back-to-menu">Hauptmenü</button>
                </div>
            </div>
        </div>
    </div>

    <!-- In-Game HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-time">15:00</span>
            </div>
            <div class="hud-scores" id="hud-tdm-scores" style="display: none;">
                <div class="team-score blue">
                    <span class="l-team_blue">Blau</span>
                    <span id="score-blue">0</span>
                </div>
                <div class="team-score red">
                    <span id="score-red">0</span>
                    <span class="l-team_red">Rot</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="hud-weapon">
                <span id="hud-ammo">250</span>
                <i class="fa-solid fa-gun"></i>
            </div>
            <div class="hud-stats">
                <div class="stat-item">
                    <span class="l-kills">Kills</span>
                    <span id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="l-deaths">Tode</span>
                    <span id="hud-deaths">0</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom-left">
            <div class="hud-bar-container">
                <div class="hud-bar health">
                    <div class="bar-fill" id="health-bar" style="width: 100%;"></div>
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="hud-bar armor">
                    <div class="bar-fill" id="armor-bar" style="width: 50%;"></div>
                    <i class="fa-solid fa-shield"></i>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
