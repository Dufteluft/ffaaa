<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" id="l-menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="l-tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="l-tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="l-tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1 & 3: Lobby List View -->
                <div id="tab-view-list" class="tab-content">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label><span id="l-map_select">Map auswählen</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span id="l-players">Spieler</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all">ANY</option>
                                <option value="not-full">NOT FULL</option>
                            </select>
                        </div>
                    </aside>

                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </main>
                </div>

                <!-- Tab 2: Create Lobby View -->
                <div id="tab-view-create" class="tab-content" style="display: none;">
                    <div class="create-lobby-form">
                        <div class="form-grid">
                            <div class="input-group">
                                <label id="l-lobby_name">Lobby Name</label>
                                <input type="text" id="create-name" placeholder="Enter lobby name...">
                            </div>
                            <div class="input-group">
                                <label id="l-map_select">Map auswählen</label>
                                <select id="create-map"></select>
                            </div>
                            <div class="input-group">
                                <label id="l-mode_select">Spielmodus</label>
                                <select id="create-mode">
                                    <option value="ffa">Free For All</option>
                                    <option value="tdm">Team Deathmatch</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label id="l-loadout_select">Waffen-Loadout</label>
                                <div class="checkbox-grid" id="loadout-checkboxes">
                                    <!-- Dynamic loadouts -->
                                </div>
                            </div>
                            <div class="input-group">
                                <label><span id="l-round_time">Rundenzeit (Min)</span>: <span id="val-round-time">15</span></label>
                                <input type="range" id="create-round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span id="l-max_players">Max. Spieler</span>: <span id="val-max-players">16</span></label>
                                <input type="range" id="create-max-players" min="2" max="16" step="1" value="16">
                            </div>
                            <div class="input-group">
                                <label id="l-vehicles_allowed">Fahrzeuge erlaubt?</label>
                                <label class="switch">
                                    <input type="checkbox" id="create-vehicles">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="input-group">
                                <label id="l-friendly_fire">Freundliches Feuer</label>
                                <label class="switch">
                                    <input type="checkbox" id="create-ff">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="input-group">
                                <label><span id="l-respawn_time">Respawn-Zeit (Sek)</span>: <span id="val-respawn-time">5</span></label>
                                <input type="range" id="create-respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span id="l-kill_limit">Kill-Limit zum Sieg</span>: <span id="val-kill-limit">30</span></label>
                                <input type="range" id="create-kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="confirm-btn" id="btn-submit-create"><i class="fa-solid fa-plus"></i> <span id="l-btn_create">Lobby erstellen</span></button>
                            <button class="cancel-btn" id="btn-cancel-create"><span id="l-btn_cancel">Abbrechen</span></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Waiting Area Overlay -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2><span id="l-tab_list">Lobby</span>: <span id="lobby-display-name">N/A</span></h2>
                    <div class="lobby-status-badge" id="lobby-display-mode">FFA</div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="l-players">Spieler</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <div class="lobby-settings-summary" id="lobby-settings-display">
                            <!-- Summary of settings -->
                        </div>
                        <div class="team-selection" id="team-selector">
                            <button class="team-btn" data-team="blue" id="l-team_blue">Team Blau</button>
                            <button class="team-btn" data-team="red" id="l-team_red">Team Rot</button>
                            <button class="team-btn" data-team="spectator" id="l-spectator">Zuschauer</button>
                            <button class="team-btn" data-team="random" id="l-random">Zufall</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input" placeholder="Nachricht schreiben...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle"><span id="l-btn_ready">Bereit</span></button>
                            <button class="start-btn" id="btn-start-game" style="display: none;"><span id="l-btn_start">Spiel starten</span></button>
                            <button class="leave-btn" id="btn-leave-lobby"><span id="l-btn_leave">Lobby verlassen</span></button>
                            <button class="close-btn" id="btn-close-lobby" style="display: none;"><span id="l-btn_close_lobby">Lobby schließen</span></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen / Post-Match -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 id="l-game_ended">Runde beendet!</h1>
                <h2 id="winner-announcement"><span id="winner-name">Spieler</span> <span class="l-winner_suffix">GEWINNT!</span></h2>

                <div class="stats-container">
                    <table id="match-stats-table">
                        <thead>
                            <tr>
                                <th id="l-players">Spieler</th>
                                <th id="l-kills">Kills</th>
                                <th id="l-deaths">Tode</th>
                                <th id="l-kd_ratio">K/D</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div class="map-voting">
                    <h3 id="l-vote_map">Nächste Map wählen</h3>
                    <div class="vote-grid" id="map-vote-grid"></div>
                </div>

                <div class="post-actions">
                    <button class="confirm-btn" id="btn-back-to-lobby"><span id="l-back_to_lobby">Zurück zur Lobby</span></button>
                    <button class="cancel-btn" id="btn-back-to-menu"><span id="l-back_to_menu">Hauptmenü</span></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Gameplay HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="timer-box">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-timer">15:00</span>
            </div>
            <div class="score-box" id="hud-score-container" style="display: none;">
                <div class="team-score blue"><span class="l-team_blue">Blau</span>: <span id="hud-score-blue">0</span></div>
                <div class="team-score red"><span class="l-team_red">Rot</span>: <span id="hud-score-red">0</span></div>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-stats">
                <div class="stat-item"><span class="l-kills">Kills</span>: <span id="hud-kills">0</span></div>
                <div class="stat-item"><span class="l-deaths">Tode</span>: <span id="hud-deaths">0</span></div>
            </div>
            <div class="hud-bars">
                <div class="bar-container health">
                    <div class="bar-fill" id="hud-health-bar" style="width: 100%;"></div>
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="bar-container armor">
                    <div class="bar-fill" id="hud-armor-bar" style="width: 0%;"></div>
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
            </div>
            <div class="ammo-box">
                <span id="hud-ammo">100</span>
                <i class="fa-solid fa-gun"></i>
            </div>
        </div>
        <div id="hud-countdown" class="countdown-overlay" style="display: none;">10</div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
