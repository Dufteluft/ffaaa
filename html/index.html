<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <!-- Hauptmenü Container -->
        <div class="main-container" id="main-menu">
            <header class="main-header">
                <h1 class="header-title" id="locale-menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="locale-tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="locale-tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="locale-tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1 & 3: Lobby Listen (FFA & Offene Lobbys) -->
                <div class="tab-content active" id="tab-lobbies">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label><span id="locale-map_select">MAPS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all" id="locale-all_maps">ALLE MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span id="locale-players">SPIELER</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all" id="locale-any">ALLE</option>
                                <option value="not-full" id="locale-not_full">NICHT VOLL</option>
                            </select>
                        </div>
                        <div class="stats-mini-box">
                            <h3 id="locale-your_stats">DEINE STATS</h3>
                            <div class="mini-stat"><span>KILLS:</span> <span id="stat-kills">0</span></div>
                            <div class="mini-stat"><span>DEATHS:</span> <span id="stat-deaths">0</span></div>
                            <div class="mini-stat"><span>K/D:</span> <span id="stat-kd">0.00</span></div>
                        </div>
                    </aside>

                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Einträge werden hier dynamisch eingefügt -->
                        </div>
                    </main>
                </div>

                <!-- Tab 2: Lobby Erstellen -->
                <div class="tab-content" id="tab-create">
                    <div class="create-form">
                        <div class="form-section">
                            <div class="input-group">
                                <label id="locale-lobby_name">LOBBY NAME</label>
                                <input type="text" id="create-lobby-name" placeholder="Name eingeben...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label id="locale-map_select">MAP</label>
                                    <select id="create-map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label id="locale-mode_select">MODUS</label>
                                    <select id="create-mode-select">
                                        <option value="ffa" id="locale-ffa_mode">FFA</option>
                                        <option value="tdm" id="locale-tdm_mode">TDM</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label id="locale-loadout_select">WAFFEN-LOADOUT</label>
                                <div class="loadout-grid" id="loadout-checkboxes">
                                    <!-- Checkboxen werden hier eingefügt -->
                                </div>
                            </div>
                        </div>
                        <div class="form-section">
                            <div class="input-row">
                                <div class="input-group slider-group">
                                    <label><span id="locale-round_time">ZEIT</span>: <span id="round-time-val">15</span> MIN</label>
                                    <input type="range" id="create-round-time" min="5" max="30" step="1" value="15">
                                </div>
                                <div class="input-group slider-group">
                                    <label><span id="locale-max_players">SPIELER</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="create-max-players" min="2" max="16" step="1" value="16">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group slider-group">
                                    <label><span id="locale-respawn_time">RESPAWN</span>: <span id="respawn-time-val">5</span> SEK</label>
                                    <input type="range" id="create-respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group slider-group">
                                    <label><span id="locale-kill_limit">LIMIT</span>: <span id="kill-limit-val">0</span></label>
                                    <input type="range" id="create-kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="toggle-row">
                                <div class="toggle-group">
                                    <label id="locale-vehicles_allowed">FAHRZEUGE</label>
                                    <label class="switch">
                                        <input type="checkbox" id="create-vehicles">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="toggle-group">
                                    <label id="locale-friendly_fire">FRIENDLY FIRE</label>
                                    <label class="switch">
                                        <input type="checkbox" id="create-ff">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="confirm-btn" id="btn-create-lobby-final" id="locale-btn_create">LOBBY ERSTELLEN</button>
                                <button class="cancel-btn" id="btn-cancel-create" id="locale-btn_cancel">ABBRECHEN</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lobby Wartebereich -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title-display">NAME</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="locale-players">SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 id="locale-settings">EINSTELLUNGEN</h3>
                        <div id="lobby-info-summary"></div>

                        <div class="team-selection" id="team-selection-box">
                            <button class="team-btn" data-team="blue" id="btn-team-blue"><span id="locale-team_blue">BLUE</span></button>
                            <button class="team-btn" data-team="red" id="btn-team-red"><span id="locale-team_red">RED</span></button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec"><span id="locale-spectator">SPEC</span></button>
                            <button class="team-btn" data-team="random" id="btn-team-random"><span id="locale-random">RANDOM</span></button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="NACHRICHT SENDEN...">
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle"><span id="locale-btn_ready">BEREIT</span></button>
                            <button class="start-btn" id="btn-start-game" style="display: none;"><span id="locale-btn_start">START</span></button>
                            <button class="leave-btn" id="btn-leave-lobby"><span id="locale-btn_leave">VERLASSEN</span></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- In-Game HUD -->
        <div id="game-hud" style="display: none;">
            <div class="hud-top">
                <div class="round-timer">
                    <i class="fa-solid fa-clock"></i> <span id="hud-timer">15:00</span>
                </div>
                <div class="team-scores" id="hud-team-scores" style="display: none;">
                    <div class="score-box blue"><span id="score-blue">0</span></div>
                    <div class="divider">VS</div>
                    <div class="score-box red"><span id="score-red">0</span></div>
                </div>
            </div>

            <div class="hud-bottom-right">
                <div class="weapon-info">
                    <div class="ammo-count"><span id="hud-ammo">30</span></div>
                    <div class="weapon-label"><span id="hud-weapon-name">PISTOL</span></div>
                </div>
                <div class="player-stats-hud">
                    <div class="stat-item"><span id="locale-kills">KILLS</span>: <span id="hud-kills">0</span></div>
                    <div class="stat-item"><span id="locale-deaths">DEATHS</span>: <span id="hud-deaths">0</span></div>
                </div>
            </div>

            <div class="hud-bottom-left">
                <div class="health-armor-container">
                    <div class="bar-wrapper armor">
                        <div class="bar-fill" id="hud-armor-fill" style="width: 100%;"></div>
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <div class="bar-wrapper health">
                        <div class="bar-fill" id="hud-health-fill" style="width: 100%;"></div>
                        <i class="fa-solid fa-heart"></i>
                    </div>
                </div>
            </div>

            <div id="countdown-display" class="countdown-overlay" style="display: none;">
                <h1 id="countdown-number">10</h1>
            </div>
        </div>

        <!-- Sieg Anzeige -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 id="winner-name-display">PLAYER</h1>
                <h2 id="locale-winner_suffix">GEWINNT!</h2>

                <div class="match-stats-container">
                    <table id="match-stats-table">
                        <thead>
                            <tr>
                                <th id="locale-name">NAME</th>
                                <th id="locale-kills">KILLS</th>
                                <th id="locale-deaths">DEATHS</th>
                                <th id="locale-kd_ratio">K/D</th>
                            </tr>
                        </thead>
                        <tbody id="stats-body"></tbody>
                    </table>
                </div>

                <div class="map-voting" id="map-voting-section" style="margin-top: 20px;">
                    <h3 id="locale-vote_next_map" style="font-size: 14px; margin-bottom: 10px; color: var(--text-muted);">NÄCHSTE MAP WÄHLEN</h3>
                    <div class="vote-grid" id="vote-grid" style="display: flex; gap: 10px; justify-content: center;"></div>
                </div>

                <div class="btn-group">
                    <button class="confirm-btn" id="btn-back-to-lobby" id="locale-btn_back_lobby">ZURÜCK ZUR LOBBY</button>
                    <button class="cancel-btn" id="btn-back-to-menu" id="locale-btn_back_menu">HAUPTMENÜ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
