<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA LOBBY</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">LOBBY ERSTELLEN</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">OFFENE LOBBYS</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Main Content -->
                <main class="tab-content-container">
                    <!-- Tab 1: FFA Lobbies (Vordefiniert) -->
                    <div id="tab-ffa" class="tab-pane active">
                        <div class="lobby-list" id="ffa-lobby-list">
                            <!-- Injected by JS -->
                        </div>
                    </div>

                    <!-- Tab 2: Lobby erstellen -->
                    <div id="tab-create" class="tab-pane">
                        <div class="create-form">
                            <h2 data-locale="tab_create">LOBBY ERSTELLEN</h2>
                            <div class="form-grid">
                                <div class="input-group">
                                    <label data-locale="lobby_name">LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="Name eingeben...">
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label data-locale="map_select">MAP</label>
                                        <select id="map-select"></select>
                                    </div>
                                    <div class="input-group">
                                        <label data-locale="mode_select">MODUS</label>
                                        <select id="mode-select">
                                            <option value="ffa">FFA</option>
                                            <option value="tdm">TEAM DEATHMATCH</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label data-locale="loadout_select">LOADOUT</label>
                                    <div id="loadout-options" class="multi-select-grid">
                                        <!-- Injected by JS -->
                                    </div>
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label><span data-locale="round_time">RUNDENZEIT</span>: <span id="round-time-val">15</span> Min</label>
                                        <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                    </div>
                                    <div class="input-group">
                                        <label><span data-locale="max_players">MAX SPIELER</span>: <span id="max-players-val">16</span></label>
                                        <input type="range" id="max-players" min="2" max="32" step="1" value="16">
                                    </div>
                                </div>
                                <div class="input-row">
                                    <div class="input-group toggle-group">
                                        <label data-locale="vehicles_allowed">FAHRZEUGE ERLAUBT</label>
                                        <input type="checkbox" id="vehicles-allowed" class="ios-toggle">
                                    </div>
                                    <div class="input-group toggle-group">
                                        <label data-locale="friendly_fire">FRIENDLY FIRE</label>
                                        <input type="checkbox" id="friendly-fire" class="ios-toggle">
                                    </div>
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label><span data-locale="respawn_time">RESPAWN ZEIT</span>: <span id="respawn-time-val">5</span> Sek</label>
                                        <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                    </div>
                                    <div class="input-group">
                                        <label><span data-locale="kill_limit">KILL LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                        <input type="range" id="kill-limit" min="0" max="100" step="10" value="30">
                                    </div>
                                </div>
                                <div class="btn-group">
                                    <button class="confirm-btn" id="btn-create-lobby" data-locale="btn_create">ERSTELLEN</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Tab 3: Offene Lobbys -->
                    <div id="tab-list" class="tab-pane">
                        <div class="lobby-list" id="open-lobby-list">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2>LOBBY: <span id="lobby-title">Default</span></h2>
                    <div id="lobby-host-controls" style="display: none;">
                        <!-- Host can edit settings here if needed -->
                    </div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 data-locale="mode_select">EINSTELLUNGEN</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" data-locale="team_blue">BLAU</button>
                            <button class="team-btn" data-team="red" data-locale="team_red">ROT</button>
                            <button class="team-btn" data-team="spectator" data-locale="spectator">ZUSCHAUER</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="Nachricht senden...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">VERLASSEN</button>
                            <button class="leave-btn" id="btn-close-lobby" style="display: none; background: #911;" data-locale="btn_kick">LOBBY SCHLIESSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Gameplay HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="match-timer" id="hud-timer">00:00</div>
            <div class="match-scores" id="hud-scores" style="display: none;">
                <div class="score-item blue">BLAU: <span id="score-blue">0</span></div>
                <div class="score-item red">ROT: <span id="score-red">0</span></div>
            </div>
        </div>
        <div class="hud-bottom">
            <div class="player-stats">
                <div class="stat-box"><span data-locale="kills">KILLS</span>: <span id="hud-kills">0</span></div>
                <div class="stat-box"><span data-locale="deaths">TODE</span>: <span id="hud-deaths">0</span></div>
            </div>
            <div class="vitals-container">
                <div class="bar-wrapper">
                    <div class="bar-label">HP</div>
                    <div class="bar-bg"><div id="hp-bar" class="bar-fill hp"></div></div>
                </div>
                <div class="bar-wrapper">
                    <div class="bar-label">ARMOR</div>
                    <div class="bar-bg"><div id="armor-bar" class="bar-fill armor"></div></div>
                </div>
            </div>
            <div class="ammo-counter">
                <i class="fa-solid fa-gun"></i> <span id="hud-ammo">0</span>
            </div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title" data-locale="game_ended">RUNDE BEENDET</h1>
            <h2 id="winner-name">SPIELER GEWINNT!</h2>

            <div class="map-voting" id="map-voting-container">
                <h3 data-locale="map_select">NÄCHSTE MAP WÄHLEN</h3>
                <div class="vote-options" id="vote-options">
                    <!-- Injected by JS -->
                </div>
            </div>

            <div id="match-stats-table"></div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_join">ZURÜCK ZUR LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu" data-locale="btn_cancel">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
