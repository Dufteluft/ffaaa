<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">CREATE</button>
                    <button class="tab-btn" data-tab="lobby" data-locale="tab_list">LOBBIES</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Browser View (Tabs FFA & LOBBY) -->
                <div id="browser-view" class="tab-content active">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label><span data-locale="map_select">MAPS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span data-locale="loadout_select">WEAPONS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-weapons">
                                <option value="all">ALL WEAPONS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span data-locale="max_players">PLAYERS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all">ANY</option>
                                <option value="not-full">NOT FULL</option>
                            </select>
                        </div>
                        <button class="refresh-btn" onclick="fetchLobbies()"><i class="fa-solid fa-rotate"></i> REFRESH</button>
                    </aside>
                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </main>
                </div>

                <!-- Create View (Tab CREATE) -->
                <div id="create-view" class="tab-content">
                    <div class="creation-container">
                        <div class="creation-form">
                            <div class="form-section">
                                <h3 data-locale="tab_create">LOBBY ERSTELLEN</h3>
                                <div class="input-group">
                                    <label data-locale="lobby_name">LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label data-locale="map_select">MAP</label>
                                        <select id="map-select"></select>
                                    </div>
                                    <div class="input-group">
                                        <label data-locale="mode_select">MODE</label>
                                        <select id="mode-select">
                                            <option value="ffa">FFA</option>
                                            <option value="tdm">TEAM DEATHMATCH</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label data-locale="loadout_select">LOADOUT</label>
                                    <div id="loadout-checkboxes" class="checkbox-grid">
                                        <!-- Checkboxes will be injected here -->
                                    </div>
                                </div>
                            </div>
                            <div class="form-section">
                                <div class="input-row">
                                    <div class="input-group">
                                        <label><span data-locale="round_time">TIME</span>: <span id="round-time-val">15</span> MIN</label>
                                        <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                    </div>
                                    <div class="input-group">
                                        <label><span data-locale="max_players">MAX PLAYERS</span>: <span id="max-players-val">16</span></label>
                                        <input type="range" id="max-players" min="2" max="32" step="1" value="16">
                                    </div>
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label data-locale="vehicles_allowed">VEHICLES</label>
                                        <label class="switch">
                                            <input type="checkbox" id="vehicles-allowed">
                                            <span class="slider round"></span>
                                        </label>
                                    </div>
                                    <div class="input-group">
                                        <label data-locale="friendly_fire">FRIENDLY FIRE</label>
                                        <label class="switch">
                                            <input type="checkbox" id="friendly-fire">
                                            <span class="slider round"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label><span data-locale="respawn_time">RESPAWN</span>: <span id="respawn-time-val">5</span>s</label>
                                        <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                    </div>
                                    <div class="input-group">
                                        <label><span data-locale="kill_limit">KILL LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                        <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                    </div>
                                </div>
                                <div class="btn-group">
                                    <button class="confirm-btn" id="btn-create-lobby" data-locale="btn_create">CREATE</button>
                                    <button class="cancel-btn" id="btn-edit-settings" style="display: none;" data-locale="btn_save">SAVE</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                    <div class="lobby-id-badge">ID: <span id="lobby-id-val">0000</span></div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <div class="settings-header">
                            <h3 data-locale="mode_select">SETTINGS</h3>
                            <button id="btn-open-settings" class="icon-btn" style="display: none;"><i class="fa-solid fa-gear"></i></button>
                        </div>
                        <div id="lobby-info-summary" class="info-grid"></div>

                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red" data-locale="team_red">RED</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec" data-locale="spectator">SPECTATOR</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer" id="hud-timer">00:00</div>
            <div class="hud-scores" id="hud-scores" style="display: none;">
                <div class="score-team blue">0</div>
                <div class="score-vs">VS</div>
                <div class="score-team red">0</div>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-stats">
                <div class="stat-item"><span class="label" data-locale="kills">K</span> <span id="hud-kills">0</span></div>
                <div class="stat-item"><span class="label" data-locale="deaths">D</span> <span id="hud-deaths">0</span></div>
            </div>
            <div class="hud-weapon">
                <div class="ammo-info"><span id="hud-ammo">0</span></div>
                <div class="health-armor">
                    <div class="bar-container"><div id="hud-health" class="bar health" style="width: 100%;"></div></div>
                    <div class="bar-container"><div id="hud-armor" class="bar armor" style="width: 0%;"></div></div>
                </div>
            </div>
        </div>
        <div id="hud-countdown" class="hud-countdown" style="display: none;">10</div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title" data-locale="game_ended">MATCH ENDED</h1>
            <h2 id="winner-name">PLAYER WINS!</h2>

            <div class="winner-content">
                <div id="match-stats-table" class="stats-table-wrapper"></div>

                <div class="map-voting-section">
                    <h3 data-locale="map_select">NEXT MAP VOTE</h3>
                    <div id="map-voting-list" class="voting-grid"></div>
                </div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_back_lobby">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu" data-locale="btn_back_menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
