<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div id="main-container" class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title l-menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active l-tab_ffa" data-tab="ffa">FFA LOBBY</button>
                    <button class="tab-btn l-tab_create" data-tab="create">LOBBY ERSTELLEN</button>
                    <button class="tab-btn l-tab_list" data-tab="list">OFFENE LOBBYS</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1 & 3: Lobby Browser (Shared Layout) -->
                <div id="tab-browser" class="tab-content active">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label><span class="l-map_select">MAPS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span class="l-loadout_select">WEAPONS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-weapons">
                                <option value="all">ALL WEAPONS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span class="l-max_players">PLAYERS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all">ANY</option>
                                <option value="not-full">NOT FULL</option>
                            </select>
                        </div>
                    </aside>
                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries injected by JS -->
                        </div>
                    </main>
                </div>

                <!-- Tab 2: Create Lobby -->
                <div id="tab-create" class="tab-content">
                    <div class="create-form-container">
                        <div class="form-scroll">
                            <div class="input-group">
                                <label class="l-lobby_name">LOBBY NAME</label>
                                <input type="text" id="lobby-name" placeholder="...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label class="l-map_select">MAP</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label class="l-mode_select">MODE</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label class="l-loadout_select">WAFFEN-LOADOUT</label>
                                <div class="loadout-grid" id="loadout-checkboxes">
                                    <!-- Checkboxes injected by JS -->
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span class="l-round_time">ZEIT</span>: <span id="round-time-val">15</span>m</label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span class="l-max_players">SPIELER</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group toggle-group">
                                    <label class="l-vehicles_allowed">FAHRZEUGE</label>
                                    <label class="switch">
                                        <input type="checkbox" id="vehicles-toggle">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="input-group toggle-group">
                                    <label class="l-friendly_fire">FRIENDLY FIRE</label>
                                    <label class="switch">
                                        <input type="checkbox" id="ff-toggle">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span class="l-respawn_time">RESPAWN</span>: <span id="respawn-time-val">5</span>s</label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span class="l-kill_limit">KILL LIMIT</span>: <span id="kill-limit-val">0</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="0">
                                </div>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="confirm-btn l-btn_create" id="btn-create-lobby">LOBBY ERSTELLEN</button>
                            <button class="cancel-btn l-btn_cancel" id="btn-cancel-create">ABBRECHEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2><span id="lobby-title">LOBBY</span></h2>
                    <div id="lobby-status-tag" class="status-badge">WAITING</div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 class="l-tab_list">SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 class="l-tab_create">EINSTELLUNGEN</h3>
                        <div id="lobby-info-summary" class="info-summary"></div>

                        <div class="team-selection">
                            <button class="team-btn l-team_blue" data-team="blue" id="btn-team-blue">BLAU</button>
                            <button class="team-btn l-team_red" data-team="red" id="btn-team-red">ROT</button>
                            <button class="team-btn l-spectator" data-team="spectator" id="btn-team-spec">ZUSCHAUER</button>
                            <button class="team-btn l-random" data-team="random" id="btn-team-random">ZUFALL</button>
                        </div>

                        <div class="lobby-chat-container">
                            <div id="chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input" placeholder="Nachricht...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn l-btn_ready" id="btn-ready-toggle">BEREIT</button>
                            <button class="start-btn l-btn_start" id="btn-start-game" style="display: none;">START</button>
                            <button class="leave-btn l-btn_leave" id="btn-leave-lobby">VERLASSEN</button>
                            <button class="close-btn l-btn_cancel" id="btn-close-lobby" style="display: none;">SCHLIESSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 class="l-game_ended">RUNDE BEENDET</h1>
                <div class="winner-announcement">
                    <span id="winner-name">SPIELER</span> <span class="l-winner-suffix">GEWINNT!</span>
                </div>

                <div class="stats-container">
                    <div id="match-stats-table"></div>
                </div>

                <div class="map-voting">
                    <h3 class="l-map_select">NÄCHSTE MAP WÄHLEN</h3>
                    <div id="map-vote-grid" class="map-grid"></div>
                </div>

                <div class="btn-group">
                    <button class="confirm-btn l-btn_ready" id="btn-back-to-lobby">WEITER</button>
                    <button class="cancel-btn l-tab_ffa" id="btn-back-to-menu">MENÜ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- In-Game HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer">
                <i class="fa-solid fa-clock"></i> <span id="hud-round-time">00:00</span>
            </div>
            <div class="hud-scores" id="hud-tdm-scores" style="display: none;">
                <div class="score-team blue"><span id="hud-score-blue">0</span></div>
                <div class="score-vs">VS</div>
                <div class="score-team red"><span id="hud-score-red">0</span></div>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-weapon-info">
                <div class="ammo-count"><span id="hud-ammo">0</span></div>
                <div class="weapon-icon"><i class="fa-solid fa-gun"></i></div>
            </div>
            <div class="hud-stats-row">
                <div class="stat-item k">K: <span id="hud-kills">0</span></div>
                <div class="stat-item d">D: <span id="hud-deaths">0</span></div>
            </div>
            <div class="hud-bars">
                <div class="bar-container armor">
                    <div class="bar-fill" id="hud-armor-fill" style="width: 0%;"></div>
                </div>
                <div class="bar-container health">
                    <div class="bar-fill" id="hud-health-fill" style="width: 100%;"></div>
                </div>
            </div>
        </div>
        <div id="hud-countdown-overlay" class="countdown-overlay" style="display: none;">
            <div id="hud-countdown-text">10</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
