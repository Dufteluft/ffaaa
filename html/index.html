<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1: FFA Lobby & Tab 3: Offene Lobbys (shared container) -->
                <main class="lobby-browser" id="tab-lobby-list">
                    <div class="filter-bar" id="lobby-filters" style="display: none;">
                        <label>
                            <input type="checkbox" id="filter-free-slots"> <span data-locale="filter_free_only">Nur Lobbys mit freien Plätzen</span>
                        </label>
                    </div>
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Lobbies injected here -->
                    </div>
                </main>

                <!-- Tab 2: Lobby erstellen -->
                <main class="create-lobby-panel" id="tab-create-lobby" style="display: none;">
                    <div class="form-container">
                        <div class="input-group">
                            <label data-locale="lobby_name">Lobby Name</label>
                            <input type="text" id="lobby-name" placeholder="Name...">
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label data-locale="map_select">Map auswählen</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">Spielmodus</label>
                                <select id="mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">Team Deathmatch</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-group">
                            <label data-locale="loadout_select">Waffen-Loadout</label>
                            <div id="loadout-multi-select" class="multi-select">
                                <!-- Loadout options injected here -->
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span data-locale="round_time">Rundenzeit (Min)</span>: <span id="round-time-val">15</span></label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">Max. Spieler</span>: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group toggle-group">
                                <label data-locale="vehicles_allowed">Fahrzeuge erlaubt</label>
                                <label class="switch">
                                    <input type="checkbox" id="vehicles-allowed">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="input-group toggle-group">
                                <label data-locale="friendly_fire">Freundliches Feuer</label>
                                <label class="switch">
                                    <input type="checkbox" id="friendly-fire">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span data-locale="respawn_time">Respawn-Zeit (Sek)</span>: <span id="respawn-time-val">5</span></label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">Kill-Limit zum Sieg</span>: <span id="kill-limit-val">30</span></label>
                                <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="create-btn" id="btn-create-lobby-submit" data-locale="btn_create">Lobby erstellen</button>
                            <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">Abbrechen</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Lobby Waiting Room -->
        <div id="lobby-waiting-room" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2>LOBBY: <span id="waiting-lobby-name">NAME</span></h2>
                    <button class="edit-settings-btn" id="btn-edit-settings" style="display: none;"><i class="fa-solid fa-gear"></i></button>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">Spielerliste</h3>
                        <div id="waiting-player-list" class="player-list"></div>
                    </div>
                    <div class="lobby-controls-section">
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" data-locale="team_blue">Team Blau</button>
                            <button class="team-btn" data-team="red" data-locale="team_red">Team Rot</button>
                            <button class="team-btn" data-team="random" data-locale="random">Zufall</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="lobby-chat-messages" class="chat-messages"></div>
                            <input type="text" id="lobby-chat-input" placeholder="Nachricht senden...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">Bereit</button>
                            <button class="start-btn" id="btn-start-game" data-locale="btn_start" style="display: none;">Spiel starten</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">Lobby verlassen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Gameplay HUD -->
    <div id="hud" style="display: none;">
        <div class="hud-top">
            <div id="hud-timer" class="hud-box">00:00</div>
            <div id="hud-tdm-score" class="hud-box" style="display: none;">
                <span class="blue">0</span> : <span class="red">0</span>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-stat-row">
                <span data-locale="kills">Kills</span>: <span id="hud-kills">0</span>
            </div>
            <div class="hud-stat-row">
                <span data-locale="deaths">Tode</span>: <span id="hud-deaths">0</span>
            </div>
            <div class="hud-weapon-info">
                <span id="hud-ammo">0 / 0</span>
            </div>
            <div class="hud-bars">
                <div class="bar-container health"><div id="hud-health" class="bar"></div></div>
                <div class="bar-container armor"><div id="hud-armor" class="bar"></div></div>
            </div>
        </div>
    </div>

    <!-- Big Countdown -->
    <div id="big-countdown" style="display: none;">10</div>

    <!-- Winner / Round End Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 data-locale="game_ended">Runde beendet!</h1>
            <h2 id="winner-display">Gewinner: Name</h2>

            <div class="winner-stats">
                <table id="winner-stats-table">
                    <thead>
                        <tr>
                            <th data-locale="col_name">NAME</th>
                            <th data-locale="kills">Kills</th>
                            <th data-locale="deaths">Tode</th>
                            <th data-locale="kd_ratio">K/D</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="map-voting">
                <h3>VOTE NEXT MAP</h3>
                <div id="map-vote-list" class="vote-list"></div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-lobby" data-locale="btn_back_lobby">Zurück zur Lobby</button>
                <button class="cancel-btn" id="btn-back-menu" data-locale="btn_back_menu">Hauptmenü</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
