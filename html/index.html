<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa">FFA LOBBY</button>
                    <button class="tab-btn" data-tab="create">LOBBY ERSTELLEN</button>
                    <button class="tab-btn" data-tab="list">OFFENE LOBBYS</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Left Panel: Filters -->
                <aside class="sidebar">
                    <div class="filter-group">
                        <label>MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                            <option value="legion">LEGION SQUARE</option>
                            <option value="sandy">SANDY SHORES</option>
                            <option value="airport">AIRPORT</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>WEAPONS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                            <option value="pistols">PISTOLS ONLY</option>
                            <option value="snipers">SNIPERS ONLY</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>TIME <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-time">
                            <option value="all">ANY TIME</option>
                            <option value="short">5-10 MIN</option>
                            <option value="long">15+ MIN</option>
                        </select>
                    </div>

                    <button class="create-btn" id="open-create-modal">SPIELER-STATS</button>
                </aside>

                <!-- Main Content: Views -->
                <main class="lobby-browser">
                    <!-- Tab 1 & 3: Lobby Browser List -->
                    <div id="lobby-list-view" class="tab-view active">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </div>

                    <!-- Tab 2: Create Lobby Form -->
                    <div id="lobby-create-view" class="tab-view" style="display: none;">
                        <div class="create-form-container">
                            <h2 class="view-title">LOBBY ERSTELLEN</h2>
                            <div class="form-grid">
                                <div class="input-group full-width">
                                    <label>LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="NAME EINGEBEN...">
                                </div>
                                <div class="input-group">
                                    <label>MAP AUSWAHL</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label>SPIELMODUS</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA (ALLE GEGEN ALLE)</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                                <div class="input-group full-width">
                                    <label>WAFFEN-LOADOUT</label>
                                    <select id="loadout-select"></select>
                                </div>
                                <div class="input-group">
                                    <label>RUNDENZEIT: <span id="round-time-val">15</span> MIN</label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label>MAX. SPIELER: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="32" step="1" value="16">
                                </div>
                                <div class="input-group">
                                    <label>RESPAWN-ZEIT: <span id="respawn-time-val">5</span> SEK</label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label>KILL-LIMIT: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                                <div class="toggle-group">
                                    <div class="toggle-item">
                                        <label>FAHRZEUGE ERLAUBT</label>
                                        <input type="checkbox" id="vehicles-allowed">
                                    </div>
                                    <div class="toggle-item">
                                        <label>FREUNDLICHES FEUER</label>
                                        <input type="checkbox" id="friendly-fire">
                                    </div>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="confirm-btn" id="btn-create-lobby">LOBBY ERSTELLEN</button>
                                <button class="cancel-btn" id="btn-cancel-create">ABBRECHEN</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3>PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>SETTINGS</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">RED</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">SPECTATOR</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">START</button>
                            <button class="leave-btn" id="btn-leave-lobby">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD (Will be hidden/shown based on script) -->
    <div id="game-hud" style="display: none;">
        <!-- HUD content will be handled later as per user instructions -->
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title">MATCH ENDED</h1>
            <h2 id="winner-name">PLAYER WINS!</h2>
            <div id="match-stats-table"></div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
