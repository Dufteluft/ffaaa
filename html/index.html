<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Browser View (FFA & List) -->
                <div id="browser-view" class="view-container active">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label><span data-locale="map_select">Map</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span data-locale="loadout_select">Waffen</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-weapons">
                                <option value="all">ALL WEAPONS</option>
                            </select>
                        </div>
                        <div class="filter-checkbox">
                            <input type="checkbox" id="filter-free-slots">
                            <label for="filter-free-slots" data-locale="filter_free_slots">Nur freie Plätze</label>
                        </div>
                    </aside>
                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries injected here -->
                        </div>
                    </main>
                </div>

                <!-- Create View -->
                <div id="create-view" class="view-container">
                    <div class="create-form">
                        <div class="form-grid">
                            <div class="input-group full-width">
                                <label data-locale="lobby_name">LOBBY NAME</label>
                                <input type="text" id="lobby-name" placeholder="...">
                            </div>
                            <div class="input-group">
                                <label data-locale="map_select">MAP</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">MODE</label>
                                <select id="mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">TEAM DEATHMATCH</option>
                                </select>
                            </div>
                            <div class="input-group full-width">
                                <label data-locale="loadout_select">LOADOUT (CTRL + CLICK FOR MULTI)</label>
                                <select id="loadout-select" multiple style="height: 100px;"></select>
                            </div>
                            <div class="input-group">
                                <label><span data-locale="round_time">TIME</span>: <span id="round-time-val">15</span></label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">MAX PLAYERS</span>: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="32" step="1" value="16">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="respawn_time">RESPAWN</span>: <span id="respawn-time-val">5</span>s</label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">KILL LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                <input type="range" id="kill-limit" min="0" max="100" step="5" value="30">
                            </div>
                            <div class="input-group toggle-group">
                                <label data-locale="vehicles_allowed">VEHICLES</label>
                                <label class="switch">
                                    <input type="checkbox" id="vehicles-allowed">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="input-group toggle-group">
                                <label data-locale="friendly_fire">FRIENDLY FIRE</label>
                                <label class="switch">
                                    <input type="checkbox" id="friendly-fire">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="confirm-btn" id="btn-create-lobby" data-locale="btn_create">CREATE</button>
                            <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">CANCEL</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">PLAYERS</h3>
                        <div class="player-list-header">
                            <span data-locale="col_name">NAME</span>
                            <span>TEAM</span>
                        </div>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <div class="settings-summary" id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" data-locale="team_red">RED</button>
                            <button class="team-btn" data-team="spectator" data-locale="spectator">SPEC</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="edit-btn" id="btn-edit-settings" style="display: none;">EDIT</button>
                            <button class="leave-btn btn-close-lobby" id="btn-close-lobby" style="display: none;">CLOSE</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer" id="hud-timer">15:00</div>
            <div class="hud-tdm-score" id="hud-tdm-score" style="display: none;">
                <span class="score-blue">0</span> : <span class="score-red">0</span>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-stats">
                <div class="hud-stat-item">
                    <i class="fa-solid fa-crosshairs"></i> <span id="hud-kills">0</span>
                </div>
                <div class="hud-stat-item">
                    <i class="fa-solid fa-skull"></i> <span id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-weapon">
                <span id="hud-ammo">0 / 0</span>
            </div>
            <div class="hud-bars">
                <div class="hud-bar-container health">
                    <div class="hud-bar-fill" id="hud-health" style="width: 100%;"></div>
                </div>
                <div class="hud-bar-container armor">
                    <div class="hud-bar-fill" id="hud-armor" style="width: 0%;"></div>
                </div>
            </div>
        </div>
        <div id="big-countdown" style="display: none;">10</div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 data-locale="game_ended">MATCH ENDED</h1>
            <h2 id="winner-name">PLAYER WINS!</h2>
            <div id="match-stats-table"></div>

            <div class="map-voting">
                <h3>VOTE NEXT MAP</h3>
                <div class="vote-options" id="vote-options"></div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_back_lobby">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu" data-locale="btn_back_menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
