<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <!-- MAIN MENU -->
        <div id="main-container" class="main-container">
            <header class="main-header">
                <h1 id="l-menu_title" class="header-title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button id="l-tab_ffa" class="tab-btn active l-tab_ffa" data-tab="ffa">FFA LOBBY</button>
                    <button id="l-tab_create" class="tab-btn l-tab_create" data-tab="create">LOBBY ERSTELLEN</button>
                    <button id="l-tab_list" class="tab-btn l-tab_list" data-tab="list">OFFENE LOBBYS</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Sidebar / Filters (Visible in FFA and List tabs) -->
                <aside id="sidebar" class="sidebar">
                    <div class="filter-group">
                        <label id="l-map_select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="l-loadout_select">WEAPONS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="l-players">PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="l-time">TIME <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-time">
                            <option value="all">ANY TIME</option>
                        </select>
                    </div>
                    <button id="sidebar-quick-join" class="create-btn l-btn_join">QUICK JOIN</button>
                </aside>

                <!-- TAB: FFA LOBBY & OFFENE LOBBYS (Shared Browser) -->
                <main id="lobby-browser" class="lobby-browser">
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Entries injected here -->
                    </div>
                </main>

                <!-- TAB: LOBBY ERSTELLEN -->
                <main id="create-lobby-view" class="create-lobby-view" style="display: none;">
                    <div class="create-form">
                        <div class="input-group full-width">
                            <label id="l-lobby_name">LOBBY NAME</label>
                            <input type="text" id="create-lobby-name" maxlength="20" placeholder="...">
                        </div>

                        <div class="input-row">
                            <div class="input-group">
                                <label id="l-map_select">MAP</label>
                                <select id="create-map-select"></select>
                            </div>
                            <div class="input-group">
                                <label id="l-mode_select">MODE</label>
                                <select id="create-mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">TEAM DEATHMATCH</option>
                                </select>
                            </div>
                        </div>

                        <div class="input-group full-width">
                            <label id="l-loadout_select">LOADOUTS (MULTI-SELECT)</label>
                            <div id="loadout-checkboxes" class="loadout-grid">
                                <!-- Checkboxes injected here -->
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="input-group">
                                <label><span id="l-round_time">TIME</span>: <span id="val-round-time">15</span>m</label>
                                <input type="range" id="create-round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span id="l-max_players">MAX PLAYERS</span>: <span id="val-max-players">16</span></label>
                                <input type="range" id="create-max-players" min="2" max="16" step="1" value="16">
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="input-group">
                                <label><span id="l-respawn_time">RESPAWN</span>: <span id="val-respawn-time">5</span>s</label>
                                <input type="range" id="create-respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span id="l-kill_limit">KILL LIMIT</span>: <span id="val-kill-limit">30</span></label>
                                <input type="range" id="create-kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="toggle-group">
                                <label id="l-vehicles_allowed">VEHICLES</label>
                                <label class="switch">
                                    <input type="checkbox" id="create-vehicles">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="toggle-group">
                                <label id="l-friendly_fire">FRIENDLY FIRE</label>
                                <label class="switch">
                                    <input type="checkbox" id="create-ff">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>

                        <div class="action-row">
                            <button id="btn-submit-create" class="confirm-btn l-btn_create">ERSTELLEN</button>
                            <button id="btn-cancel-create" class="cancel-btn l-btn_cancel">ABBRECHEN</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- WAITING AREA -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="waiting-lobby-name">LOBBY: NAME</h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="l-players">PLAYERS</h3>
                        <div id="player-list-container"></div>
                    </div>
                    <div class="settings-section">
                        <h3 id="l-settings">SETTINGS</h3>
                        <div id="lobby-settings-summary" class="summary-box"></div>

                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="l-team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="l-team_red">RED</button>
                            <button class="team-btn" data-team="spectator" id="l-spectator">SPEC</button>
                        </div>

                        <h3 id="l-chat">CHAT</h3>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <div class="chat-input-row">
                                <input type="text" id="chat-input" maxlength="100" placeholder="...">
                                <button id="chat-send"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>

                        <div class="lobby-actions">
                            <button id="btn-ready" class="ready-btn l-btn_ready">BEREIT</button>
                            <button id="btn-start" class="start-btn l-btn_start" style="display: none;">START</button>
                            <button id="btn-leave" class="leave-btn l-btn_leave">VERLASSEN</button>
                            <button id="btn-close-lobby" class="leave-btn l-btn_close_lobby" style="display: none;">SCHLIESSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- HUD -->
        <div id="game-hud" class="game-hud" style="display: none;">
            <div class="hud-top">
                <div class="hud-box timer">
                    <i class="fa-solid fa-clock"></i> <span id="hud-timer">00:00</span>
                </div>
                <div class="hud-box score" id="hud-tdm-score" style="display: none;">
                    <span class="blue">0</span> : <span class="red">0</span>
                </div>
            </div>
            <div class="hud-bottom">
                <div class="hud-stats">
                    <div class="stat-item">
                        <span class="label l-kills">KILLS</span>
                        <span class="value" id="hud-kills">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="label l-deaths">DEATHS</span>
                        <span class="value" id="hud-deaths">0</span>
                    </div>
                </div>
                <div class="hud-vitals">
                    <div class="vital-row ammo">
                        <span id="hud-ammo">0</span> <i class="fa-solid fa-gun"></i>
                    </div>
                    <div class="vital-bar armor"><div id="bar-armor" style="width: 0%;"></div></div>
                    <div class="vital-bar health"><div id="bar-health" style="width: 100%;"></div></div>
                </div>
            </div>
            <div id="hud-countdown" class="hud-countdown" style="display: none;">10</div>
        </div>

        <!-- WINNER SCREEN -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 id="l-game_ended">RUNDE BEENDET</h1>
                <h2 id="winner-announcement">PLAYER GEWINNT!</h2>

                <div class="stats-table-wrapper">
                    <table id="winner-stats-table">
                        <thead>
                            <tr>
                                <th id="l-players">NAME</th>
                                <th id="l-kills">KILLS</th>
                                <th id="l-deaths">DEATHS</th>
                                <th id="l-kd_ratio">K/D</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div class="map-voting">
                    <h3 id="l-map_select">NÄCHSTE MAP VOTE</h3>
                    <div id="vote-grid" class="vote-grid"></div>
                </div>

                <div class="btn-group">
                    <button id="btn-winner-lobby" class="confirm-btn l-btn_ready">ZURÜCK ZUR LOBBY</button>
                    <button id="btn-winner-menu" class="cancel-btn l-btn_leave">HAUPTMENÜ</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
