<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title l-menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active l-tab_ffa" data-tab="ffa">FFA Lobby</button>
                    <button class="tab-btn l-tab_create" data-tab="create">Lobby erstellen</button>
                    <button class="tab-btn l-tab_list" data-tab="list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1 & 3: Lobby Browser (Shared) -->
                <div id="tab-browser" class="tab-content active">
                    <!-- Left Panel: Filters -->
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label><span class="l-map_select">MAPS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span class="l-loadout_select">WEAPONS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-weapons">
                                <option value="all">ALL WEAPONS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span class="l-max_players">PLAYERS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all">ANY</option>
                                <option value="not-full">NOT FULL</option>
                            </select>
                        </div>
                    </aside>

                    <!-- Main Content: Lobby List -->
                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </main>
                </div>

                <!-- Tab 2: Create Lobby -->
                <div id="tab-create" class="tab-content">
                    <div class="create-container">
                        <h2 class="l-tab_create">CREATE CUSTOM LOBBY</h2>
                        <div class="form-container">
                            <div class="input-group">
                                <label class="l-lobby_name">LOBBY NAME</label>
                                <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label class="l-map_select">MAP</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label class="l-mode_select">MODE</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label class="l-loadout_select">LOADOUT (MULTI-SELECT)</label>
                                <div class="loadout-grid" id="loadout-grid">
                                    <!-- Multi-select checkboxes will be here -->
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span class="l-round_time">TIME (MIN)</span>: <span id="round-time-val">15</span></label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span class="l-max_players">MAX PLAYERS</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label class="l-vehicles_allowed">VEHICLES ALLOWED</label>
                                    <label class="switch">
                                        <input type="checkbox" id="vehicles-allowed">
                                        <span class="slider-round"></span>
                                    </label>
                                </div>
                                <div class="input-group">
                                    <label class="l-friendly_fire">FRIENDLY FIRE</label>
                                    <label class="switch">
                                        <input type="checkbox" id="friendly-fire">
                                        <span class="slider-round"></span>
                                    </label>
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span class="l-respawn_time">RESPAWN TIME (SEC)</span>: <span id="respawn-time-val">5</span></label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span class="l-kill_limit">KILL LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="10" value="30">
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="confirm-btn l-btn_create" id="btn-create-lobby">CREATE</button>
                                <button class="cancel-btn l-btn_cancel" id="btn-cancel-create">CANCEL</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 class="l-players">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 class="l-settings">SETTINGS</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn l-team_blue" data-team="blue" id="btn-team-blue">BLUE</button>
                            <button class="team-btn l-team_red" data-team="red" id="btn-team-red">RED</button>
                            <button class="team-btn l-spectator" data-team="spectator" id="btn-team-spec">SPECTATOR</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn l-btn_ready" id="btn-ready-toggle">READY</button>
                            <button class="start-btn l-btn_start" id="btn-start-game" style="display: none;">START</button>
                            <button class="leave-btn l-btn_leave" id="btn-leave-lobby">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer">
                <i class="fa-solid fa-clock"></i> <span id="hud-time">15:00</span>
            </div>
        </div>
        <div class="hud-center">
            <div id="hud-countdown" style="display: none;">10</div>
        </div>
        <div class="hud-bottom">
            <div class="hud-stats-left">
                <div class="stat-item">
                    <div class="stat-label l-kills">KILLS</div>
                    <div class="stat-value" id="hud-kills">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label l-deaths">DEATHS</div>
                    <div class="stat-value" id="hud-deaths">0</div>
                </div>
            </div>
            <div class="hud-scores" id="hud-tdm-scores" style="display: none;">
                <div class="score-team blue">
                    <div class="team-name l-team_blue">BLUE</div>
                    <div class="team-val" id="hud-score-blue">0</div>
                </div>
                <div class="score-divider">VS</div>
                <div class="score-team red">
                    <div class="team-val" id="hud-score-red">0</div>
                    <div class="team-name l-team_red">RED</div>
                </div>
            </div>
            <div class="hud-player-info">
                <div class="bars-container">
                    <div class="hud-bar health">
                        <div class="bar-fill" id="hud-health-fill" style="width: 100%;"></div>
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div class="hud-bar armor">
                        <div class="bar-fill" id="hud-armor-fill" style="width: 0%;"></div>
                        <i class="fa-solid fa-shield"></i>
                    </div>
                </div>
                <div class="hud-ammo">
                    <i class="fa-solid fa-gun"></i> <span id="hud-ammo-val">30</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 class="l-game_ended" id="winner-title">MATCH ENDED</h1>
            <h2 id="winner-name">PLAYER <span class="winner_suffix">WINS!</span></h2>

            <div id="map-voting" class="map-voting-section">
                <h3 class="l-map_select">NEXT MAP VOTE</h3>
                <div class="vote-grid" id="vote-grid">
                    <!-- Voting options -->
                </div>
            </div>

            <div id="match-stats-table"></div>

            <div class="btn-group">
                <button class="confirm-btn l-btn_back_lobby" id="btn-back-to-lobby">BACK TO LOBBY</button>
                <button class="cancel-btn l-btn_back_menu" id="btn-back-to-menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
