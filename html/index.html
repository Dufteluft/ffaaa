<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" id="loc-menu-title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="loc-tab-ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="loc-tab-create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="loc-tab-list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Browser Tab (FFA & List) -->
                <main class="lobby-browser" id="browser-view">
                    <div class="sidebar">
                        <div class="filter-group">
                            <label><span id="loc-map-select">MAPS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span id="loc-players">PLAYERS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all">ANY</option>
                                <option value="not-full">NOT FULL</option>
                            </select>
                        </div>
                    </div>
                    <div class="lobby-list-container">
                        <div class="lobby-list" id="lobby-list">
                            <!-- Entries will be injected here -->
                        </div>
                    </div>
                </main>

                <!-- Create Tab -->
                <main class="creation-view" id="create-view" style="display: none;">
                    <div class="form-grid">
                        <div class="input-group full-width">
                            <label id="loc-lobby-name">LOBBY NAME</label>
                            <input type="text" id="create-name" placeholder="ENTER NAME...">
                        </div>
                        <div class="input-group">
                            <label id="loc-map-select-2">MAP</label>
                            <select id="create-map"></select>
                        </div>
                        <div class="input-group">
                            <label id="loc-mode-select">MODE</label>
                            <select id="create-mode">
                                <option value="ffa">FFA</option>
                                <option value="tdm">TEAM DEATHMATCH</option>
                            </select>
                        </div>
                        <div class="input-group full-width">
                            <label id="loc-loadout-select">LOADOUT</label>
                            <div class="loadout-grid" id="loadout-checkboxes">
                                <!-- Checkboxes will be injected here -->
                            </div>
                        </div>
                        <div class="input-group">
                            <label><span id="loc-round-time">TIME</span> (MIN): <span id="val-round-time">15</span></label>
                            <input type="range" id="create-round-time" min="5" max="30" step="5" value="15">
                        </div>
                        <div class="input-group">
                            <label><span id="loc-max-players">MAX PLAYERS</span>: <span id="val-max-players">16</span></label>
                            <input type="range" id="create-max-players" min="2" max="16" step="1" value="16">
                        </div>
                        <div class="input-group">
                            <label id="loc-respawn-time">RESPAWN TIME</label>
                            <input type="range" id="create-respawn-time" min="3" max="10" step="1" value="5">
                        </div>
                        <div class="input-group">
                            <label id="loc-kill-limit">KILL LIMIT</label>
                            <input type="range" id="create-kill-limit" min="0" max="50" step="5" value="30">
                        </div>
                        <div class="toggle-group">
                            <label id="loc-vehicles-allowed">VEHICLES</label>
                            <div class="toggle-btn" id="toggle-vehicles" data-value="false">OFF</div>
                        </div>
                        <div class="toggle-group">
                            <label id="loc-friendly-fire">FRIENDLY FIRE</label>
                            <div class="toggle-btn" id="toggle-ff" data-value="false">OFF</div>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="confirm-btn" id="btn-submit-create">CREATE LOBBY</button>
                        <button class="cancel-btn" id="btn-cancel-create">CANCEL</button>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2>LOBBY: <span id="waiting-lobby-name">Default</span></h2>
                    <div class="lobby-id-badge">ID: <span id="waiting-lobby-id">0000</span></div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="loc-players-list">PLAYERS</h3>
                        <div id="waiting-player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 id="loc-settings">SETTINGS</h3>
                        <div class="settings-summary" id="waiting-settings-summary"></div>

                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="loc-team-blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="loc-team-red">RED</button>
                            <button class="team-btn" data-team="spectator" id="loc-spectator">SPECTATOR</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">START</button>
                            <button class="leave-btn" id="btn-leave-lobby">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 id="winner-title-text">MATCH ENDED</h1>
                <h2 id="winner-announcement">PLAYER <span id="loc-winner-suffix">WINS!</span></h2>
                <div class="winner-stats-container">
                    <table id="winner-stats-table">
                        <thead>
                            <tr>
                                <th id="loc-name">NAME</th>
                                <th id="loc-kills">KILLS</th>
                                <th id="loc-deaths">DEATHS</th>
                                <th id="loc-kd">K/D</th>
                            </tr>
                        </thead>
                        <tbody id="winner-stats-body"></tbody>
                    </table>
                </div>
                <div class="btn-group">
                    <button class="confirm-btn" id="btn-winner-lobby">BACK TO LOBBY</button>
                    <button class="cancel-btn" id="btn-winner-menu">MAIN MENU</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Gameplay HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-container">
            <div class="hud-top">
                <div class="hud-timer">
                    <i class="fa-regular fa-clock"></i>
                    <span id="hud-time">15:00</span>
                </div>
                <div class="hud-scores" id="hud-team-scores" style="display: none;">
                    <div class="score-box blue">
                        <span class="label">BLUE</span>
                        <span class="value" id="hud-score-blue">0</span>
                    </div>
                    <div class="score-box red">
                        <span class="label">RED</span>
                        <span class="value" id="hud-score-red">0</span>
                    </div>
                </div>
            </div>

            <div class="hud-bottom">
                <div class="hud-player-stats">
                    <div class="stat-item">
                        <span class="label" id="loc-hud-kills">KILLS</span>
                        <span class="value" id="hud-kills">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="label" id="loc-hud-deaths">DEATHS</span>
                        <span class="value" id="hud-deaths">0</span>
                    </div>
                </div>
                <div class="hud-vital-bars">
                    <div class="bar-container health">
                        <div class="bar-fill" id="hud-health" style="width: 100%;"></div>
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div class="bar-container armor">
                        <div class="bar-fill" id="hud-armor" style="width: 0%;"></div>
                        <i class="fa-solid fa-shield"></i>
                    </div>
                </div>
                <div class="hud-weapon-info">
                    <div class="ammo-count">
                        <span id="hud-ammo">100</span>
                        <i class="fa-solid fa-gun"></i>
                    </div>
                </div>
            </div>
        </div>
        <div id="countdown-display" style="display: none;">10</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
