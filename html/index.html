<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1: FFA Lobby (Persistent) & Tab 3: Open Lobbies -->
                <main class="lobby-browser" id="tab-content-lobby">
                    <div class="browser-header" id="browser-filters" style="display: none;">
                        <div class="filter-item">
                            <input type="checkbox" id="filter-free-slots">
                            <label for="filter-free-slots" data-locale="free_slots_only">Nur Lobbys mit freien Plätzen</label>
                        </div>
                    </div>
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Entries injected here -->
                    </div>
                </main>

                <!-- Tab 2: Create Lobby -->
                <main class="create-lobby-area" id="tab-content-create" style="display: none;">
                    <div class="form-container">
                        <div class="input-group">
                            <label data-locale="lobby_name">Lobby Name</label>
                            <input type="text" id="lobby-name" placeholder="...">
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label data-locale="map_select">Map auswählen</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">Spielmodus</label>
                                <select id="mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">Team Deathmatch</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-group">
                            <label data-locale="loadout_select">Waffen-Loadout</label>
                            <select id="loadout-select" multiple></select>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span data-locale="round_time">Rundenzeit (Min)</span>: <span id="round-time-val">15</span></label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">Max. Spieler</span>: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group toggle-group">
                                <label data-locale="vehicles_allowed">Fahrzeuge erlaubt</label>
                                <input type="checkbox" id="vehicles-allowed" class="toggle-input">
                            </div>
                            <div class="input-group toggle-group">
                                <label data-locale="friendly_fire">Freundliches Feuer</label>
                                <input type="checkbox" id="friendly-fire" class="toggle-input">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span data-locale="respawn_time">Respawn-Zeit (Sek)</span>: <span id="respawn-time-val">5</span></label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">Kill-Limit zum Sieg</span>: <span id="kill-limit-val">30</span></label>
                                <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="confirm-btn create-btn-final" id="btn-create-lobby" data-locale="btn_create">Lobby erstellen</button>
                            <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">Abbrechen</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">Spielerliste</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 data-locale="tab_settings">Einstellungen</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue" data-locale="team_blue">Blau</button>
                            <button class="team-btn" data-team="red" id="btn-team-red" data-locale="team_red">Rot</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec" data-locale="spectator">Zuschauer</button>
                            <button class="team-btn" data-team="random" id="btn-team-random" data-locale="random">Zufall</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">Bereit</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">Spiel starten</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">Lobby verlassen</button>
                            <button class="cancel-btn" id="btn-close-lobby" style="display: none;" data-locale="btn_close_lobby">Lobby schließen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-time-val">00:00</span>
            </div>
        </div>
        <div class="hud-bottom">
            <div class="hud-stats-left">
                <div class="hud-item">
                    <span class="label" data-locale="hud_health">LEBEN</span>
                    <div class="bar-container"><div id="health-bar" class="bar"></div></div>
                </div>
                <div class="hud-item">
                    <span class="label" data-locale="hud_armor">RÜSTUNG</span>
                    <div class="bar-container"><div id="armor-bar" class="bar"></div></div>
                </div>
            </div>
            <div class="hud-center">
                <div class="tdm-score" id="hud-tdm-score" style="display: none;">
                    <span class="score-blue" id="score-blue">0</span>
                    <span class="score-divider">:</span>
                    <span class="score-red" id="score-red">0</span>
                </div>
                <div class="ffa-kills" id="hud-ffa-kills">
                    <span id="hud-kills">0</span> <span data-locale="kills">KILLS</span>
                </div>
            </div>
            <div class="hud-stats-right">
                <div class="hud-ammo">
                    <span id="hud-ammo-val">0</span>
                    <i class="fa-solid fa-gun"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Big Countdown -->
    <div id="big-countdown" style="display: none;">
        <span id="countdown-number">10</span>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title" data-locale="game_ended">RUNDE BEENDET!</h1>
            <h2 id="winner-name">PLAYER <span data-locale="wins_suffix">GEWINNT!</span></h2>

            <div id="match-stats-table"></div>

            <div class="map-voting" id="map-voting-area">
                <h3 data-locale="map_select">Map auswählen</h3>
                <div class="voting-grid" id="voting-maps"></div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_ready">ZURÜCK ZUM WARTEBEREICH</button>
                <button class="cancel-btn" id="btn-back-to-menu" data-locale="btn_cancel">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
