<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <!-- Main Menu -->
        <div id="main-menu" class="overlay" style="display: none;">
            <div class="main-container">
                <!-- Header -->
                <header class="main-header">
                    <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                    <nav class="nav-tabs">
                        <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                        <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                        <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                    </nav>
                </header>

                <div class="content-wrapper">
                    <!-- Tab 1 & 3: Lobby Browser (Shared container) -->
                    <main class="lobby-browser" id="lobby-browser-container">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </main>

                    <!-- Tab 2: Create Lobby (Dedicated container) -->
                    <main class="create-lobby-container" id="create-lobby-tab" style="display: none;">
                        <div class="form-grid">
                            <div class="input-group full-width">
                                <label data-locale="lobby_name">Lobby Name</label>
                                <input type="text" id="lobby-name" placeholder="...">
                            </div>
                            <div class="input-group">
                                <label data-locale="map_select">Map auswählen</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">Spielmodus</label>
                                <select id="mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">TEAM DEATHMATCH</option>
                                </select>
                            </div>
                            <div class="input-group full-width">
                                <label data-locale="loadout_select">Waffen-Loadout</label>
                                <div class="multi-select" id="loadout-multi-select">
                                    <!-- Options will be injected here -->
                                </div>
                            </div>
                            <div class="input-group">
                                <label><span data-locale="round_time">Rundenzeit (Min)</span>: <span id="round-time-val">15</span></label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">Max. Spieler</span>: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                            </div>
                            <div class="input-group toggle-group">
                                <label data-locale="vehicles_allowed">Fahrzeuge erlaubt</label>
                                <label class="switch">
                                    <input type="checkbox" id="vehicles-toggle">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="input-group toggle-group">
                                <label data-locale="friendly_fire">Freundliches Feuer</label>
                                <label class="switch">
                                    <input type="checkbox" id="ff-toggle">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="input-group">
                                <label><span data-locale="respawn_time">Respawn-Zeit (Sek)</span>: <span id="respawn-time-val">5</span></label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">Kill-Limit zum Sieg</span>: <span id="kill-limit-val">0</span></label>
                                <input type="range" id="kill-limit" min="0" max="50" step="10" value="0">
                            </div>
                        </div>
                        <div class="create-actions">
                            <button class="create-confirm-btn" id="btn-create-lobby" data-locale="btn_create">Lobby erstellen</button>
                            <button class="create-cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">Abbrechen</button>
                        </div>
                    </main>
                </div>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-title">LOBBY NAME</h2>
                    <div class="lobby-id-badge">ID: <span id="lobby-id-display">0000</span></div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">Spielerliste</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <div class="lobby-summary-grid" id="lobby-info-summary">
                            <!-- Summary items like Map, Mode, Time -->
                        </div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" data-locale="team_red">RED</button>
                            <button class="team-btn" data-team="spectator" data-locale="spectator">SPECTATOR</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input" placeholder="...">
                                <i class="fa-solid fa-paper-plane"></i>
                            </div>
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">Bereit</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">Spiel starten</button>
                            <button class="close-lobby-btn" id="btn-close-lobby" style="display: none;" data-locale="btn_close_lobby">Lobby schließen</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">Lobby verlassen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- HUD -->
        <div id="game-hud" style="display: none;">
            <div class="hud-top-right">
                <div class="hud-stat-item">
                    <i class="fa-solid fa-clock"></i>
                    <span id="hud-timer">00:00</span>
                </div>
                <div class="hud-stat-item ffa-only">
                    <i class="fa-solid fa-crosshairs"></i>
                    <span id="hud-kills">0</span>
                </div>
                <div class="tdm-only hud-teams">
                    <div class="team-score blue-score">
                        <span class="team-dot"></span>
                        <span id="hud-score-blue">0</span>
                    </div>
                    <div class="team-score red-score">
                        <span class="team-dot"></span>
                        <span id="hud-score-red">0</span>
                    </div>
                </div>
            </div>
            <div class="hud-bottom-right">
                <div class="health-armor-bars">
                    <div class="bar-container armor-container">
                        <div class="bar-fill" id="hud-armor-fill" style="width: 100%;"></div>
                    </div>
                    <div class="bar-container health-container">
                        <div class="bar-fill" id="hud-health-fill" style="width: 100%;"></div>
                    </div>
                </div>
                <div class="ammo-display">
                    <i class="fa-solid fa-gun"></i>
                    <span id="hud-ammo">0</span>
                </div>
            </div>
        </div>

        <!-- Countdown -->
        <div id="big-countdown" style="display: none;">
            <span id="countdown-number">10</span>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <div class="winner-header">
                    <h1 data-locale="game_ended">RUNDE BEENDET</h1>
                    <h2 id="winner-name-display">SPIELER GEWINNT!</h2>
                </div>

                <div class="winner-content">
                    <div class="winner-stats">
                        <div class="stats-table-wrapper">
                            <table id="match-stats-table">
                                <thead>
                                    <tr>
                                        <th data-locale="name">NAME</th>
                                        <th data-locale="kills">KILLS</th>
                                        <th data-locale="deaths">DEATHS</th>
                                        <th data-locale="kd_ratio">K/D</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>

                    <div class="map-voting">
                        <h3 data-locale="map_vote">Nächste Map wählen:</h3>
                        <div class="vote-options" id="vote-map-options"></div>
                    </div>
                </div>

                <div class="winner-actions">
                    <button class="confirm-btn" id="btn-back-to-lobby">BACK TO LOBBY</button>
                    <button class="cancel-btn" id="btn-back-to-menu">MAIN MENU</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
