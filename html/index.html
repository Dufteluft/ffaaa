<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" id="l-menu-title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="l-tab-ffa">FFA LOBBY</button>
                    <button class="tab-btn" data-tab="create" id="l-tab-create">LOBBY ERSTELLEN</button>
                    <button class="tab-btn" data-tab="list" id="l-tab-list">OFFENE LOBBYS</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab: FFA & Tab: List -->
                <div id="tab-content-browser" class="tab-content">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label id="l-map-select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label id="l-loadout-select">WEAPONS <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-weapons">
                                <option value="all">ALL WEAPONS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label id="l-max-players">PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all">ANY</option>
                                <option value="not-full">NOT FULL</option>
                            </select>
                        </div>
                    </aside>
                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container"></div>
                    </main>
                </div>

                <!-- Tab: Create -->
                <div id="tab-content-create" class="tab-content" style="display: none;">
                    <div class="create-form-container">
                        <div class="form-grid">
                            <div class="input-group">
                                <label id="l-lobby-name">LOBBY NAME</label>
                                <input type="text" id="lobby-name" placeholder="Name eingeben...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label id="l-map-select-2">MAP</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label id="l-mode-select">MODUS</label>
                                    <select id="mode-select">
                                        <option value="ffa">Free-for-All</option>
                                        <option value="tdm">Team Deathmatch</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label id="l-loadout-select-2">LOADOUT</label>
                                <select id="loadout-select"></select>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label id="l-round-time">RUNDENZEIT (MIN): <span id="round-time-val">15</span></label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label id="l-max-players-2">MAX SPIELER: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label id="l-respawn-time">RESPAWN (SEK): <span id="respawn-time-val">5</span></label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label id="l-kill-limit">KILL LIMIT: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="toggle-row">
                                <div class="toggle-group">
                                    <label id="l-vehicles-allowed">FAHRZEUGE</label>
                                    <input type="checkbox" id="vehicles-allowed" class="custom-toggle">
                                </div>
                                <div class="toggle-group">
                                    <label id="l-friendly-fire">FRIENDLY FIRE</label>
                                    <input type="checkbox" id="friendly-fire" class="custom-toggle">
                                </div>
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="confirm-btn" id="btn-create-lobby-final">LOBBY ERSTELLEN</button>
                            <button class="cancel-btn" id="btn-cancel-create">ABBRECHEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-title">LOBBY: NAME</h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="l-players-title">SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 id="l-settings-title">EINSTELLUNGEN</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">BLAU</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">ROT</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">ZUSCHAUER</button>
                            <button class="team-btn active" data-team="random" id="btn-team-rand">ZUFALL</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="Nachricht senden...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">START</button>
                            <button class="leave-btn" id="btn-leave-lobby">VERLASSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-container">
            <div class="hud-top">
                <div class="hud-timer">
                    <i class="fa-solid fa-clock"></i>
                    <span id="hud-time">15:00</span>
                </div>
                <div class="hud-team-score" id="hud-tdm-score" style="display: none;">
                    <span class="score-blue">0</span>
                    <span class="score-divider">:</span>
                    <span class="score-red">0</span>
                </div>
            </div>
            <div class="hud-stats">
                <div class="stat-item">
                    <span class="stat-label" id="l-hud-kills">KILLS</span>
                    <span class="stat-value" id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label" id="l-hud-deaths">TODE</span>
                    <span class="stat-value" id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-bottom">
                <div class="hud-bars">
                    <div class="bar-container health">
                        <div class="bar-fill" id="hud-health-fill" style="width: 100%;"></div>
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div class="bar-container armor">
                        <div class="bar-fill" id="hud-armor-fill" style="width: 50%;"></div>
                        <i class="fa-solid fa-shield"></i>
                    </div>
                </div>
                <div class="hud-ammo">
                    <span id="hud-ammo-val">30</span>
                    <i class="fa-solid fa-gun"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Countdown Overlay -->
    <div id="countdown-overlay" class="overlay" style="display: none; background: rgba(0,0,0,0.5);">
        <div class="countdown-number" id="countdown-text">10</div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title">RUNDE BEENDET</h1>
            <h2 id="winner-name">SPIELER GEWINNT!</h2>
            <div id="match-stats-table"></div>

            <!-- Map Voting -->
            <div class="map-voting-section">
                <h3 id="l-vote-next-map">NÄCHSTE MAP WÄHLEN</h3>
                <div class="map-voting-grid" id="map-voting-container"></div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby">ZURÜCK ZUR LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
