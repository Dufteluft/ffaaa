<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- jQuery for easier DOM manipulation -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" id="locale-menu-title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="locale-tab-ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="locale-tab-create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="locale-tab-list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1: FFA LOBBY (Vordefiniert) -->
                <section id="tab-ffa-content" class="tab-content active">
                    <div class="lobby-browser">
                        <div class="lobby-list" id="ffa-lobby-list">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                </section>

                <!-- Tab 2: LOBBY ERSTELLEN -->
                <section id="tab-create-content" class="tab-content">
                    <div class="create-form-container">
                        <div class="form-grid">
                            <div class="input-group">
                                <label id="locale-lobby-name">Lobby Name</label>
                                <input type="text" id="create-lobby-name" placeholder="Name eingeben...">
                            </div>
                            <div class="input-group">
                                <label id="locale-map-select">Map auswählen</label>
                                <select id="create-map-select"></select>
                            </div>
                            <div class="input-group">
                                <label id="locale-mode-select">Spielmodus</label>
                                <select id="create-mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">Team Deathmatch</option>
                                </select>
                            </div>
                            <div class="input-group full-width">
                                <label id="locale-loadout-select">Waffen-Loadout</label>
                                <div class="loadout-grid" id="create-loadout-grid">
                                    <!-- Injected by JS (Checkboxes) -->
                                </div>
                            </div>
                            <div class="input-group">
                                <label><span id="locale-round-time">Rundenzeit (Min)</span>: <span id="val-round-time">15</span></label>
                                <input type="range" id="create-round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span id="locale-max-players">Max. Spieler</span>: <span id="val-max-players">16</span></label>
                                <input type="range" id="create-max-players" min="2" max="16" step="1" value="16">
                            </div>
                            <div class="input-group">
                                <label id="locale-vehicles-allowed">Fahrzeuge erlaubt?</label>
                                <label class="switch">
                                    <input type="checkbox" id="create-vehicles">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="input-group">
                                <label id="locale-friendly-fire">Freundliches Feuer</label>
                                <label class="switch">
                                    <input type="checkbox" id="create-ff">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="input-group">
                                <label><span id="locale-respawn-time">Respawn-Zeit (Sek)</span>: <span id="val-respawn-time">5</span></label>
                                <input type="range" id="create-respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span id="locale-kill-limit">Kill-Limit zum Sieg</span>: <span id="val-kill-limit">30</span></label>
                                <input type="range" id="create-kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="confirm-btn" id="btn-create-action">Lobby erstellen</button>
                            <button class="cancel-btn" id="btn-cancel-create">Abbrechen</button>
                        </div>
                    </div>
                </section>

                <!-- Tab 3: OFFENE LOBBYS -->
                <section id="tab-list-content" class="tab-content">
                    <div class="list-layout">
                        <aside class="sidebar">
                            <div class="filter-group">
                                <label>MAPS</label>
                                <select id="filter-maps">
                                    <option value="all">ALLE MAPS</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label>SPIELER</label>
                                <select id="filter-players">
                                    <option value="all">ALLE</option>
                                    <option value="not-full">FREIE PLÄTZE</option>
                                </select>
                            </div>
                        </aside>
                        <main class="lobby-browser">
                            <div class="lobby-list" id="open-lobby-list">
                                <!-- Injected by JS -->
                            </div>
                        </main>
                    </div>
                </section>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="waiting-lobby-title">LOBBY NAME</h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="locale-players">SPIELER</h3>
                        <div id="player-list-container"></div>
                    </div>
                    <div class="settings-section">
                        <h3>SETTINGS</h3>
                        <div id="lobby-settings-summary" class="settings-summary"></div>

                        <div class="team-selection-area">
                            <button class="team-btn" data-team="blue" id="locale-team-blue">Team Blau</button>
                            <button class="team-btn" data-team="red" id="locale-team-red">Team Rot</button>
                            <button class="team-btn" data-team="spectator" id="locale-spectator">Zuschauer</button>
                            <button class="team-btn active" data-team="random" id="locale-random">Zufall</button>
                        </div>

                        <div class="lobby-chat-container">
                            <div id="lobby-chat-messages" class="chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="lobby-chat-input" placeholder="Nachricht senden...">
                                <i class="fa-solid fa-paper-plane"></i>
                            </div>
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">SPIEL STARTEN</button>
                            <button class="leave-btn" id="btn-leave-lobby">LOBBY VERLASSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 id="winner-announcement">GEWINNER!</h1>
                <h2 id="winner-player-name">SPIELERNAME</h2>
                <div class="stats-table-wrapper" id="end-game-stats">
                    <!-- Table injected by JS -->
                </div>
                <div class="winner-actions">
                    <button class="confirm-btn" id="btn-back-to-lobby">ZURÜCK ZUR LOBBY</button>
                    <button class="cancel-btn" id="btn-back-to-menu">HAUPTMENÜ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer" id="hud-timer">15:00</div>
            <div class="hud-scores" id="hud-tdm-scores" style="display: none;">
                <span class="score-blue" id="hud-score-blue">0</span>
                <span class="score-divider">:</span>
                <span class="score-red" id="hud-score-red">0</span>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-stats">
                <div class="stat-item">
                    <span class="stat-label">KILLS</span>
                    <span class="stat-value" id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">TODE</span>
                    <span class="stat-value" id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-weapon">
                <div class="ammo-info">
                    <i class="fa-solid fa-gun"></i>
                    <span id="hud-ammo">0</span>
                </div>
            </div>
        </div>
        <div class="hud-bottom-left">
            <div class="bars-container">
                <div class="bar-wrapper health">
                    <div class="bar-fill" id="hud-health-fill" style="width: 100%;"></div>
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="bar-wrapper armor">
                    <div class="bar-fill" id="hud-armor-fill" style="width: 0%;"></div>
                    <i class="fa-solid fa-shield"></i>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
