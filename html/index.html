<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA LOBBY</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">LOBBY ERSTELLEN</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">OFFENE LOBBYS</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Left Panel: Filters (Visible on Tab 1 and 3) -->
                <aside class="sidebar" id="main-sidebar">
                    <div class="filter-group">
                        <label><span data-locale="map_select">MAPS</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all" data-locale="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label><span data-locale="loadout_select">WEAPONS</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all" data-locale="all">ALL WEAPONS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label><span data-locale="max_players">PLAYERS</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all" data-locale="all">ANY</option>
                            <option value="not-full" data-locale="not_full">NOT FULL</option>
                        </select>
                    </div>
                </aside>

                <!-- Main Content -->
                <main class="main-view">
                    <!-- Tab 1 & 3: Lobby Browser -->
                    <div id="lobby-browser-view" class="tab-view active">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </div>

                    <!-- Tab 2: Create Lobby -->
                    <div id="create-lobby-view" class="tab-view">
                        <div class="create-form">
                            <h2 data-locale="tab_create">CREATE CUSTOM LOBBY</h2>
                            <div class="form-grid">
                                <div class="input-group full-width">
                                    <label data-locale="lobby_name">LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                                </div>
                                <div class="input-group">
                                    <label data-locale="map_select">MAP</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="mode_select">MODE</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                                <div class="input-group full-width">
                                    <label data-locale="loadout_select">LOADOUT</label>
                                    <select id="loadout-select" multiple class="multi-select"></select>
                                    <small data-locale="multi_select_hint" style="color: var(--text-muted); font-size: 10px; margin-top: 5px;">Halte STRG für Mehrfachauswahl</small>
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="round_time">TIME</span>: <span id="round-time-val">15</span> <span data-locale="minutes_abbr">MIN</span></label>
                                    <input type="range" id="round-time" min="0" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="max_players">MAX PLAYERS</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="32" step="1" value="16">
                                </div>
                                <div class="input-group">
                                    <label data-locale="vehicles_allowed">VEHICLES</label>
                                    <div class="toggle-switch">
                                        <input type="checkbox" id="vehicles-allowed">
                                        <label for="vehicles-allowed"></label>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label data-locale="friendly_fire">FRIENDLY FIRE</label>
                                    <div class="toggle-switch">
                                        <input type="checkbox" id="friendly-fire">
                                        <label for="friendly-fire"></label>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="respawn_time">RESPAWN</span>: <span id="respawn-time-val">5</span> <span data-locale="seconds_abbr">SEK</span></label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="kill_limit">KILL LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="confirm-btn create-btn-large" id="btn-create-lobby" data-locale="btn_create">CREATE</button>
                                <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">CANCEL</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2><span data-locale="lobby_name">LOBBY</span>: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <!-- Host can edit settings here -->
                        <div id="host-settings-editor" style="display: none;">
                            <h3 data-locale="tab_create">SETTINGS</h3>
                            <div id="settings-editor-content"></div>
                            <button class="confirm-btn" id="btn-save-settings" data-locale="btn_save_settings">SAVE</button>
                        </div>
                        <div id="client-settings-view">
                            <h3 data-locale="tab_create">SETTINGS</h3>
                            <div id="lobby-info-summary"></div>
                        </div>

                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red" data-locale="team_red">RED</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec" data-locale="spectator">SPECTATOR</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">LEAVE</button>
                            <button class="leave-btn" id="btn-close-lobby" style="display: none; background: var(--danger);" data-locale="btn_close_lobby">CLOSE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer">
                <i class="fa-regular fa-clock"></i>
                <span id="hud-time">00:00</span>
            </div>
        </div>
        <div class="hud-bottom-left">
            <div class="hud-stats-box">
                <div class="stat-item">
                    <span class="stat-label" data-locale="kills">KILLS</span>
                    <span class="stat-value" id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label" data-locale="deaths">DEATHS</span>
                    <span class="stat-value" id="hud-deaths">0</span>
                </div>
            </div>
            <div id="hud-tdm-score" style="display: none;">
                <div class="team-score blue">
                    <span class="team-dot"></span>
                    <span id="hud-score-blue">0</span>
                </div>
                <div class="team-score red">
                    <span id="hud-score-red">0</span>
                    <span class="team-dot"></span>
                </div>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-weapon-info">
                <div class="ammo-box">
                    <span id="hud-ammo">0</span>
                    <i class="fa-solid fa-gun"></i>
                </div>
            </div>
            <div class="hud-player-bars">
                <div class="bar-container armor">
                    <div class="bar-fill" id="hud-armor-fill" style="width: 0%;"></div>
                </div>
                <div class="bar-container health">
                    <div class="bar-fill" id="hud-health-fill" style="width: 100%;"></div>
                </div>
            </div>
        </div>
        <div id="hud-countdown" class="hud-center-msg" style="display: none;">
            <h1 id="countdown-number">10</h1>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title" data-locale="game_ended">MATCH ENDED</h1>
            <div class="winner-announcement">
                <span id="winner-name">PLAYER</span>
                <span data-locale="wins_suffix">GEWINNT!</span>
            </div>

            <div id="match-stats-table"></div>

            <div class="map-voting">
                <h3 data-locale="map_select">NEXT MAP VOTE</h3>
                <div id="map-vote-list"></div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_join">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu" data-locale="tab_list">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
