<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa">FFA LOBBY</button>
                    <button class="tab-btn" data-tab="create">LOBBY ERSTELLEN</button>
                    <button class="tab-btn" data-tab="list">OFFENE LOBBYS</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Left Panel: Filters (Only visible on Lobby List tabs) -->
                <aside class="sidebar" id="sidebar-filters">
                    <div class="filter-group">
                        <label>MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>WEAPONS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                            <option value="pistol">PISTOLS ONLY</option>
                            <option value="sniper">SNIPERS ONLY</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>TIME <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-time">
                            <option value="all">ANY TIME</option>
                            <option value="short">5-10 MIN</option>
                            <option value="long">15+ MIN</option>
                        </select>
                    </div>
                </aside>

                <!-- Main Content -->
                <main class="lobby-browser">
                    <!-- Tab: Lobby List (FFA or Custom) -->
                    <div id="lobby-list-view" class="tab-view active">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </div>

                    <!-- Tab: Create Lobby -->
                    <div id="create-lobby-view" class="tab-view">
                        <div class="create-form-container">
                            <h2>CUSTOM LOBBY ERSTELLEN</h2>
                            <div class="form-grid">
                                <div class="input-group">
                                    <label>LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="NAME EINGEBEN...">
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label>MAP</label>
                                        <select id="map-select"></select>
                                    </div>
                                    <div class="input-group">
                                        <label>SPIELMODUS</label>
                                        <select id="mode-select">
                                            <option value="ffa">FFA (ALLE GEGEN ALLE)</option>
                                            <option value="tdm">TEAM DEATHMATCH</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label>WAFFEN-LOADOUT</label>
                                    <div class="loadout-grid" id="loadout-checkboxes">
                                        <!-- Checkboxes will be injected here -->
                                    </div>
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label>RUNDENZEIT (MIN): <span id="round-time-val">15</span></label>
                                        <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                    </div>
                                    <div class="input-group">
                                        <label>MAX. SPIELER: <span id="max-players-val">16</span></label>
                                        <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                    </div>
                                </div>
                                <div class="input-row">
                                    <div class="input-group toggle-group">
                                        <label>FAHRZEUGE ERLAUBT</label>
                                        <input type="checkbox" id="vehicles-allowed" class="toggle-input">
                                        <label for="vehicles-allowed" class="toggle-label"></label>
                                    </div>
                                    <div class="input-group toggle-group">
                                        <label>FREUNDLICHES FEUER</label>
                                        <input type="checkbox" id="friendly-fire" class="toggle-input">
                                        <label for="friendly-fire" class="toggle-label"></label>
                                    </div>
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label>RESPAWN-ZEIT (SEK): <span id="respawn-time-val">5</span></label>
                                        <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                    </div>
                                    <div class="input-group">
                                        <label>KILL-LIMIT ZUM SIEG: <span id="kill-limit-val">30</span></label>
                                        <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                    </div>
                                </div>
                                <div class="btn-group">
                                    <button class="create-btn" id="btn-create-lobby">LOBBY ERSTELLEN</button>
                                    <button class="cancel-btn" id="btn-cancel-create">ABBRECHEN</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">DEFAULT</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3>SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>EINSTELLUNGEN</h3>
                        <div id="lobby-info-summary" class="info-grid"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">BLAU</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">ROT</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">ZUSCHAUER</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="NACHRICHT SENDEN...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">STARTEN</button>
                            <button class="leave-btn" id="btn-leave-lobby">VERLASSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-right">
            <div class="hud-timer">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-time">15:00</span>
            </div>
            <div class="hud-scores" id="hud-team-scores" style="display: none;">
                <div class="score-box blue">
                    <span class="team-label">BLUE</span>
                    <span id="score-blue">0</span>
                </div>
                <div class="score-box red">
                    <span class="team-label">RED</span>
                    <span id="score-red">0</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="hud-stats">
                <div class="stat-item">
                    <span class="stat-label">KILLS</span>
                    <span id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">DEATHS</span>
                    <span id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-vitals">
                <div class="vital-row">
                    <i class="fa-solid fa-heart"></i>
                    <div class="bar-bg"><div id="health-bar" class="bar-fill health"></div></div>
                </div>
                <div class="vital-row">
                    <i class="fa-solid fa-shield-halved"></i>
                    <div class="bar-bg"><div id="armor-bar" class="bar-fill armor"></div></div>
                </div>
                <div class="ammo-info">
                    <i class="fa-solid fa-gun"></i>
                    <span id="hud-ammo">0</span>
                </div>
            </div>
        </div>

        <div id="hud-countdown" class="hud-center-msg" style="display: none;">
            <div class="countdown-circle">
                <span id="countdown-number">10</span>
            </div>
            <div class="countdown-text">STARTET IN</div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title">RUNDE BEENDET</h1>
            <h2 id="winner-name">SPIELER GEWINNT!</h2>
            <div id="match-stats-table"></div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby">ZURÜCK ZUR LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
