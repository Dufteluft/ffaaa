<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <header class="main-header">
                <h1 class="header-title" id="loc-menu-title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="loc-tab-ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="loc-tab-create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="loc-tab-list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1 & 3: Lobby Browser -->
                <div id="tab-browser" class="tab-content active">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label id="loc-map-select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label id="loc-max-players">PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all">ANY</option>
                                <option value="not-full">NOT FULL</option>
                            </select>
                        </div>
                        <button class="refresh-btn" onclick="fetchLobbies()"><i class="fa-solid fa-rotate"></i> REFRESH</button>
                    </aside>

                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </main>
                </div>

                <!-- Tab 2: Create Lobby -->
                <div id="tab-create" class="tab-content">
                    <div class="create-form">
                        <div class="input-group">
                            <label id="loc-lobby-name">LOBBY NAME</label>
                            <input type="text" id="create-lobby-name" placeholder="ENTER NAME...">
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label id="loc-map-select-create">MAP</label>
                                <select id="create-map-select"></select>
                            </div>
                            <div class="input-group">
                                <label id="loc-mode-select">MODE</label>
                                <select id="create-mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">TEAM DEATHMATCH</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-group">
                            <label id="loc-loadout-select">WEAPON LOADOUT (MULTI-SELECT)</label>
                            <div class="loadout-grid" id="loadout-grid">
                                <!-- Checkboxes injected here -->
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span id="loc-round-time">TIME (MIN)</span>: <span id="val-round-time">15</span></label>
                                <input type="range" id="create-round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span id="loc-max-players-create">MAX PLAYERS</span>: <span id="val-max-players">16</span></label>
                                <input type="range" id="create-max-players" min="2" max="16" step="1" value="16">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="toggle-group">
                                <label id="loc-vehicles-allowed">VEHICLES</label>
                                <label class="switch">
                                    <input type="checkbox" id="create-vehicles">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="toggle-group">
                                <label id="loc-friendly-fire">FRIENDLY FIRE</label>
                                <label class="switch">
                                    <input type="checkbox" id="create-friendly-fire">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span id="loc-respawn-time">RESPAWN (SEC)</span>: <span id="val-respawn-time">5</span></label>
                                <input type="range" id="create-respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span id="loc-kill-limit">KILL LIMIT</span>: <span id="val-kill-limit">30</span></label>
                                <input type="range" id="create-kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="confirm-btn" id="btn-submit-create" onclick="createLobby()">CREATE LOBBY</button>
                            <button class="cancel-btn" onclick="switchTab('ffa')">CANCEL</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lobby Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="waiting-lobby-name">LOBBY NAME</h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="loc-players">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 id="loc-settings">SETTINGS</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection" id="team-selection">
                            <button class="team-btn" data-team="blue" id="loc-team-blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="loc-team-red">RED</button>
                            <button class="team-btn" data-team="spectator" id="loc-spectator">SPECTATOR</button>
                            <button class="team-btn" data-team="random" id="loc-random">RANDOM</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" onclick="toggleReady()">READY</button>
                            <button class="start-btn" id="btn-start-game" onclick="startGame()" style="display: none;">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" onclick="leaveLobby()">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Gameplay HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer" id="hud-timer">00:00</div>
            <div class="hud-scores" id="hud-tdm-scores" style="display: none;">
                <span class="score-blue">0</span> : <span class="score-red">0</span>
            </div>
        </div>
        <div class="hud-bottom">
            <div class="hud-stats">
                <div class="hud-stat-item"><i class="fa-solid fa-crosshairs"></i> <span id="hud-kills">0</span></div>
                <div class="hud-stat-item"><i class="fa-solid fa-skull"></i> <span id="hud-deaths">0</span></div>
            </div>
            <div class="hud-vitals">
                <div class="hud-bar-container">
                    <div class="hud-bar health" id="hud-health-bar" style="width: 100%;"></div>
                </div>
                <div class="hud-bar-container">
                    <div class="hud-bar armor" id="hud-armor-bar" style="width: 0%;"></div>
                </div>
            </div>
            <div class="hud-ammo">
                <i class="fa-solid fa-bullet"></i> <span id="hud-ammo">0</span>
            </div>
        </div>
        <div id="hud-countdown" class="hud-countdown" style="display: none;">10</div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="loc-game-ended">MATCH ENDED</h1>
            <h2 id="winner-announcement">PLAYER <span id="loc-winner-suffix">WINS!</span></h2>
            <div id="match-stats-table" class="stats-table-container"></div>
            <div id="map-voting-container" class="map-voting-container"></div>
            <div class="btn-group">
                <button class="confirm-btn" id="btn-winner-back">BACK</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
