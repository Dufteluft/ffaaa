<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESX FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" id="loc-menu-title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="loc-tab-ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="loc-tab-create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="loc-tab-list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Lobby Browser (For Tabs 1 and 3) -->
                <main class="lobby-browser" id="lobby-browser-section">
                    <!-- Filters (Only for Tab 3) -->
                    <div class="filters-bar" id="filters-container" style="display: none;">
                        <div class="filter-group">
                            <label id="loc-map-select">MAPS</label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label id="loc-max-players">PLAYERS</label>
                            <select id="filter-players">
                                <option value="all">ANY</option>
                                <option value="not-full">NOT FULL</option>
                            </select>
                        </div>
                    </div>

                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Entries will be injected here -->
                    </div>
                </main>

                <!-- Create Lobby Section (Tab 2) -->
                <main class="create-lobby-section" id="create-lobby-section" style="display: none;">
                    <div class="form-container">
                        <div class="input-group">
                            <label id="loc-lobby-name">LOBBY NAME</label>
                            <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label id="loc-map-select-create">MAP</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label id="loc-mode-select">MODE</label>
                                <select id="mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">TEAM DEATHMATCH</option>
                                </select>
                            </div>
                        </div>

                        <div class="input-group">
                            <label id="loc-loadout-select">LOADOUT</label>
                            <div class="loadout-grid" id="loadout-checkboxes">
                                <!-- Checkboxes injected here -->
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="input-group">
                                <label id="loc-round-time">TIME (MIN): <span id="round-time-val">15</span></label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label id="loc-max-players-create">MAX PLAYERS: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="input-group toggle-group">
                                <label id="loc-vehicles-allowed">VEHICLES</label>
                                <label class="switch">
                                    <input type="checkbox" id="vehicles-allowed">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="input-group toggle-group">
                                <label id="loc-friendly-fire">FRIENDLY FIRE</label>
                                <label class="switch">
                                    <input type="checkbox" id="friendly-fire">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="input-group">
                                <label id="loc-respawn-time">RESPAWN (SEC): <span id="respawn-time-val">5</span></label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label id="loc-kill-limit">KILL LIMIT: <span id="kill-limit-val">30</span></label>
                                <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>

                        <div class="btn-group">
                            <button class="confirm-btn" id="btn-create-lobby-action">CREATE</button>
                            <button class="cancel-btn" id="btn-cancel-create">CANCEL</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="loc-players">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 id="loc-settings">SETTINGS</h3>
                        <div id="lobby-info-summary"></div>

                        <div class="team-selection" id="team-selection-area">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">RED</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">SPECTATOR</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">START</button>
                            <button class="leave-btn" id="btn-leave-lobby">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="timer-box">
                <i class="fa-solid fa-clock"></i> <span id="hud-timer">15:00</span>
            </div>
            <div class="score-box" id="hud-scores" style="display: none;">
                <span class="blue-score">0</span> : <span class="red-score">0</span>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="stats-row">
                <div class="stat-item"><span id="loc-hud-kills">KILLS</span>: <span id="hud-kills">0</span></div>
                <div class="stat-item"><span id="loc-hud-deaths">DEATHS</span>: <span id="hud-deaths">0</span></div>
            </div>
            <div class="bars-container">
                <div class="hud-bar-bg"><div id="hud-health" class="hud-bar health" style="width: 100%;"></div></div>
                <div class="hud-bar-bg"><div id="hud-armor" class="hud-bar armor" style="width: 100%;"></div></div>
            </div>
            <div class="ammo-box">
                <i class="fa-solid fa-gun"></i> <span id="hud-ammo">100</span>
            </div>
        </div>

        <div id="countdown-display" style="display: none;">10</div>
    </div>

    <!-- Map Voting -->
    <div id="map-voting" class="overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="loc-vote-map">VOTE FOR NEXT MAP</h2>
            <div class="map-voting-grid" id="map-voting-container"></div>
            <p id="voting-timer">10s</p>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="loc-game-ended">MATCH ENDED</h1>
            <h2 id="winner-name">PLAYER WINS!</h2>
            <div id="match-stats-table"></div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
