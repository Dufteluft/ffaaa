<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <!-- Hauptmenü -->
        <div id="main-menu" class="main-container">
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="lobby" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab: FFA & Tab: LOBBY (Browser) -->
                <main id="tab-browser" class="lobby-browser">
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Lobbys werden hier injiziert -->
                    </div>
                </main>

                <!-- Tab: CREATE -->
                <main id="tab-create" class="create-panel" style="display: none;">
                    <div class="create-form">
                        <div class="form-grid">
                            <div class="input-group">
                                <label data-locale="lobby_name">Lobby Name</label>
                                <input type="text" id="create-name" placeholder="...">
                            </div>
                            <div class="input-group">
                                <label data-locale="map_select">Map auswählen</label>
                                <select id="create-map"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">Spielmodus</label>
                                <select id="create-mode">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">Team Deathmatch</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label data-locale="loadout_select">Waffen-Loadout</label>
                                <div id="loadout-checkboxes" class="checkbox-grid">
                                    <!-- Waffen-Checkboxen -->
                                </div>
                            </div>
                            <div class="input-group">
                                <label><span data-locale="round_time">Rundenzeit (Min)</span>: <span id="val-time">15</span></label>
                                <input type="range" id="create-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">Max. Spieler</span>: <span id="val-players">16</span></label>
                                <input type="range" id="create-players" min="2" max="16" step="1" value="16">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="respawn_time">Respawn-Zeit (Sek)</span>: <span id="val-respawn">5</span></label>
                                <input type="range" id="create-respawn" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">Kill-Limit</span>: <span id="val-kills">30</span></label>
                                <input type="range" id="create-kills" min="0" max="50" step="5" value="30">
                            </div>
                            <div class="toggle-group">
                                <label>
                                    <input type="checkbox" id="create-vehicles">
                                    <span data-locale="vehicles_allowed">Fahrzeuge erlaubt</span>
                                </label>
                                <label>
                                    <input type="checkbox" id="create-ff">
                                    <span data-locale="friendly_fire">Freundliches Feuer</span>
                                </label>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="confirm-btn" id="btn-create-submit" data-locale="btn_create">Lobby erstellen</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Lobby Wartebereich -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-header">
                    <h2 id="lobby-display-name">LOBBY NAME</h2>
                    <div class="lobby-status-badge" id="lobby-display-map">MAP: LEGION</div>
                </header>
                <div class="lobby-main">
                    <div class="player-list-container">
                        <h3 data-locale="tab_list">Spieler</h3>
                        <div id="player-list" class="player-list"></div>
                    </div>
                    <div class="lobby-side">
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" data-locale="team_blue">Blau</button>
                            <button class="team-btn" data-team="red" data-locale="team_red">Rot</button>
                            <button class="team-btn" data-team="random" data-locale="random">Zufall</button>
                            <button class="team-btn" data-team="spectator" data-locale="spectator">Zuschauer</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages" class="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="...">
                        </div>
                        <div class="lobby-controls">
                            <button class="ready-btn" id="btn-ready" data-locale="btn_ready">Bereit</button>
                            <button class="start-btn" id="btn-start" style="display: none;" data-locale="btn_start">Starten</button>
                            <button class="edit-btn" id="btn-edit-settings" style="display: none;"><i class="fa-solid fa-gear"></i></button>
                            <button class="leave-btn" id="btn-leave" data-locale="btn_leave">Verlassen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- HUD -->
        <div id="hud" class="hud-container" style="display: none;">
            <div class="hud-top">
                <div class="hud-timer" id="hud-timer">00:00</div>
                <div class="hud-scores" id="hud-scores" style="display: none;">
                    <span class="score-blue">0</span>
                    <span class="score-divider">:</span>
                    <span class="score-red">0</span>
                </div>
            </div>
            <div class="hud-bottom">
                <div class="hud-stats">
                    <div class="stat-item">
                        <span class="label" data-locale="kills">Kills</span>
                        <span class="value" id="hud-kills">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="label" data-locale="deaths">Tode</span>
                        <span class="value" id="hud-deaths">0</span>
                    </div>
                </div>
                <div class="hud-bars">
                    <div class="bar-container health">
                        <div class="bar-fill" id="hud-health-fill" style="width: 100%;"></div>
                    </div>
                    <div class="bar-container armor">
                        <div class="bar-fill" id="hud-armor-fill" style="width: 0%;"></div>
                    </div>
                </div>
                <div class="hud-ammo" id="hud-ammo">100</div>
            </div>
            <div class="hud-countdown" id="hud-countdown" style="display: none;">10</div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 data-locale="game_ended">RUNDE BEENDET</h1>
                <h2 id="winner-display-name">SPIELER GEWINNT!</h2>

                <div class="scoreboard-container">
                    <table class="scoreboard">
                        <thead>
                            <tr>
                                <th data-locale="col_name">NAME</th>
                                <th data-locale="col_kills">KILLS</th>
                                <th data-locale="col_deaths">TODE</th>
                                <th data-locale="col_kd">K/D</th>
                            </tr>
                        </thead>
                        <tbody id="winner-stats"></tbody>
                    </table>
                </div>

                <div class="winner-actions">
                    <button class="confirm-btn" id="btn-winner-lobby" data-locale="btn_back_lobby">Zurück zur Lobby</button>
                    <button class="cancel-btn" id="btn-winner-menu" data-locale="btn_back_menu">Hauptmenü</button>
                </div>
            </div>
        </div>

        <!-- Scoreboard (Toggleable during game) -->
        <div id="scoreboard" class="overlay" style="display: none; background: rgba(0,0,0,0.5);">
             <!-- Gleiche Struktur wie im Winner Screen -->
             <div class="winner-card" style="min-width: 600px;">
                <h2 data-locale="score">SCOREBOARD</h2>
                <div class="scoreboard-container">
                    <table class="scoreboard">
                        <thead>
                            <tr>
                                <th data-locale="col_name">NAME</th>
                                <th data-locale="col_kills">KILLS</th>
                                <th data-locale="col_deaths">TODE</th>
                                <th data-locale="col_kd">K/D</th>
                            </tr>
                        </thead>
                        <tbody id="scoreboard-stats"></tbody>
                    </table>
                </div>
             </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
