<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper" id="tab-content-ffa">
                <!-- Left Panel: Filters -->
                <aside class="sidebar">
                    <div class="filter-group">
                        <label data-locale="map_select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label data-locale="max_players">PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>
                </aside>

                <!-- Main Content: Lobby List -->
                <main class="lobby-browser">
                    <div class="lobby-list" id="lobby-list-container-ffa">
                        <!-- Entries will be injected here -->
                    </div>
                </main>
            </div>

            <div class="content-wrapper" id="tab-content-create" style="display: none;">
                <div class="create-lobby-form">
                    <h2 data-locale="tab_create">LOBBY ERSTELLEN</h2>
                    <div class="form-grid">
                        <div class="input-group">
                            <label data-locale="lobby_name">LOBBY NAME</label>
                            <input type="text" id="create-lobby-name" placeholder="ENTER NAME...">
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label data-locale="map_select">MAP</label>
                                <select id="create-map-select"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">MODE</label>
                                <select id="create-mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">TEAM DEATHMATCH</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-group">
                            <label data-locale="loadout_select">LOADOUT</label>
                            <div class="loadout-grid" id="loadout-checkboxes">
                                <!-- Checkboxes will be injected here -->
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span data-locale="round_time">TIME (MIN)</span>: <span id="create-round-time-val">15</span></label>
                                <input type="range" id="create-round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">MAX PLAYERS</span>: <span id="create-max-players-val">16</span></label>
                                <input type="range" id="create-max-players" min="2" max="16" step="1" value="16">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label data-locale="vehicles_allowed">VEHICLES</label>
                                <label class="switch">
                                    <input type="checkbox" id="create-vehicles">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="input-group">
                                <label data-locale="friendly_fire">FRIENDLY FIRE</label>
                                <label class="switch">
                                    <input type="checkbox" id="create-friendlyfire">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span data-locale="respawn_time">RESPAWN (SEK)</span>: <span id="create-respawn-val">5</span></label>
                                <input type="range" id="create-respawn" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">KILL LIMIT</span>: <span id="create-killlimit-val">30</span></label>
                                <input type="range" id="create-killlimit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button class="create-confirm-btn" id="btn-submit-create" data-locale="btn_create">CREATE LOBBY</button>
                    </div>
                </div>
            </div>

            <div class="content-wrapper" id="tab-content-list" style="display: none;">
                <aside class="sidebar">
                    <div class="filter-group">
                        <label data-locale="map_select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="list-filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                </aside>
                <main class="lobby-browser">
                    <div class="lobby-list" id="lobby-list-container-list">
                        <!-- Entries will be injected here -->
                    </div>
                </main>
            </div>
        </div>


        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3>PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>SETTINGS</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">RED</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">SPECTATOR</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">START</button>
                            <button class="leave-btn" id="btn-leave-lobby">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD (Will be hidden/shown based on script) -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-time-val">00:00</span>
            </div>
            <div class="hud-scores" id="hud-tdm-scores" style="display: none;">
                <div class="score-box blue-score">
                    <span class="score-label">BLUE</span>
                    <span id="hud-score-blue">0</span>
                </div>
                <div class="score-box red-score">
                    <span class="score-label">RED</span>
                    <span id="hud-score-red">0</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="hud-stats">
                <div class="stat-item">
                    <span class="stat-label" data-locale="kills">KILLS</span>
                    <span id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label" data-locale="deaths">TODE</span>
                    <span id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-weapon">
                <div class="ammo-container">
                    <i class="fa-solid fa-gun"></i>
                    <span id="hud-ammo">0</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom-left">
            <div class="bars-container">
                <div class="bar-wrapper">
                    <div class="bar-bg">
                        <div id="hud-health-bar" class="bar-fill health"></div>
                    </div>
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="bar-wrapper">
                    <div class="bar-bg">
                        <div id="hud-armor-bar" class="bar-fill armor"></div>
                    </div>
                    <i class="fa-solid fa-shield"></i>
                </div>
            </div>
        </div>

        <div id="countdown-display" style="display: none;">
            <div class="countdown-circle">
                <span id="countdown-number">10</span>
            </div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title">MATCH ENDED</h1>
            <h2 id="winner-name">PLAYER WINS!</h2>
            <div id="match-stats-table"></div>

            <div class="map-voting-section">
                <h3 data-locale="map_select">NEXT MAP VOTE</h3>
                <div class="map-voting-grid" id="winner-map-voting">
                    <!-- Map voting items will be injected here -->
                </div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
