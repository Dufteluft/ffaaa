<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESX FFA LOBBY SYSTEM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container" id="main-menu">
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1 & 3: Lobby Browser -->
                <main class="lobby-browser" id="tab-browser">
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Lobbies injected here -->
                    </div>
                </main>

                <!-- Tab 2: Create Lobby -->
                <main class="create-section" id="tab-create" style="display: none;">
                    <div class="create-form">
                        <div class="input-group">
                            <label data-locale="lobby_name">Lobby Name</label>
                            <input type="text" id="lobby-name-input" placeholder="...">
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label data-locale="map_select">Map auswählen</label>
                                <select id="map-select-input"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">Spielmodus</label>
                                <select id="mode-select-input">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">Team Deathmatch</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-group">
                            <label data-locale="loadout_select">Waffen-Loadout</label>
                            <select id="loadout-select-input" multiple size="5"></select>
                            <small style="color: var(--text-muted); margin-top: 5px;">(Strg halten für Mehrfachauswahl)</small>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span data-locale="round_time">Rundenzeit (Min)</span>: <span id="round-time-val">15</span></label>
                                <input type="range" id="round-time-input" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">Max. Spieler</span>: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players-input" min="2" max="16" step="1" value="16">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="toggle-group">
                                <label data-locale="vehicles_allowed">Fahrzeuge erlaubt</label>
                                <input type="checkbox" id="vehicles-input">
                            </div>
                            <div class="toggle-group">
                                <label data-locale="friendly_fire">Freundliches Feuer</label>
                                <input type="checkbox" id="ff-input">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span data-locale="respawn_time">Respawn-Zeit (Sek)</span>: <span id="respawn-time-val">5</span></label>
                                <input type="range" id="respawn-time-input" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">Kill-Limit</span>: <span id="kill-limit-val">30</span></label>
                                <input type="range" id="kill-limit-input" min="0" max="50" step="5" value="30">
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="create-btn" id="btn-submit-create" data-locale="btn_create">Lobby erstellen</button>
                            <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">Abbrechen</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-display-name">LOBBY NAME</h2>
                    <div class="lobby-status-tag" id="lobby-status-tag">WAITING</div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">Spielerliste</h3>
                        <div id="waiting-player-list"></div>
                    </div>
                    <div class="settings-section">
                        <div id="host-settings-editor" style="display: none;">
                            <!-- Host can edit settings here -->
                        </div>
                        <div id="player-settings-view">
                            <div class="setting-item"><strong>MAP:</strong> <span id="view-map">?</span></div>
                            <div class="setting-item"><strong>MODE:</strong> <span id="view-mode">?</span></div>
                            <div class="setting-item"><strong>LOADOUT:</strong> <span id="view-loadout">?</span></div>
                        </div>

                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" data-locale="team_red">RED</button>
                            <button class="team-btn" data-team="random" data-locale="random">RANDOM</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="Nachricht...">
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready" data-locale="btn_ready">Bereit</button>
                            <button class="start-btn" id="btn-start" style="display: none;" data-locale="btn_start">Start</button>
                            <button class="leave-btn" id="btn-leave" data-locale="btn_leave">Verlassen</button>
                            <button class="close-lobby-btn" id="btn-close-lobby" style="display: none;" data-locale="btn_close_lobby">Schließen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 id="winner-label" data-locale="winner">GEWINNER</h1>
                <h2 id="winner-name-display">SPIELER</h2>
                <div class="winner-stats" id="winner-stats-container"></div>

                <div class="map-voting" id="map-voting-section">
                    <h3>NEXT MAP VOTE</h3>
                    <div class="vote-options" id="vote-options-container"></div>
                </div>

                <div class="btn-group">
                    <button class="confirm-btn" id="btn-winner-lobby" data-locale="back_to_lobby">Zurück zur Lobby</button>
                    <button class="cancel-btn" id="btn-winner-menu" data-locale="back_to_menu">Hauptmenü</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Gameplay HUD -->
    <div id="hud" style="display: none;">
        <div class="hud-top">
            <div class="match-timer" id="hud-timer">00:00</div>
            <div class="tdm-score" id="hud-tdm-score" style="display: none;">
                <span class="score-blue">0</span>
                <span class="score-divider">:</span>
                <span class="score-red">0</span>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="stat-box">
                <i class="fa-solid fa-crosshairs"></i>
                <span id="hud-kills">0</span>
            </div>
            <div class="stat-box">
                <i class="fa-solid fa-skull"></i>
                <span id="hud-deaths">0</span>
            </div>
            <div class="weapon-info">
                <div class="ammo-count" id="hud-ammo">0</div>
            </div>
        </div>
        <div class="hud-bottom-left">
            <div class="health-bar-container">
                <div class="health-bar" id="hud-health"></div>
            </div>
            <div class="armor-bar-container">
                <div class="armor-bar" id="hud-armor"></div>
            </div>
        </div>
    </div>

    <!-- Big Countdown Overlay -->
    <div id="big-countdown" style="display: none;">
        <div class="countdown-number" id="countdown-num">10</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
