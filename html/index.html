<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <!-- MAIN MENU -->
        <div class="main-container" id="main-menu">
            <header class="main-header">
                <h1 class="header-title l-menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active l-tab_ffa" data-tab="ffa">FFA Lobby</button>
                    <button class="tab-btn l-tab_create" data-tab="create">Lobby erstellen</button>
                    <button class="tab-btn l-tab_list" data-tab="list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Sidebar (Shared for FFA and LIST tabs) -->
                <aside class="sidebar" id="main-sidebar">
                    <div class="filter-group">
                        <label class="l-map_select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="l-players">PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>
                    <div class="sidebar-footer">
                        <p class="l-waiting_for_players">Warte auf Spieler...</p>
                    </div>
                </aside>

                <!-- TAB CONTENT: LOBBY LISTS (FFA & LIST) -->
                <main class="lobby-browser" id="tab-list-content">
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Entries injected here -->
                    </div>
                </main>

                <!-- TAB CONTENT: CREATE LOBBY -->
                <main class="creation-area" id="tab-create-content" style="display: none;">
                    <div class="creation-form">
                        <div class="form-section">
                            <h2 class="l-tab_create">Lobby erstellen</h2>
                            <div class="input-group">
                                <label class="l-lobby_name">Lobby Name</label>
                                <input type="text" id="create-name" placeholder="...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label class="l-map_select">Map auswählen</label>
                                    <select id="create-map"></select>
                                </div>
                                <div class="input-group">
                                    <label class="l-mode_select">Spielmodus</label>
                                    <select id="create-mode">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">Team Deathmatch</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label class="l-loadout_select">Waffen-Loadout</label>
                                <div class="loadout-grid" id="create-loadout-grid">
                                    <!-- Checkboxes injected here -->
                                </div>
                            </div>
                        </div>

                        <div class="form-section">
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span class="l-round_time">Rundenzeit (Min)</span>: <span id="val-time">15</span></label>
                                    <input type="range" id="create-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span class="l-max_players">Max. Spieler</span>: <span id="val-players">16</span></label>
                                    <input type="range" id="create-players" min="2" max="16" step="1" value="16">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span class="l-respawn_time">Respawn-Zeit (Sek)</span>: <span id="val-respawn">5</span></label>
                                    <input type="range" id="create-respawn" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span class="l-kill_limit">Kill-Limit zum Sieg</span>: <span id="val-kills">0</span></label>
                                    <input type="range" id="create-kills" min="0" max="50" step="5" value="0">
                                </div>
                            </div>
                            <div class="toggle-row">
                                <div class="toggle-group">
                                    <span class="l-vehicles_allowed">Fahrzeuge erlaubt</span>
                                    <label class="switch">
                                        <input type="checkbox" id="create-vehicles">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="toggle-group">
                                    <span class="l-friendly_fire">Freundliches Feuer</span>
                                    <label class="switch">
                                        <input type="checkbox" id="create-ff">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="confirm-btn l-btn_create" id="btn-submit-create">Lobby erstellen</button>
                                <button class="cancel-btn l-btn_cancel" id="btn-cancel-create">Abbrechen</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- LOBBY WAITING AREA -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">DEFAULT</span></h2>
                    <div class="lobby-status-pill l-waiting_for_players">Warte auf Spieler...</div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 class="l-tab_list">Spieler</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <div class="lobby-info-box" id="lobby-info-summary"></div>

                        <div class="team-selection">
                            <button class="team-btn l-team_blue" data-team="blue" id="btn-team-blue">Team Blau</button>
                            <button class="team-btn l-team_red" data-team="red" id="btn-team-red">Team Rot</button>
                            <button class="team-btn l-random" data-team="random" id="btn-team-random">Zufall</button>
                            <button class="team-btn l-spectator" data-team="spectator" id="btn-team-spec">Zuschauer</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input" placeholder="...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn l-btn_ready" id="btn-ready-toggle">Bereit</button>
                            <button class="start-btn l-btn_start" id="btn-start-game" style="display: none;">Spiel starten</button>
                            <button class="leave-btn l-btn_leave" id="btn-leave-lobby">Lobby verlassen</button>
                            <button class="close-btn" id="btn-close-lobby" style="display: none; background: var(--danger); color: white;">Lobby schließen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- WINNER SCREEN -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 class="l-game_ended">Runde beendet!</h1>
                <h2 id="winner-name-display"><span id="winner-name">PLAYER</span> <span class="l-winner_suffix">GEWINNT!</span></h2>

                <div class="stats-container">
                    <table class="stats-table">
                        <thead>
                            <tr>
                                <th class="l-lobby_name">Name</th>
                                <th class="l-kills">Kills</th>
                                <th class="l-deaths">Tode</th>
                                <th class="l-kd_ratio">K/D</th>
                            </tr>
                        </thead>
                        <tbody id="match-stats-tbody"></tbody>
                    </table>
                </div>

                <div class="map-voting">
                    <h3 class="l-map_select">Nächste Map wählen</h3>
                    <div class="voting-grid" id="voting-grid"></div>
                </div>

                <div class="winner-actions">
                    <button class="confirm-btn l-btn_ready" id="btn-back-to-lobby">Zurück zur Lobby</button>
                    <button class="cancel-btn l-tab_ffa" id="btn-back-to-menu">Hauptmenü</button>
                </div>
            </div>
        </div>

        <!-- IN-GAME HUD -->
        <div id="game-hud" style="display: none;">
            <div class="hud-top">
                <div class="hud-timer">
                    <i class="fa-solid fa-clock"></i>
                    <span id="hud-timer-val">15:00</span>
                </div>
                <div class="hud-scores" id="hud-tdm-scores" style="display: none;">
                    <div class="score-team blue">
                        <span class="l-team_blue">BLAU</span>
                        <span id="hud-score-blue">0</span>
                    </div>
                    <div class="score-divider">:</div>
                    <div class="score-team red">
                        <span id="hud-score-red">0</span>
                        <span class="l-team_red">ROT</span>
                    </div>
                </div>
            </div>

            <div class="hud-bottom-right">
                <div class="hud-stat-box">
                    <div class="stat-label l-kills">KILLS</div>
                    <div class="stat-value" id="hud-kills">0</div>
                </div>
                <div class="hud-stat-box">
                    <div class="stat-label l-deaths">TODE</div>
                    <div class="stat-value" id="hud-deaths">0</div>
                </div>
                <div class="hud-weapon">
                    <div class="ammo-val" id="hud-ammo">100</div>
                    <div class="weapon-icon"><i class="fa-solid fa-gun"></i></div>
                </div>
            </div>

            <div class="hud-bottom-left">
                <div class="hud-bars">
                    <div class="bar-container health">
                        <div class="bar-fill" id="hud-health-fill" style="width: 100%;"></div>
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div class="bar-container armor">
                        <div class="bar-fill" id="hud-armor-fill" style="width: 0%;"></div>
                        <i class="fa-solid fa-shield"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
