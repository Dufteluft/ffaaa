<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFA LOBBY SYSTEM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1 & 3: Lobby Browser (Shared container, content changes) -->
                <main class="lobby-browser" id="tab-browser">
                    <div class="filter-bar" id="filter-bar" style="display: none;">
                        <div class="filter-item">
                            <input type="checkbox" id="filter-free-slots">
                            <label for="filter-free-slots" data-locale="free_slots_only">Nur Lobbys mit freien Plätzen</label>
                        </div>
                    </div>
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Entries injected by JS -->
                    </div>
                </main>

                <!-- Tab 2: Create Lobby Form -->
                <main class="create-lobby-form" id="tab-create" style="display: none;">
                    <div class="form-container">
                        <div class="input-group">
                            <label data-locale="lobby_name">Lobby Name</label>
                            <input type="text" id="lobby-name" placeholder="Enter Name...">
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label data-locale="map_select">Map auswählen</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">Spielmodus</label>
                                <select id="mode-select">
                                    <option value="ffa" data-locale="ffa_mode">FFA (Alle gegen Alle)</option>
                                    <option value="tdm" data-locale="tdm_mode">Team Deathmatch</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-group">
                            <label data-locale="loadout_select">Waffen-Loadout</label>
                            <select id="loadout-select" multiple size="5">
                                <!-- Loaded via JS -->
                            </select>
                            <small style="color: var(--text-muted); margin-top: 5px;">STRG + Klick für Mehrfachauswahl</small>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span data-locale="round_time">Rundenzeit (Min)</span>: <span id="round-time-val">15</span></label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">Max. Spieler</span>: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                            </div>
                        </div>
                        <div class="toggle-row">
                            <div class="toggle-group">
                                <label data-locale="vehicles_allowed">Fahrzeuge erlaubt</label>
                                <input type="checkbox" id="vehicles-allowed" class="ios-toggle">
                            </div>
                            <div class="toggle-group">
                                <label data-locale="friendly_fire">Freundliches Feuer</label>
                                <input type="checkbox" id="friendly-fire" class="ios-toggle">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span data-locale="respawn_time">Respawn-Zeit (Sek)</span>: <span id="respawn-time-val">5</span></label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">Kill-Limit zum Sieg</span>: <span id="kill-limit-val">30</span></label>
                                <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="confirm-btn create-btn" id="btn-create-lobby" data-locale="btn_create">Lobby erstellen</button>
                            <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">Abbrechen</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Lobby Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-display-name">LOBBY</h2>
                    <div class="lobby-id-badge">ID: <span id="lobby-display-id">0000</span></div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">Spielerliste</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <div class="lobby-details-panel">
                            <div class="detail-item">
                                <span class="label" data-locale="map">Map</span>
                                <span class="value" id="wait-map-label">-</span>
                            </div>
                            <div class="detail-item">
                                <span class="label" data-locale="mode">Modus</span>
                                <span class="value" id="wait-mode-label">-</span>
                            </div>
                        </div>

                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" data-locale="team_blue">Team Blau</button>
                            <button class="team-btn" data-team="red" data-locale="team_red">Team Rot</button>
                            <button class="team-btn" data-team="spectator" data-locale="spectator">Zuschauer</button>
                            <button class="team-btn active" data-team="random" data-locale="random">Zufall</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="Nachricht senden...">
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">Bereit</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">Spiel starten</button>
                            <button class="start-btn" id="btn-save-settings" style="display: none;" data-locale="btn_save">Speichern</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">Verlassen</button>
                            <button class="leave-btn" id="btn-close-lobby" style="display: none;" data-locale="btn_close_lobby">Lobby schließen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 id="winner-title" data-locale="game_ended">RUNDE BEENDET!</h1>
                <h2 id="winner-display-name">SPIELER <span data-locale="wins_suffix">GEWINNT!</span></h2>

                <div class="match-stats-container">
                    <table class="stats-table">
                        <thead>
                            <tr>
                                <th data-locale="host">Spieler</th>
                                <th data-locale="kills">Kills</th>
                                <th data-locale="deaths">Tode</th>
                                <th data-locale="kd_ratio">K/D</th>
                            </tr>
                        </thead>
                        <tbody id="match-stats-body"></tbody>
                    </table>
                </div>

                <div class="map-voting-section">
                    <h3 data-locale="map_select">Nächste Map wählen</h3>
                    <div class="voting-grid" id="map-voting-grid"></div>
                </div>

                <div class="btn-group">
                    <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_back_lobby">Zurück zur Lobby</button>
                    <button class="cancel-btn" id="btn-back-to-menu" data-locale="btn_main_menu">Hauptmenü</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD Overlay -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-center">
            <div id="hud-timer">00:00</div>
        </div>

        <div class="hud-top-right">
            <div class="tdm-scores" id="hud-tdm-scores" style="display: none;">
                <div class="score-team blue">
                    <span class="team-label" data-locale="team_blue">BLAU</span>
                    <span class="team-value" id="hud-score-blue">0</span>
                </div>
                <div class="score-divider">VS</div>
                <div class="score-team red">
                    <span class="team-label" data-locale="team_red">ROT</span>
                    <span class="team-value" id="hud-score-red">0</span>
                </div>
            </div>
            <div class="hud-stats">
                <div class="stat-item">
                    <i class="fa-solid fa-crosshairs"></i>
                    <span id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <i class="fa-solid fa-skull"></i>
                    <span id="hud-deaths">0</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="hud-bars">
                <div class="bar-container health">
                    <div class="bar-fill" id="hud-health-fill" style="width: 100%;"></div>
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="bar-container armor">
                    <div class="bar-fill" id="hud-armor-fill" style="width: 0%;"></div>
                    <i class="fa-solid fa-shield"></i>
                </div>
            </div>
            <div class="hud-weapon">
                <span id="hud-ammo">0</span>
                <i class="fa-solid fa-gun"></i>
            </div>
        </div>

        <div id="big-countdown" style="display: none;">10</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
