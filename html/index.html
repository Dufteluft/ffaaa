<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome für Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" id="locale-menu-title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="locale-tab-ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="locale-tab-create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="locale-tab-list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Sidebar: Filter (Nur für Tab 1 und 3 sichtbar) -->
                <aside class="sidebar" id="sidebar-filters">
                    <div class="filter-group">
                        <label><span id="locale-map-select-filter">MAPS</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALLE MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label><span id="locale-loadout-select-filter">WAFFEN</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALLE WAFFEN</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label><span id="locale-players-filter">SPIELER</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ALLE</option>
                            <option value="not-full">NICHT VOLL</option>
                        </select>
                    </div>
                </aside>

                <!-- Hauptinhalt: Dynamisch je nach Tab -->
                <main class="main-content">
                    <!-- Tab: FFA & Offene Lobbys (Lobby-Liste) -->
                    <div id="tab-content-list" class="tab-pane active">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Einträge werden hier injiziert -->
                        </div>
                    </div>

                    <!-- Tab: Lobby erstellen -->
                    <div id="tab-content-create" class="tab-pane">
                        <div class="create-lobby-form">
                            <h2 id="locale-create-title">NEUE LOBBY ERSTELLEN</h2>
                            <div class="form-grid">
                                <div class="input-group full-width">
                                    <label id="locale-lobby-name">LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="Name eingeben...">
                                </div>
                                <div class="input-group">
                                    <label id="locale-map-select">MAP</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label id="locale-mode-select">MODUS</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA (Alle gegen Alle)</option>
                                        <option value="tdm">Team Deathmatch</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <label id="locale-loadout-select">LOADOUT</label>
                                    <select id="loadout-select"></select>
                                </div>
                                <div class="input-group">
                                    <label><span id="locale-round-time">RUNDENZEIT</span>: <span id="round-time-val">15</span> Min</label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span id="locale-max-players">MAX. SPIELER</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="32" step="1" value="16">
                                </div>
                                <div class="input-group">
                                    <label><span id="locale-respawn-time">RESPAWN-ZEIT</span>: <span id="respawn-time-val">5</span> Sek</label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span id="locale-kill-limit">KILL-LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="100" step="10" value="30">
                                </div>
                                <div class="toggle-group">
                                    <div class="toggle-item">
                                        <label id="locale-vehicles-allowed">FAHRZEUGE ERLAUBT</label>
                                        <input type="checkbox" id="vehicles-allowed" class="toggle-switch">
                                    </div>
                                    <div class="toggle-item">
                                        <label id="locale-friendly-fire">FRIENDLY FIRE</label>
                                        <input type="checkbox" id="friendly-fire" class="toggle-switch">
                                    </div>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="confirm-btn" id="btn-create-lobby">ERSTELLEN</button>
                                <button class="cancel-btn" id="btn-reset-form">ZURÜCKSETZEN</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Wartebereich / Lobby-Bildschirm -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title-display">Default</span></h2>
                    <div class="lobby-status-indicator" id="lobby-status-text">WARTE AUF SPIELER...</div>
                </header>
                <div class="lobby-grid">
                    <!-- Linke Spalte: Spielerliste -->
                    <div class="player-list-section">
                        <h3 id="locale-players-list-title">SPIELER</h3>
                        <div id="player-list">
                            <!-- Spieler werden hier injiziert -->
                        </div>
                    </div>
                    <!-- Rechte Spalte: Einstellungen & Chat -->
                    <div class="settings-section">
                        <div class="lobby-info-box">
                            <h3 id="locale-settings-title">EINSTELLUNGEN</h3>
                            <div id="lobby-info-summary" class="info-grid">
                                <!-- Kurzinfo zur Lobby -->
                            </div>
                            <!-- Host-spezifische Einstellungen (Nur für Host sichtbar) -->
                            <div id="host-edit-settings" style="display: none;">
                                <button class="edit-btn" id="btn-edit-lobby"><i class="fa-solid fa-gear"></i> EINSTELLUNGEN ÄNDERN</button>
                            </div>
                        </div>

                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">BLAU</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">ROT</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">ZUSCHAUER</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="NACHRICHT SENDEN...">
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">SPIEL STARTEN</button>
                            <button class="leave-btn" id="btn-leave-lobby">VERLASSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sieger-Bildschirm -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <div class="winner-glow"></div>
                <h1 id="locale-match-ended">RUNDE BEENDET</h1>
                <h2 id="winner-name-display">SPIELER WINS!</h2>

                <div class="stats-container">
                    <table class="stats-table">
                        <thead>
                            <tr>
                                <th id="locale-th-name">NAME</th>
                                <th id="locale-th-kills">KILLS</th>
                                <th id="locale-th-deaths">TODE</th>
                                <th id="locale-th-kd">K/D</th>
                            </tr>
                        </thead>
                        <tbody id="match-stats-body"></tbody>
                    </table>
                </div>

                <div class="winner-actions">
                    <button class="confirm-btn" id="btn-back-to-lobby">ZURÜCK ZUR LOBBY</button>
                    <button class="cancel-btn" id="btn-back-to-menu">HAUPTMENÜ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD (Sichtbar während des Spiels) -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-time-left">15:00</span>
            </div>
            <div class="hud-scores" id="hud-tdm-scores" style="display: none;">
                <div class="score-item blue">
                    <span class="score-label">BLAU</span>
                    <span class="score-value" id="hud-score-blue">0</span>
                </div>
                <div class="score-divider">VS</div>
                <div class="score-item red">
                    <span class="score-label">ROT</span>
                    <span class="score-value" id="hud-score-red">0</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="hud-stats">
                <div class="stat-row">
                    <span id="locale-hud-kills">KILLS</span>
                    <span class="stat-val" id="hud-kills">0</span>
                </div>
                <div class="stat-row">
                    <span id="locale-hud-deaths">TODE</span>
                    <span class="stat-val" id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-weapon">
                <div class="ammo-container">
                    <i class="fa-solid fa-gun"></i>
                    <span id="hud-ammo">100</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom-left">
            <div class="bars-container">
                <div class="bar-wrapper">
                    <div class="bar-icon"><i class="fa-solid fa-heart"></i></div>
                    <div class="bar-bg"><div class="bar-fill health" id="hud-health-bar" style="width: 100%;"></div></div>
                </div>
                <div class="bar-wrapper">
                    <div class="bar-icon"><i class="fa-solid fa-shield-halved"></i></div>
                    <div class="bar-bg"><div class="bar-fill armor" id="hud-armor-bar" style="width: 0%;"></div></div>
                </div>
            </div>
        </div>

        <!-- Kill Feed (Optional, aber gut für Atmosphäre) -->
        <div id="kill-feed"></div>

        <!-- Countdown-Anzeige -->
        <div id="countdown-overlay" style="display: none;">
            <div class="countdown-number" id="countdown-text">3</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
