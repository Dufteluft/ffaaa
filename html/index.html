<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="lobby" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab: FFA & Tab: LOBBY -->
                <div id="tab-content-browser" class="tab-content active" style="width: 100%; display: flex;">
                    <!-- Left Panel: Filters -->
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label data-locale="map_select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label data-locale="loadout_select">WEAPONS <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-weapons">
                                <option value="all">ALL WEAPONS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label data-locale="max_players">PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all">ANY</option>
                                <option value="not-full">NOT FULL</option>
                            </select>
                        </div>
                    </aside>

                    <!-- Main Content: Lobby List -->
                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </main>
                </div>

                <!-- Tab: CREATE -->
                <div id="tab-content-create" class="tab-content" style="width: 100%; display: none; padding: 40px; justify-content: center;">
                    <div class="create-form-container" style="width: 800px; background: rgba(0,0,0,0.3); padding: 40px; border-radius: 8px; border: 1px solid var(--border);">
                        <h2 data-locale="tab_create" style="margin-bottom: 30px; font-family: 'Impact'; letter-spacing: 2px;">LOBBY ERSTELLEN</h2>
                        <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                            <div class="input-group">
                                <label data-locale="lobby_name">LOBBY NAME</label>
                                <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                            </div>
                            <div class="input-group">
                                <label data-locale="map_select">MAP</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">SPIELMODUS</label>
                                <select id="mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">TEAM DEATHMATCH</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label data-locale="loadout_select">WAFFEN-LOADOUT</label>
                                <div id="loadout-multi-select" class="multi-select-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: var(--surface); padding: 10px; border-radius: 4px; border: 1px solid var(--border);">
                                    <!-- Checkboxes will be injected here -->
                                </div>
                            </div>
                            <div class="input-group">
                                <label><span data-locale="round_time">RUNDENZEIT</span>: <span id="round-time-val">15</span> Min</label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">MAX. SPIELER</span>: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                            </div>
                            <div class="input-group">
                                <label data-locale="vehicles_allowed">FAHRZEUGE ERLAUBT</label>
                                <div class="toggle-switch">
                                    <input type="checkbox" id="vehicles-allowed">
                                    <span class="slider"></span>
                                </div>
                            </div>
                            <div class="input-group">
                                <label data-locale="friendly_fire">FREUNDLICHES FEUER</label>
                                <div class="toggle-switch">
                                    <input type="checkbox" id="friendly-fire">
                                    <span class="slider"></span>
                                </div>
                            </div>
                            <div class="input-group">
                                <label><span data-locale="respawn_time">RESPAWN-ZEIT</span>: <span id="respawn-time-val">5</span> Sek</label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">KILL-LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>
                        <div class="btn-group" style="margin-top: 40px;">
                            <button class="confirm-btn" id="btn-create-lobby" data-locale="btn_create">LOBBY ERSTELLEN</button>
                            <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">ABBRECHEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3>PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <h3 style="margin: 0;">SETTINGS</h3>
                            <button id="btn-edit-settings" class="action-btn" style="width: auto; padding: 5px 15px; font-size: 12px; display: none;">EDIT SETTINGS</button>
                        </div>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">RED</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">SPECTATOR</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">START</button>
                            <button class="leave-btn" id="btn-close-lobby" style="display: none;">CLOSE LOBBY</button>
                            <button class="leave-btn" id="btn-leave-lobby">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD (Will be hidden/shown based on script) -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-center">
            <div class="match-timer">
                <i class="fa-solid fa-clock"></i> <span id="hud-timer">15:00</span>
            </div>
            <div id="hud-team-score" class="team-score-container" style="display: none;">
                <div class="score-box blue">
                    <span class="score-label" data-locale="team_blue">BLUE</span>
                    <span id="score-blue" class="score-val">0</span>
                </div>
                <div class="score-divider">VS</div>
                <div class="score-box red">
                    <span id="score-red" class="score-val">0</span>
                    <span class="score-label" data-locale="team_red">RED</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="weapon-info">
                <div class="ammo-container">
                    <i class="fa-solid fa-gun"></i> <span id="hud-ammo">100</span>
                </div>
            </div>
            <div class="status-bars">
                <div class="bar-wrapper">
                    <div class="bar-bg health"><div id="bar-health" class="bar-fill" style="width: 100%;"></div></div>
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="bar-wrapper">
                    <div class="bar-bg armor"><div id="bar-armor" class="bar-fill" style="width: 0%;"></div></div>
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
            </div>
        </div>

        <div class="hud-bottom-left">
            <div class="stats-box">
                <div class="stat-item">
                    <span class="label" data-locale="kills">KILLS</span>
                    <span id="hud-kills" class="val">0</span>
                </div>
                <div class="stat-item">
                    <span class="label" data-locale="deaths">DEATHS</span>
                    <span id="hud-deaths" class="val">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title">MATCH ENDED</h1>
            <h2 id="winner-name">PLAYER WINS!</h2>
            <div id="match-stats-table"></div>

            <div id="map-voting-section" style="margin-top: 30px; border-top: 1px solid var(--border); padding-top: 20px;">
                <h3 style="margin-bottom: 15px;">VOTE NEXT MAP</h3>
                <div id="map-voting-list" style="display: flex; gap: 10px; justify-content: center;">
                    <!-- Maps for voting injected here -->
                </div>
            </div>

            <div class="btn-group" style="margin-top: 40px;">
                <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_back_lobby">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu" data-locale="btn_back_menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
