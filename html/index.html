<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFA LOBBY SYSTEM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container" id="main-container">
            <header class="main-header">
                <h1 class="header-title" id="l-menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="l-tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="l-tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="l-tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Sidebar for FFA and List Tabs -->
                <aside class="sidebar" id="sidebar-filters">
                    <div class="filter-group">
                        <label id="l-map_select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="l-loadout_select">WEAPONS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="l-max_players">PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>
                </aside>

                <!-- Main Content Area -->
                <main class="lobby-browser">
                    <!-- Lobby List View (for Tab 1 and 3) -->
                    <div id="lobby-list-view">
                        <div class="lobby-list" id="lobby-list-container"></div>
                    </div>

                    <!-- Create Lobby View (for Tab 2) -->
                    <div id="create-lobby-view" style="display: none;">
                        <div class="create-form">
                            <div class="form-grid">
                                <div class="input-group">
                                    <label id="l-lobby_name">LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="...">
                                </div>
                                <div class="input-group">
                                    <label id="l-map_select_2">MAP</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label id="l-mode_select">MODE</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                                <div class="input-group full-width">
                                    <label id="l-loadout_select_2">LOADOUT</label>
                                    <div class="loadout-grid" id="loadout-checkbox-grid">
                                        <!-- Checkboxes will be injected here -->
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label id="l-round_time">TIME (MIN): <span id="round-time-val">15</span></label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label id="l-max_players_2">MAX PLAYERS: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                                <div class="input-group">
                                    <label id="l-respawn_time">RESPAWN (SEK): <span id="respawn-time-val">5</span></label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label id="l-kill_limit">KILL LIMIT: <span id="kill-limit-val">0</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="0">
                                </div>
                                <div class="toggle-group">
                                    <label id="l-vehicles_allowed">VEHICLES</label>
                                    <label class="switch">
                                        <input type="checkbox" id="vehicles-toggle">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="toggle-group">
                                    <label id="l-friendly_fire">FRIENDLY FIRE</label>
                                    <label class="switch">
                                        <input type="checkbox" id="friendly-fire-toggle">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="confirm-btn" id="btn-create-lobby">LOBBY ERSTELLEN</button>
                                <button class="cancel-btn" id="btn-cancel-create">ABBRECHEN</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-title">LOBBY NAME</h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="l-players_title">SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <div class="settings-summary" id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">RED</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">SPECTATOR</button>
                            <button class="team-btn" data-team="random" id="btn-team-random">RANDOM</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input" placeholder="Nachricht...">
                                <button id="send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">START</button>
                            <button class="leave-btn" id="btn-leave-lobby">VERLASSEN</button>
                            <button class="close-lobby-btn" id="btn-close-lobby" style="display: none;">LOBBY SCHLIEßEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 id="l-game_ended">RUNDE BEENDET</h1>
                <h2 id="winner-name">SPIELER GEWINNT!</h2>
                <div id="match-stats-table"></div>

                <h3 id="l-vote_map_title" style="margin-top: 20px;">MAP VOTING</h3>
                <div class="map-vote-grid" id="map-vote-grid"></div>

                <div class="btn-group">
                    <button class="confirm-btn" id="btn-back-to-lobby">LOBBY</button>
                    <button class="cancel-btn" id="btn-back-to-menu">MENÜ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-right">
            <div class="hud-timer">
                <i class="fa-solid fa-clock"></i> <span id="hud-timer-val">15:00</span>
            </div>
            <div class="hud-scores" id="hud-team-scores" style="display: none;">
                <span class="score-blue">BLUE: <span id="score-blue-val">0</span></span>
                <span class="score-red">RED: <span id="score-red-val">0</span></span>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-stats">
                <div class="stat-item"><span id="l-kills_hud">KILLS</span>: <span id="hud-kills-val">0</span></div>
                <div class="stat-item"><span id="l-deaths_hud">DEATHS</span>: <span id="hud-deaths-val">0</span></div>
            </div>
            <div class="hud-weapon">
                <div class="ammo-count"><i class="fa-solid fa-gun"></i> <span id="hud-ammo-val">30</span></div>
            </div>
        </div>
        <div class="hud-bottom-left">
            <div class="bars-container">
                <div class="bar-wrapper">
                    <div class="bar-label"><i class="fa-solid fa-heart"></i></div>
                    <div class="bar-bg"><div id="hud-health-bar" class="bar-fill health"></div></div>
                    <div class="bar-percent"><span id="hud-health-val">100</span>%</div>
                </div>
                <div class="bar-wrapper">
                    <div class="bar-label"><i class="fa-solid fa-shield-halved"></i></div>
                    <div class="bar-bg"><div id="hud-armor-bar" class="bar-fill armor"></div></div>
                </div>
            </div>
        </div>
        <div id="hud-countdown" class="hud-countdown" style="display: none;">10</div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
