<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESX FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Main Application Container -->
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1 & 3 share the Sidebar + Browser layout -->
                <div id="browser-view" class="tab-view active">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label><span data-locale="map_select">MAPS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all" data-locale="all_maps">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span data-locale="loadout_select">WEAPONS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-weapons">
                                <option value="all" data-locale="all_weapons">ALL WEAPONS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span data-locale="players_filter">PLAYERS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all" data-locale="any_players">ANY</option>
                                <option value="not-full" data-locale="not_full">NOT FULL</option>
                            </select>
                        </div>
                    </aside>

                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entry placeholder -->
                        </div>
                    </main>
                </div>

                <!-- Tab 2: Create Lobby Content -->
                <div id="create-view" class="tab-view">
                    <div class="create-container">
                        <h2 data-locale="tab_create">Lobby erstellen</h2>
                        <div class="form-grid">
                            <div class="input-group">
                                <label data-locale="lobby_name">Lobby Name</label>
                                <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label data-locale="map_select">Map auswählen</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="mode_select">Spielmodus</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label data-locale="loadout_select">Waffen-Loadout</label>
                                <select id="loadout-select" class="multi-select" multiple></select>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span data-locale="round_time">Rundenzeit (Min)</span>: <span id="round-time-val">15</span></label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="max_players">Max. Spieler</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group checkbox-group">
                                    <label data-locale="vehicles_allowed">Fahrzeuge erlaubt</label>
                                    <input type="checkbox" id="vehicles-allowed">
                                </div>
                                <div class="input-group checkbox-group">
                                    <label data-locale="friendly_fire">Freundliches Feuer</label>
                                    <input type="checkbox" id="friendly-fire">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span data-locale="respawn_time">Respawn-Zeit (Sek)</span>: <span id="respawn-time-val">5</span></label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="kill_limit">Kill-Limit zum Sieg</span>: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="confirm-btn" id="btn-create-lobby" data-locale="btn_create">Lobby erstellen</button>
                                <button class="cancel-btn" id="btn-reset-form" data-locale="btn_cancel">Abbrechen</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2><span data-locale="lobby_prefix">LOBBY:</span> <span id="lobby-title">Default</span></h2>
                    <div class="host-controls" id="host-settings-btn" style="display: none;">
                         <i class="fa-solid fa-gear"></i>
                    </div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="players_header">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 data-locale="settings_header">SETTINGS</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red" data-locale="team_red">RED</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec" data-locale="spectator">SPECTATOR</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">LEAVE</button>
                            <button class="close-lobby-btn" id="btn-close-lobby" style="display: none;" data-locale="btn_close_lobby">CLOSE LOBBY</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Gameplay HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-container">
            <div class="hud-top-center">
                <div class="hud-timer" id="hud-timer">15:00</div>
            </div>
            <div class="hud-bottom-right">
                <div class="hud-stat-box">
                    <div class="hud-label" data-locale="kills">KILLS</div>
                    <div class="hud-value" id="hud-kills">0</div>
                </div>
                <div class="hud-stat-box" id="tdm-score-box" style="display: none;">
                    <div class="hud-score-blue" id="hud-score-blue">0</div>
                    <div class="hud-score-divider">:</div>
                    <div class="hud-score-red" id="hud-score-red">0</div>
                </div>
                <div class="hud-weapon-box">
                    <div class="hud-ammo" id="hud-ammo">30/90</div>
                </div>
            </div>
            <div class="hud-bottom-left">
                <div class="hud-bars">
                    <div class="hud-bar-container health">
                        <div class="hud-bar-fill" id="hud-health-fill" style="width: 100%;"></div>
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div class="hud-bar-container armor">
                        <div class="hud-bar-fill" id="hud-armor-fill" style="width: 0%;"></div>
                        <i class="fa-solid fa-shield"></i>
                    </div>
                </div>
            </div>
        </div>
        <div id="countdown-display" style="display: none;">10</div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 data-locale="game_ended">MATCH ENDED</h1>
            <h2 id="winner-name-display"><span id="winner-name">PLAYER</span> <span data-locale="wins_suffix">WINS!</span></h2>
            <div id="match-stats-table"></div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_back_lobby">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu" data-locale="btn_back_menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
