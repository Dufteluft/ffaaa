<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="lobby" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Content Area -->
                <main class="main-content">
                    <!-- Tab 1 & 3: Lobby Browser (shared container) -->
                    <div id="tab-browser" class="tab-view active">
                        <div class="browser-header">
                            <div class="search-bar">
                                <i class="fa-solid fa-magnifying-glass"></i>
                                <input type="text" id="lobby-search" placeholder="Suchen...">
                            </div>
                            <div class="filters">
                                <select id="filter-map">
                                    <option value="all">Alle Maps</option>
                                </select>
                            </div>
                        </div>
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </div>

                    <!-- Tab 2: Create Lobby -->
                    <div id="tab-create" class="tab-view">
                        <div class="create-form-container">
                            <h2 data-locale="tab_create">LOBBY ERSTELLEN</h2>
                            <div class="form-grid">
                                <div class="input-group">
                                    <label data-locale="lobby_name">LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="Name eingeben...">
                                </div>
                                <div class="input-group">
                                    <label data-locale="map_select">MAP AUSWÄHLEN</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="mode_select">SPIELMODUS</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">Team Deathmatch</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="loadout_select">WAFFEN-LOADOUT</label>
                                    <div class="checkbox-group" id="loadout-options">
                                        <!-- Loadouts injected here -->
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="round_time">RUNDENZEIT (MIN)</span>: <span id="round-time-val">15</span></label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="max_players">MAX. SPIELER</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                                <div class="input-group">
                                    <label data-locale="respawn_time">RESPAWN-ZEIT (SEK)</label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                    <span id="respawn-time-val">5</span>
                                </div>
                                <div class="input-group">
                                    <label data-locale="kill_limit">KILL-LIMIT ZUM SIEG</label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                    <span id="kill-limit-val">30</span>
                                </div>
                                <div class="toggle-group">
                                    <div class="toggle-item">
                                        <label data-locale="vehicles_allowed">FAHRZEUGE ERLAUBT</label>
                                        <input type="checkbox" id="vehicles-allowed">
                                    </div>
                                    <div class="toggle-item">
                                        <label data-locale="friendly_fire">FREUNDLICHES FEUER</label>
                                        <input type="checkbox" id="friendly-fire">
                                    </div>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="btn-primary" id="btn-create-lobby" data-locale="btn_create">LOBBY ERSTELLEN</button>
                                <button class="btn-secondary" id="btn-cancel-create" data-locale="btn_cancel">ABBRECHEN</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                    <div class="lobby-status-badge" id="lobby-status-text">Warten auf Spieler...</div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="players">SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <div class="settings-header">
                            <h3 data-locale="settings">EINSTELLUNGEN</h3>
                            <button id="btn-edit-settings" class="icon-btn" style="display: none;"><i class="fa-solid fa-gear"></i></button>
                        </div>
                        <div id="lobby-info-summary"></div>

                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" data-locale="team_blue">BLAU</button>
                            <button class="team-btn" data-team="red" data-locale="team_red">ROT</button>
                            <button class="team-btn" data-team="random" data-locale="random">ZUFALL</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input" placeholder="Nachricht senden...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>

                        <div class="lobby-actions">
                            <button class="btn-ready" id="btn-ready-toggle" data-locale="btn_ready">BEREIT</button>
                            <button class="btn-start" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="btn-leave" id="btn-leave-lobby" data-locale="btn_leave">VERLASSEN</button>
                            <button class="btn-danger" id="btn-close-lobby" style="display: none;">LOBBY SCHLIEẞEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="match-timer">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-timer">00:00</span>
            </div>
            <div class="team-scores" id="hud-team-scores" style="display: none;">
                <div class="score-item blue">
                    <span class="score-label">BLAU</span>
                    <span id="score-blue">0</span>
                </div>
                <div class="score-divider">VS</div>
                <div class="score-item red">
                    <span id="score-red">0</span>
                    <span class="score-label">ROT</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="player-stats">
                <div class="stat-item">
                    <span class="stat-label" data-locale="kills">KILLS</span>
                    <span id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label" data-locale="deaths">TODE</span>
                    <span id="hud-deaths">0</span>
                </div>
            </div>
            <div class="weapon-info">
                <span id="hud-ammo">0</span>
                <i class="fa-solid fa-gun"></i>
            </div>
            <div class="status-bars">
                <div class="bar-container health">
                    <div class="bar-fill" id="hud-health" style="width: 100%;"></div>
                </div>
                <div class="bar-container armor">
                    <div class="bar-fill" id="hud-armor" style="width: 0%;"></div>
                </div>
            </div>
        </div>

        <div id="kill-feed"></div>
        <div id="respawn-timer" style="display: none;">
            <div class="respawn-circle">
                <svg viewBox="0 0 36 36">
                    <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    <path class="circle" id="respawn-circle-path" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                </svg>
                <span id="respawn-countdown">5</span>
            </div>
        </div>
        <div id="game-countdown" style="display: none;">10</div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 data-locale="game_ended">RUNDE BEENDET!</h1>
            <h2 id="winner-name">GEWINNER: SPIELER</h2>

            <div class="scoreboard-container">
                <table id="end-scoreboard">
                    <thead>
                        <tr>
                            <th data-locale="col_name">NAME</th>
                            <th data-locale="kills">KILLS</th>
                            <th data-locale="deaths">TODE</th>
                            <th data-locale="kd_ratio">K/D</th>
                        </tr>
                    </thead>
                    <tbody id="winner-stats-body"></tbody>
                </table>
            </div>

            <div class="map-voting">
                <h3 data-locale="map_vote">NÄCHSTE MAP WÄHLEN</h3>
                <div class="map-vote-list" id="map-vote-container">
                    <!-- Maps for voting -->
                </div>
            </div>

            <div class="winner-actions">
                <button class="btn-primary" id="btn-back-lobby" data-locale="btn_back_lobby">ZURÜCK ZUR LOBBY</button>
                <button class="btn-secondary" id="btn-back-menu" data-locale="btn_back_menu">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
