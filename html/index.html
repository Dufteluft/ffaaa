<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESX FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Sidebar (Filters only for Tab 1 and 3) -->
                <aside class="sidebar" id="sidebar">
                    <div class="filter-group">
                        <label data-locale="map_select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label data-locale="loadout_select">WEAPONS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label data-locale="players_filter">PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>
                </aside>

                <!-- Main Content -->
                <main class="main-content">
                    <!-- Tab 1 & 3: Lobby List -->
                    <div id="lobby-list-view" class="tab-view active">
                        <div class="lobby-list" id="lobby-list-container"></div>
                    </div>

                    <!-- Tab 2: Create Lobby -->
                    <div id="create-lobby-view" class="tab-view">
                        <div class="create-form">
                            <div class="form-grid">
                                <div class="input-group">
                                    <label data-locale="lobby_name">LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="...">
                                </div>
                                <div class="input-group">
                                    <label data-locale="map_select">MAP</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="mode_select">MODE</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="loadout_select">LOADOUT (MULTI-SELECT)</label>
                                    <select id="loadout-select" multiple class="multi-select"></select>
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="round_time">TIME</span>: <span id="round-time-val">15</span> Min</label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="max_players">MAX PLAYERS</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="respawn_time">RESPAWN</span>: <span id="respawn-time-val">5</span> Sek</label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="kill_limit">KILL LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                                <div class="toggle-group">
                                    <label data-locale="vehicles_allowed">VEHICLES</label>
                                    <label class="switch">
                                        <input type="checkbox" id="vehicles-allowed">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="toggle-group">
                                    <label data-locale="friendly_fire">FRIENDLY FIRE</label>
                                    <label class="switch">
                                        <input type="checkbox" id="friendly-fire">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="create-btn" id="btn-create-lobby" data-locale="btn_create">CREATE LOBBY</button>
                                <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">CANCEL</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 data-locale="tab_settings">SETTINGS</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red" data-locale="team_red">RED</button>
                            <button class="team-btn" data-team="random" id="btn-team-random" data-locale="random">RANDOM</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec" data-locale="spectator">SPEC</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="close-btn" id="btn-close-lobby" style="display: none;" data-locale="btn_close">CLOSE</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Gameplay HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-container">
            <div class="hud-top">
                <div class="timer-box">
                    <i class="fa-solid fa-clock"></i>
                    <span id="hud-timer">15:00</span>
                </div>
                <div class="tdm-score" id="tdm-score-box" style="display: none;">
                    <div class="score-blue"><span id="score-blue">0</span></div>
                    <div class="score-red"><span id="score-red">0</span></div>
                </div>
            </div>
            <div class="hud-bottom">
                <div class="stats-box">
                    <div class="stat-item">
                        <span class="label" data-locale="kills">KILLS</span>
                        <span class="value" id="hud-kills">0</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                        <span class="label" data-locale="deaths">DEATHS</span>
                        <span class="value" id="hud-deaths">0</span>
                    </div>
                </div>
                <div class="bars-box">
                    <div class="bar-wrapper">
                        <div class="bar-bg"><div class="bar-fill health" id="bar-health"></div></div>
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div class="bar-wrapper">
                        <div class="bar-bg"><div class="bar-fill armor" id="bar-armor"></div></div>
                        <i class="fa-solid fa-shield"></i>
                    </div>
                </div>
                <div class="ammo-box">
                    <i class="fa-solid fa-gun"></i>
                    <span id="hud-ammo">100</span>
                </div>
            </div>
            <div id="hud-countdown" class="hud-countdown">10</div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 data-locale="game_ended">MATCH ENDED</h1>
            <h2 id="winner-name">PLAYER <span data-locale="wins_suffix">WINS!</span></h2>
            <div id="match-stats-table"></div>

            <div class="map-voting">
                <h3 data-locale="map_vote">VOTE NEXT MAP</h3>
                <div id="map-vote-list" class="vote-grid"></div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_back_lobby">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu" data-locale="btn_back_menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
