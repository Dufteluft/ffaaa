<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFA & TDM Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <!-- Haupt-Menu Container -->
        <div class="main-container" id="main-menu">
            <header class="main-header">
                <h1 class="header-title l-key" id="l-menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active l-key" data-tab="ffa" id="l-tab_ffa">FFA Lobby</button>
                    <button class="tab-btn l-key" data-tab="create" id="l-tab_create">Lobby erstellen</button>
                    <button class="tab-btn l-key" data-tab="list" id="l-tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Browser Bereich (für Tab 1 und 3) -->
                <div id="browser-view" class="tab-view active">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label><span class="l-key" id="l-map_select">Map auswählen</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALLE MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span class="l-key" id="l-max_players">Max. Spieler</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all">EGAL</option>
                                <option value="free">FREIE PLÄTZE</option>
                            </select>
                        </div>
                        <div class="info-box">
                            <p id="tab-description">Wähle ein vordefiniertes Match für sofortige Action.</p>
                        </div>
                    </aside>
                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Lobbys werden hier eingefügt -->
                        </div>
                    </main>
                </div>

                <!-- Erstellen Bereich (Tab 2) -->
                <div id="create-view" class="tab-view">
                    <div class="create-form-container">
                        <div class="form-grid">
                            <div class="form-left">
                                <div class="input-group">
                                    <label class="l-key" id="l-lobby_name">Lobby Name</label>
                                    <input type="text" id="create-name" placeholder="Name eingeben...">
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label class="l-key" id="l-map_select">Map auswählen</label>
                                        <select id="create-map"></select>
                                    </div>
                                    <div class="input-group">
                                        <label class="l-key" id="l-mode_select">Spielmodus</label>
                                        <select id="create-mode">
                                            <option value="ffa">FFA (Alle gegen Alle)</option>
                                            <option value="tdm">TDM (Team Deathmatch)</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label class="l-key" id="l-loadout_select">Waffen-Loadout</label>
                                    <div class="loadout-grid" id="loadout-checkboxes">
                                        <!-- Checkboxen werden dynamisch geladen -->
                                    </div>
                                </div>
                            </div>
                            <div class="form-right">
                                <div class="input-group">
                                    <label><span class="l-key" id="l-round_time">Rundenzeit (Min)</span>: <span id="val-time">15</span></label>
                                    <input type="range" id="create-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span class="l-key" id="l-max_players">Max. Spieler</span>: <span id="val-players">16</span></label>
                                    <input type="range" id="create-maxplayers" min="2" max="32" step="1" value="16">
                                </div>
                                <div class="input-group">
                                    <label><span class="l-key" id="l-respawn_time">Respawn-Zeit (Sek)</span>: <span id="val-respawn">5</span></label>
                                    <input type="range" id="create-respawn" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span class="l-key" id="l-kill_limit">Kill-Limit zum Sieg</span>: <span id="val-kills">30</span></label>
                                    <input type="range" id="create-kills" min="0" max="100" step="10" value="30">
                                </div>
                                <div class="toggle-group">
                                    <label class="switch-container">
                                        <span class="l-key" id="l-vehicles_allowed">Fahrzeuge erlaubt</span>
                                        <input type="checkbox" id="create-vehicles">
                                        <span class="slider"></span>
                                    </label>
                                    <label class="switch-container">
                                        <span class="l-key" id="l-friendly_fire">Freundliches Feuer</span>
                                        <input type="checkbox" id="create-ff">
                                        <span class="slider"></span>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="form-footer">
                            <button class="confirm-btn l-key" id="btn-submit-create">Lobby erstellen</button>
                            <button class="cancel-btn l-key" id="btn-clear-create">Abbrechen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Wartebereich / Lobby Lobby -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                    <div id="lobby-status-text" class="status-waiting">WARTE AUF SPIELER...</div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 class="l-key" id="l-players_title">SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <div class="settings-header">
                            <h3 class="l-key" id="l-settings_title">EINSTELLUNGEN</h3>
                            <div id="lobby-settings-summary"></div>
                        </div>
                        <div class="team-selection">
                            <button class="team-btn l-key" data-team="blue" id="l-team_blue">Team Blau</button>
                            <button class="team-btn l-key" data-team="red" id="l-team_red">Team Rot</button>
                            <button class="team-btn l-key" data-team="spectator" id="l-spectator">Zuschauer</button>
                            <button class="team-btn active l-key" data-team="random" id="l-random">Zufall</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input" placeholder="Nachricht senden...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn l-key" id="btn-ready-toggle">Bereit</button>
                            <button class="start-btn l-key" id="btn-start-game" style="display: none;">Spiel starten</button>
                            <button class="leave-btn l-key" id="btn-leave-lobby">Lobby verlassen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <div class="winner-header">
                    <h1 class="l-key" id="l-game_ended">RUNDE BEENDET</h1>
                    <h2 id="winner-name-display">SPIELER <span class="l-key" id="l-winner_suffix">GEWINNT!</span></h2>
                </div>

                <div class="stats-container" id="match-stats-table">
                    <!-- Tabelle wird via JS gefüllt -->
                </div>

                <div class="map-voting-section">
                    <h3 class="l-key" id="l-vote_next_map">NÄCHSTE MAP WÄHLEN</h3>
                    <div class="map-grid" id="map-voting-grid">
                        <!-- Maps zum Voten -->
                    </div>
                </div>

                <div class="winner-footer">
                    <button class="confirm-btn l-key" id="btn-win-lobby">Zurück zur Lobby</button>
                    <button class="cancel-btn l-key" id="btn-win-menu">Hauptmenü</button>
                </div>
            </div>
        </div>
    </div>

    <!-- In-Game HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-time">15:00</span>
            </div>
            <div class="hud-score-tdm" id="hud-team-score" style="display: none;">
                <div class="score-box blue"><span id="hud-score-blue">0</span></div>
                <div class="score-box red"><span id="hud-score-red">0</span></div>
            </div>
        </div>

        <div class="hud-bottom-left">
            <div class="hud-stats">
                <div class="stat-item">
                    <span class="label l-key" id="l-kills">Kills</span>
                    <span class="value" id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="label l-key" id="l-deaths">Tode</span>
                    <span class="value" id="hud-deaths">0</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="hud-player-info">
                <div class="bars-container">
                    <div class="bar-wrapper health">
                        <div class="bar-fill" id="hud-health" style="width: 100%;"></div>
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div class="bar-wrapper armor">
                        <div class="bar-fill" id="hud-armor" style="width: 0%;"></div>
                        <i class="fa-solid fa-shield"></i>
                    </div>
                </div>
                <div class="ammo-container">
                    <span id="hud-ammo">100</span>
                    <i class="fa-solid fa-gun"></i>
                </div>
            </div>
        </div>

        <div id="countdown-display" style="display: none;">10</div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
