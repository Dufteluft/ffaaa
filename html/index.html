<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Kopfzeile -->
            <header class="main-header">
                <h1 class="header-title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa">FFA LOBBY</button>
                    <button class="tab-btn" data-tab="create">LOBBY ERSTELLEN</button>
                    <button class="tab-btn" data-tab="list">OFFENE LOBBYS</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Linkes Panel: Filter (Wird nur in den Tabs ffa und list angezeigt) -->
                <aside class="sidebar" id="filter-sidebar">
                    <div class="filter-group">
                        <label>MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>WEAPONS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                            <option value="pistol">PISTOLS ONLY</option>
                            <option value="sniper">SNIPERS ONLY</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>TIME <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-time">
                            <option value="all">ANY TIME</option>
                            <option value="short">5-10 MIN</option>
                            <option value="long">15+ MIN</option>
                        </select>
                    </div>
                </aside>

                <!-- Hauptinhalt -->
                <main class="lobby-browser">
                    <!-- Lobbylisten-Ansicht -->
                    <div id="lobby-list-view">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Einträge werden hier injiziert -->
                        </div>
                    </div>

                    <!-- Ansicht: Lobby erstellen -->
                    <div id="create-lobby-view" style="display: none;">
                        <div class="create-form-container">
                            <h2 class="view-title">CUSTOM LOBBY ERSTELLEN</h2>
                            <div class="form-grid">
                                <div class="input-group full-width">
                                    <label>LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="NAME EINGEBEN...">
                                </div>
                                <div class="input-group">
                                    <label>MAP</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label>SPIELMODUS</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA (Alle gegen Alle)</option>
                                        <option value="tdm">TDM (Team Deathmatch)</option>
                                    </select>
                                </div>
                                <div class="input-group full-width">
                                    <label>WAFFEN-LOADOUT</label>
                                    <select id="loadout-select"></select>
                                </div>
                                <div class="input-group">
                                    <label>RUNDENZEIT (MIN): <span id="round-time-val">15</span></label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label>MAX. SPIELER: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                                <div class="input-group">
                                    <label>RESPAWN-ZEIT (SEK): <span id="respawn-time-val">5</span></label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label>KILL-LIMIT: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                                <div class="input-group toggle-group">
                                    <label>FAHRZEUGE ERLAUBT</label>
                                    <input type="checkbox" id="vehicles-allowed">
                                </div>
                                <div class="input-group toggle-group">
                                    <label>FRIENDLY FIRE</label>
                                    <input type="checkbox" id="friendly-fire">
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="confirm-btn" id="btn-create-lobby">LOBBY ERSTELLEN</button>
                                <button class="cancel-btn" id="btn-cancel-create">ABBRECHEN</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Wartebereich / Lobby-Bildschirm -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3>SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>EINSTELLUNGEN</h3>
                        <div id="lobby-info-summary" class="settings-grid"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">RED</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">SPECTATOR</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">STARTEN</button>
                            <button class="leave-btn" id="btn-leave-lobby">VERLASSEN</button>
                            <button class="leave-btn" id="btn-close-lobby" style="display: none; background: #333;">LOBBY SCHLIESSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD (Wird per Skript ein-/ausgeblendet) -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-right">
            <div class="hud-stat-box">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-timer">00:00</span>
            </div>
            <div class="hud-score-row" id="hud-tdm-scores" style="display: none;">
                <div class="score-box blue">
                    <span class="label">BLUE</span>
                    <span id="score-blue">0</span>
                </div>
                <div class="score-box red">
                    <span class="label">RED</span>
                    <span id="score-red">0</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="hud-player-stats">
                <div class="stat-item">
                    <span class="label">KILLS</span>
                    <span id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">DEATHS</span>
                    <span id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-weapon-info">
                <div class="ammo-count">
                    <span id="hud-ammo">0</span>
                    <span class="ammo-label">AMMO</span>
                </div>
            </div>
            <div class="hud-bars">
                <div class="bar-container health">
                    <div class="bar-fill" id="health-bar"></div>
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="bar-container armor">
                    <div class="bar-fill" id="armor-bar"></div>
                    <i class="fa-solid fa-shield"></i>
                </div>
            </div>
        </div>

        <div id="countdown-overlay" style="display: none;">
            <div class="countdown-number" id="countdown-text">10</div>
            <div class="countdown-label">MATCH STARTING</div>
        </div>
    </div>

    <!-- Gewinner-Bildschirm -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title">RUNDE BEENDET</h1>
            <h2 id="winner-name">PLAYER WINS!</h2>
            <div id="match-stats-table"></div>

            <div class="map-voting-section">
                <h3>NÄCHSTE MAP WÄHLEN</h3>
                <div class="map-grid" id="map-voting-grid"></div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby">ZURÜCK ZUR LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
