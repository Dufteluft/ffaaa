<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="lobby" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Main Content: Tab Based -->
                <main class="content-panel">

                    <!-- Tab 1: FFA Lobby (Predefined) -->
                    <div id="tab-ffa-content" class="tab-content active">
                        <div class="lobby-grid-list" id="ffa-predefined-list">
                            <!-- Predefined maps will be injected here -->
                        </div>
                    </div>

                    <!-- Tab 2: Create Lobby -->
                    <div id="tab-create-content" class="tab-content">
                        <div class="create-form-container">
                            <div class="form-grid">
                                <div class="input-group full-width">
                                    <label data-locale="lobby_name">Lobby Name</label>
                                    <input type="text" id="create-lobby-name" placeholder="ENTER NAME...">
                                </div>
                                <div class="input-group">
                                    <label data-locale="map_select">Map auswählen</label>
                                    <select id="create-map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="mode_select">Spielmodus</label>
                                    <select id="create-mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                                <div class="input-group full-width">
                                    <label data-locale="loadout_select">Waffen-Loadout</label>
                                    <div class="loadout-checkboxes" id="create-loadout-list">
                                        <!-- Loadouts injected here -->
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="round_time">Rundenzeit</span>: <span id="create-round-time-val">15</span></label>
                                    <input type="range" id="create-round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="max_players">Max. Spieler</span>: <span id="create-max-players-val">16</span></label>
                                    <input type="range" id="create-max-players" min="2" max="16" step="1" value="16">
                                </div>
                                <div class="input-group">
                                    <label data-locale="vehicles_allowed">Fahrzeuge erlaubt</label>
                                    <label class="switch">
                                        <input type="checkbox" id="create-vehicles-allowed">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="input-group">
                                    <label data-locale="friendly_fire">Freundliches Feuer</label>
                                    <label class="switch">
                                        <input type="checkbox" id="create-friendly-fire">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="respawn_time">Respawn-Zeit</span>: <span id="create-respawn-time-val">5</span>s</label>
                                    <input type="range" id="create-respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="kill_limit">Kill-Limit</span>: <span id="create-kill-limit-val">30</span></label>
                                    <input type="range" id="create-kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="btn-primary" id="btn-submit-create" data-locale="btn_create">Lobby erstellen</button>
                                <button class="btn-secondary" id="btn-cancel-create" data-locale="btn_cancel">Abbrechen</button>
                            </div>
                        </div>
                    </div>

                    <!-- Tab 3: Open Lobbies -->
                    <div id="tab-lobby-content" class="tab-content">
                        <table class="lobby-table">
                            <thead>
                                <tr>
                                    <th data-locale="col_name">NAME</th>
                                    <th data-locale="col_host">HOST</th>
                                    <th data-locale="col_players">SPIELER</th>
                                    <th data-locale="col_map">MAP</th>
                                    <th data-locale="col_mode">MODUS</th>
                                    <th data-locale="col_action">AKTION</th>
                                </tr>
                            </thead>
                            <tbody id="open-lobbies-list">
                                <!-- Entries will be injected here -->
                            </tbody>
                        </table>
                    </div>

                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title-display">Default</span></h2>
                    <button class="edit-settings-btn" id="btn-edit-settings" style="display: none;"><i class="fa-solid fa-gear"></i></button>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="col_players">SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 data-locale="tab_list">SETTINGS</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red" data-locale="team_red">RED</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec" data-locale="spectator">SPECTATOR</button>
                            <button class="team-btn" data-team="random" id="btn-team-random" data-locale="random">RANDOM</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 id="winner-title-text" data-locale="game_ended">MATCH ENDED</h1>
                <h2 id="winner-name-display">PLAYER WINS!</h2>
                <div id="match-stats-table-container"></div>

                <div class="map-voting-section">
                    <h3>VOTE FOR NEXT MAP</h3>
                    <div class="vote-grid" id="map-vote-grid"></div>
                </div>

                <div class="btn-group">
                    <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_back_lobby">BACK TO LOBBY</button>
                    <button class="cancel-btn" id="btn-back-to-menu" data-locale="btn_back_menu">MAIN MENU</button>
                </div>
            </div>
        </div>

    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-container">
            <div class="hud-top">
                <div class="hud-timer" id="hud-timer">15:00</div>
                <div class="hud-score tdm-only" id="hud-team-score" style="display: none;">
                    <span class="score-blue">0</span>
                    <span class="score-divider">VS</span>
                    <span class="score-red">0</span>
                </div>
            </div>
            <div class="hud-bottom">
                <div class="hud-stats">
                    <div class="stat-item"><span data-locale="kills">Kills</span>: <span id="hud-kills">0</span></div>
                    <div class="stat-item"><span data-locale="deaths">Tode</span>: <span id="hud-deaths">0</span></div>
                </div>
                <div class="hud-player-bars">
                    <div class="bar-container health-bar"><div class="bar-fill" id="hud-health-fill"></div></div>
                    <div class="bar-container armor-bar"><div class="bar-fill" id="hud-armor-fill"></div></div>
                </div>
                <div class="hud-ammo">
                    <i class="fa-solid fa-gun"></i> <span id="hud-ammo-val">250</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
