<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1 & 3 Content (Lobby Lists) -->
                <main class="lobby-browser" id="tab-content-list">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label data-locale="map_select">MAPS</label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label data-locale="loadout_select">WEAPONS</label>
                            <select id="filter-weapons">
                                <option value="all">ALL WEAPONS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label data-locale="max_players">PLAYERS</label>
                            <select id="filter-players">
                                <option value="all">ANY</option>
                                <option value="not-full">NOT FULL</option>
                            </select>
                        </div>
                    </aside>
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Entries injected here -->
                    </div>
                </main>

                <!-- Tab 2 Content (Create Lobby) -->
                <main class="create-lobby-panel" id="tab-content-create" style="display: none;">
                    <div class="form-grid">
                        <div class="input-group full-width">
                            <label data-locale="lobby_name">LOBBY NAME</label>
                            <input type="text" id="create-lobby-name" placeholder="...">
                        </div>
                        <div class="input-group">
                            <label data-locale="map_select">MAP</label>
                            <select id="create-map-select"></select>
                        </div>
                        <div class="input-group">
                            <label data-locale="mode_select">MODE</label>
                            <select id="create-mode-select">
                                <option value="ffa">FFA</option>
                                <option value="tdm">TEAM DEATHMATCH</option>
                            </select>
                        </div>
                        <div class="input-group full-width">
                            <label data-locale="loadout_select">LOADOUT (MULTI-SELECT)</label>
                            <div class="loadout-multi-select" id="create-loadout-multi">
                                <!-- Multi-select options injected here -->
                            </div>
                        </div>
                        <div class="input-group">
                            <label><span data-locale="round_time">TIME</span>: <span id="create-round-time-val">15</span>m</label>
                            <input type="range" id="create-round-time" min="5" max="30" step="5" value="15">
                        </div>
                        <div class="input-group">
                            <label><span data-locale="max_players">MAX PLAYERS</span>: <span id="create-max-players-val">16</span></label>
                            <input type="range" id="create-max-players" min="2" max="16" step="1" value="16">
                        </div>
                        <div class="input-group">
                            <label><span data-locale="respawn_time">RESPAWN</span>: <span id="create-respawn-time-val">5</span>s</label>
                            <input type="range" id="create-respawn-time" min="3" max="10" step="1" value="5">
                        </div>
                        <div class="input-group">
                            <label><span data-locale="kill_limit">KILL LIMIT</span>: <span id="create-kill-limit-val">30</span></label>
                            <input type="range" id="create-kill-limit" min="0" max="50" step="5" value="30">
                        </div>
                        <div class="input-group toggle-group">
                            <label data-locale="vehicles_allowed">VEHICLES</label>
                            <label class="switch">
                                <input type="checkbox" id="create-vehicles">
                                <span class="slider round"></span>
                            </label>
                        </div>
                        <div class="input-group toggle-group">
                            <label data-locale="friendly_fire">FRIENDLY FIRE</label>
                            <label class="switch">
                                <input type="checkbox" id="create-friendly-fire">
                                <span class="slider round"></span>
                            </label>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button class="confirm-btn" id="btn-submit-create" data-locale="btn_create">CREATE</button>
                        <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">CANCEL</button>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="waiting-lobby-name">LOBBY NAME</h2>
                    <div class="lobby-id-badge">ID: <span id="waiting-lobby-id">0000</span></div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="players">PLAYERS</h3>
                        <div id="waiting-player-list"></div>
                    </div>
                    <div class="management-section">
                        <div class="settings-editor" id="host-settings-editor" style="display: none;">
                            <h3 data-locale="tab_create">EDIT SETTINGS</h3>
                            <div class="settings-grid">
                                <!-- Host can edit settings here -->
                            </div>
                        </div>
                        <div class="player-controls">
                            <h3 data-locale="mode_select">TEAM SELECTION</h3>
                            <div class="team-selection">
                                <button class="team-btn" data-team="blue" data-locale="team_blue">BLUE</button>
                                <button class="team-btn" data-team="red" data-locale="team_red">RED</button>
                                <button class="team-btn" data-team="spectator" data-locale="spectator">SPECTATOR</button>
                                <button class="team-btn" data-team="random" data-locale="random">RANDOM</button>
                            </div>
                            <div class="lobby-chat">
                                <div id="waiting-chat-messages"></div>
                                <input type="text" id="waiting-chat-input" placeholder="...">
                            </div>
                        </div>
                    </div>
                </div>
                <footer class="lobby-card-footer">
                    <div class="lobby-actions">
                        <button class="ready-btn" id="waiting-ready-btn" data-locale="btn_ready">READY</button>
                        <button class="start-btn" id="waiting-start-btn" style="display: none;" data-locale="btn_start">START</button>
                        <button class="close-btn" id="waiting-close-btn" style="display: none;" data-locale="btn_close">CLOSE LOBBY</button>
                        <button class="leave-btn" id="waiting-leave-btn" data-locale="btn_leave">LEAVE</button>
                    </div>
                </footer>
            </div>
        </div>
    </div>

    <!-- Gameplay HUD -->
    <div id="hud" style="display: none;">
        <div class="hud-top">
            <div class="timer" id="hud-timer">15:00</div>
            <div class="tdm-scores" id="hud-tdm-scores" style="display: none;">
                <span class="score-blue">0</span> : <span class="score-red">0</span>
            </div>
        </div>
        <div class="hud-bottom">
            <div class="stats-box">
                <div class="stat"><i class="fa-solid fa-crosshairs"></i> <span id="hud-kills">0</span></div>
                <div class="stat"><i class="fa-solid fa-skull"></i> <span id="hud-deaths">0</span></div>
            </div>
            <div class="weapon-box">
                <div class="ammo-count" id="hud-ammo">100</div>
                <div class="health-armor">
                    <div class="bar health"><div class="fill" id="hud-health-fill" style="width: 100%;"></div></div>
                    <div class="bar armor"><div class="fill" id="hud-armor-fill" style="width: 50%;"></div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 data-locale="game_ended">MATCH ENDED</h1>
            <h2 id="winner-display-name">PLAYER <span data-locale="winner">WINS!</span></h2>

            <div class="match-stats-container">
                <table id="winner-stats-table">
                    <thead>
                        <tr>
                            <th data-locale="players">PLAYER</th>
                            <th data-locale="kills">KILLS</th>
                            <th data-locale="deaths">DEATHS</th>
                            <th data-locale="kd_ratio">K/D</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="next-map-voting">
                <h3 data-locale="map_select">VOTE NEXT MAP</h3>
                <div class="vote-options" id="winner-vote-options"></div>
            </div>

            <div class="winner-actions">
                <button class="confirm-btn" id="btn-winner-lobby" data-locale="btn_back_lobby">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-winner-menu" data-locale="btn_back_menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
