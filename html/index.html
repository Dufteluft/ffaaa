<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- jQuery for easier DOM manipulation -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" id="l-menu_title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active l-tab_ffa" data-tab="ffa">FFA LOBBY</button>
                    <button class="tab-btn l-tab_create" data-tab="create">LOBBY ERSTELLEN</button>
                    <button class="tab-btn l-tab_list" data-tab="list">OFFENE LOBBYS</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Left Panel: Filters (Only for Tab 1 & 3) -->
                <aside class="sidebar" id="filter-sidebar">
                    <div class="filter-group">
                        <label><span id="l-map_select">MAPS</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label><span id="l-max_players">PLAYERS</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>
                    <div class="sidebar-info">
                        <p id="player-stats-summary"></p>
                    </div>
                </aside>

                <!-- Main Content: Lobby List / Creation Form -->
                <main class="main-content">
                    <!-- Tab 1 & 3: Lobby Browser -->
                    <div id="lobby-browser" class="tab-content active">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </div>

                    <!-- Tab 2: Creation Form -->
                    <div id="lobby-creation" class="tab-content">
                        <div class="creation-grid">
                            <div class="input-group full-width">
                                <label id="l-lobby_name">LOBBY NAME</label>
                                <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                            </div>
                            <div class="input-group">
                                <label id="l-map_select_2">MAP</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label id="l-mode_select">MODE</label>
                                <select id="mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">TEAM DEATHMATCH</option>
                                </select>
                            </div>
                            <div class="input-group full-width">
                                <label id="l-loadout_select">LOADOUT</label>
                                <div class="loadout-grid" id="loadout-grid">
                                    <!-- Checkboxes will be injected here -->
                                </div>
                            </div>
                            <div class="input-group">
                                <label id="l-round_time">ROUND TIME (MIN): <span id="round-time-val">15</span></label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label id="l-max_players_2">MAX PLAYERS: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                            </div>
                            <div class="input-group">
                                <label id="l-respawn_time">RESPAWN TIME (SEC): <span id="respawn-time-val">5</span></label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label id="l-kill_limit">KILL LIMIT: <span id="kill-limit-val">30</span></label>
                                <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                            <div class="toggle-group">
                                <label id="l-vehicles_allowed">VEHICLES ALLOWED</label>
                                <input type="checkbox" id="vehicles-allowed" class="toggle-input">
                            </div>
                            <div class="toggle-group">
                                <label id="l-friendly_fire">FRIENDLY FIRE</label>
                                <input type="checkbox" id="friendly-fire" class="toggle-input">
                            </div>
                            <div class="btn-group full-width">
                                <button class="confirm-btn l-btn_create" id="btn-create-lobby">LOBBY ERSTELLEN</button>
                                <button class="cancel-btn l-btn_cancel" id="btn-cancel-create">ABBRECHEN</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="l-players_header">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 id="l-settings_header">SETTINGS</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn l-team_blue" data-team="blue" id="btn-team-blue">TEAM BLAU</button>
                            <button class="team-btn l-team_red" data-team="red" id="btn-team-red">TEAM ROT</button>
                            <button class="team-btn l-spectator" data-team="spectator" id="btn-team-spec">ZUSCHAUER</button>
                            <button class="team-btn l-random" data-team="random" id="btn-team-random">ZUFALL</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn l-btn_ready" id="btn-ready-toggle">BEREIT</button>
                            <button class="start-btn l-btn_start" id="btn-start-game" style="display: none;">SPIEL STARTEN</button>
                            <button class="leave-btn l-btn_leave" id="btn-leave-lobby">LOBBY VERLASSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-container">
            <div class="hud-top">
                <div class="round-timer"><i class="fa-solid fa-clock"></i> <span id="hud-timer">00:00</span></div>
                <div class="team-scores" id="hud-team-scores" style="display: none;">
                    <div class="score-box blue"><span id="score-blue">0</span></div>
                    <div class="score-box red"><span id="score-red">0</span></div>
                </div>
            </div>
            <div class="hud-bottom">
                <div class="stats-group">
                    <div class="stat-item"><span class="label">K</span> <span id="hud-kills">0</span></div>
                    <div class="stat-item"><span class="label">D</span> <span id="hud-deaths">0</span></div>
                </div>
                <div class="vital-group">
                    <div class="bar-container health"><div class="bar-fill" id="health-bar"></div></div>
                    <div class="bar-container armor"><div class="bar-fill" id="armor-bar"></div></div>
                </div>
                <div class="ammo-group">
                    <i class="fa-solid fa-gun"></i> <span id="hud-ammo">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 class="l-game_ended">RUNDE BEENDET!</h1>
            <h2 id="winner-announcement"><span id="winner-name">PLAYER</span> <span id="l-winner_suffix">WINS!</span></h2>

            <div id="match-stats-table"></div>

            <div class="map-voting-section">
                <h3 id="l-vote_next_map">VOTE FÜR NÄCHSTE MAP</h3>
                <div class="map-vote-grid" id="map-vote-grid"></div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn l-btn_back_to_lobby" id="btn-back-to-lobby">ZURÜCK ZUR LOBBY</button>
                <button class="cancel-btn l-btn_main_menu" id="btn-back-to-menu">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
