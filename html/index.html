<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFA LOBBY SYSTEM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Main Application -->
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Sidebar: Filters (Only visible in Tab 1 & 3) -->
                <aside class="sidebar" id="sidebar">
                    <div class="filter-group">
                        <label data-locale="map_select">MAPS</label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label data-locale="loadout_select">WEAPONS</label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label data-locale="max_players">PLAYERS</label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>

                    <div class="stats-box">
                        <h3 data-locale="score">STATS</h3>
                        <div class="stat-row"><span data-locale="kills">Kills</span>: <span id="stat-kills">0</span></div>
                        <div class="stat-row"><span data-locale="deaths">Deaths</span>: <span id="stat-deaths">0</span></div>
                        <div class="stat-row"><span data-locale="kd_ratio">K/D</span>: <span id="stat-kd">0.00</span></div>
                    </div>
                </aside>

                <!-- Main Content -->
                <main class="lobby-browser">
                    <!-- Tab 1 & 3: Lobby Lists -->
                    <div id="lobby-list-container" class="lobby-list"></div>

                    <!-- Tab 2: Create Lobby Form -->
                    <div id="create-lobby-form" style="display: none;" class="creation-form">
                        <h2 data-locale="tab_create">Lobby erstellen</h2>
                        <div class="form-grid">
                            <div class="input-group full-width">
                                <label data-locale="lobby_name">Lobby Name</label>
                                <input type="text" id="lobby-name" placeholder="Enter name...">
                            </div>
                            <div class="input-group">
                                <label data-locale="map_select">Map</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">Mode</label>
                                <select id="mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">TEAM DEATHMATCH</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label data-locale="loadout_select">Loadout</label>
                                <select id="loadout-select"></select>
                            </div>
                            <div class="input-group">
                                <label><span data-locale="round_time">Time (Min)</span>: <span id="round-time-val">15</span></label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">Max Players</span>: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="respawn_time">Respawn (Sek)</span>: <span id="respawn-time-val">5</span></label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">Kill Limit</span>: <span id="kill-limit-val">30</span></label>
                                <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                            <div class="input-group toggle-group">
                                <label data-locale="vehicles_allowed">Vehicles</label>
                                <label class="switch">
                                    <input type="checkbox" id="vehicles-allowed">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="input-group toggle-group">
                                <label data-locale="friendly_fire">Friendly Fire</label>
                                <label class="switch">
                                    <input type="checkbox" id="friendly-fire">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="confirm-btn" id="btn-create-submit" data-locale="btn_create">CREATE</button>
                            <button class="cancel-btn" id="btn-create-cancel" data-locale="btn_cancel">CANCEL</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area Overlay -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2><span data-locale="tab_ffa">LOBBY</span>: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 data-locale="mode_select">SETTINGS</h3>
                        <div id="lobby-info-summary"></div>

                        <div id="team-selection-area" style="display: none;">
                            <div class="team-selection">
                                <button class="team-btn" data-team="blue" data-locale="team_blue">BLUE</button>
                                <button class="team-btn" data-team="red" data-locale="team_red">RED</button>
                                <button class="team-btn" data-team="random" data-locale="random">RANDOM</button>
                            </div>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="...">
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Gameplay HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-container">
            <div class="hud-top">
                <div class="hud-timer" id="hud-timer">00:00</div>
                <div class="hud-scores" id="hud-scores" style="display: none;">
                    <span class="score-blue" id="score-blue">0</span>
                    <span class="score-divider">:</span>
                    <span class="score-red" id="score-red">0</span>
                </div>
            </div>
            <div class="hud-bottom-left">
                <div class="hud-stat">
                    <i class="fa-solid fa-crosshairs"></i> <span id="hud-kills">0</span>
                </div>
                <div class="hud-stat">
                    <i class="fa-solid fa-skull"></i> <span id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-bottom-right">
                <div class="hud-bars">
                    <div class="bar-container armor-bar"><div id="armor-fill" class="bar-fill"></div></div>
                    <div class="bar-container health-bar"><div id="health-fill" class="bar-fill"></div></div>
                </div>
                <div class="hud-ammo">
                    <i class="fa-solid fa-gun"></i> <span id="hud-ammo">0</span>
                </div>
            </div>
        </div>
        <div id="game-countdown" class="countdown-overlay" style="display: none;">10</div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 data-locale="game_ended">MATCH ENDED</h1>
            <h2 id="winner-name">PLAYER <span data-locale="wins_suffix">WINS!</span></h2>

            <div class="winner-content">
                <div class="stats-table-wrapper">
                    <table id="winner-stats-table">
                        <thead>
                            <tr>
                                <th data-locale="score">NAME</th>
                                <th data-locale="kills">KILLS</th>
                                <th data-locale="deaths">DEATHS</th>
                                <th data-locale="kd_ratio">K/D</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div class="map-voting">
                    <h3 data-locale="vote_map">VOTE FOR NEXT MAP</h3>
                    <div id="vote-map-list" class="vote-grid"></div>
                </div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_join">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu" data-locale="tab_list">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
