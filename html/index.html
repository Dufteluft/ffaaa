<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div id="main-container" class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" id="l-menu_title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="l-tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="l-tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="l-tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Left Panel: Filters (Only visible in Tab 1 and 3) -->
                <aside class="sidebar" id="sidebar">
                    <div class="filter-group">
                        <label id="l-map_select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="l-loadout_select">WEAPONS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="l-max_players">PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>
                </aside>

                <!-- Main Content -->
                <main class="main-content-area">
                    <!-- Tab 1 & 3: Lobby Browser -->
                    <div id="lobby-browser" class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </div>

                    <!-- Tab 2: Create Lobby Form -->
                    <div id="create-lobby-tab" class="create-lobby-page" style="display: none;">
                        <div class="form-scrollable">
                            <div class="input-group">
                                <label id="l-lobby_name">LOBBY NAME</label>
                                <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label class="l-map_select">MAP</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label class="l-mode_select">MODE</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label class="l-loadout_select">LOADOUT (MULTI-SELECT)</label>
                                <div class="loadout-grid" id="loadout-checkboxes">
                                    <!-- Checkboxes will be injected here -->
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span class="l-round_time">TIME</span>: <span id="round-time-val">15</span>m</label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span class="l-max_players">MAX PLAYERS</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group toggle-group">
                                    <label class="l-vehicles_allowed">VEHICLES</label>
                                    <label class="switch">
                                        <input type="checkbox" id="vehicles-allowed">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="input-group toggle-group">
                                    <label class="l-friendly_fire">FRIENDLY FIRE</label>
                                    <label class="switch">
                                        <input type="checkbox" id="friendly-fire">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span class="l-respawn_time">RESPAWN</span>: <span id="respawn-time-val">5</span>s</label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span class="l-kill_limit">KILL LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="confirm-btn" id="btn-create-lobby-submit">Lobby erstellen</button>
                                <button class="cancel-btn" id="btn-cancel-create">Abbrechen</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3>PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>SETTINGS</h3>
                        <div id="lobby-info-summary" class="lobby-settings-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">RED</button>
                            <button class="team-btn" data-team="random" id="btn-team-random">RANDOM</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">SPEC</button>
                        </div>
                        <div class="lobby-chat-wrapper">
                            <div id="chat-messages" class="chat-box"></div>
                            <div class="chat-input-area">
                                <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">START</button>
                            <button class="leave-btn" id="btn-leave-lobby">LEAVE</button>
                            <button class="close-lobby-btn" id="btn-close-lobby" style="display: none;">CLOSE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 id="winner-title">RUNDE BEENDET</h1>
                <h2 id="winner-name-display">PLAYER GEWINNT!</h2>

                <div class="winner-content-grid">
                    <div class="stats-table-wrapper">
                        <div id="match-stats-table"></div>
                    </div>
                    <div class="map-voting-section">
                        <h3>NEXT MAP VOTE</h3>
                        <div id="map-vote-grid" class="map-vote-grid">
                            <!-- Map votes here -->
                        </div>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="confirm-btn" id="btn-back-to-lobby">BACK TO LOBBY</button>
                    <button class="cancel-btn" id="btn-back-to-menu">MAIN MENU</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" class="hud-container" style="display: none;">
        <div class="hud-top-right">
            <div class="hud-timer">
                <i class="fa-solid fa-clock"></i> <span id="hud-time">15:00</span>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="hud-weapon-info">
                <div class="ammo-count"><span id="hud-ammo">30</span></div>
            </div>
            <div class="hud-bars">
                <div class="hud-bar-wrapper">
                    <div class="hud-bar-bg"><div id="hud-health-bar" class="hud-bar-fill health"></div></div>
                </div>
                <div class="hud-bar-wrapper">
                    <div class="hud-bar-bg"><div id="hud-armor-bar" class="hud-bar-fill armor"></div></div>
                </div>
            </div>
        </div>

        <div class="hud-bottom-left">
            <div class="hud-stats">
                <div class="hud-stat-item"><span class="label">KILLS:</span> <span id="hud-kills">0</span></div>
                <div class="hud-stat-item"><span class="label">DEATHS:</span> <span id="hud-deaths">0</span></div>
            </div>
            <div id="hud-team-scores" class="hud-team-scores" style="display: none;">
                <div class="team-score blue">BLUE: <span id="hud-score-blue">0</span></div>
                <div class="team-score red">RED: <span id="hud-score-red">0</span></div>
            </div>
        </div>

        <div id="hud-countdown" class="hud-countdown" style="display: none;">10</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
