<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="lobby" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <main class="lobby-browser">
                    <!-- Tab 1: FFA Predefined -->
                    <div id="tab-ffa" class="tab-content active">
                        <div class="lobby-list" id="ffa-list-container"></div>
                    </div>

                    <!-- Tab 2: Create Lobby -->
                    <div id="tab-create" class="tab-content">
                        <div class="create-form-container">
                            <div class="form-grid">
                                <div class="input-group">
                                    <label data-locale="lobby_name">LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="...">
                                </div>
                                <div class="input-group">
                                    <label data-locale="map_select">MAP</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="mode_select">MODE</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="loadout_select">LOADOUT</label>
                                    <div class="checkbox-group">
                                        <label><input type="checkbox" name="loadout" value="pistol"> Pistol</label>
                                        <label><input type="checkbox" name="loadout" value="smg"> SMG</label>
                                        <label><input type="checkbox" name="loadout" value="assault"> Assault</label>
                                        <label><input type="checkbox" name="loadout" value="sniper"> Sniper</label>
                                        <label><input type="checkbox" name="loadout" value="shotgun"> Shotgun</label>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="round_time">TIME</span>: <span id="round-time-val">15</span>m</label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="max_players">MAX PLAYERS</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="32" step="1" value="16">
                                </div>
                                <div class="input-group toggle-group">
                                    <label data-locale="vehicles_allowed">VEHICLES</label>
                                    <label class="switch">
                                        <input type="checkbox" id="vehicles-allowed">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="input-group toggle-group">
                                    <label data-locale="friendly_fire">FRIENDLY FIRE</label>
                                    <label class="switch">
                                        <input type="checkbox" id="friendly-fire">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="respawn_time">RESPAWN</span>: <span id="respawn-time-val">5</span>s</label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="kill_limit">KILL LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="confirm-btn" id="btn-create-lobby" data-locale="btn_create">CREATE</button>
                            </div>
                        </div>
                    </div>

                    <!-- Tab 3: Open Lobbies -->
                    <div id="tab-lobby" class="tab-content">
                        <div class="lobby-list" id="open-list-container"></div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                    <button class="edit-btn" id="btn-edit-settings" style="display: none;"><i class="fa-solid fa-gear"></i></button>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 data-locale="settings">SETTINGS</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red" data-locale="team_red">RED</button>
                            <button class="team-btn" data-team="random" id="btn-team-random" data-locale="random">RANDOM</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 data-locale="game_ended">MATCH ENDED</h1>
                <h2 id="winner-name">PLAYER WINS!</h2>
                <div id="match-stats-table"></div>

                <!-- Map Voting -->
                <div class="map-voting">
                    <h3 data-locale="map_select">VOTE NEXT MAP</h3>
                    <div class="vote-options" id="vote-options"></div>
                </div>

                <div class="btn-group">
                    <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_back_lobby">BACK TO LOBBY</button>
                    <button class="cancel-btn" id="btn-back-to-menu" data-locale="btn_back_menu">MAIN MENU</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer-box">
                <i class="fa-regular fa-clock"></i>
                <span id="hud-timer">15:00</span>
            </div>
            <div id="hud-tdm-score" style="display: none;">
                <span class="blue-score">0</span>
                <span class="score-divider">:</span>
                <span class="red-score">0</span>
            </div>
        </div>

        <div class="hud-center">
            <div id="kill-feed"></div>
        </div>

        <div class="hud-bottom-left">
            <div class="stat-box">
                <span class="label" data-locale="kills">KILLS</span>
                <span id="hud-kills">0</span>
            </div>
            <div class="stat-box">
                <span class="label" data-locale="deaths">DEATHS</span>
                <span id="hud-deaths">0</span>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="weapon-info">
                <span id="hud-ammo">30/250</span>
            </div>
            <div class="bars-container">
                <div class="bar-wrapper health">
                    <div class="bar-inner" id="hud-health" style="width: 100%;"></div>
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="bar-wrapper armor">
                    <div class="bar-inner" id="hud-armor" style="width: 50%;"></div>
                    <i class="fa-solid fa-shield"></i>
                </div>
            </div>
        </div>

        <div id="countdown-display" style="display: none;">10</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
