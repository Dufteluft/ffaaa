<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFA LOBBY SYSTEM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <!-- Hauptcontainer -->
        <div id="main-container" class="main-container">
            <header class="main-header">
                <h1 class="header-title" id="l-menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="l-tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="l-tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="l-tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Sidebar / Filter (Nur in Tabs FFA und LIST sichtbar) -->
                <aside class="sidebar" id="sidebar-filters">
                    <div class="filter-group">
                        <label id="l-map_select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALLE MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="l-loadout_select">WAFFEN <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALLE WAFFEN</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="l-max_players">SPIELER <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ALLE</option>
                            <option value="not-full">NICHT VOLL</option>
                        </select>
                    </div>
                </aside>

                <!-- Hauptbereich -->
                <main class="lobby-browser">
                    <!-- Tab: FFA Lobby & Offene Lobbys -->
                    <div id="lobby-list-container" class="lobby-list">
                        <!-- Lobbys werden hier injiziert -->
                    </div>

                    <!-- Tab: Lobby erstellen -->
                    <div id="create-lobby-view" class="create-view" style="display: none;">
                        <div class="form-container">
                            <div class="input-group">
                                <label id="l-lobby_name">LOBBY NAME</label>
                                <input type="text" id="create-name" placeholder="Name eingeben...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label id="l-map_select_2">MAP</label>
                                    <select id="create-map"></select>
                                </div>
                                <div class="input-group">
                                    <label id="l-mode_select">MODUS</label>
                                    <select id="create-mode">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">Team Deathmatch</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label id="l-loadout_select_2">WAFFEN-LOADOUT</label>
                                <div id="loadout-grid" class="checkbox-grid">
                                    <!-- Checkboxen werden hier injiziert -->
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label id="l-round_time">RUNDENZEIT: <span id="round-time-val">15</span> Min</label>
                                    <input type="range" id="create-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label id="l-max_players_2">MAX. SPIELER: <span id="max-players-val">16</span></label>
                                    <input type="range" id="create-max" min="2" max="16" step="1" value="16">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label id="l-respawn_time">RESPAWN-ZEIT: <span id="respawn-time-val">5</span> Sek</label>
                                    <input type="range" id="create-respawn" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label id="l-kill_limit">KILL-LIMIT: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="create-kills" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="toggle-row">
                                <div class="toggle-group">
                                    <label id="l-vehicles_allowed">Fahrzeuge</label>
                                    <input type="checkbox" id="create-vehicles" class="toggle-switch">
                                </div>
                                <div class="toggle-group">
                                    <label id="l-friendly_fire">Friendly Fire</label>
                                    <input type="checkbox" id="create-ff" class="toggle-switch">
                                </div>
                            </div>
                            <button class="confirm-btn" id="btn-submit-create">LOBBY ERSTELLEN</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Wartebereich -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2>LOBBY: <span id="lobby-title-display">---</span></h2>
                    <div id="lobby-status-tag" class="status-tag">WARTET</div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="l-players_title">SPIELER</h3>
                        <div id="player-list-display"></div>
                    </div>
                    <div class="settings-section">
                        <h3 id="l-settings_title">EINSTELLUNGEN</h3>
                        <div id="lobby-info-details" class="info-details"></div>

                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="l-team_blue">Blau</button>
                            <button class="team-btn" data-team="red" id="l-team_red">Rot</button>
                            <button class="team-btn" data-team="spectator" id="l-spectator">Zuschauer</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages-display" class="chat-content"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input-field" placeholder="Nachricht...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-action">BEREIT</button>
                            <button class="start-btn" id="btn-start-action" style="display: none;">STARTEN</button>
                            <button class="leave-btn" id="btn-leave-action">VERLASSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Siegerbildschirm -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 id="l-game_ended">RUNDE BEENDET</h1>
                <h2 id="winner-display-name">--- GEWINNT!</h2>

                <div class="winner-content">
                    <div class="stats-table-wrapper" id="winner-stats-container"></div>

                    <div class="map-voting-wrapper">
                        <h3 id="l-vote_next_map">NÄCHSTE MAP WÄHLEN</h3>
                        <div id="map-voting-grid" class="map-grid"></div>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="confirm-btn" id="btn-winner-lobby">ZURÜCK ZUR LOBBY</button>
                    <button class="cancel-btn" id="btn-winner-menu">HAUPTMENÜ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- In-Game HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-left">
            <div class="hud-item timer">
                <i class="fa-solid fa-clock"></i> <span id="hud-timer">00:00</span>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-stats">
                <div class="stat-row">
                    <span class="label">KILLS</span>
                    <span class="value" id="hud-kills">0</span>
                </div>
                <div class="stat-row">
                    <span class="label">TODE</span>
                    <span class="value" id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-team-score" id="hud-tdm-score" style="display: none;">
                <div class="team blue">
                    <span class="name">BLAU</span>
                    <span class="score" id="hud-score-blue">0</span>
                </div>
                <div class="team red">
                    <span class="name">ROT</span>
                    <span class="score" id="hud-score-red">0</span>
                </div>
            </div>
            <div class="hud-weapon">
                <div class="bars">
                    <div class="bar-bg"><div id="hud-hp-bar" class="bar hp"></div></div>
                    <div class="bar-bg"><div id="hud-armor-bar" class="bar armor"></div></div>
                </div>
                <div class="ammo">
                    <span id="hud-ammo">---</span>
                </div>
            </div>
        </div>
        <div id="hud-countdown" class="hud-countdown" style="display: none;">10</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
