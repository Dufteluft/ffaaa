<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">CREATE</button>
                    <button class="tab-btn" data-tab="lobby" data-locale="tab_list">LOBBY</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Left Panel: Filters -->
                <aside class="sidebar">
                    <div class="filter-group">
                        <label data-locale="map_select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                            <option value="legion">LEGION SQUARE</option>
                            <option value="sandy">SANDY SHORES</option>
                            <option value="airport">AIRPORT</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>WEAPONS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                            <option value="pistols">PISTOLS ONLY</option>
                            <option value="snipers">SNIPERS ONLY</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>TIME <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-time">
                            <option value="all">ANY TIME</option>
                            <option value="short">5-10 MIN</option>
                            <option value="long">15+ MIN</option>
                        </select>
                    </div>

                    <button class="create-btn" id="open-create-modal" data-locale="btn_create">CREATE LOBBY</button>
                </aside>

                <!-- Main Content: Lobby List -->
                <main class="lobby-browser">
                    <div id="tab-content-create" style="display: none;">
                        <div class="create-lobby-form">
                            <h2 data-locale="tab_create">CREATE CUSTOM LOBBY</h2>
                            <div class="form-container">
                                <div class="input-group">
                                    <label data-locale="lobby_name">LOBBY NAME</label>
                                    <input type="text" id="lobby-name-tab" placeholder="ENTER NAME...">
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label data-locale="map_select">MAP</label>
                                        <select id="map-select-tab"></select>
                                    </div>
                                    <div class="input-group">
                                        <label data-locale="mode_select">MODE</label>
                                        <select id="mode-select-tab">
                                            <option value="ffa">FFA</option>
                                            <option value="tdm">TEAM DEATHMATCH</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label data-locale="loadout_select">LOADOUT (MULTI-SELECT)</label>
                                    <div id="loadout-grid-tab" class="checkbox-grid"></div>
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label><span data-locale="round_time">TIME (MIN)</span>: <span id="round-time-val-tab">15</span></label>
                                        <input type="range" id="round-time-tab" min="5" max="30" step="5" value="15">
                                    </div>
                                    <div class="input-group">
                                        <label><span data-locale="max_players">MAX PLAYERS</span>: <span id="max-players-val-tab">16</span></label>
                                        <input type="range" id="max-players-tab" min="2" max="32" step="1" value="16">
                                    </div>
                                </div>
                                <div class="btn-group">
                                    <button class="confirm-btn" id="btn-create-lobby-tab" data-locale="btn_create">CREATE</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Entries will be injected here -->
                    </div>
                </main>
            </div>
        </div>

        <!-- Create Lobby Modal (Hidden by default) -->
        <div id="create-lobby-modal" class="overlay" style="display: none;">
             <div class="modal-content">
                <h2>CREATE CUSTOM LOBBY</h2>
                <div class="form-container">
                    <div class="input-group">
                        <label>LOBBY NAME</label>
                        <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label>MAP</label>
                            <select id="map-select"></select>
                        </div>
                        <div class="input-group">
                            <label>MODE</label>
                            <select id="mode-select">
                                <option value="ffa">FFA</option>
                                <option value="tdm">TEAM DEATHMATCH</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>LOADOUT (MULTI-SELECT)</label>
                        <div id="loadout-grid" class="checkbox-grid"></div>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label>TIME (MIN): <span id="round-time-val">15</span></label>
                            <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                        </div>
                        <div class="input-group">
                            <label>MAX PLAYERS: <span id="max-players-val">16</span></label>
                            <input type="range" id="max-players" min="2" max="32" step="1" value="16">
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="confirm-btn" id="btn-create-lobby">CREATE</button>
                        <button class="cancel-btn" id="btn-close-modal">CANCEL</button>
                    </div>
                </div>
             </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3>PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>SETTINGS</h3>
                        <div id="lobby-info-summary"></div>
                        <div id="host-settings-edit" style="display: none;">
                            <button class="action-btn" id="btn-edit-settings">EDIT SETTINGS</button>
                        </div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">RED</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">SPECTATOR</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">START</button>
                            <button class="leave-btn" id="btn-leave-lobby">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD (Will be hidden/shown based on script) -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-time">00:00</span>
            </div>
            <div class="hud-scores" id="hud-tdm-scores" style="display: none;">
                <div class="score-box score-blue">
                    <span class="score-label">BLUE</span>
                    <span id="hud-score-blue">0</span>
                </div>
                <div class="score-box score-red">
                    <span class="score-label">RED</span>
                    <span id="hud-score-red">0</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom">
            <div class="hud-stats">
                <div class="stat-item">
                    <span class="stat-label">KILLS</span>
                    <span id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">DEATHS</span>
                    <span id="hud-deaths">0</span>
                </div>
            </div>

            <div class="hud-player">
                <div class="status-bars">
                    <div class="bar-container">
                        <div id="health-bar" class="bar health"></div>
                    </div>
                    <div class="bar-container">
                        <div id="armor-bar" class="bar armor"></div>
                    </div>
                </div>
                <div class="ammo-info">
                    <i class="fa-solid fa-gun"></i>
                    <span id="hud-ammo">0</span>
                </div>
            </div>
        </div>

        <div id="countdown-display" style="display: none;">
            <div class="countdown-circle">
                <span id="countdown-number">10</span>
            </div>
        </div>
    </div>

    <!-- Winner Screen -->
    <!-- Scoreboard (Toggleable with TAB) -->
    <div id="scoreboard" style="display: none;">
        <div class="scoreboard-container">
            <header class="scoreboard-header">
                <h2 id="sb-lobby-name">LOBBY NAME</h2>
                <div id="sb-timer">00:00</div>
            </header>
            <div id="sb-content"></div>
        </div>
    </div>

    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title">MATCH ENDED</h1>
            <h2 id="winner-name">PLAYER WINS!</h2>
            <div id="match-stats-table"></div>

            <div class="map-voting-section">
                <h3>VOTE FOR NEXT MAP</h3>
                <div class="map-vote-grid" id="map-vote-grid"></div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
