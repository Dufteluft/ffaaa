<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1: FFA LOBBY & Tab 3: OFFENE LOBBYS (Shared List View) -->
                <main class="lobby-browser" id="browser-view">
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Entries injected by script.js -->
                    </div>
                </main>

                <!-- Tab 2: LOBBY ERSTELLEN -->
                <main class="create-lobby-view" id="create-view" style="display: none;">
                    <div class="create-form">
                        <div class="input-group">
                            <label data-locale="lobby_name">Lobby Name</label>
                            <input type="text" id="create-lobby-name" placeholder="Name eingeben...">
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label data-locale="map_select">Map auswählen</label>
                                <select id="create-map-select"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">Spielmodus</label>
                                <select id="create-mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">Team Deathmatch</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-group">
                            <label data-locale="loadout_select">Waffen-Loadout (Multi-Select)</label>
                            <div class="loadout-grid" id="loadout-checkboxes">
                                <!-- Checkboxes injected by script.js -->
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span data-locale="round_time">Rundenzeit</span>: <span id="val-round-time">15</span> Min</label>
                                <input type="range" id="create-round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">Max. Spieler</span>: <span id="val-max-players">16</span></label>
                                <input type="range" id="create-max-players" min="2" max="16" step="1" value="16">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span data-locale="respawn_time">Respawn-Zeit</span>: <span id="val-respawn-time">5</span> Sek</label>
                                <input type="range" id="create-respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">Kill-Limit zum Sieg</span>: <span id="val-kill-limit">30</span></label>
                                <input type="range" id="create-kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="toggle-group">
                                <span data-locale="vehicles_allowed">Fahrzeuge erlaubt</span>
                                <label class="switch">
                                    <input type="checkbox" id="create-vehicles">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="toggle-group">
                                <span data-locale="friendly_fire">Freundliches Feuer</span>
                                <label class="switch">
                                    <input type="checkbox" id="create-friendly-fire">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="confirm-btn" id="btn-submit-create" data-locale="btn_create">Lobby erstellen</button>
                            <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">Abbrechen</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title-display">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="players">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 data-locale="tab_create">SETTINGS</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection" id="team-selector-container">
                            <button class="team-btn" data-team="blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" data-locale="team_red">RED</button>
                            <button class="team-btn" data-team="spectator" data-locale="spectator">SPECTATOR</button>
                            <button class="team-btn" data-team="random" data-locale="random">RANDOM</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="Nachricht senden...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">Bereit</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">Spiel starten</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">Lobby verlassen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-right">
            <div class="hud-timer">
                <i class="fa-solid fa-clock"></i> <span id="hud-match-timer">00:00</span>
            </div>
            <div class="hud-score-container" id="hud-tdm-scores" style="display: none;">
                <div class="score-box blue">BLUE: <span id="score-blue">0</span></div>
                <div class="score-box red">RED: <span id="score-red">0</span></div>
            </div>
            <div class="hud-personal-stats">
                <div class="stat-item"><i class="fa-solid fa-crosshairs"></i> <span id="hud-kills">0</span></div>
                <div class="stat-item"><i class="fa-solid fa-skull"></i> <span id="hud-deaths">0</span></div>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-weapon">
                <div class="weapon-ammo"><span id="hud-ammo">0</span> <i class="fa-solid fa-bullet"></i></div>
            </div>
            <div class="hud-bars">
                <div class="bar-container health">
                    <div class="bar-fill" id="hud-health-fill" style="width: 100%;"></div>
                </div>
                <div class="bar-container armor">
                    <div class="bar-fill" id="hud-armor-fill" style="width: 0%;"></div>
                </div>
            </div>
        </div>
        <div id="hud-countdown" class="countdown-overlay" style="display: none;">
            <div class="countdown-number" id="countdown-text">10</div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-status" data-locale="game_ended">MATCH ENDED</h1>
            <h2 id="winner-name-display">PLAYER WINS!</h2>
            <div id="match-stats-container">
                <!-- Table injected by script.js -->
            </div>
            <!-- Map Voting -->
            <div class="map-voting" id="map-voting-container">
                <h3>VOTE FOR NEXT MAP</h3>
                <div class="voting-grid" id="voting-grid">
                    <!-- Maps injected by script.js -->
                </div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-lobby" data-locale="btn_ready">ZURÜCK</button>
                <button class="cancel-btn" id="btn-back-main" data-locale="btn_leave">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
