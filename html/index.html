<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Main Content -->
                <main class="lobby-browser">
                    <!-- FFA Lobby Tab -->
                    <div id="tab-ffa-content" class="tab-content active">
                        <div class="lobby-list" id="ffa-lobby-list">
                            <!-- Predefined matches will be injected here -->
                        </div>
                    </div>

                    <!-- Create Lobby Tab -->
                    <div id="tab-create-content" class="tab-content">
                        <div class="create-form">
                            <h2 data-locale="tab_create">Lobby erstellen</h2>
                            <div class="form-grid">
                                <div class="input-group">
                                    <label data-locale="lobby_name">Lobby Name</label>
                                    <input type="text" id="lobby-name" placeholder="...">
                                </div>
                                <div class="input-group">
                                    <label data-locale="map_select">Map auswählen</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="mode_select">Spielmodus</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">Team Deathmatch</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="loadout_select">Waffen-Loadout</label>
                                    <select id="loadout-select" multiple size="5"></select>
                                    <small>(Halte STRG für Mehrfachauswahl)</small>
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="round_time">Rundenzeit (Min)</span>: <span id="round-time-val">15</span></label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="max_players">Max. Spieler</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="32" step="1" value="16">
                                </div>
                                <div class="input-group toggle-group">
                                    <label data-locale="vehicles_allowed">Fahrzeuge erlaubt</label>
                                    <input type="checkbox" id="vehicles-allowed">
                                </div>
                                <div class="input-group toggle-group">
                                    <label data-locale="friendly_fire">Freundliches Feuer</label>
                                    <input type="checkbox" id="friendly-fire">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="respawn_time">Respawn-Zeit (Sek)</span>: <span id="respawn-time-val">5</span></label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="kill_limit">Kill-Limit zum Sieg</span>: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="confirm-btn" id="btn-create-lobby" data-locale="btn_create">Lobby erstellen</button>
                                <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">Abbrechen</button>
                            </div>
                        </div>
                    </div>

                    <!-- Open Lobbies Tab -->
                    <div id="tab-list-content" class="tab-content">
                        <div class="filter-bar">
                            <label><input type="checkbox" id="filter-not-full" checked> Nur verfügbare Plätze</label>
                        </div>
                        <div class="lobby-list" id="open-lobby-list">
                            <!-- Custom lobbies will be injected here -->
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2>LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">Spielerliste</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 data-locale="settings">Einstellungen</h3>
                        <div id="lobby-info-summary"></div>

                        <!-- Host Settings Editor (initially hidden) -->
                        <div id="host-settings-editor" style="display: none;">
                            <!-- Will be populated dynamically if host -->
                        </div>

                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" data-locale="team_blue">Blau</button>
                            <button class="team-btn" data-team="red" data-locale="team_red">Rot</button>
                            <button class="team-btn" data-team="spectator" data-locale="spectator">Zuschauer</button>
                            <button class="team-btn active" data-team="random" data-locale="random">Zufall</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">Bereit</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">Starten</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">Verlassen</button>
                            <button class="close-btn" id="btn-close-lobby" style="display: none;">Lobby schließen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 id="winner-title" data-locale="game_ended">MATCH ENDED</h1>
                <h2 id="winner-name-container"><span id="winner-name">PLAYER</span> <span data-locale="wins_suffix">GEWINNT!</span></h2>
                <div id="match-stats-table"></div>

                <div class="map-voting">
                    <h3 data-locale="vote_next_map">Nächste Map wählen</h3>
                    <div id="map-vote-list"></div>
                </div>

                <div class="btn-group">
                    <button class="confirm-btn" id="btn-back-to-lobby">Zurück zur Lobby</button>
                    <button class="cancel-btn" id="btn-back-to-menu">Hauptmenü</button>
                </div>
            </div>
        </div>

        <!-- Big Countdown -->
        <div id="big-countdown" style="display: none;">
            <span id="countdown-number">10</span>
        </div>
    </div>

    <!-- Gameplay HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="timer-box">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-timer">00:00</span>
            </div>
            <div class="score-box" id="hud-tdm-score" style="display: none;">
                <span class="team-blue-score">0</span>
                <span class="score-divider">:</span>
                <span class="team-red-score">0</span>
            </div>
        </div>

        <div class="hud-bottom">
            <div class="stats-box">
                <div class="stat-item">
                    <span class="stat-label" data-locale="kills">Kills</span>
                    <span id="hud-kills">0</span>
                </div>
            </div>

            <div class="player-bars">
                <div class="bar-container armor-container">
                    <div id="hud-armor-bar" class="bar"></div>
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div class="bar-container health-container">
                    <div id="hud-health-bar" class="bar"></div>
                    <i class="fa-solid fa-heart"></i>
                </div>
            </div>

            <div class="ammo-box">
                <i class="fa-solid fa-gun"></i>
                <span id="hud-ammo">0</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
