<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESX FFA LOBBY SYSTEM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA LOBBY</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">LOBBY ERSTELLEN</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">OFFENE LOBBYS</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <aside class="sidebar-stats">
                    <h3 data-locale="tab_stats">STATISTIKEN</h3>
                    <div class="stat-box">
                        <div class="stat-val" id="stat-kills">0</div>
                        <div class="stat-label" data-locale="kills">KILLS</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val" id="stat-deaths">0</div>
                        <div class="stat-label" data-locale="deaths">TODE</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val" id="stat-wins">0</div>
                        <div class="stat-label" data-locale="wins">SIEGE</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val" id="stat-kd">0.00</div>
                        <div class="stat-label" data-locale="kd_ratio">K/D</div>
                    </div>
                </aside>

                <!-- Tab 1 & 3: Lobby Browser (Shared container, content varies) -->
                <main class="lobby-browser" id="browser-view">
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Entries will be injected here -->
                    </div>
                </main>

                <!-- Tab 2: Create Lobby View -->
                <main class="create-view" id="create-view" style="display: none;">
                    <div class="create-container">
                        <div class="form-grid">
                            <div class="input-group">
                                <label data-locale="lobby_name">LOBBY NAME</label>
                                <input type="text" id="lobby-name" placeholder="...">
                            </div>
                            <div class="input-group">
                                <label data-locale="map_select">MAP AUSWÄHLEN</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">SPIELMODUS</label>
                                <select id="mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">TEAM DEATHMATCH</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label data-locale="loadout_select">WAFFEN-LOADOUT</label>
                                <select id="loadout-select" multiple class="multi-select"></select>
                            </div>
                            <div class="input-group">
                                <label><span data-locale="round_time">RUNDENZEIT</span>: <span id="round-time-val">15</span></label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">MAX. SPIELER</span>: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                            </div>
                            <div class="input-group toggle-group">
                                <label data-locale="vehicles_allowed">FAHRZEUGE ERLAUBT?</label>
                                <label class="switch">
                                    <input type="checkbox" id="vehicles-allowed">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="input-group toggle-group">
                                <label data-locale="friendly_fire">FREUNDLICHES FEUER</label>
                                <label class="switch">
                                    <input type="checkbox" id="friendly-fire">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="input-group">
                                <label><span data-locale="respawn_time">RESPAWN-ZEIT</span>: <span id="respawn-time-val">5</span></label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">KILL-LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>
                        <div class="btn-row">
                            <button class="confirm-btn" id="btn-create-lobby" data-locale="btn_create">LOBBY ERSTELLEN</button>
                            <button class="cancel-btn" id="btn-reset-create" data-locale="btn_cancel">ABBRECHEN</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2><span data-locale="tab_ffa">LOBBY</span>: <span id="lobby-title-display"></span></h2>
                    <div class="lobby-id-badge">ID: <span id="lobby-id-display"></span></div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">SPIELERLISTE</h3>
                        <div id="player-list-container"></div>
                    </div>
                    <div class="settings-section">
                        <div class="settings-header">
                            <h3 data-locale="tab_settings">EINSTELLUNGEN</h3>
                            <div id="host-controls" style="display: none;">
                                <button class="save-btn" id="btn-save-settings"><i class="fa-solid fa-floppy-disk"></i></button>
                            </div>
                        </div>
                        <div id="lobby-info-summary" class="info-grid"></div>

                        <div class="team-selection-area">
                            <button class="team-btn blue" data-team="blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn red" data-team="red" data-locale="team_red">RED</button>
                            <button class="team-btn spec" data-team="spectator" data-locale="spectator">SPECTATOR</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages-container"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="lobby-chat-input" placeholder="...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>

                        <div class="lobby-footer-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">BEREIT</button>
                            <button class="start-btn" id="btn-start-match" style="display: none;" data-locale="btn_start">START</button>
                            <button class="close-btn host-only" id="btn-close-lobby" style="display: none;">Lobby schließen</button>
                            <button class="leave-btn" id="btn-leave-match" data-locale="btn_leave">VERLASSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <div class="winner-header">
                    <h1 id="winner-label" data-locale="game_ended">RUNDE BEENDET!</h1>
                    <h2 id="winner-name-display"><span id="winner-name-text"></span> <span data-locale="wins_suffix">GEWINNT!</span></h2>
                </div>

                <div class="stats-container">
                    <table class="stats-table">
                        <thead>
                            <tr>
                                <th data-locale="player">SPIELER</th>
                                <th data-locale="kills">KILLS</th>
                                <th data-locale="deaths">TODE</th>
                                <th data-locale="kd_ratio">K/D</th>
                            </tr>
                        </thead>
                        <tbody id="winner-stats-body"></tbody>
                    </table>
                </div>

                <div class="map-voting" id="map-voting-section">
                    <h3 data-locale="vote_next_map">NÄCHSTE MAP WÄHLEN</h3>
                    <div class="vote-grid" id="vote-map-grid"></div>
                </div>

                <div class="winner-actions">
                    <button class="confirm-btn" id="btn-winner-back-lobby" data-locale="btn_back_lobby">ZURÜCK ZUR LOBBY</button>
                    <button class="cancel-btn" id="btn-winner-back-menu" data-locale="btn_back_menu">HAUPTMENÜ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-center">
            <div class="timer-box">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-timer">00:00</span>
            </div>
        </div>

        <div class="hud-top-right">
            <div class="score-container" id="hud-score-tdm" style="display: none;">
                <div class="team-score blue">
                    <span class="team-label">BLUE</span>
                    <span id="score-blue">0</span>
                </div>
                <div class="team-score red">
                    <span id="score-red">0</span>
                    <span class="team-label">RED</span>
                </div>
            </div>
            <div class="kill-feed" id="hud-kills">
                <div class="stat-item">
                    <span class="stat-label" data-locale="kills">KILLS</span>
                    <span id="hud-kill-count">0</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="weapon-info">
                <div class="ammo-count" id="hud-ammo">0</div>
                <div class="weapon-icon"><i class="fa-solid fa-gun"></i></div>
            </div>
            <div class="bars-container">
                <div class="hud-bar health">
                    <div class="bar-fill" id="health-fill" style="width: 100%;"></div>
                </div>
                <div class="hud-bar armor">
                    <div class="bar-fill" id="armor-fill" style="width: 0%;"></div>
                </div>
            </div>
        </div>

        <div id="big-countdown" style="display: none;">10</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
