<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- jQuery for easier DOM manipulation -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title l-menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active l-tab_ffa" data-tab="ffa">FFA Lobby</button>
                    <button class="tab-btn l-tab_create" data-tab="create">Lobby erstellen</button>
                    <button class="tab-btn l-tab_list" data-tab="list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab: FFA Lobby (Vordefiniert) & Tab: Offene Lobbys -->
                <main class="lobby-browser" id="lobby-browser-tab">
                    <div class="filter-bar" id="filter-bar" style="display: none;">
                         <div class="filter-group">
                            <label class="l-map_select">Map auswählen</label>
                            <select id="filter-maps">
                                <option value="all">Alle Maps</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label class="l-max_players">Max. Spieler</label>
                            <select id="filter-players">
                                <option value="all">Alle</option>
                                <option value="free">Nur freie Plätze</option>
                            </select>
                        </div>
                    </div>
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Einträge werden hier dynamisch eingefügt -->
                    </div>
                </main>

                <!-- Tab: Lobby erstellen -->
                <main class="create-section" id="create-lobby-tab" style="display: none;">
                    <div class="form-grid">
                        <div class="input-group full-width">
                            <label class="l-lobby_name">Lobby Name</label>
                            <input type="text" id="c-lobby-name" placeholder="...">
                        </div>
                        <div class="input-group">
                            <label class="l-map_select">Map auswählen</label>
                            <select id="c-map-select"></select>
                        </div>
                        <div class="input-group">
                            <label class="l-mode_select">Spielmodus</label>
                            <select id="c-mode-select">
                                <option value="ffa">FFA</option>
                                <option value="tdm">Team Deathmatch</option>
                            </select>
                        </div>

                        <div class="input-group full-width">
                            <label class="l-loadout_select">Waffen-Loadout (Mehrfachauswahl)</label>
                            <div class="checkbox-grid" id="c-loadout-grid">
                                <!-- Loadouts werden hier eingefügt -->
                            </div>
                        </div>

                        <div class="input-group">
                            <label><span class="l-round_time">Rundenzeit (Min)</span>: <span id="c-round-time-val">15</span></label>
                            <input type="range" id="c-round-time" min="5" max="30" step="5" value="15">
                        </div>
                        <div class="input-group">
                            <label><span class="l-max_players">Max. Spieler</span>: <span id="c-max-players-val">16</span></label>
                            <input type="range" id="c-max-players" min="2" max="16" step="1" value="16">
                        </div>

                        <div class="input-group">
                            <label><span class="l-respawn_time">Respawn-Zeit (Sek)</span>: <span id="c-respawn-time-val">5</span></label>
                            <input type="range" id="c-respawn-time" min="3" max="10" step="1" value="5">
                        </div>
                        <div class="input-group">
                            <label><span class="l-kill_limit">Kill-Limit zum Sieg</span>: <span id="c-kill-limit-val">30</span></label>
                            <input type="range" id="c-kill-limit" min="0" max="50" step="5" value="30">
                        </div>

                        <div class="toggle-group">
                            <label class="l-vehicles_allowed">Fahrzeuge erlaubt?</label>
                            <label class="switch">
                                <input type="checkbox" id="c-vehicles-allowed">
                                <span class="slider round"></span>
                            </label>
                        </div>
                        <div class="toggle-group">
                            <label class="l-friendly_fire">Freundliches Feuer</label>
                            <label class="switch">
                                <input type="checkbox" id="c-friendly-fire">
                                <span class="slider round"></span>
                            </label>
                        </div>
                    </div>
                    <div class="form-footer">
                        <button class="confirm-btn l-btn_create" id="btn-create-lobby-final">Lobby erstellen</button>
                        <button class="cancel-btn l-btn_cancel" id="btn-cancel-create">Abbrechen</button>
                    </div>
                </main>
            </div>
        </div>

        <!-- Lobby Wartebereich -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2>LOBBY: <span id="w-lobby-title">DEFAULT</span></h2>
                    <div class="lobby-id-badge">ID: <span id="w-lobby-id">0000</span></div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 class="l-player_list">Spieler</h3>
                        <div id="w-player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 class="l-lobby_settings">Einstellungen</h3>
                        <div id="w-settings-summary">
                            <!-- Hier können Hosts Einstellungen auch nachträglich ändern -->
                        </div>

                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="w-btn-blue"><i class="fa-solid fa-shield-halved"></i> <span class="l-team_blue">Blau</span></button>
                            <button class="team-btn" data-team="red" id="w-btn-red"><i class="fa-solid fa-skull-crossbones"></i> <span class="l-team_red">Rot</span></button>
                            <button class="team-btn" data-team="spectator" id="w-btn-spec"><i class="fa-solid fa-eye"></i> <span class="l-spectator">Zuschauer</span></button>
                        </div>

                        <div class="lobby-chat">
                            <div id="w-chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="w-chat-input" placeholder="Nachricht schreiben...">
                                <button id="w-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="w-btn-ready"><i class="fa-solid fa-check"></i> <span class="l-btn_ready">Bereit</span></button>
                            <button class="start-btn" id="w-btn-start" style="display: none;"><i class="fa-solid fa-play"></i> <span class="l-btn_start">Starten</span></button>
                            <button class="close-btn" id="w-btn-close" style="display: none;"><i class="fa-solid fa-xmark"></i> <span class="l-btn_close_lobby">Schließen</span></button>
                            <button class="leave-btn" id="w-btn-leave"><i class="fa-solid fa-right-from-bracket"></i> <span class="l-btn_leave">Verlassen</span></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Rundenende / Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <div class="winner-header">
                    <h1 class="l-game_ended">RUNDE BEENDET</h1>
                    <h2 id="winner-announcement">SPIELER <span class="l-winner_suffix">GEWINNT!</span></h2>
                </div>

                <div class="stats-container">
                    <table id="winner-stats-table">
                        <thead>
                            <tr>
                                <th class="l-tab_list">Name</th>
                                <th class="l-kills">Kills</th>
                                <th class="l-deaths">Tode</th>
                                <th class="l-kd_ratio">K/D</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div class="map-voting">
                    <h3 class="l-map_select">Nächste Map wählen</h3>
                    <div class="vote-grid" id="vote-map-grid"></div>
                </div>

                <div class="winner-footer">
                    <button class="confirm-btn l-btn_ready" id="btn-winner-stay">Zurück zur Lobby</button>
                    <button class="cancel-btn l-tab_ffa" id="btn-winner-exit">Hauptmenü</button>
                </div>
            </div>
        </div>
    </div>

    <!-- In-Game HUD -->
    <div id="hud" style="display: none;">
        <div class="hud-top">
            <div class="timer-box">
                <i class="fa-solid fa-clock"></i> <span id="h-timer">00:00</span>
            </div>
            <div class="score-board" id="h-tdm-score" style="display: none;">
                <div class="score-team blue">BLUE: <span id="h-score-blue">0</span></div>
                <div class="score-divider">VS</div>
                <div class="score-team red">RED: <span id="h-score-red">0</span></div>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="stat-row">
                <div class="hud-stat kills">
                    <label class="l-kills">KILLS</label>
                    <span id="h-kills">0</span>
                </div>
                <div class="hud-stat deaths">
                    <label class="l-deaths">DEATHS</label>
                    <span id="h-deaths">0</span>
                </div>
            </div>
            <div class="weapon-info">
                <div class="ammo-box">
                    <i class="fa-solid fa-gun"></i> <span id="h-ammo">0</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom-left">
            <div class="bar-container health">
                <div class="bar-fill" id="h-health-fill" style="width: 100%;"></div>
                <i class="fa-solid fa-heart"></i>
            </div>
            <div class="bar-container armor">
                <div class="bar-fill" id="h-armor-fill" style="width: 0%;"></div>
                <i class="fa-solid fa-shield"></i>
            </div>
        </div>

        <div id="hud-countdown" class="countdown-overlay" style="display: none;">
            <div class="countdown-number">10</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
