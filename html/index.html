<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="tab-ffa-btn">FFA LOBBY</button>
                    <button class="tab-btn" data-tab="create" id="tab-create-btn">LOBBY ERSTELLEN</button>
                    <button class="tab-btn" data-tab="list" id="tab-list-btn">OFFENE LOBBYS</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1 & 3: Lobby Browser -->
                <main class="lobby-browser" id="tab-browser">
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Entries will be injected here -->
                    </div>
                </main>

                <!-- Tab 2: Create Lobby -->
                <main class="create-lobby-panel" id="tab-create" style="display: none;">
                    <div class="form-container">
                        <div class="input-group">
                            <label>LOBBY NAME</label>
                            <input type="text" id="lobby-name" placeholder="NAME EINGEBEN...">
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label>MAP AUSWÄHLEN</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label>SPIELMODUS</label>
                                <select id="mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">TEAM DEATHMATCH</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>WAFFEN-LOADOUT (MULTI-SELECT)</label>
                            <div class="loadout-grid" id="loadout-checkboxes">
                                <!-- Checkboxes will be injected here via JS -->
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label>RUNDENZEIT (MIN): <span id="round-time-val">15</span></label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label>MAX. SPIELER: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label>RESPAWN-ZEIT (SEK): <span id="respawn-time-val">5</span></label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label>KILL-LIMIT ZUM SIEG: <span id="kill-limit-val">30</span></label>
                                <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>
                        <div class="input-row toggles">
                            <div class="toggle-group">
                                <label>FAHRZEUGE ERLAUBT?</label>
                                <label class="switch">
                                    <input type="checkbox" id="vehicles-allowed">
                                    <span class="slider-toggle round"></span>
                                </label>
                            </div>
                            <div class="toggle-group">
                                <label>FREUNDLICHES FEUER</label>
                                <label class="switch">
                                    <input type="checkbox" id="friendly-fire">
                                    <span class="slider-toggle round"></span>
                                </label>
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="confirm-btn" id="btn-create-lobby">LOBBY ERSTELLEN</button>
                            <button class="cancel-btn" id="btn-reset-form">ZURÜCKSETZEN</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Lobby Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">DEFAULT</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3>SPIELER <span id="player-count-header">(0/0)</span></h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>EINSTELLUNGEN</h3>
                        <div id="lobby-info-summary" class="info-grid"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">TEAM BLAU</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">TEAM ROT</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">ZUSCHAUER</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input" placeholder="NACHRICHT SENDEN...">
                                <i class="fa-solid fa-paper-plane"></i>
                            </div>
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">SPIEL STARTEN</button>
                            <button class="leave-btn" id="btn-leave-lobby">VERLASSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-left">
            <div class="hud-timer">
                <i class="fa-solid fa-clock"></i> <span id="hud-time">00:00</span>
            </div>
            <div class="hud-kills">
                <i class="fa-solid fa-skull"></i> <span id="hud-player-kills">0</span>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="hud-weapon">
                <div class="ammo-info">
                    <span id="hud-ammo-clip">0</span> / <span id="hud-ammo-total">0</span>
                </div>
            </div>
            <div class="hud-stats">
                <div class="hud-bar-container health">
                    <div class="hud-bar" id="hud-health-bar"></div>
                </div>
                <div class="hud-bar-container armor">
                    <div class="hud-bar" id="hud-armor-bar"></div>
                </div>
            </div>
        </div>

        <div class="hud-team-score" id="hud-team-score" style="display: none;">
            <div class="score-blue">BLAU: <span id="hud-score-blue">0</span></div>
            <div class="score-red">ROT: <span id="hud-score-red">0</span></div>
        </div>

        <div id="countdown-display" class="countdown-overlay" style="display: none;">
            <div id="countdown-number">10</div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title">RUNDE BEENDET</h1>
            <h2 id="winner-name">SPIELER GEWINNT!</h2>

            <div class="stats-container">
                <div id="match-stats-table"></div>
            </div>

            <div class="map-voting-section">
                <h3>NÄCHSTE MAP WÄHLEN</h3>
                <div class="map-vote-grid" id="map-vote-grid">
                    <!-- Maps will be injected here via JS -->
                </div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby">ZURÜCK ZUR LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
