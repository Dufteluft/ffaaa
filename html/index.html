<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Main Content: Depends on Active Tab -->
                <main class="content-area">

                    <!-- TAB 1 & 3: Lobby Browser (Shared Layout) -->
                    <div id="lobby-browser-tab" class="tab-content active">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </div>

                    <!-- TAB 2: Create Lobby -->
                    <div id="create-lobby-tab" class="tab-content">
                        <div class="create-form">
                            <div class="input-group">
                                <label data-locale="lobby_name">Lobby Name</label>
                                <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label data-locale="map_select">Map auswählen</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="mode_select">Spielmodus</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">Team Deathmatch</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label data-locale="loadout_select">Waffen-Loadout</label>
                                <div class="loadout-grid" id="loadout-multi-select">
                                    <!-- Loadout options as checkboxes -->
                                    <label class="checkbox-container">Pistole <input type="checkbox" value="pistol" checked><span class="checkmark"></span></label>
                                    <label class="checkbox-container">SMG <input type="checkbox" value="smg"><span class="checkmark"></span></label>
                                    <label class="checkbox-container">Sturmgewehr <input type="checkbox" value="assault"><span class="checkmark"></span></label>
                                    <label class="checkbox-container">Sniper <input type="checkbox" value="sniper"><span class="checkmark"></span></label>
                                    <label class="checkbox-container">Shotgun <input type="checkbox" value="shotgun"><span class="checkmark"></span></label>
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span data-locale="round_time">Rundenzeit (Min)</span>: <span id="round-time-val">15</span></label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="max_players">Max. Spieler</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group toggle-group">
                                    <label data-locale="vehicles_allowed">Fahrzeuge erlaubt</label>
                                    <label class="switch"><input type="checkbox" id="vehicles-allowed"><span class="slider round"></span></label>
                                </div>
                                <div class="input-group toggle-group">
                                    <label data-locale="friendly_fire">Freundliches Feuer</label>
                                    <label class="switch"><input type="checkbox" id="friendly-fire"><span class="slider round"></span></label>
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span data-locale="respawn_time">Respawn-Zeit (Sek)</span>: <span id="respawn-time-val">5</span></label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="kill_limit">Kill-Limit zum Sieg</span>: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="confirm-btn" id="btn-create-lobby" data-locale="btn_create">Lobby erstellen</button>
                                <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">Abbrechen</button>
                            </div>
                        </div>
                    </div>

                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="players">Spieler</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 data-locale="tab_create">Einstellungen</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue" data-locale="team_blue">Team Blau</button>
                            <button class="team-btn" data-team="red" id="btn-team-red" data-locale="team_red">Team Rot</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec" data-locale="spectator">Zuschauer</button>
                            <button class="team-btn" data-team="random" id="btn-team-random" data-locale="random">Zufall</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="NACHRICHT SENDEN...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">Bereit</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">Spiel starten</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">Lobby verlassen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="timer-box">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-timer">00:00</span>
            </div>
            <div class="score-box" id="hud-tdm-score" style="display: none;">
                <div class="team-score blue"><span id="score-blue">0</span></div>
                <div class="score-divider">VS</div>
                <div class="team-score red"><span id="score-red">0</span></div>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="weapon-info">
                <span id="weapon-ammo">0</span>
                <i class="fa-solid fa-gun"></i>
            </div>
            <div class="player-stats">
                <div class="stat-item"><span data-locale="kills">Kills</span>: <span id="hud-kills">0</span></div>
                <div class="stat-item"><span data-locale="deaths">Tode</span>: <span id="hud-deaths">0</span></div>
            </div>
            <div class="bars-container">
                <div class="bar-wrapper health"><div class="bar-fill" id="health-bar"></div></div>
                <div class="bar-wrapper armor"><div class="bar-fill" id="armor-bar"></div></div>
            </div>
        </div>

        <div id="countdown-display" style="display: none;">
            <div class="countdown-number">10</div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title" data-locale="game_ended">Runde beendet!</h1>
            <h2 id="winner-name">SPIELER GEWINNT!</h2>
            <div id="match-stats-table"></div>

            <div class="map-voting" id="map-voting-section">
                <h3>MAP VOTING</h3>
                <div class="vote-grid" id="vote-grid">
                    <!-- Maps for voting -->
                </div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
