<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container" id="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" id="l-menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="l-tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="l-tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="l-tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Sidebar: Filter (Nur sichtbar in Tab 1 & 3) -->
                <aside class="sidebar" id="sidebar-filters">
                    <div class="filter-group">
                        <label id="l-map_select">Map auswählen <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALLE MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="l-loadout_select">Waffen-Loadout <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALLE WAFFEN</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="l-max_players">Max. Spieler <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ALLE</option>
                            <option value="not-full">NICHT VOLL</option>
                        </select>
                    </div>
                </aside>

                <!-- Main Content -->
                <main class="lobby-browser">
                    <!-- Tab 1 & 3: Lobbyliste -->
                    <div id="lobby-list-view" class="tab-view active">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Einträge werden hier injiziert -->
                        </div>
                    </div>

                    <!-- Tab 2: Lobby erstellen -->
                    <div id="create-lobby-view" class="tab-view">
                        <div class="create-form">
                            <div class="input-group">
                                <label id="l-lobby_name">Lobby Name</label>
                                <input type="text" id="lobby-name" placeholder="Name eingeben...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label id="l-map_select_2">Map auswählen</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label id="l-mode_select">Spielmodus</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label id="l-loadout_select_2">Waffen-Loadout (Multi-Select)</label>
                                <div class="loadout-grid" id="loadout-multi-select">
                                    <!-- Checkboxen werden hier injiziert -->
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span id="l-round_time">Rundenzeit (Min)</span>: <span id="round-time-val">15</span></label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span id="l-max_players_2">Max. Spieler</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group toggle-group">
                                    <label id="l-vehicles_allowed">Fahrzeuge erlaubt</label>
                                    <label class="switch">
                                        <input type="checkbox" id="vehicles-allowed">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="input-group toggle-group">
                                    <label id="l-friendly_fire">Freundliches Feuer</label>
                                    <label class="switch">
                                        <input type="checkbox" id="friendly-fire">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span id="l-respawn_time">Respawn-Zeit (Sek)</span>: <span id="respawn-time-val">5</span></label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span id="l-kill_limit">Kill-Limit zum Sieg</span>: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="confirm-btn" id="btn-create-lobby-action">LOBBY ERSTELLEN</button>
                                <button class="cancel-btn" id="btn-cancel-create">ABBRECHEN</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2>LOBBY: <span id="lobby-title">Default</span></h2>
                    <div class="host-controls" style="display: none;">
                        <button class="edit-btn" id="btn-edit-settings"><i class="fa-solid fa-gear"></i></button>
                        <button class="close-btn" id="btn-close-lobby"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="l-players_title">SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 id="l-settings_title">EINSTELLUNGEN</h3>
                        <div id="lobby-info-summary" class="info-summary-grid"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="l-team_blue">TEAM BLAU</button>
                            <button class="team-btn" data-team="red" id="l-team_red">TEAM ROT</button>
                            <button class="team-btn" data-team="random" id="l-random">ZUFALL</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input" placeholder="Nachricht senden...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">START</button>
                            <button class="leave-btn" id="btn-leave-lobby">VERLASSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-center">
            <div class="countdown-display" id="hud-countdown" style="display: none;">10</div>
            <div class="timer-display" id="hud-timer">15:00</div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-stat-box">
                <div class="hud-label" id="l-kills_hud">KILLS</div>
                <div class="hud-value" id="hud-kills">0</div>
            </div>
            <div class="hud-stat-box">
                <div class="hud-label" id="l-deaths_hud">TODE</div>
                <div class="hud-value" id="hud-deaths">0</div>
            </div>
            <div class="hud-weapon-info">
                <div class="ammo-count" id="hud-ammo">30 / 120</div>
            </div>
        </div>
        <div class="hud-bottom-left">
            <div class="bars-container">
                <div class="hud-bar-bg"><div class="hud-bar health" id="hud-health-bar"></div></div>
                <div class="hud-bar-bg"><div class="hud-bar armor" id="hud-armor-bar"></div></div>
            </div>
        </div>
        <div class="tdm-score-hud" id="tdm-scores" style="display: none;">
            <div class="team-score blue">
                <span id="l-blue_score_label">BLAU</span>: <span id="hud-score-blue">0</span>
            </div>
            <div class="team-score red">
                <span id="l-red_score_label">ROT</span>: <span id="hud-score-red">0</span>
            </div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="l-game_ended">RUNDE BEENDET!</h1>
            <h2 id="winner-announcement"><span id="winner-name">SPIELER</span> <span id="l-wins_text">GEWINNT!</span></h2>

            <div class="winner-stats-container">
                <table class="stats-table" id="match-stats-table">
                    <thead>
                        <tr>
                            <th id="l-th_name">NAME</th>
                            <th id="l-th_kills">KILLS</th>
                            <th id="l-th_deaths">TODE</th>
                            <th id="l-th_kd">K/D</th>
                        </tr>
                    </thead>
                    <tbody id="stats-body"></tbody>
                </table>
            </div>

            <div class="map-voting-section">
                <h3 id="l-vote_map">NÄCHSTE MAP WÄHLEN</h3>
                <div class="map-voting-grid" id="map-voting-grid">
                    <!-- Map Voting Buttons -->
                </div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby">ZURÜCK ZUR LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
