<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header mit 3 Tabs -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="lobby" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1 & 3: Lobby Browser (wird durch JS gefiltert) -->
                <main class="tab-content active" id="tab-browser">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label data-locale="map_select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all">ANY</option>
                                <option value="not-full">NOT FULL</option>
                            </select>
                        </div>
                    </aside>
                    <div class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Einträge werden hier injiziert -->
                        </div>
                    </div>
                </main>

                <!-- Tab 2: Lobby erstellen -->
                <main class="tab-content" id="tab-create">
                    <div class="create-form-container">
                        <div class="form-grid">
                            <div class="form-left">
                                <div class="input-group">
                                    <label data-locale="lobby_name">LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="Name eingeben...">
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label data-locale="map_select">MAP</label>
                                        <select id="map-select"></select>
                                    </div>
                                    <div class="input-group">
                                        <label data-locale="mode_select">MODUS</label>
                                        <select id="mode-select">
                                            <option value="ffa">Free For All</option>
                                            <option value="tdm">Team Deathmatch</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label data-locale="loadout_select">WAFFEN-LOADOUT</label>
                                    <div class="multi-select" id="loadout-multi-select">
                                        <!-- Checkboxen werden hier injiziert -->
                                    </div>
                                </div>
                            </div>
                            <div class="form-right">
                                <div class="input-group">
                                    <label><span data-locale="round_time">RUNDENZEIT</span>: <span id="round-time-val">15</span> Min</label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="max_players">MAX. SPIELER</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="respawn_time">RESPAWN-ZEIT</span>: <span id="respawn-time-val">5</span> Sek</label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="kill_limit">KILL-LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                                <div class="toggle-row">
                                    <div class="toggle-group">
                                        <label data-locale="vehicles_allowed">FAHRZEUGE</label>
                                        <input type="checkbox" id="vehicles-allowed">
                                    </div>
                                    <div class="toggle-group">
                                        <label data-locale="friendly_fire">FRIENDLY FIRE</label>
                                        <input type="checkbox" id="friendly-fire">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="confirm-btn" id="btn-create-lobby" data-locale="btn_create">Lobby erstellen</button>
                            <button class="cancel-btn" id="btn-reset-form" data-locale="btn_cancel">Abbrechen</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Wartebereich / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2><span data-locale="tab_ffa">LOBBY</span>: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_list">SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>SETTINGS</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection" id="team-selection-container">
                            <button class="team-btn" data-team="blue" data-locale="team_blue">BLAU</button>
                            <button class="team-btn" data-team="red" data-locale="team_red">ROT</button>
                            <button class="team-btn" data-team="random" data-locale="random">ZUFALL</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="Nachricht senden...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">VERLASSEN</button>
                            <button class="edit-btn" id="btn-edit-settings" style="display: none;">EDIT</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer" id="hud-timer">00:00</div>
            <div class="hud-score" id="hud-score" style="display: none;">
                <span class="score-blue" id="score-blue">0</span>
                <span class="score-vs">VS</span>
                <span class="score-red" id="score-red">0</span>
            </div>
        </div>
        <div class="hud-bottom">
            <div class="hud-stats">
                <div class="stat-item">
                    <i class="fa-solid fa-crosshairs"></i>
                    <span id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <i class="fa-solid fa-skull"></i>
                    <span id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-player">
                <div class="bars">
                    <div class="bar-container health">
                        <div class="bar-fill" id="bar-health"></div>
                    </div>
                    <div class="bar-container armor">
                        <div class="bar-fill" id="bar-armor"></div>
                    </div>
                </div>
                <div class="ammo-info">
                    <i class="fa-solid fa-gun"></i>
                    <span id="hud-ammo">0</span>
                </div>
            </div>
        </div>
        <div id="countdown-display" class="countdown-overlay" style="display: none;">10</div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 data-locale="game_ended">RUNDE BEENDET</h1>
            <h2 id="winner-name">SPIELER GEWINNT!</h2>

            <div class="winner-content">
                <div id="match-stats-table"></div>

                <div class="map-voting">
                    <h3 data-locale="map_select">NÄCHSTE MAP WÄHLEN</h3>
                    <div class="vote-grid" id="vote-map-grid"></div>
                </div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-close-winner" data-locale="btn_cancel">SCHLIESSEN</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
