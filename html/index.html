<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa-lobby" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create-lobby" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="open-lobbies" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- TAB 1: FFA LOBBY -->
                <section id="ffa-lobby" class="tab-content active">
                    <div class="grid-container" id="quick-join-list">
                        <!-- Vordefinierte Maps werden hier eingefügt -->
                    </div>
                </section>

                <!-- TAB 2: LOBBY ERSTELLEN -->
                <section id="create-lobby" class="tab-content">
                    <div class="form-container">
                        <div class="input-group">
                            <label data-locale="lobby_name">Lobby Name</label>
                            <input type="text" id="input-lobby-name" placeholder="...">
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label data-locale="map_select">Map auswählen</label>
                                <select id="select-map"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">Spielmodus</label>
                                <select id="select-mode">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">Team Deathmatch</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-group">
                            <label data-locale="loadout_select">Waffen-Loadout</label>
                            <select id="select-loadout" multiple></select>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span data-locale="round_time">Rundenzeit (Min)</span>: <span id="val-round-time">15</span></label>
                                <input type="range" id="range-round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">Max. Spieler</span>: <span id="val-max-players">16</span></label>
                                <input type="range" id="range-max-players" min="2" max="16" step="1" value="16">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group toggle-group">
                                <label data-locale="vehicles_allowed">Fahrzeuge erlaubt?</label>
                                <input type="checkbox" id="check-vehicles">
                            </div>
                            <div class="input-group toggle-group">
                                <label data-locale="friendly_fire">Freundliches Feuer</label>
                                <input type="checkbox" id="check-friendly-fire">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span data-locale="respawn_time">Respawn-Zeit (Sek)</span>: <span id="val-respawn-time">5</span></label>
                                <input type="range" id="range-respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">Kill-Limit zum Sieg</span>: <span id="val-kill-limit">30</span></label>
                                <input type="range" id="range-kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="create-btn" id="btn-submit-create" data-locale="btn_create">Lobby erstellen</button>
                            <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">Abbrechen</button>
                        </div>
                    </div>
                </section>

                <!-- TAB 3: OFFENE LOBBYS -->
                <section id="open-lobbies" class="tab-content">
                    <div class="filter-bar">
                        <label>
                            <input type="checkbox" id="filter-free-slots"> Nur Lobbys mit freien Plätzen
                        </label>
                    </div>
                    <div class="lobby-table-container">
                        <table class="lobby-table">
                            <thead>
                                <tr>
                                    <th data-locale="lobby_name">Lobby-Name</th>
                                    <th>Host</th>
                                    <th>Spieler</th>
                                    <th>Map</th>
                                    <th>Modus</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="lobby-list-body">
                                <!-- Lobbys werden hier eingefügt -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>

        <!-- LOBBY WARTEBEREICH -->
        <div id="lobby-waiting-room" class="overlay" style="display: none;">
            <div class="waiting-room-content">
                <header class="waiting-header">
                    <h2 id="waiting-lobby-name">Lobby Name</h2>
                    <span class="status-badge" data-locale="waiting_for_players">Warte auf Spieler...</span>
                </header>
                <div class="waiting-grid">
                    <div class="player-list-area">
                        <h3 data-locale="tab_players">Spielerliste</h3>
                        <ul id="waiting-player-list"></ul>
                    </div>
                    <div class="settings-area">
                        <div class="team-selector">
                            <button class="team-btn blue" data-team="blue" data-locale="team_blue">Team Blau</button>
                            <button class="team-btn red" data-team="red" data-locale="team_red">Team Rot</button>
                            <button class="team-btn random" data-team="random" data-locale="random">Zufall</button>
                        </div>
                        <div class="lobby-chat">
                            <div class="chat-messages" id="lobby-chat-messages"></div>
                            <input type="text" id="lobby-chat-input" placeholder="Nachricht schreiben...">
                        </div>
                        <div class="action-buttons">
                            <button class="ready-btn" id="btn-ready" data-locale="btn_ready">Bereit</button>
                            <button class="start-btn host-only" id="btn-start" data-locale="btn_start" style="display: none;">Spiel starten</button>
                            <button class="leave-btn" id="btn-leave" data-locale="btn_leave">Lobby verlassen</button>
                            <button class="close-btn host-only" id="btn-close-lobby" data-locale="btn_close_lobby" style="display: none;">Lobby schließen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- GAME HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="timer-box">
                <i class="fa-regular fa-clock"></i>
                <span id="hud-timer">15:00</span>
            </div>
        </div>
        <div id="big-countdown" style="display: none;">10</div>
        <div class="hud-bottom-right">
            <div class="score-container" id="tdm-scores" style="display: none;">
                <div class="team-score blue">
                    <span class="team-label" data-locale="team_blue">BLUE</span>
                    <span id="score-blue">0</span>
                </div>
                <div class="team-score red">
                    <span class="team-label" data-locale="team_red">RED</span>
                    <span id="score-red">0</span>
                </div>
            </div>
            <div class="player-stats">
                <div class="stat-item">
                    <span data-locale="kills">KILLS</span>
                    <span id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span data-locale="deaths">DEATHS</span>
                    <span id="hud-deaths">0</span>
                </div>
            </div>
            <div class="vitals-container">
                <div class="vital-bar-bg"><div id="bar-health" class="vital-bar health"></div></div>
                <div class="vital-bar-bg"><div id="bar-armor" class="vital-bar armor"></div></div>
            </div>
            <div class="ammo-box">
                <i class="fa-solid fa-gun"></i>
                <span id="hud-ammo">30</span>
            </div>
        </div>
    </div>

    <!-- WINNER SCREEN -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-container">
            <h1 id="win-status" data-locale="game_ended">RUNDE BEENDET!</h1>
            <h2 id="winner-display">PLAYER <span data-locale="winner_suffix">GEWINNT!</span></h2>

            <div class="stats-table-wrapper">
                <table class="stats-table">
                    <thead>
                        <tr>
                            <th>RANK</th>
                            <th data-locale="tab_players">SPIELER</th>
                            <th data-locale="kills">KILLS</th>
                            <th data-locale="deaths">DEATHS</th>
                            <th data-locale="kd_ratio">K/D</th>
                        </tr>
                    </thead>
                    <tbody id="winner-stats-body"></tbody>
                </table>
            </div>

            <div class="map-voting">
                <h3 data-locale="map_select">Nächste Map wählen</h3>
                <div class="vote-grid" id="vote-map-list"></div>
            </div>

            <div class="winner-actions">
                <button class="confirm-btn" id="btn-winner-close">OK</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
