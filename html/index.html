<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active l-tab_ffa" data-tab="ffa">FFA LOBBY</button>
                    <button class="tab-btn l-tab_create" data-tab="create">LOBBY ERSTELLEN</button>
                    <button class="tab-btn l-tab_list" data-tab="list">OFFENE LOBBYS</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Left Panel: Filters -->
                <aside class="sidebar">
                    <div class="filter-group">
                        <label>MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                            <option value="legion">LEGION SQUARE</option>
                            <option value="sandy">SANDY SHORES</option>
                            <option value="airport">AIRPORT</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>WEAPONS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                            <option value="pistols">PISTOLS ONLY</option>
                            <option value="snipers">SNIPERS ONLY</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>TIME <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-time">
                            <option value="all">ANY TIME</option>
                            <option value="short">5-10 MIN</option>
                            <option value="long">15+ MIN</option>
                        </select>
                    </div>

                    <button class="create-btn" id="open-create-modal">CREATE LOBBY</button>
                </aside>

                <!-- Main Content: Lobby List -->
                <main class="lobby-browser">
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Entries will be injected here -->
                    </div>
                </main>
            </div>
        </div>

        <!-- Create Lobby Modal (Hidden by default) -->
        <div id="create-lobby-modal" class="overlay" style="display: none;">
             <div class="modal-content">
                <h2>CREATE CUSTOM LOBBY</h2>
                <div class="form-container">
                    <div class="input-group">
                        <label>LOBBY NAME</label>
                        <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label>MAP</label>
                            <select id="map-select"></select>
                        </div>
                        <div class="input-group">
                            <label>MODE</label>
                            <select id="mode-select">
                                <option value="ffa">FFA</option>
                                <option value="tdm">TEAM DEATHMATCH</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="l-loadout_select">WAFFEN-LOADOUT</label>
                        <div class="loadout-grid" id="loadout-grid">
                            <!-- Checkboxes injected by JS -->
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label class="l-round_time">RUNDENZEIT (MIN): <span id="round-time-val">15</span></label>
                            <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                        </div>
                        <div class="input-group">
                            <label class="l-max_players">MAX. SPIELER: <span id="max-players-val">16</span></label>
                            <input type="range" id="max-players" min="2" max="32" step="1" value="16">
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label class="l-respawn_time">RESPAWN-ZEIT (SEK): <span id="respawn-time-val">5</span></label>
                            <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                        </div>
                        <div class="input-group">
                            <label class="l-kill_limit">KILL-LIMIT: <span id="kill-limit-val">0</span></label>
                            <input type="range" id="kill-limit" min="0" max="50" step="5" value="0">
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="toggle-group">
                            <label class="l-vehicles_allowed">FAHRZEUGE</label>
                            <label class="switch">
                                <input type="checkbox" id="toggle-vehicles">
                                <span class="slider-toggle"></span>
                            </label>
                        </div>
                        <div class="toggle-group">
                            <label class="l-friendly_fire">FRIENDLY FIRE</label>
                            <label class="switch">
                                <input type="checkbox" id="toggle-ff">
                                <span class="slider-toggle"></span>
                            </label>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="confirm-btn" id="btn-create-lobby">CREATE</button>
                        <button class="cancel-btn" id="btn-close-modal">CANCEL</button>
                    </div>
                </div>
             </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3>PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>SETTINGS</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">RED</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">SPECTATOR</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">START</button>
                            <button class="leave-btn" id="btn-leave-lobby">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD (In-Game Stats) -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-time">15:00</span>
            </div>
            <div class="hud-scores" id="hud-scores-tdm" style="display: none;">
                <div class="score-team blue">
                    <span class="score-val" id="score-blue">0</span>
                    <label class="l-team_blue">BLUE</label>
                </div>
                <div class="score-divider">:</div>
                <div class="score-team red">
                    <label class="l-team_red">RED</label>
                    <span class="score-val" id="score-red">0</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom">
            <div class="hud-player-stats">
                <div class="stat-item">
                    <i class="fa-solid fa-skull"></i>
                    <span id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <i class="fa-solid fa-crosshairs"></i>
                    <span id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-vitals">
                <div class="vital-row">
                    <i class="fa-solid fa-heart"></i>
                    <div class="progress-bar-bg">
                        <div id="hud-health" class="progress-bar health" style="width: 100%;"></div>
                    </div>
                </div>
                <div class="vital-row">
                    <i class="fa-solid fa-shield-halved"></i>
                    <div class="progress-bar-bg">
                        <div id="hud-armor" class="progress-bar armor" style="width: 0%;"></div>
                    </div>
                </div>
            </div>
            <div class="hud-weapon">
                <div class="ammo-count">
                    <span id="hud-ammo-clip">30</span>
                </div>
                <i class="fa-solid fa-gun"></i>
            </div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title" class="l-game_ended">MATCH ENDED</h1>
            <h2 id="winner-name">PLAYER WINS!</h2>

            <div class="winner-content-grid">
                <div id="match-stats-table"></div>

                <div class="map-voting-section">
                    <h3 class="l-vote_next_map">VOTE NEXT MAP</h3>
                    <div class="voting-grid" id="voting-grid">
                        <!-- Maps injected by JS -->
                    </div>
                </div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn l-btn_back_to_lobby" id="btn-back-to-lobby">BACK TO LOBBY</button>
                <button class="cancel-btn l-btn_back_to_menu" id="btn-back-to-menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
