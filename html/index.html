<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESX FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <!-- Haupt-Container für das Menü -->
        <div id="main-container" class="main-container">
            <!-- Header mit Tabs -->
            <header class="main-header">
                <h1 class="header-title" id="l-menu-title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="l-tab-ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="l-tab-create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="l-tab-list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Linkes Panel: Filter (Nur sichtbar in Tab 1 und 3) -->
                <aside class="sidebar" id="sidebar-filters">
                    <div class="filter-group">
                        <label id="l-map-select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALLE MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="l-loadout-select">WEAPONS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALLE WAFFEN</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="l-max-players">SPIELER <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">EGAL</option>
                            <option value="not-full">NICHT VOLL</option>
                        </select>
                    </div>
                </aside>

                <!-- Hauptbereich: Lobbyliste oder Erstellungs-Formular -->
                <main class="lobby-browser">
                    <!-- Tab 1 & 3: Lobby Liste -->
                    <div id="lobby-list-view" class="tab-view active">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Einträge werden via JS injiziert -->
                        </div>
                    </div>

                    <!-- Tab 2: Lobby Erstellen -->
                    <div id="create-lobby-view" class="tab-view">
                        <div class="create-form">
                            <h2 id="l-tab-create-title">CUSTOM LOBBY KONFIGURIEREN</h2>
                            <div class="form-grid">
                                <div class="input-group full-width">
                                    <label id="l-lobby-name">LOBBY NAME</label>
                                    <input type="text" id="create-lobby-name" placeholder="Name eingeben...">
                                </div>
                                <div class="input-group">
                                    <label id="l-map-select-create">MAP WÄHLEN</label>
                                    <select id="create-map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label id="l-mode-select">SPIELMODUS</label>
                                    <select id="create-mode-select">
                                        <option value="ffa">Free-for-All (FFA)</option>
                                        <option value="tdm">Team Deathmatch (TDM)</option>
                                    </select>
                                </div>
                                <div class="input-group full-width">
                                    <label id="l-loadout-select-create">WAFFEN-LOADOUT (MULTI-SELECT)</label>
                                    <div class="weapon-grid" id="create-weapon-grid">
                                        <!-- Checkboxen werden via JS injiziert -->
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label><span id="l-round-time">RUNDENZEIT</span>: <span id="val-round-time">15</span> MIN</label>
                                    <input type="range" id="create-round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span id="l-max-players-create">MAX. SPIELER</span>: <span id="val-max-players">16</span></label>
                                    <input type="range" id="create-max-players" min="2" max="16" step="1" value="16">
                                </div>
                                <div class="input-group">
                                    <label id="l-vehicles-allowed">FAHRZEUGE ERLAUBT?</label>
                                    <div class="toggle-switch">
                                        <input type="checkbox" id="create-vehicles">
                                        <span class="slider"></span>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label id="l-friendly-fire">FRIENDLY FIRE</label>
                                    <div class="toggle-switch">
                                        <input type="checkbox" id="create-ff">
                                        <span class="slider"></span>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label><span id="l-respawn-time">RESPAWN ZEIT</span>: <span id="val-respawn-time">5</span> SEK</label>
                                    <input type="range" id="create-respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span id="l-kill-limit">KILL LIMIT</span>: <span id="val-kill-limit">30</span></label>
                                    <input type="range" id="create-kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="btn-primary" id="btn-submit-create"><i class="fa-solid fa-plus"></i> <span id="l-btn-create">LOBBY ERSTELLEN</span></button>
                                <button class="btn-secondary" id="btn-cancel-create"><span id="l-btn-cancel">ABBRECHEN</span></button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Wartebereich / Lobby Screen (Nach Beitritt/Erstellung) -->
        <div id="lobby-waiting-view" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2>LOBBY: <span id="waiting-lobby-name">NAME</span></h2>
                    <div class="lobby-status-tag" id="waiting-lobby-status">WARTEBEREICH</div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="l-players-title">SPIELER (<span id="waiting-player-count">0</span>)</h3>
                        <div id="waiting-player-list" class="player-list">
                            <!-- Spieler werden via JS injiziert -->
                        </div>
                    </div>
                    <div class="lobby-info-section">
                        <div class="info-grid">
                            <div class="info-item">
                                <label id="l-map-label">MAP</label>
                                <span id="waiting-map-name">-</span>
                            </div>
                            <div class="info-item">
                                <label id="l-mode-label">MODUS</label>
                                <span id="waiting-mode-name">-</span>
                            </div>
                            <div class="info-item">
                                <label id="l-time-label">ZEIT</label>
                                <span id="waiting-round-time">-</span>
                            </div>
                        </div>

                        <div class="team-selection" id="team-selector">
                            <button class="team-btn blue" data-team="blue" id="l-team-blue">TEAM BLAU</button>
                            <button class="team-btn red" data-team="red" id="l-team-red">TEAM ROT</button>
                            <button class="team-btn spec" data-team="spectator" id="l-spectator">ZUSCHAUER</button>
                            <button class="team-btn random" data-team="random" id="l-random">ZUFALL</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="lobby-chat-messages" class="chat-container"></div>
                            <div class="chat-input-row">
                                <input type="text" id="lobby-chat-input" placeholder="Nachricht schreiben...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>

                        <div class="lobby-footer-actions">
                            <button class="btn-ready" id="btn-lobby-ready"><i class="fa-solid fa-check"></i> <span id="l-btn-ready">BEREIT</span></button>
                            <button class="btn-start" id="btn-lobby-start" style="display: none;"><i class="fa-solid fa-play"></i> <span id="l-btn-start">SPIEL STARTEN</span></button>
                            <button class="btn-leave" id="btn-lobby-leave"><i class="fa-solid fa-right-from-bracket"></i> <span id="l-btn-leave">VERLASSEN</span></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- In-Game HUD -->
    <div id="hud-container" style="display: none;">
        <div class="hud-top">
            <div class="timer-box">
                <i class="fa-regular fa-clock"></i>
                <span id="hud-timer">15:00</span>
            </div>
            <div class="tdm-scores" id="hud-tdm-scores" style="display: none;">
                <div class="score-blue">BLAU: <span id="hud-score-blue">0</span></div>
                <div class="score-red"><span id="hud-score-red">0</span> :ROT</div>
            </div>
        </div>
        <div class="hud-bottom-left">
            <div class="stats-row">
                <div class="stat-item">
                    <span class="label" id="l-hud-kills">KILLS</span>
                    <span class="value" id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="label" id="l-hud-deaths">DEATHS</span>
                    <span class="value" id="hud-deaths">0</span>
                </div>
            </div>
            <div class="bars-container">
                <div class="bar-wrapper health">
                    <div class="bar-fill" id="hud-health-fill" style="width: 100%;"></div>
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="bar-wrapper armor">
                    <div class="bar-fill" id="hud-armor-fill" style="width: 0%;"></div>
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="ammo-box">
                <span id="hud-ammo">30 / 120</span>
                <i class="fa-solid fa-gun"></i>
            </div>
        </div>
        <div id="countdown-display" class="countdown-overlay" style="display: none;">
            <span id="countdown-number">10</span>
        </div>
    </div>

    <!-- Rundenende / Winner Screen -->
    <div id="winner-view" class="overlay" style="display: none;">
        <div class="winner-container">
            <h1 id="l-game-ended">RUNDE BEENDET</h1>
            <div class="winner-announcement">
                <span id="winner-name">PLAYER</span> <span id="l-winner-suffix">GEWINNT!</span>
            </div>

            <div class="stats-summary">
                <table id="winner-stats-table">
                    <thead>
                        <tr>
                            <th id="l-stat-name">NAME</th>
                            <th id="l-stat-kills">KILLS</th>
                            <th id="l-stat-deaths">TODE</th>
                            <th id="l-stat-kd">K/D</th>
                        </tr>
                    </thead>
                    <tbody id="winner-stats-body">
                        <!-- Statistiken werden via JS injiziert -->
                    </tbody>
                </table>
            </div>

            <div class="map-voting">
                <h3 id="l-vote-map">NÄCHSTE MAP WÄHLEN</h3>
                <div class="vote-grid" id="vote-map-grid">
                    <!-- Maps zum Voten werden via JS injiziert -->
                </div>
            </div>

            <div class="winner-actions">
                <button class="btn-primary" id="btn-winner-back"><i class="fa-solid fa-rotate-left"></i> <span id="l-btn-back-lobby">ZUR LOBBY</span></button>
                <button class="btn-secondary" id="btn-winner-menu"><i class="fa-solid fa-house"></i> <span id="l-btn-main-menu">HAUPTMENÜ</span></button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
