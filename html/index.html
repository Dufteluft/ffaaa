<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Main Content: Lobby Browser / Creation -->
                <main class="main-content">
                    <!-- Tab 1 & 3: Lobby List (Shared Container) -->
                    <div id="tab-lobby-list" class="tab-content active">
                        <div class="lobby-list-header">
                             <div class="filter-bar">
                                 <div class="filter-item">
                                     <i class="fa-solid fa-filter"></i>
                                     <select id="filter-slots">
                                         <option value="all">Alle Lobbys</option>
                                         <option value="free">Nur Lobbys mit freien Plätzen</option>
                                     </select>
                                 </div>
                             </div>
                        </div>
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </div>

                    <!-- Tab 2: Create Lobby -->
                    <div id="tab-create-lobby" class="tab-content">
                        <div class="create-form-container">
                            <h2 data-locale="tab_create">LOBBY ERSTELLEN</h2>
                            <div class="form-grid">
                                <div class="input-group">
                                    <label data-locale="lobby_name">LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="Name eingeben...">
                                </div>
                                <div class="input-group">
                                    <label data-locale="map_select">MAP AUSWÄHLEN</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="mode_select">SPIELMODUS</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="loadout_select">WAFFEN-LOADOUT</label>
                                    <select id="loadout-select" multiple size="5"></select>
                                    <small style="color: var(--text-muted); font-size: 10px; margin-top: 5px;">STRG halten für Mehrfachauswahl</small>
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="round_time">RUNDENZEIT (MIN)</span>: <span id="round-time-val">15</span></label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="max_players">MAX. SPIELER</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="32" step="1" value="16">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="respawn_time">RESPAWN-ZEIT (SEK)</span>: <span id="respawn-time-val">5</span></label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="kill_limit">KILL-LIMIT ZUM SIEG</span>: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                    <small style="color: var(--text-muted); font-size: 10px;">0 = Deaktiviert</small>
                                </div>
                                <div class="toggle-group">
                                    <label class="switch-label">
                                        <span data-locale="vehicles_allowed">FAHRZEUGE ERLAUBT</span>
                                        <label class="switch">
                                            <input type="checkbox" id="vehicles-allowed">
                                            <span class="slider-round"></span>
                                        </label>
                                    </label>
                                    <label class="switch-label">
                                        <span data-locale="friendly_fire">FREUNDLICHES FEUER</span>
                                        <label class="switch">
                                            <input type="checkbox" id="friendly-fire">
                                            <span class="slider-round"></span>
                                        </label>
                                    </label>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="create-btn" id="btn-create-lobby" data-locale="btn_create">LOBBY ERSTELLEN</button>
                                <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">ABBRECHEN</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-title">LOBBY NAME</h2>
                    <div id="lobby-status-badge" class="badge">WARTEN</div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">SPIELERLISTE</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 data-locale="tab_settings">EINSTELLUNGEN</h3>
                        <div id="lobby-info-summary" class="info-summary"></div>

                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue" data-locale="team_blue">BLAU</button>
                            <button class="team-btn" data-team="red" id="btn-team-red" data-locale="team_red">ROT</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec" data-locale="spectator">ZUSCHAUER</button>
                            <button class="team-btn" data-team="random" id="btn-team-random" data-locale="random">ZUFALL</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input" placeholder="Nachricht senden...">
                                <i class="fa-solid fa-paper-plane"></i>
                            </div>
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">SPIEL STARTEN</button>
                            <button class="close-btn" id="btn-close-lobby" style="display: none;" data-locale="btn_close">LOBBY SCHLIEßEN</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">LOBBY VERLASSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Countdown Overlay -->
        <div id="countdown-overlay" class="overlay" style="display: none; background: rgba(0,0,0,0.5);">
            <div id="big-countdown"></div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 data-locale="game_ended">RUNDE BEENDET</h1>
                <h2 id="winner-name">SPIELER GEWINNT!</h2>

                <div class="match-stats-container">
                    <div id="match-stats-table"></div>
                </div>

                <div class="map-voting">
                    <h3 data-locale="map_select">NÄCHSTE MAP WÄHLEN</h3>
                    <div id="map-vote-list" class="vote-list"></div>
                </div>

                <div class="winner-actions">
                    <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_back_lobby">ZURÜCK ZUR LOBBY</button>
                    <button class="cancel-btn" id="btn-back-to-menu" data-locale="btn_back_menu">HAUPTMENÜ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud" style="display: none;">
        <div class="hud-container">
            <div class="hud-top">
                <div class="hud-timer-box">
                    <i class="fa-solid fa-clock"></i>
                    <span id="hud-timer">00:00</span>
                </div>
                <div class="hud-tdm-score" id="hud-tdm-score" style="display: none;">
                    <div class="score-blue">
                        <span class="team-dot"></span>
                        <span id="hud-score-blue">0</span>
                    </div>
                    <div class="score-separator">:</div>
                    <div class="score-red">
                        <span id="hud-score-red">0</span>
                        <span class="team-dot"></span>
                    </div>
                </div>
            </div>

            <div class="hud-bottom-left">
                <div class="hud-stat-box">
                    <span class="stat-label" data-locale="kills">KILLS</span>
                    <span id="hud-kills" class="stat-value">0</span>
                </div>
                <div class="hud-stat-box">
                    <span class="stat-label" data-locale="deaths">TODE</span>
                    <span id="hud-deaths" class="stat-value">0</span>
                </div>
            </div>

            <div class="hud-bottom-right">
                <div class="weapon-info">
                    <div id="hud-ammo" class="ammo-count">0</div>
                    <div class="weapon-icon"><i class="fa-solid fa-gun"></i></div>
                </div>
                <div class="player-bars">
                    <div class="bar-container">
                        <div id="hud-health" class="bar-fill health"></div>
                    </div>
                    <div class="bar-container">
                        <div id="hud-armor" class="bar-fill armor"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
