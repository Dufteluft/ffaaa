<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="lobby" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab FFA & LOBBY List -->
                <main class="lobby-browser" id="browser-tab">
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Einträge werden hier injiziert -->
                    </div>
                </main>

                <!-- Tab CREATE -->
                <main class="create-section" id="create-tab" style="display: none;">
                    <div class="form-container">
                        <div class="input-group">
                            <label data-locale="lobby_name">Lobby Name</label>
                            <input type="text" id="create-lobby-name" placeholder="...">
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label data-locale="map_select">Map auswählen</label>
                                <select id="create-map-select"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">Spielmodus</label>
                                <select id="create-mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">TEAM DEATHMATCH</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-group">
                            <label data-locale="loadout_select">Waffen-Loadout</label>
                            <div class="loadout-grid" id="loadout-checkboxes">
                                <!-- Checkboxes for loadouts -->
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span data-locale="round_time">Rundenzeit</span>: <span id="round-time-val">15</span></label>
                                <input type="range" id="create-round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">Max. Spieler</span>: <span id="max-players-val">16</span></label>
                                <input type="range" id="create-max-players" min="2" max="32" step="1" value="16">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group toggle-group">
                                <label data-locale="vehicles_allowed">Fahrzeuge erlaubt</label>
                                <label class="switch">
                                    <input type="checkbox" id="create-vehicles">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="input-group toggle-group">
                                <label data-locale="friendly_fire">Freundliches Feuer</label>
                                <label class="switch">
                                    <input type="checkbox" id="create-ff">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span data-locale="respawn_time">Respawn-Zeit</span>: <span id="respawn-time-val">5</span>s</label>
                                <input type="range" id="create-respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">Kill-Limit</span>: <span id="kill-limit-val">30</span></label>
                                <input type="range" id="create-kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="confirm-btn" id="btn-create-lobby-final" data-locale="btn_create">Lobby erstellen</button>
                            <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">Abbrechen</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="col_name">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 data-locale="tab_create">SETTINGS</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red" data-locale="team_red">RED</button>
                            <button class="team-btn" data-team="random" id="btn-team-random" data-locale="random">RANDOM</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-right">
            <div class="hud-timer">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-time">15:00</span>
            </div>
            <div class="hud-score-board" id="hud-tdm-score" style="display: none;">
                <div class="team-score blue"><span class="score-label">BLUE</span> <span id="score-blue">0</span></div>
                <div class="team-score red"><span id="score-red">0</span> <span class="score-label">RED</span></div>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="hud-stats">
                <div class="stat-item">
                    <span class="stat-label" data-locale="kills">KILLS</span>
                    <span class="stat-value" id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label" data-locale="deaths">DEATHS</span>
                    <span class="stat-value" id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-vitals">
                <div class="vital-bar armor-bar">
                    <div class="bar-fill" id="hud-armor-fill" style="width: 100%;"></div>
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div class="vital-bar health-bar">
                    <div class="bar-fill" id="hud-health-fill" style="width: 100%;"></div>
                    <i class="fa-solid fa-heart"></i>
                </div>
            </div>
            <div class="hud-ammo">
                <span id="hud-ammo-val">100</span>
                <i class="fa-solid fa-gun"></i>
            </div>
        </div>

        <div class="kill-notification" id="kill-feed"></div>
        <div class="countdown-overlay" id="countdown-display" style="display: none;">10</div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title" data-locale="game_ended">MATCH ENDED</h1>
            <h2 id="winner-name">PLAYER WINS!</h2>
            <div id="match-stats-table" class="stats-table-container"></div>

            <div class="map-voting" id="map-voting-section">
                <h3 data-locale="map_select">VOTE NEXT MAP</h3>
                <div class="vote-grid" id="vote-grid-container"></div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_back_lobby">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu" data-locale="btn_back_menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
