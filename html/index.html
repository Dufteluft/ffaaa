<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="lobby" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1 & 3: Lobby Browser (Shared Layout) -->
                <div id="tab-browser" class="tab-content active">
                    <div class="browser-layout">
                        <!-- Sidebar: Filters -->
                        <aside class="sidebar">
                            <div class="filter-group">
                                <label data-locale="map_select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                                <select id="filter-maps">
                                    <option value="all">ALL MAPS</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label data-locale="players">PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                                <select id="filter-players">
                                    <option value="all">ANY</option>
                                    <option value="not-full">NOT FULL</option>
                                </select>
                            </div>
                            <div class="sidebar-info">
                                <p>F5 zum Schließen</p>
                            </div>
                        </aside>

                        <!-- Main Content: Lobby List -->
                        <main class="lobby-browser">
                            <div class="lobby-list" id="lobby-list-container">
                                <!-- Entries injected by script.js -->
                            </div>
                        </main>
                    </div>
                </div>

                <!-- Tab 2: Create Lobby -->
                <div id="tab-create" class="tab-content">
                    <div class="create-lobby-container">
                        <div class="create-form">
                            <div class="form-scroll">
                                <div class="input-group">
                                    <label data-locale="lobby_name">LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="Name eingeben...">
                                </div>

                                <div class="input-row">
                                    <div class="input-group">
                                        <label data-locale="map_select">MAP</label>
                                        <select id="map-select"></select>
                                    </div>
                                    <div class="input-group">
                                        <label data-locale="mode_select">SPIELMODUS</label>
                                        <select id="mode-select">
                                            <option value="ffa">FFA</option>
                                            <option value="tdm">TEAM DEATHMATCH</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="input-group">
                                    <label data-locale="loadout_select">WAFFEN-LOADOUT (MULTI-SELECT)</label>
                                    <div class="checkbox-grid" id="loadout-checkboxes">
                                        <!-- Injected by script.js -->
                                    </div>
                                </div>

                                <div class="input-row">
                                    <div class="input-group">
                                        <label><span data-locale="round_time">RUNDENZEIT</span>: <span id="round-time-val">15</span> MIN</label>
                                        <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                    </div>
                                    <div class="input-group">
                                        <label><span data-locale="max_players">MAX. SPIELER</span>: <span id="max-players-val">16</span></label>
                                        <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                    </div>
                                </div>

                                <div class="input-row">
                                    <div class="input-group">
                                        <label><span data-locale="respawn_time">RESPAWN-ZEIT</span>: <span id="respawn-time-val">5</span> SEK</label>
                                        <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                    </div>
                                    <div class="input-group">
                                        <label><span data-locale="kill_limit">KILL-LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                        <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                    </div>
                                </div>

                                <div class="toggle-row">
                                    <div class="toggle-group">
                                        <label data-locale="vehicles_allowed">FAHRZEUGE ERLAUBT</label>
                                        <label class="switch">
                                            <input type="checkbox" id="vehicles-allowed">
                                            <span class="slider-toggle"></span>
                                        </label>
                                    </div>
                                    <div class="toggle-group">
                                        <label data-locale="friendly_fire">FREUNDLICHES FEUER</label>
                                        <label class="switch">
                                            <input type="checkbox" id="friendly-fire">
                                            <span class="slider-toggle"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="btn-group">
                                <button class="confirm-btn" id="btn-create-lobby" data-locale="btn_create">LOBBY ERSTELLEN</button>
                                <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">ABBRECHEN</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">DEFAULT</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_list">SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>SETTINGS</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection" id="team-selector-box">
                            <button class="team-btn" data-team="blue" data-locale="team_blue">BLAU</button>
                            <button class="team-btn" data-team="red" data-locale="team_red">ROT</button>
                            <button class="team-btn" data-team="random" data-locale="random">ZUFALL</button>
                            <button class="team-btn" data-team="spectator" data-locale="spectator">ZUSCHAUER</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="Nachricht senden...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">VERLASSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="timer-box">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-timer">00:00</span>
            </div>
            <div class="tdm-score" id="hud-tdm-score" style="display: none;">
                <span class="score-blue" id="hud-score-blue">0</span>
                <span class="score-divider">:</span>
                <span class="score-red" id="hud-score-red">0</span>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="stats-row">
                <div class="stat-item">
                    <span class="stat-label" data-locale="kills">KILLS</span>
                    <span class="stat-value" id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label" data-locale="deaths">TODE</span>
                    <span class="stat-value" id="hud-deaths">0</span>
                </div>
            </div>
            <div class="weapon-info">
                <span id="hud-weapon-name">PISTOL</span>
                <span id="hud-ammo">15 / 100</span>
            </div>
            <div class="status-bars">
                <div class="bar-container health">
                    <div class="bar-fill" id="hud-health-fill" style="width: 100%;"></div>
                </div>
                <div class="bar-container armor">
                    <div class="bar-fill" id="hud-armor-fill" style="width: 0%;"></div>
                </div>
            </div>
        </div>

        <div id="countdown-display" style="display: none;">
            <h1 id="countdown-text">10</h1>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 data-locale="game_ended">RUNDE BEENDET</h1>
            <h2 id="winner-name">PLAYER GEWINNT!</h2>

            <div id="match-stats-table"></div>

            <div class="map-voting-section">
                <h3 data-locale="map_select">NÄCHSTE MAP WÄHLEN</h3>
                <div class="map-voting-grid" id="map-voting-grid">
                    <!-- Maps injected by script.js -->
                </div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-lobby" data-locale="btn_back_lobby">ZURÜCK ZUR LOBBY</button>
                <button class="cancel-btn" id="btn-back-menu" data-locale="btn_cancel">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
