<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <header class="main-header">
                <h1 class="header-title l-menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active l-tab_ffa" data-tab="ffa">FFA Lobby</button>
                    <button class="tab-btn l-tab_create" data-tab="create">Lobby erstellen</button>
                    <button class="tab-btn l-tab_list" data-tab="list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- FFA Lobby Tab -->
                <div id="tab-ffa-content" class="tab-content active">
                    <div class="lobby-grid-container" id="ffa-lobby-list">
                        <!-- Predefined FFA Maps injected here -->
                    </div>
                </div>

                <!-- Create Lobby Tab -->
                <div id="tab-create-content" class="tab-content">
                    <div class="creation-form">
                        <div class="form-section">
                            <div class="input-group">
                                <label class="l-lobby_name">Lobby Name</label>
                                <input type="text" id="create-name" placeholder="...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label class="l-map_select">Map auswählen</label>
                                    <select id="create-map"></select>
                                </div>
                                <div class="input-group">
                                    <label class="l-mode_select">Spielmodus</label>
                                    <select id="create-mode">
                                        <option value="ffa">Free For All</option>
                                        <option value="tdm">Team Deathmatch</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label class="l-loadout_select">Waffen-Loadout</label>
                                <div class="loadout-grid" id="loadout-grid">
                                    <!-- Checkboxes will be injected here -->
                                </div>
                            </div>
                        </div>
                        <div class="form-section">
                            <div class="slider-group">
                                <label><span class="l-round_time">Rundenzeit (Min)</span>: <span id="val-time">15</span></label>
                                <input type="range" id="create-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="slider-group">
                                <label><span class="l-max_players">Max. Spieler</span>: <span id="val-players">16</span></label>
                                <input type="range" id="create-players" min="2" max="16" step="1" value="16">
                            </div>
                            <div class="slider-group">
                                <label><span class="l-respawn_time">Respawn-Zeit (Sek)</span>: <span id="val-respawn">5</span></label>
                                <input type="range" id="create-respawn" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="slider-group">
                                <label><span class="l-kill_limit">Kill-Limit zum Sieg</span>: <span id="val-kills">30</span></label>
                                <input type="range" id="create-kills" min="0" max="50" step="5" value="30">
                            </div>
                            <div class="toggle-row">
                                <div class="toggle-group">
                                    <label class="l-vehicles_allowed">Fahrzeuge erlaubt</label>
                                    <label class="switch">
                                        <input type="checkbox" id="create-vehicles">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="toggle-group">
                                    <label class="l-friendly_fire">Freundliches Feuer</label>
                                    <label class="switch">
                                        <input type="checkbox" id="create-fire">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="confirm-btn l-btn_create" id="btn-create-submit">Lobby erstellen</button>
                            <button class="cancel-btn l-btn_cancel" id="btn-create-cancel">Abbrechen</button>
                        </div>
                    </div>
                </div>

                <!-- Open Lobbies Tab -->
                <div id="tab-list-content" class="tab-content">
                    <div class="list-filters">
                        <div class="filter-item">
                            <label>Map</label>
                            <select id="filter-map">
                                <option value="all">Alle Maps</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label>Plätze</label>
                            <select id="filter-players">
                                <option value="all">Alle</option>
                                <option value="free">Nur mit freien Plätzen</option>
                            </select>
                        </div>
                    </div>
                    <div class="lobby-list" id="open-lobby-list">
                        <!-- Custom Lobbies injected here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Waiting Area Overlay -->
        <div id="waiting-area" class="overlay" style="display: none;">
            <div class="waiting-container">
                <div class="waiting-header">
                    <h2 id="wait-lobby-name">LOBBY NAME</h2>
                    <div class="wait-lobby-info" id="wait-lobby-info">Map: Legion | Mode: FFA</div>
                </div>
                <div class="waiting-body">
                    <div class="player-list-section">
                        <h3 class="l-players">SPIELER</h3>
                        <div class="player-list" id="wait-player-list">
                            <!-- Players injected here -->
                        </div>
                    </div>
                    <div class="lobby-control-section">
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue"><i class="fa-solid fa-shield-halved"></i> <span class="l-team_blue">Team Blau</span></button>
                            <button class="team-btn" data-team="red"><i class="fa-solid fa-skull"></i> <span class="l-team_red">Team Rot</span></button>
                            <button class="team-btn" data-team="spectator"><i class="fa-solid fa-eye"></i> <span class="l-spectator">Zuschauer</span></button>
                            <button class="team-btn active" data-team="random"><i class="fa-solid fa-shuffle"></i> <span class="l-random">Zufall</span></button>
                        </div>
                        <div class="chat-section">
                            <div class="chat-messages" id="lobby-chat-messages"></div>
                            <input type="text" id="lobby-chat-input" placeholder="Nachricht schreiben...">
                        </div>
                        <div class="action-buttons">
                            <button class="ready-btn l-btn_ready" id="btn-ready">Bereit</button>
                            <button class="start-btn l-btn_start" id="btn-start" style="display: none;">Spiel starten</button>
                            <button class="leave-btn l-btn_leave" id="btn-leave">Lobby verlassen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Gameplay HUD -->
    <div id="hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer" id="hud-timer">15:00</div>
        </div>
        <div class="hud-bottom">
            <div class="hud-stats">
                <div class="stat-item">
                    <span class="stat-label l-kills">Kills</span>
                    <span class="stat-value" id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label l-deaths">Tode</span>
                    <span class="stat-value" id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-bars">
                <div class="bar-container">
                    <i class="fa-solid fa-heart"></i>
                    <div class="bar-bg"><div class="bar-fill health" id="hud-health"></div></div>
                </div>
                <div class="bar-container">
                    <i class="fa-solid fa-shield-halved"></i>
                    <div class="bar-bg"><div class="bar-fill armor" id="hud-armor"></div></div>
                </div>
            </div>
            <div class="hud-weapon">
                <i class="fa-solid fa-gun"></i>
                <span id="hud-ammo">250</span>
            </div>
        </div>
        <div class="hud-team-scores" id="hud-team-scores" style="display: none;">
            <div class="team-score blue">
                <span class="l-team_blue">Blau</span>
                <span id="score-blue">0</span>
            </div>
            <div class="team-score red">
                <span class="l-team_red">Rot</span>
                <span id="score-red">0</span>
            </div>
        </div>
        <div class="countdown-overlay" id="countdown" style="display: none;">10</div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-container">
            <h1 class="l-game_ended">RUNDE BEENDET!</h1>
            <h2 id="winner-announcement">PLAYER <span class="l-winner_suffix">GEWINNT!</span></h2>
            <div class="winner-stats">
                <table id="winner-stats-table">
                    <thead>
                        <tr>
                            <th class="l-name">NAME</th>
                            <th class="l-kills">KILLS</th>
                            <th class="l-deaths">TODE</th>
                            <th class="l-kd_ratio">K/D</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="winner-actions">
                <button class="confirm-btn l-btn_back_to_lobby" id="btn-win-lobby">Zurück zur Lobby</button>
                <button class="cancel-btn l-btn_back_to_menu" id="btn-win-menu">Hauptmenü</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
