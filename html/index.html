<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <!-- Hauptmenü Container -->
        <div id="main-container" class="main-container">
            <header class="main-header">
                <h1 class="header-title" id="L_menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="L_tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="L_tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="L_tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- FFA & Offene Lobbys Liste -->
                <div id="lobby-browser" class="lobby-browser">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label><span id="L_map_select">Map auswählen</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALLE MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span id="L_loadout_select">Waffen-Loadout</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-weapons">
                                <option value="all">ALLE WAFFEN</option>
                            </select>
                        </div>
                    </aside>
                    <main class="lobby-list-wrapper">
                        <div id="lobby-list" class="lobby-list">
                            <!-- Dynamische Lobby Einträge -->
                        </div>
                    </main>
                </div>

                <!-- Lobby Erstellen Tab -->
                <div id="create-lobby-tab" class="create-lobby-tab" style="display: none;">
                    <div class="create-form">
                        <div class="form-grid">
                            <div class="input-group">
                                <label id="L_lobby_name">Lobby Name</label>
                                <input type="text" id="create-name" placeholder="Name eingeben...">
                            </div>
                            <div class="input-group">
                                <label id="L_map_select_2">Map auswählen</label>
                                <select id="create-map"></select>
                            </div>
                            <div class="input-group">
                                <label id="L_mode_select">Spielmodus</label>
                                <select id="create-mode">
                                    <option value="ffa">FFA (Free For All)</option>
                                    <option value="tdm">TDM (Team Deathmatch)</option>
                                </select>
                            </div>
                        </div>

                        <div class="loadout-grid-container">
                            <label id="L_loadout_select_2">Waffen-Loadout (Multi-Select)</label>
                            <div id="loadout-checkbox-grid" class="loadout-checkbox-grid">
                                <!-- Checkboxen werden per JS eingefügt -->
                            </div>
                        </div>

                        <div class="settings-grid">
                            <div class="input-group">
                                <label><span id="L_round_time">Rundenzeit (Min)</span>: <span id="val-time">15</span></label>
                                <input type="range" id="create-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span id="L_max_players">Max. Spieler</span>: <span id="val-players">16</span></label>
                                <input type="range" id="create-players" min="2" max="16" step="1" value="16">
                            </div>
                            <div class="input-group">
                                <label><span id="L_respawn_time">Respawn-Zeit (Sek)</span>: <span id="val-respawn">5</span></label>
                                <input type="range" id="create-respawn" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span id="L_kill_limit">Kill-Limit zum Sieg</span>: <span id="val-kills">30</span></label>
                                <input type="range" id="create-killlimit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>

                        <div class="toggle-group">
                            <div class="toggle-item">
                                <label id="L_vehicles_allowed">Fahrzeuge erlaubt</label>
                                <input type="checkbox" id="create-vehicles" class="toggle-checkbox">
                            </div>
                            <div class="toggle-item">
                                <label id="L_friendly_fire">Freundliches Feuer</label>
                                <input type="checkbox" id="create-ff" class="toggle-checkbox">
                            </div>
                        </div>

                        <div class="form-actions">
                            <button id="btn-submit-create" class="confirm-btn L_btn_create">Lobby erstellen</button>
                            <button id="btn-cancel-create" class="cancel-btn L_btn_cancel">Abbrechen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Wartebereich / Lobby Ansicht -->
        <div id="waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2>LOBBY: <span id="display-lobby-name">NAME</span></h2>
                    <div class="host-controls" id="host-only-controls" style="display: none;">
                        <button id="btn-close-lobby" class="close-btn L_btn_close_lobby">Lobby schließen</button>
                    </div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="L_players_title">SPIELER</h3>
                        <div id="player-list" class="player-list"></div>
                    </div>
                    <div class="lobby-main-section">
                        <div class="settings-summary" id="lobby-settings-summary">
                            <!-- Host kann hier Einstellungen bearbeiten -->
                        </div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="L_team_blue">Team Blau</button>
                            <button class="team-btn" data-team="red" id="L_team_red">Team Rot</button>
                            <button class="team-btn" data-team="spectator" id="L_spectator">Zuschauer</button>
                            <button class="team-btn" data-team="random" id="L_random">Zufall</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages" class="chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input" placeholder="Nachricht senden...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>
                        <div class="lobby-actions">
                            <button id="btn-ready" class="ready-btn L_btn_ready">Bereit</button>
                            <button id="btn-start" class="start-btn L_btn_start" style="display: none;">Spiel starten</button>
                            <button id="btn-leave" class="leave-btn L_btn_leave">Lobby verlassen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 id="L_game_ended">Runde beendet!</h1>
                <h2 id="winner-display-name">Gewinner: SPIELER</h2>

                <div id="winner-stats-container" class="stats-table-container">
                    <!-- Tabelle mit Kills, Toden, K/D -->
                </div>

                <div class="map-voting-section">
                    <h3 id="L_vote_next_map">Nächste Map wählen</h3>
                    <div id="map-vote-grid" class="map-vote-grid"></div>
                </div>

                <div class="winner-actions">
                    <button id="btn-winner-back" class="confirm-btn L_btn_back_lobby">Zurück zur Lobby</button>
                    <button id="btn-winner-menu" class="cancel-btn L_btn_main_menu">Hauptmenü</button>
                </div>
            </div>
        </div>
    </div>

    <!-- In-Game HUD -->
    <div id="game-hud" class="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="timer-box">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-timer">15:00</span>
            </div>
            <div class="team-scores" id="hud-team-scores" style="display: none;">
                <div class="score-item blue">
                    <span class="team-label">BLUE</span>
                    <span id="hud-score-blue">0</span>
                </div>
                <div class="score-divider">VS</div>
                <div class="score-item red">
                    <span class="team-label">RED</span>
                    <span id="hud-score-red">0</span>
                </div>
            </div>
        </div>
        <div class="hud-bottom">
            <div class="player-stats-box">
                <div class="stat-item">
                    <span class="stat-label" id="L_hud_kills">KILLS</span>
                    <span id="hud-kills">0</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-label" id="L_hud_deaths">TODE</span>
                    <span id="hud-deaths">0</span>
                </div>
            </div>
            <div class="weapon-info-box">
                <div class="ammo-display">
                    <i class="fa-solid fa-gun"></i>
                    <span id="hud-ammo">30</span>
                </div>
                <div class="bars-container">
                    <div class="bar-wrapper health">
                        <div id="hud-health-bar" class="bar-fill" style="width: 100%;"></div>
                    </div>
                    <div class="bar-wrapper armor">
                        <div id="hud-armor-bar" class="bar-fill" style="width: 0%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
