<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">GTA V FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1 & 3: Lobby Browser (shared container) -->
                <div id="tab-browser" class="tab-content active">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label><span data-locale="map_select">Map</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all" data-locale="all_maps">Alle Maps</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span data-locale="players">Spieler</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all" data-locale="all_players">Alle</option>
                                <option value="not-full" data-locale="filter_free_slots">Nur mit freien Plätzen</option>
                            </select>
                        </div>
                        <button class="create-btn" id="open-create-tab" data-locale="btn_create_nav">LOBBY ERSTELLEN</button>
                    </aside>

                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </main>
                </div>

                <!-- Tab 2: Create Lobby -->
                <div id="tab-create" class="tab-content">
                    <div class="create-container">
                        <h2 data-locale="tab_create">Lobby erstellen</h2>
                        <div class="form-grid">
                            <div class="input-group">
                                <label data-locale="lobby_name">Lobby Name</label>
                                <input type="text" id="lobby-name" placeholder="Name eingeben...">
                            </div>
                            <div class="input-group">
                                <label data-locale="map_select">Map auswählen</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">Spielmodus</label>
                                <select id="mode-select">
                                    <option value="ffa">Free For All (FFA)</option>
                                    <option value="tdm">Team Deathmatch (TDM)</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label data-locale="loadout_select">Waffen-Loadout</label>
                                <select id="loadout-select"></select>
                            </div>
                            <div class="input-group">
                                <label><span data-locale="round_time">Rundenzeit</span>: <span id="round-time-val">15</span> Min</label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">Max. Spieler</span>: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                            </div>
                            <div class="input-group toggle-group">
                                <label data-locale="vehicles_allowed">Fahrzeuge erlaubt</label>
                                <input type="checkbox" id="vehicles-allowed" class="toggle-input">
                            </div>
                            <div class="input-group toggle-group">
                                <label data-locale="friendly_fire">Freundliches Feuer</label>
                                <input type="checkbox" id="friendly-fire" class="toggle-input">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="respawn_time">Respawn-Zeit</span>: <span id="respawn-time-val">5</span>s</label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">Kill-Limit</span>: <span id="kill-limit-val">30</span></label>
                                <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="confirm-btn" id="btn-create-lobby" data-locale="btn_create">Lobby erstellen</button>
                            <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">Abbrechen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                    <button id="btn-edit-settings" class="icon-btn" title="Einstellungen bearbeiten" style="display: none;"><i class="fa-solid fa-gear"></i></button>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">Spielerliste</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 data-locale="mode_select">Spielmodus</h3>
                        <div id="lobby-info-summary" class="info-grid"></div>

                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue" data-locale="team_blue">Team Blau</button>
                            <button class="team-btn" data-team="red" id="btn-team-red" data-locale="team_red">Team Rot</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec" data-locale="spectator">Zuschauer</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="Nachricht senden...">
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">Bereit</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">Spiel starten</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">Lobby verlassen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div id="big-countdown" style="display: none;">10</div>
        <div class="hud-top">
            <div id="hud-timer" class="hud-element">00:00</div>
            <div id="hud-tdm-score" class="hud-element" style="display: none;">
                <span class="blue-score">0</span> : <span class="red-score">0</span>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-stats">
                <div class="hud-stat-item"><i class="fa-solid fa-crosshairs"></i> <span id="hud-kills">0</span></div>
                <div class="hud-stat-item"><i class="fa-solid fa-skull"></i> <span id="hud-deaths">0</span></div>
            </div>
            <div class="hud-weapon">
                <span id="hud-ammo">0</span> <i class="fa-solid fa-gun"></i>
            </div>
            <div class="hud-bars">
                <div class="hud-bar-container">
                    <div id="hud-health" class="hud-bar health-bar" style="width: 100%;"></div>
                </div>
                <div class="hud-bar-container">
                    <div id="hud-armor" class="hud-bar armor-bar" style="width: 0%;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title" data-locale="game_ended">Runde beendet!</h1>
            <h2 id="winner-name">SPIELER GEWINNT!</h2>

            <div id="match-stats-table"></div>

            <div class="map-voting-section">
                <h3 data-locale="vote_next_map">Nächste Map wählen:</h3>
                <div id="map-voting-list" class="voting-grid">
                    <!-- Map votes here -->
                </div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_back_lobby">Zurück zur Lobby</button>
                <button class="cancel-btn" id="btn-back-to-menu" data-locale="btn_back_menu">Hauptmenü</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
