<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" id="l-menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="l-tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="l-tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="l-tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Sidebar / Filters -->
                <aside class="sidebar">
                    <div id="filter-section">
                        <div class="filter-group">
                            <label><span id="l-map_select">MAPS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span id="l-max_players">PLAYERS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all">ANY</option>
                                <option value="not-full">NOT FULL</option>
                            </select>
                        </div>
                    </div>

                    <div id="create-btn-container" style="display: none;">
                         <button class="create-btn" id="btn-submit-lobby">CREATE LOBBY</button>
                    </div>
                </aside>

                <!-- Main Content -->
                <main class="lobby-browser">
                    <!-- Tab 1: FFA Lobbies & Tab 3: Open Lobbies -->
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Entries will be injected here -->
                    </div>

                    <!-- Tab 2: Create Lobby Form -->
                    <div id="create-lobby-form" style="display: none;">
                        <div class="form-container">
                            <div class="input-group">
                                <label id="l-lobby_name">LOBBY NAME</label>
                                <input type="text" id="input-lobby-name" placeholder="...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label id="l-map_select">MAP</label>
                                    <select id="select-map"></select>
                                </div>
                                <div class="input-group">
                                    <label id="l-mode_select">MODE</label>
                                    <select id="select-mode">
                                        <option value="ffa" id="l-ffa_mode">FFA</option>
                                        <option value="tdm" id="l-tdm_mode">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label id="l-loadout_select">LOADOUT</label>
                                <div class="multi-select-grid" id="loadout-multi-select">
                                    <!-- Dynamic checkboxes -->
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span id="l-round_time">TIME</span>: <span id="val-round-time">15</span>m</label>
                                    <input type="range" id="input-round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span id="l-max_players">MAX PLAYERS</span>: <span id="val-max-players">16</span></label>
                                    <input type="range" id="input-max-players" min="2" max="32" step="1" value="16">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label id="l-respawn_time">RESPAWN (SEC)</label>
                                    <input type="range" id="input-respawn-time" min="3" max="10" step="1" value="5">
                                    <span id="val-respawn-time">5</span>s
                                </div>
                                <div class="input-group">
                                    <label id="l-kill_limit">KILL LIMIT</label>
                                    <input type="range" id="input-kill-limit" min="0" max="100" step="10" value="30">
                                    <span id="val-kill-limit">30</span>
                                </div>
                            </div>
                            <div class="input-row toggles">
                                <div class="toggle-group">
                                    <label id="l-vehicles_allowed">VEHICLES</label>
                                    <input type="checkbox" id="input-vehicles">
                                </div>
                                <div class="toggle-group">
                                    <label id="l-friendly_fire">FRIENDLY FIRE</label>
                                    <input type="checkbox" id="input-friendly-fire">
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="confirm-btn" id="btn-create-lobby" style="width: 100%;">CREATE</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-title">LOBBY NAME</h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="l-tab_list">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 id="l-mode_select">SETTINGS / CHAT</h3>
                        <div id="lobby-info-summary"></div>
                        <button class="action-btn" id="btn-edit-settings" style="display: none; width: 100%; margin-bottom: 10px; background: var(--surface);">EDIT SETTINGS</button>

                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="l-team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="l-team_red">RED</button>
                            <button class="team-btn" data-team="random" id="l-random">RANDOM</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input" placeholder="...">
                                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-l="btn_ready">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-l="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-l="btn_leave">LEAVE</button>
                            <button class="cancel-btn" id="btn-close-lobby" style="display: none;" data-l="btn_close_lobby">CLOSE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <div class="match-ended-banner" id="l-game_ended">RUNDE BEENDET</div>
                <h1 id="winner-name">PLAYER <span id="l-winner_suffix">WINS!</span></h1>

                <div class="stats-table-wrapper">
                    <table id="match-stats-table">
                        <thead>
                            <tr>
                                <th id="l-player_name">NAME</th>
                                <th id="l-kills">KILLS</th>
                                <th id="l-deaths">DEATHS</th>
                                <th id="l-kd_ratio">K/D</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div class="map-voting">
                    <h3>NEXT MAP VOTE</h3>
                    <div class="vote-grid" id="map-vote-grid"></div>
                </div>

                <div class="btn-group">
                    <button class="confirm-btn" id="btn-back-to-lobby">BACK TO LOBBY</button>
                    <button class="cancel-btn" id="btn-back-to-menu">MAIN MENU</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="timer-box">
                <i class="fa-solid fa-clock"></i> <span id="hud-timer">15:00</span>
            </div>
        </div>

        <div class="hud-bottom-left">
            <div class="stat-item">
                <span class="label" id="l-kills">KILLS</span>
                <span class="value" id="hud-kills">0</span>
            </div>
            <div class="stat-item">
                <span class="label" id="l-deaths">DEATHS</span>
                <span class="value" id="hud-deaths">0</span>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="bars">
                <div class="bar-container health">
                    <div class="bar-fill" id="hud-health-fill"></div>
                    <span class="bar-text"><i class="fa-solid fa-heart"></i> <span id="hud-health-val">100</span>%</span>
                </div>
                <div class="bar-container armor">
                    <div class="bar-fill" id="hud-armor-fill"></div>
                    <span class="bar-text"><i class="fa-solid fa-shield"></i> <span id="hud-armor-val">0</span>%</span>
                </div>
            </div>
            <div class="ammo-box">
                <i class="fa-solid fa-gun"></i> <span id="hud-ammo">30 / 250</span>
            </div>
        </div>

        <div class="hud-center-top" id="tdm-score-box" style="display: none;">
            <div class="team-score blue">
                <div class="score-label" id="l-team_blue">BLUE</div>
                <div class="score-val" id="hud-score-blue">0</div>
            </div>
            <div class="vs">VS</div>
            <div class="team-score red">
                <div class="score-label" id="l-team_red">RED</div>
                <div class="score-val" id="hud-score-red">0</div>
            </div>
        </div>

        <div class="countdown-overlay" id="hud-countdown" style="display: none;">
            <div class="count-num">10</div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
