<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Left Panel: Filters (Only visible in Tab 1 and 3) -->
                <aside class="sidebar" id="sidebar-filters">
                    <div class="filter-group">
                        <label>MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>WEAPONS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>
                </aside>

                <!-- Main Content -->
                <main class="content-area">
                    <!-- Tab 1 & 3: Lobby Browser -->
                    <div id="lobby-browser" class="tab-content active">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </div>

                    <!-- Tab 2: Create Lobby -->
                    <div id="create-lobby-pane" class="tab-content">
                        <div class="create-form">
                            <h2 data-locale="tab_create">LOBBY ERSTELLEN</h2>
                            <div class="form-grid">
                                <div class="input-group full-width">
                                    <label data-locale="lobby_name">LOBBY NAME</label>
                                    <input type="text" id="lobby-name" placeholder="Name eingeben...">
                                </div>
                                <div class="input-group">
                                    <label data-locale="map_select">MAP</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="mode_select">MODUS</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                                <div class="input-group full-width">
                                    <label data-locale="loadout_select">LOADOUT</label>
                                    <div class="multi-select" id="loadout-multi-select">
                                        <!-- Multi-select items injected here -->
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="round_time">ZEIT</span>: <span id="round-time-val">15</span> Min</label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="max_players">SPIELER</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="respawn_time">RESPAWN</span>: <span id="respawn-time-val">5</span> Sek</label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="kill_limit">LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                                <div class="toggle-group">
                                    <label data-locale="vehicles_allowed">FAHRZEUGE</label>
                                    <label class="switch">
                                        <input type="checkbox" id="vehicles-allowed">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="toggle-group">
                                    <label data-locale="friendly_fire">FRIENDLY FIRE</label>
                                    <label class="switch">
                                        <input type="checkbox" id="friendly-fire">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="confirm-btn" id="btn-create-lobby" data-locale="btn_create">ERSTELLEN</button>
                                <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">ABBRECHEN</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2><span data-locale="tab_ffa">LOBBY</span>: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="max_players">SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 data-locale="tab_create">EINSTELLUNGEN</h3>
                        <div id="lobby-info-summary"></div>
                        <div id="host-settings-editor" style="display: none;">
                            <!-- Host can edit settings here -->
                        </div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" data-locale="team_blue">BLAU</button>
                            <button class="team-btn" data-team="red" data-locale="team_red">ROT</button>
                            <button class="team-btn" data-team="spectator" data-locale="spectator">ZUSCHAUER</button>
                            <button class="team-btn" data-team="random" data-locale="random">ZUFALL</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="Nachricht senden...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">VERLASSEN</button>
                            <button class="danger-btn" id="btn-close-lobby" style="display: none;" data-locale="btn_cancel">SCHLIESSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer" id="hud-timer">00:00</div>
        </div>
        <div class="hud-center">
            <div id="hud-countdown" class="hud-countdown"></div>
        </div>
        <div class="hud-bottom">
            <div class="hud-stats">
                <div class="hud-stat-item">
                    <i class="fa-solid fa-skull"></i>
                    <span id="hud-kills">0</span>
                </div>
                <div class="hud-stat-item">
                    <i class="fa-solid fa-cross"></i>
                    <span id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-health-armor">
                <div class="hud-bar-container">
                    <div class="hud-bar health" id="hud-health-bar"></div>
                </div>
                <div class="hud-bar-container">
                    <div class="hud-bar armor" id="hud-armor-bar"></div>
                </div>
            </div>
            <div class="hud-ammo">
                <i class="fa-solid fa-gun"></i>
                <span id="hud-ammo">0</span>
            </div>
            <div class="hud-scores" id="hud-scores" style="display: none;">
                <div class="score-team blue">
                    <span data-locale="team_blue">BLAU</span>
                    <span id="hud-score-blue">0</span>
                </div>
                <div class="score-team red">
                    <span data-locale="team_red">ROT</span>
                    <span id="hud-score-red">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 data-locale="game_ended">RUNDE BEENDET</h1>
            <h2 id="winner-name">SPIELER GEWINNT!</h2>
            <div class="winner-stats-container">
                <div id="match-stats-table"></div>
            </div>
            <div class="winner-actions">
                <div class="map-voting" id="map-voting">
                    <h3 data-locale="map_select">MAP VOTING</h3>
                    <div id="voting-maps-list"></div>
                </div>
                <div class="btn-group">
                    <button class="confirm-btn" id="btn-back-to-lobby">LOBBY</button>
                    <button class="cancel-btn" id="btn-back-to-menu">MENÜ</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
