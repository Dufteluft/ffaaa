<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- TAB 1: FFA Lobby & TAB 3: Offene Lobbys -->
                <main class="lobby-browser" id="browser-view">
                    <div class="browser-header">
                        <div class="filter-group">
                            <label data-locale="map_select">MAP AUSWÄHLEN</label>
                            <select id="filter-maps">
                                <option value="all">ALLE MAPS</option>
                            </select>
                        </div>
                        <div class="filter-checkbox">
                            <input type="checkbox" id="filter-free-slots">
                            <label for="filter-free-slots">Nur Lobbys mit freien Plätzen</label>
                        </div>
                    </div>
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Lobbies injected here -->
                    </div>
                </main>

                <!-- TAB 2: Lobby Erstellen -->
                <main class="create-view" id="create-view" style="display: none;">
                    <div class="form-container">
                        <div class="input-group full">
                            <label data-locale="lobby_name">LOBBY NAME</label>
                            <input type="text" id="lobby-name" placeholder="...">
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label data-locale="map_select">MAP</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">MODUS</label>
                                <select id="mode-select">
                                    <option value="ffa" data-locale="ffa_mode">FFA</option>
                                    <option value="tdm" data-locale="tdm_mode">Team Deathmatch</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-group full">
                            <label data-locale="loadout_select">LOADOUT</label>
                            <select id="loadout-select" multiple size="5"></select>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span data-locale="round_time">ZEIT</span>: <span id="round-time-val">15</span></label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">MAX SPIELER</span>: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span data-locale="respawn_time">RESPAWN</span>: <span id="respawn-time-val">5</span></label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">KILL LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                <input type="range" id="kill-limit" min="0" max="50" step="10" value="30">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="toggle-group">
                                <label data-locale="vehicles_allowed">Fahrzeuge</label>
                                <input type="checkbox" id="vehicles-allowed">
                            </div>
                            <div class="toggle-group">
                                <label data-locale="friendly_fire">Friendly Fire</label>
                                <input type="checkbox" id="friendly-fire">
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="confirm-btn" id="btn-submit-create" data-locale="btn_create">CREATE</button>
                            <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">CANCEL</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-title">LOBBY NAME</h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <div id="lobby-info-summary" class="info-grid"></div>

                        <div class="team-selection" id="team-selector">
                            <button class="team-btn" data-team="blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" data-locale="team_red">RED</button>
                            <button class="team-btn" data-team="random" data-locale="random">RANDOM</button>
                            <button class="team-btn" data-team="spectator" data-locale="spectator">SPEC</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="...">
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">LEAVE</button>
                            <button class="leave-btn" id="btn-close-lobby" style="display: none;" data-locale="btn_close_lobby">CLOSE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Gameplay HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-container">
            <div class="hud-stats-top">
                <div class="hud-item timer">
                    <i class="fa-regular fa-clock"></i>
                    <span id="hud-timer">00:00</span>
                </div>
                <div class="hud-item score ffa-only">
                    <i class="fa-solid fa-crosshairs"></i>
                    <span id="hud-kills">0</span>
                    <span class="divider">/</span>
                    <span id="hud-deaths">0</span>
                </div>
                <div class="hud-item team-scores tdm-only" style="display: none;">
                    <span class="score-blue" id="hud-score-blue">0</span>
                    <span class="divider">:</span>
                    <span class="score-red" id="hud-score-red">0</span>
                </div>
            </div>
            <div class="hud-bars">
                <div class="bar-container health">
                    <div class="bar-fill" id="hud-health-fill"></div>
                </div>
                <div class="bar-container armor">
                    <div class="bar-fill" id="hud-armor-fill"></div>
                </div>
            </div>
            <div class="hud-ammo">
                <i class="fa-solid fa-gun"></i>
                <span id="hud-ammo">0</span>
            </div>
        </div>
    </div>

    <!-- Big Countdown -->
    <div id="big-countdown" style="display: none;">
        <span id="countdown-number">10</span>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title" data-locale="game_ended">MATCH ENDED</h1>
            <h2 id="winner-name">PLAYER WINS!</h2>
            <div id="match-stats-table" class="stats-scroll"></div>

            <div class="map-voting" id="map-voting">
                <h3>VOTE NEXT MAP</h3>
                <div class="vote-options" id="vote-options"></div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
