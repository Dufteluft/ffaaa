<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <header class="main-header">
                <h1 class="header-title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa">FFA LOBBY</button>
                    <button class="tab-btn" data-tab="create">LOBBY ERSTELLEN</button>
                    <button class="tab-btn" data-tab="list">OFFENE LOBBYS</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1 & 3: Lobby Browser -->
                <main class="lobby-browser" id="tab-browser">
                    <div class="sidebar" id="sidebar-filters" style="display: none;">
                        <div class="filter-group">
                            <label>FILTER</label>
                            <div class="checkbox-group">
                                <input type="checkbox" id="filter-free-slots">
                                <label for="filter-free-slots">Nur Lobbys mit freien Plätzen</label>
                            </div>
                        </div>
                    </div>
                    <div class="lobby-list" id="lobby-list-container"></div>
                </main>

                <!-- Tab 2: Create Lobby -->
                <main class="create-lobby-section" id="tab-create" style="display: none;">
                    <div class="create-form">
                        <div class="input-group">
                            <label>LOBBY-NAME</label>
                            <input type="text" id="lobby-name" placeholder="Name eingeben...">
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label>MAP</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label>SPIELMODUS</label>
                                <select id="mode-select">
                                    <option value="ffa">FFA (Alle gegen Alle)</option>
                                    <option value="tdm">Team Deathmatch</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>WAFFEN-LOADOUT (Mehrfachauswahl möglich)</label>
                            <select id="loadout-select" multiple size="5"></select>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label>RUNDENZEIT (MIN): <span id="round-time-val">15</span></label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label>MAX. SPIELER: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label>RESPAWN-ZEIT (SEK): <span id="respawn-time-val">5</span></label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label>KILL-LIMIT (0 = Aus): <span id="kill-limit-val">30</span></label>
                                <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>
                        <div class="input-row toggles">
                            <div class="toggle-group">
                                <label>FAHRZEUGE ERLAUBT</label>
                                <input type="checkbox" id="vehicles-allowed">
                            </div>
                            <div class="toggle-group">
                                <label>FREUNDLICHES FEUER</label>
                                <input type="checkbox" id="friendly-fire">
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="confirm-btn" id="btn-create-lobby">LOBBY ERSTELLEN</button>
                            <button class="cancel-btn" id="btn-reset-create">ZURÜCKSETZEN</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Lobby Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2>WARTEBEREICH: <span id="lobby-title-display">LOBBY NAME</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="player-list-header">SPIELERLISTE</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>EINSTELLUNGEN & CHAT</h3>
                        <div id="lobby-info-summary" class="info-grid"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue">TEAM BLAU</button>
                            <button class="team-btn" data-team="red">TEAM ROT</button>
                            <button class="team-btn" data-team="random">ZUFALL</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="Nachricht schreiben...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">SPIEL STARTEN</button>
                            <button class="leave-btn" id="btn-leave-lobby">VERLASSEN</button>
                            <button class="cancel-btn" id="btn-close-lobby" style="display: none;">LOBBY SCHLIEẞEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 id="winner-title">RUNDE BEENDET</h1>
                <h2 id="winner-name-display">SPIELER GEWINNT!</h2>
                <div id="match-stats-table"></div>

                <div class="map-voting-section">
                    <h3>MAP VOTING</h3>
                    <div id="map-voting-list" class="voting-grid"></div>
                </div>

                <div class="btn-group">
                    <button class="confirm-btn" id="btn-back-to-lobby">ZURÜCK ZUR LOBBY</button>
                    <button class="cancel-btn" id="btn-back-to-menu">HAUPTMENÜ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-container">
            <div class="hud-top">
                <div class="hud-timer" id="hud-timer">00:00</div>
                <div class="hud-tdm-score" id="hud-tdm-score" style="display: none;">
                    <span class="score-blue">0</span> : <span class="score-red">0</span>
                </div>
            </div>
            <div class="hud-bottom">
                <div class="hud-stats">
                    <div class="stat-item"><i class="fa-solid fa-crosshairs"></i> <span id="hud-kills">0</span></div>
                    <div class="stat-item"><i class="fa-solid fa-skull"></i> <span id="hud-deaths">0</span></div>
                </div>
                <div class="hud-weapon">
                    <div id="hud-ammo">0 / 0</div>
                </div>
                <div class="hud-bars">
                    <div class="bar-container health"><div class="bar-fill" id="hud-health" style="width: 100%;"></div></div>
                    <div class="bar-container armor"><div class="bar-fill" id="hud-armor" style="width: 0%;"></div></div>
                </div>
            </div>
        </div>
    </div>

    <div id="big-countdown" style="display: none;">10</div>

    <script src="script.js"></script>
</body>
</html>
