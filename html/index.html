<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1: FFA Lobby (Vordefiniert) & Tab 3: Offene Lobbys -->
                <main class="lobby-browser" id="tab-content-browser">
                    <div class="browser-header" id="browser-filters" style="display: none;">
                        <div class="filter-group checkbox-filter">
                            <input type="checkbox" id="filter-free-slots">
                            <label for="filter-free-slots" data-locale="filter_free_slots">Nur Lobbys mit freien Plätzen</label>
                        </div>
                    </div>
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Lobbies are injected here -->
                    </div>
                </main>

                <!-- Tab 2: Lobby erstellen -->
                <main class="creation-panel" id="tab-content-create" style="display: none;">
                    <div class="form-container">
                        <div class="input-group">
                            <label data-locale="lobby_name">Lobby Name</label>
                            <input type="text" id="lobby-name" placeholder="Name eingeben...">
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label data-locale="map_select">Map auswählen</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">Spielmodus</label>
                                <select id="mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">Team Deathmatch</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-group">
                            <label data-locale="loadout_select">Waffen-Loadout</label>
                            <div class="loadout-grid" id="loadout-multi-select">
                                <!-- Multi-select checkboxes injected here -->
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span data-locale="round_time">Rundenzeit</span>: <span id="round-time-val">15</span> Min</label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">Max. Spieler</span>: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group toggle-group">
                                <label data-locale="vehicles_allowed">Fahrzeuge erlaubt?</label>
                                <label class="switch">
                                    <input type="checkbox" id="vehicles-allowed">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="input-group toggle-group">
                                <label data-locale="friendly_fire">Freundliches Feuer</label>
                                <label class="switch">
                                    <input type="checkbox" id="friendly-fire">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label><span data-locale="respawn_time">Respawn-Zeit</span>: <span id="respawn-time-val">5</span>s</label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">Kill-Limit zum Sieg</span>: <span id="kill-limit-val">30</span></label>
                                <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="confirm-btn" id="btn-create-lobby-action" data-locale="btn_create">Lobby erstellen</button>
                            <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">Abbrechen</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Lobby Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title-display">DEFAULT</span></h2>
                    <div class="host-controls" id="host-only-controls" style="display: none;">
                         <button class="icon-btn" id="btn-edit-settings" title="Einstellungen bearbeiten"><i class="fa-solid fa-gear"></i></button>
                    </div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">Spielerliste</h3>
                        <div class="player-list-header">
                            <span data-locale="col_name">Name</span>
                            <span data-locale="mode">Team</span>
                        </div>
                        <div id="player-list-container"></div>
                    </div>
                    <div class="settings-section">
                        <div class="team-selection-area">
                            <h3 data-locale="mode_select">Team-Auswahl</h3>
                            <div class="team-buttons">
                                <button class="team-btn blue" data-team="blue" data-locale="team_blue">Blau</button>
                                <button class="team-btn red" data-team="red" data-locale="team_red">Rot</button>
                                <button class="team-btn" data-team="random" data-locale="random">Zufall</button>
                                <button class="team-btn spectator" data-team="spectator" data-locale="spectator">Zuschauer</button>
                            </div>
                        </div>
                        <div class="lobby-chat-container">
                            <div id="chat-messages-container"></div>
                            <input type="text" id="lobby-chat-input" data-placeholder="chat_placeholder" placeholder="Nachricht senden...">
                        </div>
                        <div class="lobby-footer-actions">
                            <button class="ready-btn" id="btn-toggle-ready" data-locale="btn_ready">Bereit</button>
                            <button class="start-btn" id="btn-start-match" data-locale="btn_start" style="display: none;">Spiel starten</button>
                            <button class="leave-btn" id="btn-leave-lobby-action" data-locale="btn_leave">Lobby verlassen</button>
                            <button class="danger-btn" id="btn-close-lobby-action" data-locale="btn_close_lobby" style="display: none;">Lobby schließen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-right">
            <div class="hud-timer" id="hud-timer">00:00</div>
            <div class="hud-tdm-score" id="hud-tdm-score" style="display: none;">
                <span class="score-blue" id="score-blue">0</span>
                <span class="score-divider">:</span>
                <span class="score-red" id="score-red">0</span>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-stats">
                <div class="stat-item"><i class="fa-solid fa-crosshairs"></i> <span id="hud-kills">0</span></div>
                <div class="stat-item"><i class="fa-solid fa-skull"></i> <span id="hud-deaths">0</span></div>
            </div>
            <div class="hud-weapon">
                <div class="ammo-count" id="hud-ammo">0</div>
            </div>
            <div class="hud-bars">
                <div class="bar-container health">
                    <div class="bar-fill" id="hud-health" style="width: 100%;"></div>
                </div>
                <div class="bar-container armor">
                    <div class="bar-fill" id="hud-armor" style="width: 0%;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <div class="winner-header">
                <h1 data-locale="game_ended">RUNDE BEENDET</h1>
                <h2 id="winner-display-name">SPIELER GEWINNT!</h2>
            </div>

            <div class="winner-stats">
                <table class="stats-table">
                    <thead>
                        <tr>
                            <th data-locale="col_name">NAME</th>
                            <th data-locale="col_kills">KILLS</th>
                            <th data-locale="col_deaths">TODE</th>
                            <th data-locale="col_kd">K/D</th>
                        </tr>
                    </thead>
                    <tbody id="winner-stats-body"></tbody>
                </table>
            </div>

            <div class="map-voting-section">
                <h3>VOTE FÜR NÄCHSTE MAP</h3>
                <div class="map-vote-grid" id="map-vote-container"></div>
            </div>

            <div class="winner-actions">
                <button class="confirm-btn" id="btn-winner-back-lobby" data-locale="btn_back_lobby">Zurück zur Lobby</button>
                <button class="cancel-btn" id="btn-winner-back-menu" data-locale="btn_back_menu">Hauptmenü</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
