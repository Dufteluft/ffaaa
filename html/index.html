<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1 & 3 Content (Lobby Browser) -->
                <div id="tab-browser" class="tab-content active">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label><span data-locale="map_select">Map auswählen</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all">ANY</option>
                                <option value="not-full">NOT FULL</option>
                            </select>
                        </div>
                        <!-- Stats Summary -->
                        <div class="stats-summary">
                            <h3 data-locale="score">Statistiken</h3>
                            <div class="stat-row">
                                <span data-locale="kills">Kills</span>
                                <span id="my-kills">0</span>
                            </div>
                            <div class="stat-row">
                                <span data-locale="deaths">Tode</span>
                                <span id="my-deaths">0</span>
                            </div>
                            <div class="stat-row">
                                <span data-locale="kd_ratio">K/D</span>
                                <span id="my-kd">0.00</span>
                            </div>
                        </div>
                    </aside>

                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </main>
                </div>

                <!-- Tab 2 Content (Create Lobby) -->
                <div id="tab-create" class="tab-content">
                    <div class="create-form-wrapper">
                        <div class="form-container">
                            <div class="input-group">
                                <label data-locale="lobby_name">Lobby Name</label>
                                <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label data-locale="map_select">Map auswählen</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="mode_select">Spielmodus</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label data-locale="loadout_select">Waffen-Loadout</label>
                                <select id="loadout-select" multiple class="multi-select"></select>
                                <small>Hold CTRL to select multiple</small>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span data-locale="round_time">Rundenzeit (Min)</span>: <span id="round-time-val">15</span></label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="max_players">Max. Spieler</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="32" step="1" value="16">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span data-locale="respawn_time">Respawn-Zeit (Sek)</span>: <span id="respawn-time-val">5</span></label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="kill_limit">Kill-Limit zum Sieg</span>: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="100" step="5" value="30">
                                </div>
                            </div>
                            <div class="input-row toggle-row">
                                <div class="toggle-group">
                                    <label data-locale="vehicles_allowed">Fahrzeuge erlaubt</label>
                                    <label class="switch">
                                        <input type="checkbox" id="vehicles-allowed">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="toggle-group">
                                    <label data-locale="friendly_fire">Freundliches Feuer</label>
                                    <label class="switch">
                                        <input type="checkbox" id="friendly-fire">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="confirm-btn" id="btn-create-lobby" data-locale="btn_create">Lobby erstellen</button>
                                <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">Abbrechen</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">Spielerliste</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>SETTINGS</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red" data-locale="team_red">RED</button>
                            <button class="team-btn" data-team="random" id="btn-team-random" data-locale="random">RANDOM</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">LEAVE</button>
                            <button class="cancel-btn" id="btn-close-lobby" style="display: none;" data-locale="btn_close_lobby">CLOSE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-right">
            <div class="hud-timer">
                <i class="fa-regular fa-clock"></i> <span id="hud-time">00:00</span>
            </div>
            <div class="hud-scores" id="hud-tdm-scores" style="display: none;">
                <div class="score-box blue">
                    <span class="team-label">BLUE</span>
                    <span id="score-blue">0</span>
                </div>
                <div class="score-box red">
                    <span class="team-label">RED</span>
                    <span id="score-red">0</span>
                </div>
            </div>
        </div>

        <div id="big-countdown" style="display: none;">10</div>

        <div class="hud-bottom-right">
            <div class="hud-stats">
                <div class="hud-stat-item">
                    <span class="label">KILLS</span>
                    <span id="hud-kills" class="value">0</span>
                </div>
                <div class="hud-stat-item">
                    <span class="label">DEATHS</span>
                    <span id="hud-deaths" class="value">0</span>
                </div>
            </div>
            <div class="hud-player-bars">
                <div class="hud-bar-container">
                    <div id="hud-health-bar" class="hud-bar health"></div>
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="hud-bar-container">
                    <div id="hud-armor-bar" class="hud-bar armor"></div>
                    <i class="fa-solid fa-shield"></i>
                </div>
            </div>
            <div class="hud-weapon-info">
                <span id="hud-ammo">30</span> <i class="fa-solid fa-gun"></i>
            </div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title" data-locale="game_ended">MATCH ENDED</h1>
            <h2 id="winner-name">PLAYER WINS!</h2>
            <div id="match-stats-table"></div>

            <div class="map-voting-section">
                <h3>VOTE NEXT MAP</h3>
                <div id="vote-maps-container"></div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_back">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu" data-locale="btn_join">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
