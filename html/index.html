<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="lobby" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Main Content -->
                <main class="content-area">
                    <!-- Tab 1: FFA Lobbies (Persistent) -->
                    <div id="tab-ffa" class="tab-content active">
                        <div class="lobby-grid-list" id="ffa-list"></div>
                    </div>

                    <!-- Tab 2: Create Lobby -->
                    <div id="tab-create" class="tab-content">
                        <div class="create-form-container">
                            <h2 data-locale="tab_create">Lobby erstellen</h2>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label data-locale="lobby_name">Lobby Name</label>
                                    <input type="text" id="input-lobby-name" placeholder="...">
                                </div>
                                <div class="form-group">
                                    <label data-locale="map_select">Map auswählen</label>
                                    <select id="select-map"></select>
                                </div>
                                <div class="form-group">
                                    <label data-locale="mode_select">Spielmodus</label>
                                    <select id="select-mode">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">Team Deathmatch</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label data-locale="loadout_select">Waffen-Loadout</label>
                                    <div class="loadout-multi-select" id="loadout-checkboxes">
                                        <!-- Loadouts from config -->
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label data-locale="round_time">Rundenzeit (Min)</label>
                                    <div class="range-wrapper">
                                        <input type="range" id="range-time" min="5" max="30" step="5" value="15">
                                        <span id="val-time">15</span>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label data-locale="max_players">Max. Spieler</label>
                                    <div class="range-wrapper">
                                        <input type="range" id="range-players" min="2" max="16" step="1" value="16">
                                        <span id="val-players">16</span>
                                    </div>
                                </div>
                                <div class="form-group toggle-group">
                                    <label data-locale="vehicles_allowed">Fahrzeuge erlaubt</label>
                                    <input type="checkbox" id="check-vehicles" class="toggle-switch">
                                </div>
                                <div class="form-group toggle-group">
                                    <label data-locale="friendly_fire">Freundliches Feuer</label>
                                    <input type="checkbox" id="check-fire" class="toggle-switch">
                                </div>
                                <div class="form-group">
                                    <label data-locale="respawn_time">Respawn-Zeit (Sek)</label>
                                    <div class="range-wrapper">
                                        <input type="range" id="range-respawn" min="3" max="10" step="1" value="5">
                                        <span id="val-respawn">5</span>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label data-locale="kill_limit">Kill-Limit zum Sieg</label>
                                    <div class="range-wrapper">
                                        <input type="range" id="range-kills" min="0" max="50" step="5" value="30">
                                        <span id="val-kills">30</span>
                                    </div>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="btn-primary" id="btn-create-lobby" data-locale="btn_create">Lobby erstellen</button>
                                <button class="btn-secondary" id="btn-cancel-create" data-locale="btn_cancel">Abbrechen</button>
                            </div>
                        </div>
                    </div>

                    <!-- Tab 3: Open Lobbies -->
                    <div id="tab-lobby" class="tab-content">
                        <div class="lobby-grid-list" id="open-list"></div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="waiting-card">
                <div class="waiting-header">
                    <h2 id="wait-lobby-name">LOBBY NAME</h2>
                    <div class="lobby-stats">
                        <span id="wait-map">MAP: -</span>
                        <span id="wait-mode">MODE: -</span>
                    </div>
                </div>
                <div class="waiting-body">
                    <div class="players-panel">
                        <h3 data-locale="tab_players">Spielerliste</h3>
                        <div id="wait-player-list"></div>
                    </div>
                    <div class="controls-panel">
                        <div class="team-selector">
                            <button class="team-btn" data-team="blue" data-locale="team_blue">Team Blau</button>
                            <button class="team-btn" data-team="red" data-locale="team_red">Team Rot</button>
                            <button class="team-btn" data-team="spectator" data-locale="spectator">Zuschauer</button>
                            <button class="team-btn active" data-team="random" data-locale="random">Zufall</button>
                        </div>
                        <div class="chat-area">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="...">
                        </div>
                        <div class="action-buttons">
                            <button class="btn-ready" id="btn-ready" data-locale="btn_ready">Bereit</button>
                            <button class="btn-start" id="btn-start" style="display: none;" data-locale="btn_start">Spiel starten</button>
                            <button class="btn-secondary" id="btn-edit-settings" style="display: none;" data-locale="btn_edit_settings">Einstellungen</button>
                            <button class="btn-leave" id="btn-leave" data-locale="btn_leave">Lobby verlassen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 data-locale="game_ended">Runde beendet!</h1>
                <h2 id="winner-text">GEWINNER: -</h2>
                <div class="scoreboard-container" id="end-scoreboard"></div>

                <div class="map-voting-section">
                    <h3>Nächste Map wählen</h3>
                    <div class="voting-grid" id="map-votes"></div>
                </div>

                <div class="winner-actions">
                    <button class="btn-primary" id="btn-back-lobby" data-locale="btn_back_lobby">Zurück zur Lobby</button>
                    <button class="btn-secondary" id="btn-back-menu" data-locale="btn_back_menu">Hauptmenü</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="timer-box">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-timer">00:00</span>
            </div>
            <div class="tdm-score" id="hud-tdm-score" style="display: none;">
                <span class="score-blue">0</span>
                <span class="score-divider">:</span>
                <span class="score-red">0</span>
            </div>
        </div>
        <div class="hud-bottom-left">
            <div class="stats-row">
                <div class="stat-item">
                    <span class="stat-label" data-locale="kills">Kills</span>
                    <span class="stat-value" id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label" data-locale="deaths">Tode</span>
                    <span class="stat-value" id="hud-deaths">0</span>
                </div>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="weapon-info">
                <div class="ammo-box">
                    <i class="fa-solid fa-gun"></i>
                    <span id="hud-ammo">0</span>
                </div>
            </div>
            <div class="bars-container">
                <div class="bar-wrapper">
                    <div class="bar-bg">
                        <div id="hud-health" class="bar-fill health"></div>
                    </div>
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="bar-wrapper">
                    <div class="bar-bg">
                        <div id="hud-armor" class="bar-fill armor"></div>
                    </div>
                    <i class="fa-solid fa-shield"></i>
                </div>
            </div>
        </div>
        <div id="kill-feed"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
