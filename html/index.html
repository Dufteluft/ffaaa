<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="lobby" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1 & 3 Content (Lobby Lists) -->
                <main class="lobby-browser" id="lobby-browser">
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Lobby entries injected here -->
                    </div>
                </main>

                <!-- Tab 2 Content (Create Lobby) -->
                <main class="create-section" id="create-section" style="display: none;">
                    <div class="create-form">
                        <h2 data-locale="tab_create">Lobby erstellen</h2>
                        <div class="form-grid">
                            <div class="input-group">
                                <label data-locale="lobby_name">Lobby Name</label>
                                <input type="text" id="create-name" placeholder="...">
                            </div>
                            <div class="input-group">
                                <label data-locale="map_select">Map auswählen</label>
                                <select id="create-map"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">Spielmodus</label>
                                <select id="create-mode">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">Team Deathmatch</option>
                                </select>
                            </div>
                            <div class="input-group multi-select">
                                <label data-locale="loadout_select">Waffen-Loadout</label>
                                <div class="checkbox-group" id="create-loadout">
                                    <!-- Options injected from JS -->
                                </div>
                            </div>
                            <div class="input-group">
                                <label><span data-locale="round_time">Rundenzeit</span>: <span id="val-time">15</span> Min</label>
                                <input type="range" id="create-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">Max. Spieler</span>: <span id="val-players">16</span></label>
                                <input type="range" id="create-players" min="2" max="16" step="1" value="16">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="respawn_time">Respawn-Zeit</span>: <span id="val-respawn">5</span>s</label>
                                <input type="range" id="create-respawn" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">Kill-Limit zum Sieg</span>: <span id="val-killlimit">30</span></label>
                                <input type="range" id="create-killlimit" min="0" max="50" step="5" value="30">
                            </div>
                            <div class="input-group toggle-group">
                                <label data-locale="vehicles_allowed">Fahrzeuge erlaubt</label>
                                <label class="switch">
                                    <input type="checkbox" id="create-vehicles">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="input-group toggle-group">
                                <label data-locale="friendly_fire">Freundliches Feuer</label>
                                <label class="switch">
                                    <input type="checkbox" id="create-ff">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="confirm-btn" id="btn-submit-create" data-locale="btn_create">Lobby erstellen</button>
                            <button class="cancel-btn" id="btn-reset-create" data-locale="btn_cancel">Abbrechen</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2>LOBBY: <span id="lobby-display-name">...</span></h2>
                    <div class="lobby-meta" id="lobby-display-meta"></div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">Spielerliste</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="lobby-main-section">
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" data-locale="team_blue">Blau</button>
                            <button class="team-btn" data-team="red" data-locale="team_red">Rot</button>
                            <button class="team-btn" data-team="random" data-locale="random">Zufall</button>
                            <button class="team-btn" data-team="spectator" data-locale="spectator">Zuschauer</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="Nachricht schreiben...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready" data-locale="btn_ready">Bereit</button>
                            <button class="start-btn" id="btn-start" style="display: none;" data-locale="btn_start">Spiel starten</button>
                            <button class="leave-btn" id="btn-leave" data-locale="btn_leave">Lobby verlassen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-item" id="hud-timer">00:00</div>
            <div class="hud-item tdm-only" id="hud-tdm-score" style="display: none;">
                <span class="blue">0</span> - <span class="red">0</span>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-stats">
                <div class="stat"><span data-locale="kills">Kills</span>: <span id="hud-kills">0</span></div>
                <div class="stat"><span data-locale="deaths">Tode</span>: <span id="hud-deaths">0</span></div>
            </div>
            <div class="hud-weapon">
                <i class="fa-solid fa-gun"></i> <span id="hud-ammo">0</span>
            </div>
            <div class="hud-bars">
                <div class="bar-container health">
                    <div class="bar-fill" id="hud-health" style="width: 100%;"></div>
                </div>
                <div class="bar-container armor">
                    <div class="bar-fill" id="hud-armor" style="width: 0%;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 data-locale="game_ended">Runde beendet!</h1>
            <h2 id="winner-display-name">...</h2>

            <div class="map-voting">
                <h3>VOTE NEXT MAP</h3>
                <div class="vote-options" id="vote-options">
                    <!-- Map votes injected here -->
                </div>
            </div>

            <div id="winner-stats"></div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-lobby">ZURÜCK ZUR LOBBY</button>
                <button class="cancel-btn" id="btn-back-menu">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <!-- Countdown -->
    <div id="game-countdown" class="overlay" style="display: none;">
        <div class="countdown-number">10</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
