<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title l-menu_title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active l-tab_ffa" data-tab="ffa">FFA Lobby</button>
                    <button class="tab-btn l-tab_create" data-tab="create">Lobby erstellen</button>
                    <button class="tab-btn l-tab_list" data-tab="list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab: FFA & Tab: List (Shared Browser) -->
                <div id="tab-browser" class="tab-content" style="display: flex;">
                    <!-- Sidebar: Filters -->
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label class="l-map_select">MAPS <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label class="l-max_players">PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all">ANY</option>
                                <option value="not-full">NOT FULL</option>
                            </select>
                        </div>
                    </aside>

                    <!-- Main Content: Lobby List -->
                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </main>
                </div>

                <!-- Tab: Create -->
                <div id="tab-create" class="tab-content" style="display: none; width: 100%;">
                    <div class="create-container">
                        <h2 class="l-tab_create">CREATE CUSTOM LOBBY</h2>
                        <div class="form-grid">
                            <div class="input-group">
                                <label class="l-lobby_name">LOBBY NAME</label>
                                <input type="text" id="create-lobby-name" placeholder="ENTER NAME...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label class="l-map_select">MAP</label>
                                    <select id="create-map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label class="l-mode_select">MODE</label>
                                    <select id="create-mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label class="l-loadout_select">LOADOUT</label>
                                <div class="loadout-grid" id="loadout-checkboxes">
                                    <!-- Checkboxes will be injected here -->
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label class="l-round_time">TIME (MIN): <span id="round-time-val">15</span></label>
                                    <input type="range" id="create-round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label class="l-max_players">MAX PLAYERS: <span id="max-players-val">16</span></label>
                                    <input type="range" id="create-max-players" min="2" max="16" step="1" value="16">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group toggle-group">
                                    <label class="l-vehicles_allowed">VEHICLES</label>
                                    <input type="checkbox" id="create-vehicles" class="toggle-input">
                                </div>
                                <div class="input-group toggle-group">
                                    <label class="l-friendly_fire">FRIENDLY FIRE</label>
                                    <input type="checkbox" id="create-ff" class="toggle-input">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label class="l-respawn_time">RESPAWN (SEC): <span id="respawn-time-val">5</span></label>
                                    <input type="range" id="create-respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label class="l-kill_limit">KILL LIMIT: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="create-kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="confirm-btn l-btn_create" id="btn-create-lobby-submit">CREATE</button>
                                <button class="cancel-btn l-btn_cancel" id="btn-create-cancel">CANCEL</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Waiting Area / Lobby Screen -->
                <div id="lobby-waiting-area" class="tab-content" style="display: none; width: 100%;">
                    <div class="lobby-card">
                        <header class="lobby-card-header">
                            <h2>LOBBY: <span id="lobby-title-display">Default</span></h2>
                        </header>
                        <div class="lobby-grid">
                            <div class="player-list-section">
                                <h3 class="l-tab_list">PLAYERS</h3>
                                <div id="player-list"></div>
                            </div>
                            <div class="settings-section">
                                <div class="settings-header">
                                    <h3 class="l-mode_select">SETTINGS</h3>
                                    <button id="btn-edit-settings" class="icon-btn" style="display: none;"><i class="fa-solid fa-gear"></i></button>
                                </div>
                                <div id="lobby-info-summary"></div>
                                <div class="team-selection">
                                    <button class="team-btn l-team_blue" data-team="blue" id="btn-team-blue">BLUE</button>
                                    <button class="team-btn l-team_red" data-team="red" id="btn-team-red">RED</button>
                                    <button class="team-btn l-spectator" data-team="spectator" id="btn-team-spec">SPECTATOR</button>
                                </div>
                                <div class="lobby-chat">
                                    <div id="chat-messages"></div>
                                    <div class="chat-input-wrapper">
                                        <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                                        <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                                    </div>
                                </div>
                                <div class="lobby-actions">
                                    <button class="ready-btn l-btn_ready" id="btn-ready-toggle">READY</button>
                                    <button class="start-btn l-btn_start" id="btn-start-game" style="display: none;">START</button>
                                    <button class="leave-btn l-btn_leave" id="btn-leave-lobby">LEAVE</button>
                                    <button class="close-btn l-close_lobby" id="btn-close-lobby" style="display: none;">CLOSE</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- In-Game HUD -->
        <div id="game-hud" style="display: none;">
            <div class="hud-top">
                <div class="hud-timer">
                    <i class="fa-solid fa-clock"></i>
                    <span id="hud-time">15:00</span>
                </div>
                <div class="hud-scores" id="hud-tdm-scores" style="display: none;">
                    <div class="score-box blue">
                        <span class="l-team_blue">BLUE</span>
                        <span id="score-blue">0</span>
                    </div>
                    <div class="score-box red">
                        <span id="score-red">0</span>
                        <span class="l-team_red">RED</span>
                    </div>
                </div>
            </div>
            <div class="hud-bottom-left">
                <div class="stat-item">
                    <span class="l-kills">KILLS</span>
                    <span id="hud-kills">0</span>
                </div>
                <div class="stat-item">
                    <span class="l-deaths">DEATHS</span>
                    <span id="hud-deaths">0</span>
                </div>
            </div>
            <div class="hud-bottom-right">
                <div class="bars-container">
                    <div class="bar-wrapper">
                        <div class="bar-bg"><div id="bar-health" class="bar-fill health"></div></div>
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div class="bar-wrapper">
                        <div class="bar-bg"><div id="bar-armor" class="bar-fill armor"></div></div>
                        <i class="fa-solid fa-shield"></i>
                    </div>
                </div>
                <div class="ammo-container">
                    <span id="hud-ammo-clip">30</span>
                    <span id="hud-ammo-total">/ 250</span>
                </div>
            </div>
            <div id="hud-countdown" class="hud-overlay-text" style="display: none;">10</div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 class="l-game_ended">MATCH ENDED</h1>
                <h2 id="winner-name-display">PLAYER WINS!</h2>
                <div id="match-stats-container">
                    <!-- Stats Table -->
                </div>

                <div class="map-voting-section">
                    <h3 class="l-map_voting">MAP VOTING</h3>
                    <div class="map-voting-grid" id="map-voting-grid">
                        <!-- Map Vote Items -->
                    </div>
                </div>

                <div class="btn-group">
                    <button class="confirm-btn l-back_to_lobby" id="btn-winner-back-lobby">BACK TO LOBBY</button>
                    <button class="cancel-btn l-back_to_menu" id="btn-winner-back-menu">MAIN MENU</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
