<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa">FFA LOBBY</button>
                    <button class="tab-btn" data-tab="create">LOBBY ERSTELLEN</button>
                    <button class="tab-btn" data-tab="list">OFFENE LOBBYS</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1 & 3: Lobby Browser (Shared structure) -->
                <div id="lobby-browser-tab" class="tab-content active">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label>FILTER: FREIE PLÄTZE</label>
                            <label class="switch">
                                <input type="checkbox" id="filter-free-slots">
                                <span class="slider round"></span>
                            </label>
                        </div>
                        <div class="filter-group">
                            <label>MAPS</label>
                            <select id="filter-maps">
                                <option value="all">ALLE MAPS</option>
                            </select>
                        </div>
                    </aside>
                    <main class="lobby-list-container">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </main>
                </div>

                <!-- Tab 2: Create Lobby -->
                <div id="create-lobby-tab" class="tab-content">
                    <div class="create-form">
                        <div class="form-grid">
                            <div class="input-group">
                                <label>LOBBY NAME</label>
                                <input type="text" id="lobby-name" placeholder="Name eingeben...">
                            </div>
                            <div class="input-group">
                                <label>MAP AUSWÄHLEN</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label>SPIELMODUS</label>
                                <select id="mode-select">
                                    <option value="ffa">FFA (Jeder gegen jeden)</option>
                                    <option value="tdm">Team Deathmatch</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label>WAFFEN-LOADOUT</label>
                                <select id="loadout-select" multiple size="5">
                                    <!-- Options injected via JS -->
                                </select>
                                <small>Mehrfachauswahl mit STRG möglich</small>
                            </div>
                            <div class="input-group">
                                <label>RUNDENZEIT: <span id="round-time-val">15</span> MIN</label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label>MAX. SPIELER: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="32" step="1" value="16">
                            </div>
                            <div class="input-group horizontal">
                                <label>FAHRZEUGE ERLAUBT?</label>
                                <label class="switch">
                                    <input type="checkbox" id="vehicles-allowed">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="input-group horizontal">
                                <label>FREUNDLICHES FEUER</label>
                                <label class="switch">
                                    <input type="checkbox" id="friendly-fire">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="input-group">
                                <label>RESPAWN-ZEIT: <span id="respawn-time-val">5</span> SEK</label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label>KILL-LIMIT: <span id="kill-limit-val">0</span> (0 = AUS)</label>
                                <input type="range" id="kill-limit" min="0" max="50" step="5" value="0">
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="create-btn" id="btn-create-lobby-confirm">LOBBY ERSTELLEN</button>
                            <button class="cancel-btn" id="btn-create-lobby-cancel">ABBRECHEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Waiting Area -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="tab-players-header">SPIELERLISTE</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>EINSTELLUNGEN</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">TEAM BLAU</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">TEAM ROT</button>
                            <button class="team-btn" data-team="random" id="btn-team-random">ZUFALL</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">ZUSCHAUER</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="Nachricht senden...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">SPIEL STARTEN</button>
                            <button class="leave-btn" id="btn-leave-lobby">VERLASSEN</button>
                            <button class="cancel-btn" id="btn-close-lobby" style="display: none;">LOBBY SCHLIEẞEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-right">
            <div class="hud-timer" id="hud-timer">00:00</div>
            <div class="hud-tdm-score" id="hud-tdm-score" style="display: none;">
                <span class="score-blue" id="score-blue">0</span> - <span class="score-red" id="score-red">0</span>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-stats">
                <div class="stat-item"><i class="fa-solid fa-skull"></i> <span id="hud-kills">0</span></div>
                <div class="stat-item"><i class="fa-solid fa-cross"></i> <span id="hud-deaths">0</span></div>
            </div>
            <div class="hud-weapon">
                <span id="hud-ammo">0</span> <i class="fa-solid fa-gun"></i>
            </div>
        </div>
        <div class="hud-bottom-left">
            <div class="hud-bars">
                <div class="hud-bar-bg"><div class="hud-bar-fill health" id="hud-health"></div></div>
                <div class="hud-bar-bg"><div class="hud-bar-fill armor" id="hud-armor"></div></div>
            </div>
        </div>
        <div id="big-countdown"></div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title">MATCH BEENDET</h1>
            <h2 id="winner-name">SPIELER GEWINNT!</h2>
            <div id="match-stats-table"></div>

            <div class="map-voting">
                <h3>NÄCHSTE MAP WÄHLEN</h3>
                <div class="vote-options" id="map-vote-options"></div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby">ZURÜCK ZUR LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
