<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Sidebar: Filters (Only visible in Tab 1 and 3) -->
                <aside class="sidebar" id="sidebar-filters">
                    <div class="filter-group">
                        <label><span data-locale="map_select">MAPS</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label><span data-locale="col_players">PLAYERS</span> <i class="fa-solid fa-chevron-down"></i></label>
                        <div class="toggle-container">
                            <input type="checkbox" id="filter-free-slots">
                            <label for="filter-free-slots" data-locale="filter_free_slots">Nur Lobbys mit freien Plätzen</label>
                        </div>
                    </div>

                    <button class="create-btn" id="sidebar-btn-create" data-locale="tab_create">CREATE LOBBY</button>
                </aside>

                <!-- Main Content: Lobby Browser -->
                <main class="lobby-browser">
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Lobby items will be injected here -->
                    </div>

                    <!-- Create Lobby Form (Integrated into Tab 2) -->
                    <div id="create-lobby-form" class="tab-content" style="display: none;">
                        <h2 data-locale="tab_create">CREATE CUSTOM LOBBY</h2>
                        <div class="form-container">
                            <div class="input-group">
                                <label data-locale="lobby_name">LOBBY NAME</label>
                                <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label data-locale="map_select">MAP</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label data-locale="mode_select">MODE</label>
                                    <select id="mode-select">
                                        <option value="ffa">FFA</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label data-locale="loadout_select">LOADOUT</label>
                                <select id="loadout-select"></select>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span data-locale="round_time">TIME</span> (MIN): <span id="round-time-val">15</span></label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="max_players">MAX PLAYERS</span>: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="32" step="1" value="16">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group toggle-group">
                                    <label data-locale="vehicles_allowed">VEHICLES ALLOWED</label>
                                    <input type="checkbox" id="vehicles-allowed" class="apple-switch">
                                </div>
                                <div class="input-group toggle-group">
                                    <label data-locale="friendly_fire">FRIENDLY FIRE</label>
                                    <input type="checkbox" id="friendly-fire" class="apple-switch">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label><span data-locale="respawn_time">RESPAWN TIME</span> (SEK): <span id="respawn-time-val">5</span></label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label><span data-locale="kill_limit">KILL LIMIT</span>: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="confirm-btn" id="btn-create-lobby" data-locale="btn_create">CREATE</button>
                                <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">CANCEL</button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                    <button class="edit-settings-btn" id="btn-edit-settings" style="display: none;"><i class="fa-solid fa-gear"></i></button>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 data-locale="mode_select">SETTINGS</h3>
                        <div id="lobby-info-summary" class="info-summary-grid"></div>

                        <div class="team-selection-area">
                            <label data-locale="mode_select">TEAM</label>
                            <div class="team-selection">
                                <button class="team-btn blue" data-team="blue" data-locale="team_blue">BLUE</button>
                                <button class="team-btn red" data-team="red" data-locale="team_red">RED</button>
                                <button class="team-btn spec" data-team="spectator" data-locale="spectator">SPECTATOR</button>
                            </div>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <div class="chat-input-wrapper">
                                <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                                <i class="fa-solid fa-paper-plane"></i>
                            </div>
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 id="winner-title" data-locale="game_ended">MATCH ENDED</h1>
                <h2 id="winner-name">PLAYER WINS!</h2>

                <div class="winner-stats-container">
                    <div id="match-stats-table"></div>
                </div>

                <div class="map-voting-section">
                    <h3>VOTE NEXT MAP</h3>
                    <div id="map-vote-list" class="vote-grid"></div>
                </div>

                <div class="btn-group">
                    <button class="confirm-btn" id="btn-back-to-lobby" data-locale="btn_back_lobby">BACK TO LOBBY</button>
                    <button class="cancel-btn" id="btn-back-to-menu" data-locale="btn_back_menu">MAIN MENU</button>
                </div>
            </div>
        </div>

        <!-- Countdown Overlay -->
        <div id="big-countdown" class="overlay" style="display: none; background: transparent;">
            <div class="countdown-number">10</div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-right">
            <div class="hud-timer-box">
                <i class="fa-solid fa-clock"></i>
                <span id="hud-timer">15:00</span>
            </div>
            <div class="hud-score-box" id="hud-tdm-score" style="display: none;">
                <div class="team-score blue"><span class="team-dot"></span> <span id="score-blue">0</span></div>
                <div class="team-score red"><span class="team-dot"></span> <span id="score-red">0</span></div>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="hud-stats">
                <div class="stat-item"><span data-locale="kills">KILLS</span>: <span id="hud-kills">0</span></div>
                <div class="stat-item"><span data-locale="deaths">DEATHS</span>: <span id="hud-deaths">0</span></div>
            </div>
            <div class="hud-weapon">
                <span id="hud-ammo">30/250</span>
                <i class="fa-solid fa-gun"></i>
            </div>
            <div class="hud-bars">
                <div class="hud-bar-container">
                    <div class="hud-bar health" id="hud-health" style="width: 100%;"></div>
                </div>
                <div class="hud-bar-container">
                    <div class="hud-bar armor" id="hud-armor" style="width: 50%;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
