<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" id="loc-menu-title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" id="loc-tab-ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" id="loc-tab-create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" id="loc-tab-list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Left Panel: Filters -->
                <aside class="sidebar" id="sidebar-filters">
                    <div class="filter-group">
                        <label>MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALL MAPS</option>
                            <option value="legion">LEGION SQUARE</option>
                            <option value="sandy">SANDY SHORES</option>
                            <option value="airport">AIRPORT</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>WEAPONS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALL WEAPONS</option>
                            <option value="pistols">PISTOLS ONLY</option>
                            <option value="snipers">SNIPERS ONLY</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>PLAYERS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ANY</option>
                            <option value="not-full">NOT FULL</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>TIME <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-time">
                            <option value="all">ANY TIME</option>
                            <option value="short">5-10 MIN</option>
                            <option value="long">15+ MIN</option>
                        </select>
                    </div>

                    <button class="create-btn" id="open-create-modal">CREATE LOBBY</button>
                </aside>

                <!-- Main Content: Lobby List -->
                <main class="lobby-browser">
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Entries will be injected here -->
                    </div>
                </main>
            </div>
        </div>

        <!-- Lobby Creation Tab (Embedded in main area when 'create' tab active) -->
        <div id="lobby-creation-tab" style="display: none; height: 100%;">
            <div class="creation-container">
            <h2 id="loc-create-title">CUSTOM LOBBY ERSTELLEN</h2>
            <div class="form-container">
                <div class="input-group">
                    <label id="loc-lobby-name">LOBBY NAME</label>
                    <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label id="loc-map-select">MAP</label>
                        <select id="map-select"></select>
                    </div>
                    <div class="input-group">
                        <label id="loc-mode-select">MODE</label>
                        <select id="mode-select">
                            <option value="ffa">FFA</option>
                            <option value="tdm">TEAM DEATHMATCH</option>
                        </select>
                    </div>
                </div>
                <div class="input-group">
                    <label id="loc-loadout-select">LOADOUT</label>
                    <div class="loadout-grid" id="loadout-checkboxes">
                        <!-- Multi-select checkboxes will be injected here -->
                    </div>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label><span id="loc-round-time">TIME (MIN)</span>: <span id="round-time-val">15</span></label>
                        <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                    </div>
                    <div class="input-group">
                        <label><span id="loc-max-players">MAX PLAYERS</span>: <span id="max-players-val">16</span></label>
                        <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                    </div>
                </div>
                <div class="input-row">
                    <div class="input-group toggle-group">
                        <label id="loc-vehicles-allowed">FAHRZEUGE</label>
                        <label class="switch">
                            <input type="checkbox" id="vehicles-allowed">
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div class="input-group toggle-group">
                        <label id="loc-friendly-fire">FRIENDLY FIRE</label>
                        <label class="switch">
                            <input type="checkbox" id="friendly-fire">
                            <span class="slider round"></span>
                        </label>
                    </div>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label><span id="loc-respawn-time">RESPAWN (SEK)</span>: <span id="respawn-time-val">5</span></label>
                        <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                    </div>
                    <div class="input-group">
                        <label><span id="loc-kill-limit">KILL LIMIT</span>: <span id="kill-limit-val">30</span></label>
                        <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                    </div>
                </div>
                <div class="btn-group">
                    <button class="confirm-btn" id="btn-create-lobby">LOBBY ERSTELLEN</button>
                    <button class="cancel-btn" id="btn-cancel-create">ABBRECHEN</button>
                </div>
            </div>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 id="loc-players-header">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>SETTINGS</h3>
                        <div id="lobby-info-summary"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">RED</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">SPECTATOR</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">START</button>
                            <button class="leave-btn" id="btn-leave-lobby">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-left">
            <div class="hud-timer">
                <i class="fa-solid fa-clock"></i> <span id="hud-timer-val">15:00</span>
            </div>
            <div class="hud-score-tdm" id="hud-tdm-scores" style="display: none;">
                <div class="score-blue"><span class="score-label">BLUE</span> <span id="score-blue-val">0</span></div>
                <div class="score-red"><span id="score-red-val">0</span> <span class="score-label">RED</span></div>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-player-stats">
                <div class="stat-item"><span id="loc-hud-kills">KILLS</span>: <span id="hud-kills-val">0</span></div>
                <div class="stat-item"><span id="loc-hud-deaths">DEATHS</span>: <span id="hud-deaths-val">0</span></div>
            </div>
            <div class="hud-weapon-info">
                <div class="ammo-count" id="hud-ammo-val">30 / 120</div>
            </div>
            <div class="hud-health-armor">
                <div class="health-bar"><div id="health-progress"></div></div>
                <div class="armor-bar"><div id="armor-progress"></div></div>
            </div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title">MATCH ENDED</h1>
            <h2 id="winner-name">PLAYER WINS!</h2>
            <div id="match-stats-table"></div>

            <div class="map-voting-section">
                <h3 id="loc-vote-next-map">VOTE FOR NEXT MAP</h3>
                <div class="vote-grid" id="vote-map-list"></div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
