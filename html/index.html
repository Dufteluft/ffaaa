<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <!-- MAIN MENU -->
        <div id="main-menu" class="main-container">
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1: FFA Lobby & Tab 3: Open Lobbies (Shared List View) -->
                <div id="tab-list-view" class="tab-content active">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label><span data-locale="map_select">MAP</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all" data-locale="filter_all_maps">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span data-locale="players">PLAYERS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all" data-locale="filter_any">ANY</option>
                                <option value="not-full" data-locale="filter_not_full">NOT FULL</option>
                            </select>
                        </div>
                        <button class="create-btn" id="sidebar-create-btn" data-locale="btn_create">CREATE LOBBY</button>
                    </aside>
                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries injected by script.js -->
                        </div>
                    </main>
                </div>

                <!-- Tab 2: Create Lobby -->
                <div id="tab-create-view" class="tab-content">
                    <div class="create-form-container">
                        <div class="form-grid">
                            <div class="input-group full-width">
                                <label data-locale="lobby_name">LOBBY NAME</label>
                                <input type="text" id="create-lobby-name" placeholder="...">
                            </div>
                            <div class="input-group">
                                <label data-locale="map_select">MAP</label>
                                <select id="create-map-select"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">MODE</label>
                                <select id="create-mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">TEAM DEATHMATCH</option>
                                </select>
                            </div>
                            <div class="input-group full-width">
                                <label data-locale="loadout_select">LOADOUT</label>
                                <div class="loadout-grid" id="loadout-checkboxes">
                                    <!-- Checkboxes injected by script.js -->
                                </div>
                            </div>
                            <div class="input-group">
                                <label><span data-locale="round_time">TIME</span>: <span id="val-round-time">15</span>m</label>
                                <input type="range" id="input-round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">MAX PLAYERS</span>: <span id="val-max-players">16</span></label>
                                <input type="range" id="input-max-players" min="2" max="16" step="1" value="16">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="respawn_time">RESPAWN</span>: <span id="val-respawn-time">5</span>s</label>
                                <input type="range" id="input-respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">KILL LIMIT</span>: <span id="val-kill-limit">30</span></label>
                                <input type="range" id="input-kill-limit" min="0" max="50" step="5" value="30">
                            </div>
                            <div class="toggle-group">
                                <label data-locale="vehicles_allowed">VEHICLES</label>
                                <input type="checkbox" id="input-vehicles" class="toggle-input">
                            </div>
                            <div class="toggle-group">
                                <label data-locale="friendly_fire">FRIENDLY FIRE</label>
                                <input type="checkbox" id="input-friendly-fire" class="toggle-input">
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="confirm-btn" id="btn-submit-create" data-locale="btn_create">CREATE</button>
                            <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">CANCEL</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- LOBBY WAITING AREA -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2>LOBBY: <span id="lobby-display-name">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="players">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 data-locale="settings">SETTINGS</h3>
                        <div id="lobby-settings-summary" class="settings-summary"></div>

                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" data-locale="team_red">RED</button>
                            <button class="team-btn" data-team="spectator" data-locale="spectator">SPECTATOR</button>
                        </div>

                        <div class="lobby-chat">
                            <h3 data-locale="chat">CHAT</h3>
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="...">
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready" data-locale="btn_ready">READY</button>
                            <button class="start-btn" id="btn-start" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave" data-locale="btn_leave">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- WINNER SCREEN -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 data-locale="game_ended">MATCH ENDED</h1>
                <h2 id="winner-display-name">PLAYER <span data-locale="winner_suffix">WINS!</span></h2>

                <div id="match-stats-container"></div>

                <div class="map-voting-section">
                    <h3 data-locale="vote_next_map">VOTE NEXT MAP</h3>
                    <div class="map-vote-grid" id="map-vote-grid">
                        <!-- Map vote items injected by script.js -->
                    </div>
                </div>

                <div class="winner-actions">
                    <button class="confirm-btn" id="btn-back-lobby" data-locale="back_to_lobby">BACK TO LOBBY</button>
                    <button class="cancel-btn" id="btn-back-menu" data-locale="back_to_menu">MAIN MENU</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud" style="display: none;">
        <div class="hud-top-right">
            <div class="hud-timer" id="hud-timer">00:00</div>
            <div class="hud-score-container" id="hud-tdm-score" style="display: none;">
                <div class="score-box blue"><span id="score-blue">0</span></div>
                <div class="score-box red"><span id="score-red">0</span></div>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-stat-row">
                <i class="fa-solid fa-crosshairs"></i> <span id="hud-kills">0</span>
                <i class="fa-solid fa-skull"></i> <span id="hud-deaths">0</span>
            </div>
            <div class="hud-weapon-info">
                <span id="hud-ammo">0</span> <i class="fa-solid fa-bullet"></i>
            </div>
            <div class="hud-bars">
                <div class="hud-bar-container health">
                    <div class="hud-bar-fill" id="hud-health-fill"></div>
                </div>
                <div class="hud-bar-container armor">
                    <div class="hud-bar-fill" id="hud-armor-fill"></div>
                </div>
            </div>
        </div>
        <div id="hud-countdown" class="hud-countdown" style="display: none;">10</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
