<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA Lobby</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">Lobby erstellen</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">Offene Lobbys</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab 1 & 3: Lobby Browser -->
                <div id="tab-browser" class="tab-content active">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label><span data-locale="map_select">MAPS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALL MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label><span data-locale="loadout_select">WEAPONS</span> <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-weapons">
                                <option value="all">ALL WEAPONS</option>
                            </select>
                        </div>
                        <div class="filter-check">
                            <input type="checkbox" id="filter-free-slots">
                            <label for="filter-free-slots">Nur Lobbys mit freien Plätzen</label>
                        </div>
                    </aside>

                    <main class="lobby-browser">
                        <div class="lobby-list" id="lobby-list-container">
                            <!-- Entries will be injected here -->
                        </div>
                    </main>
                </div>

                <!-- Tab 2: Create Lobby -->
                <div id="tab-create" class="tab-content">
                    <div class="create-form-container">
                        <div class="form-grid">
                            <div class="input-group full-width">
                                <label data-locale="lobby_name">LOBBY NAME</label>
                                <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                            </div>
                            <div class="input-group">
                                <label data-locale="map_select">MAP</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">SPIELMODUS</label>
                                <select id="mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">TEAM DEATHMATCH</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label data-locale="loadout_select">WAFFEN-LOADOUT</label>
                                <select id="loadout-select" multiple class="multi-select"></select>
                                <small>Halte STRG für Mehrfachauswahl</small>
                            </div>
                            <div class="input-group">
                                <label><span data-locale="round_time">RUNDENZEIT</span>: <span id="round-time-val">15</span> MIN</label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">MAX. SPIELER</span>: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                            </div>
                            <div class="input-group">
                                <label data-locale="respawn_time">RESPAWN-ZEIT (SEK)</label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                <span id="respawn-time-val">5</span> SEK
                            </div>
                            <div class="input-group">
                                <label data-locale="kill_limit">KILL-LIMIT ZUM SIEG</label>
                                <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                <span id="kill-limit-val">30</span> (0 = AUS)
                            </div>
                            <div class="toggle-group">
                                <div class="toggle-item">
                                    <label data-locale="vehicles_allowed">FAHRZEUGE ERLAUBT</label>
                                    <input type="checkbox" id="vehicles-allowed" class="toggle-input">
                                </div>
                                <div class="toggle-item">
                                    <label data-locale="friendly_fire">FREUNDLICHES FEUER</label>
                                    <input type="checkbox" id="friendly-fire" class="toggle-input">
                                </div>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="create-btn" id="btn-create-lobby" data-locale="btn_create">LOBBY ERSTELLEN</button>
                            <button class="cancel-btn" id="btn-cancel-create" data-locale="btn_cancel">ABBRECHEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                    <div class="lobby-id-badge">ID: <span id="display-lobby-id">0000</span></div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_players">SPIELERLISTE</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <div class="settings-and-teams">
                            <div class="active-settings">
                                <h3 data-locale="mode_select">EINSTELLUNGEN</h3>
                                <div id="lobby-info-summary"></div>
                                <button class="edit-settings-btn host-only" id="btn-edit-settings" style="display: none;">EDIT SETTINGS</button>
                            </div>
                            <div class="team-selection">
                                <h3 data-locale="mode_select">TEAM WÄHLEN</h3>
                                <div class="team-buttons">
                                    <button class="team-btn" data-team="blue" id="btn-team-blue" data-locale="team_blue">BLAU</button>
                                    <button class="team-btn" data-team="red" id="btn-team-red" data-locale="team_red">ROT</button>
                                    <button class="team-btn" data-team="random" id="btn-team-random" data-locale="random">ZUFALL</button>
                                </div>
                            </div>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="NACHRICHT SENDEN...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">BEREIT</button>
                            <button class="start-btn host-only" id="btn-start-game" style="display: none;" data-locale="btn_start">SPIEL STARTEN</button>
                            <button class="close-btn host-only" id="btn-close-lobby" style="display: none;">LOBBY SCHLIESSEN</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">VERLASSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Big Countdown Overlay -->
        <div id="big-countdown" class="overlay" style="display: none; background: rgba(0,0,0,0.4); backdrop-filter: none;">
            <div class="countdown-number" id="countdown-num">10</div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer"><i class="fa-solid fa-clock"></i> <span id="hud-time">15:00</span></div>
            <div class="hud-tdm-scores" id="hud-tdm-scores" style="display: none;">
                <div class="team-score blue"><span id="score-blue">0</span></div>
                <div class="score-vs">VS</div>
                <div class="team-score red"><span id="score-red">0</span></div>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-weapon-info">
                <div class="ammo-count"><span id="weapon-ammo">30</span></div>
                <div class="weapon-icon"><i class="fa-solid fa-gun"></i></div>
            </div>
            <div class="hud-vitals">
                <div class="bar-container"><div class="bar health" id="health-fill"></div></div>
                <div class="bar-container"><div class="bar armor" id="armor-fill"></div></div>
            </div>
        </div>
        <div class="hud-bottom-left">
            <div class="hud-match-stats">
                <div class="hud-stat"><span class="label">KILLS:</span> <span id="hud-kills">0</span></div>
                <div class="hud-stat"><span class="label">TODE:</span> <span id="hud-deaths">0</span></div>
            </div>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title" data-locale="game_ended">MATCH BEENDET</h1>
            <h2 id="winner-name-display"><span id="winner-name">PLAYER</span> <span data-locale="wins_suffix">GEWINNT!</span></h2>

            <div class="stats-scroll-area">
                <div id="match-stats-table"></div>
            </div>

            <div class="map-voting">
                <h3 data-locale="map_select">NÄCHSTE MAP WÄHLEN</h3>
                <div class="map-vote-list" id="map-votes">
                    <!-- Maps will be injected here -->
                </div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
