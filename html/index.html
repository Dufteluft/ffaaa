<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa">FFA LOBBY</button>
                    <button class="tab-btn" data-tab="create">LOBBY ERSTELLEN</button>
                    <button class="tab-btn" data-tab="list">OFFENE LOBBYS</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab: FFA Lobby (Vordefiniert) -->
                <div id="tab-ffa" class="tab-content active">
                    <main class="lobby-browser">
                        <div class="lobby-list" id="ffa-list-container">
                            <!-- Predefined lobbies injected here -->
                        </div>
                    </main>
                </div>

                <!-- Tab: Lobby Erstellen -->
                <div id="tab-create" class="tab-content">
                    <div class="create-container">
                        <h2>LOBBY ERSTELLEN</h2>
                        <div class="form-grid">
                            <div class="form-left">
                                <div class="input-group">
                                    <label>LOBBY NAME</label>
                                    <input type="text" id="create-lobby-name" placeholder="NAME EINGEBEN...">
                                </div>
                                <div class="input-row">
                                    <div class="input-group">
                                        <label>MAP</label>
                                        <select id="create-map-select"></select>
                                    </div>
                                    <div class="input-group">
                                        <label>MODUS</label>
                                        <select id="create-mode-select">
                                            <option value="ffa">FFA</option>
                                            <option value="tdm">TEAM DEATHMATCH</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label>WAFFEN-LOADOUT (MULTI-SELECT)</label>
                                    <div class="loadout-grid" id="loadout-checkboxes">
                                        <!-- Checkboxes injected by JS -->
                                    </div>
                                </div>
                            </div>
                            <div class="form-right">
                                <div class="input-group">
                                    <label>RUNDENZEIT (MIN): <span id="val-round-time">15</span></label>
                                    <input type="range" id="input-round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label>MAX. SPIELER: <span id="val-max-players">16</span></label>
                                    <input type="range" id="input-max-players" min="2" max="16" step="1" value="16">
                                </div>
                                <div class="input-group">
                                    <label>RESPAWN-ZEIT (SEK): <span id="val-respawn-time">5</span></label>
                                    <input type="range" id="input-respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label>KILL-LIMIT (0 = AUS): <span id="val-kill-limit">30</span></label>
                                    <input type="range" id="input-kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                                <div class="toggle-group">
                                    <div class="toggle-item">
                                        <label>FAHRZEUGE ERLAUBT</label>
                                        <input type="checkbox" id="input-vehicles" class="toggle-input">
                                    </div>
                                    <div class="toggle-item">
                                        <label>FRIENDLY FIRE</label>
                                        <input type="checkbox" id="input-friendly-fire" class="toggle-input">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="create-actions">
                            <button class="confirm-btn" id="btn-create-lobby-final">LOBBY ERSTELLEN</button>
                            <button class="cancel-btn" id="btn-cancel-create">ABBRECHEN</button>
                        </div>
                    </div>
                </div>

                <!-- Tab: Offene Lobbys -->
                <div id="tab-list" class="tab-content">
                    <aside class="sidebar">
                        <div class="filter-group">
                            <label>MAPS <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-maps">
                                <option value="all">ALLE MAPS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>SPIELER <i class="fa-solid fa-chevron-down"></i></label>
                            <select id="filter-players">
                                <option value="all">ALLE</option>
                                <option value="not-full">NICHT VOLL</option>
                            </select>
                        </div>
                        <div class="filter-status">
                            <p>Auto-Refresh: 5s</p>
                        </div>
                    </aside>
                    <main class="lobby-browser">
                        <div class="lobby-list" id="open-list-container">
                            <!-- Open lobbies injected here -->
                        </div>
                    </main>
                </div>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                    <div id="lobby-status-tag" class="status-badge">WAITING</div>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3>SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>EINSTELLUNGEN</h3>
                        <div id="lobby-info-summary" class="info-grid"></div>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">BLAU</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">ROT</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">ZUSCHAUER</button>
                        </div>
                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="NACHRICHT SENDEN...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">START</button>
                            <button class="leave-btn" id="btn-leave-lobby">VERLASSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winner-screen" class="overlay" style="display: none;">
            <div class="winner-card">
                <h1 id="winner-title">RUNDE BEENDET</h1>
                <h2 id="winner-name">SPIELER GEWINNT!</h2>
                <div id="match-stats-table"></div>

                <div class="btn-group">
                    <button class="confirm-btn" id="btn-back-to-lobby">ZURÜCK ZUR LOBBY</button>
                    <button class="cancel-btn" id="btn-back-to-menu">HAUPTMENÜ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-timer">
                <i class="fa-regular fa-clock"></i> <span id="hud-time">15:00</span>
            </div>
        </div>
        <div class="hud-center">
            <div id="hud-countdown" class="hud-countdown-text" style="display: none;">10</div>
        </div>
        <div class="hud-bottom-left">
            <div class="hud-stats-box">
                <div class="hud-stat">
                    <span class="stat-label">KILLS</span>
                    <span id="hud-kills" class="stat-value">0</span>
                </div>
                <div class="hud-stat">
                    <span class="stat-label">TODE</span>
                    <span id="hud-deaths" class="stat-value">0</span>
                </div>
            </div>
            <div id="hud-tdm-score" class="hud-tdm-box" style="display: none;">
                <div class="team-score blue">
                    <span class="team-name">BLAU</span>
                    <span id="score-blue">0</span>
                </div>
                <div class="team-score red">
                    <span class="team-name">ROT</span>
                    <span id="score-red">0</span>
                </div>
            </div>
        </div>
        <div class="hud-bottom-right">
            <div class="hud-player-info">
                <div class="bars-container">
                    <div class="hud-bar health-bar">
                        <div id="bar-health" class="bar-fill" style="width: 100%;"></div>
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div class="hud-bar armor-bar">
                        <div id="bar-armor" class="bar-fill" style="width: 100%;"></div>
                        <i class="fa-solid fa-shield"></i>
                    </div>
                </div>
                <div class="ammo-info">
                    <i class="fa-solid fa-gun"></i> <span id="hud-ammo">100</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
