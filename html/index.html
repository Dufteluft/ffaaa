<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title" data-locale="menu_title">GTA V FREE-FOR-ALL LOBBY FINDER</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa" data-locale="tab_ffa">FFA LOBBY</button>
                    <button class="tab-btn" data-tab="create" data-locale="tab_create">LOBBY ERSTELLEN</button>
                    <button class="tab-btn" data-tab="list" data-locale="tab_list">OFFENE LOBBYS</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Tab Content: FFA & Open Lobbies -->
                <main class="lobby-browser" id="browser-content">
                    <div class="lobby-list" id="lobby-list-container">
                        <!-- Entries will be injected here -->
                    </div>
                </main>

                <!-- Tab Content: Create Lobby -->
                <main class="create-lobby-container" id="create-content" style="display: none;">
                    <div class="create-form">
                        <div class="form-grid">
                            <div class="input-group full-width">
                                <label data-locale="lobby_name">LOBBY NAME</label>
                                <input type="text" id="lobby-name" placeholder="ENTER NAME...">
                            </div>

                            <div class="input-group">
                                <label data-locale="map_select">MAP</label>
                                <select id="map-select"></select>
                            </div>
                            <div class="input-group">
                                <label data-locale="mode_select">MODE</label>
                                <select id="mode-select">
                                    <option value="ffa">FFA</option>
                                    <option value="tdm">TEAM DEATHMATCH</option>
                                </select>
                            </div>

                            <div class="input-group full-width">
                                <label data-locale="loadout_select">LOADOUT</label>
                                <div class="loadout-grid" id="loadout-checkboxes">
                                    <!-- Will be injected via script -->
                                </div>
                            </div>

                            <div class="input-group">
                                <label><span data-locale="round_time">TIME (MIN)</span>: <span id="round-time-val">15</span></label>
                                <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="max_players">MAX PLAYERS</span>: <span id="max-players-val">16</span></label>
                                <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                            </div>

                            <div class="input-group">
                                <label><span data-locale="respawn_time">RESPAWN (SEC)</span>: <span id="respawn-time-val">5</span></label>
                                <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                            </div>
                            <div class="input-group">
                                <label><span data-locale="kill_limit">KILL LIMIT</span>: <span id="kill-limit-val">0</span></label>
                                <input type="range" id="kill-limit" min="0" max="50" step="5" value="0">
                            </div>

                            <div class="toggle-group">
                                <label data-locale="vehicles_allowed">VEHICLES</label>
                                <label class="switch">
                                    <input type="checkbox" id="vehicles-allowed">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                            <div class="toggle-group">
                                <label data-locale="friendly_fire">FRIENDLY FIRE</label>
                                <label class="switch">
                                    <input type="checkbox" id="friendly-fire">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>

                        <div class="btn-group">
                            <button class="confirm-btn" id="btn-create-lobby" data-locale="btn_create">CREATE</button>
                            <button class="cancel-btn" id="btn-reset-form" data-locale="btn_cancel">RESET</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2 id="lobby-card-title">LOBBY: <span id="lobby-title">Default</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3 data-locale="tab_list">PLAYERS</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3 data-locale="tab_create">SETTINGS</h3>
                        <div id="lobby-info-summary" class="settings-summary"></div>

                        <div class="team-selection" id="team-selector-container">
                            <button class="team-btn" data-team="blue" id="btn-team-blue" data-locale="team_blue">BLUE</button>
                            <button class="team-btn" data-team="red" id="btn-team-red" data-locale="team_red">RED</button>
                            <button class="team-btn" data-team="random" id="btn-team-random" data-locale="random">RANDOM</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="SEND MESSAGE...">
                        </div>
                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle" data-locale="btn_ready">READY</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;" data-locale="btn_start">START</button>
                            <button class="leave-btn" id="btn-leave-lobby" data-locale="btn_leave">LEAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top">
            <div class="match-info">
                <div id="match-timer">00:00</div>
                <div id="match-mode">FFA</div>
            </div>
            <div class="team-scores" id="tdm-scores" style="display: none;">
                <div class="score-box blue"><span class="label">BLUE</span> <span id="score-blue">0</span></div>
                <div class="score-box red"><span id="score-red">0</span> <span class="label">RED</span></div>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="weapon-info">
                <div id="weapon-ammo">0 / 0</div>
                <div id="weapon-icon"><i class="fa-solid fa-gun"></i></div>
            </div>
            <div class="player-stats-mini">
                <div class="stat-item"><span data-locale="kills">KILLS</span> <span id="hud-kills">0</span></div>
                <div class="stat-item"><span data-locale="deaths">DEATHS</span> <span id="hud-deaths">0</span></div>
            </div>
            <div class="status-bars">
                <div class="bar-container armor">
                    <div class="bar-fill" id="armor-fill" style="width: 0%;"></div>
                </div>
                <div class="bar-container health">
                    <div class="bar-fill" id="health-fill" style="width: 100%;"></div>
                </div>
            </div>
        </div>

        <div id="countdown-display" style="display: none;">10</div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title" data-locale="game_ended">MATCH ENDED</h1>
            <h2 id="winner-name">PLAYER WINS!</h2>

            <div class="match-stats-container">
                <div id="match-stats-table"></div>
            </div>

            <div class="voting-section">
                <h3 data-locale="map_select">VOTE FOR NEXT MAP</h3>
                <div class="voting-grid" id="map-voting-grid"></div>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby" style="display: none;" data-locale="btn_join">BACK TO LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu" data-locale="btn_leave">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
