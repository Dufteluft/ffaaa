<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V FFA Lobby System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Header -->
            <header class="main-header">
                <h1 class="header-title">FFA LOBBY SYSTEM</h1>
                <nav class="nav-tabs">
                    <button class="tab-btn active" data-tab="ffa">FFA LOBBY</button>
                    <button class="tab-btn" data-tab="create">LOBBY ERSTELLEN</button>
                    <button class="tab-btn" data-tab="list">OFFENE LOBBYS</button>
                </nav>
            </header>

            <div class="content-wrapper">
                <!-- Sidebar / Filter Panel (Visible in 'list' tab) -->
                <aside class="sidebar" id="sidebar-filters">
                    <div class="filter-group">
                        <label>MAPS <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-maps">
                            <option value="all">ALLE MAPS</option>
                            <!-- Dynamic options -->
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>WAFFEN <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-weapons">
                            <option value="all">ALLE WAFFEN</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>SPIELER <i class="fa-solid fa-chevron-down"></i></label>
                        <select id="filter-players">
                            <option value="all">ALLE</option>
                            <option value="not-full">NICHT VOLL</option>
                        </select>
                    </div>
                </aside>

                <!-- Main Content: Lobby Browser -->
                <main class="lobby-browser">
                    <!-- Tab: FFA Lobby & Offene Lobbys -->
                    <div id="lobby-list-container" class="lobby-list">
                        <!-- Entries will be injected here -->
                    </div>

                    <!-- Tab: Lobby erstellen (Direct view) -->
                    <div id="create-lobby-view" style="display: none;" class="create-view">
                        <h2>EIGENE LOBBY KONFIGURIEREN</h2>
                        <div class="form-container">
                            <div class="input-group">
                                <label>LOBBY NAME</label>
                                <input type="text" id="lobby-name" placeholder="NAME EINGEBEN...">
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label>MAP</label>
                                    <select id="map-select"></select>
                                </div>
                                <div class="input-group">
                                    <label>MODUS</label>
                                    <select id="mode-select">
                                        <option value="ffa">FREE FOR ALL</option>
                                        <option value="tdm">TEAM DEATHMATCH</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label>WAFFEN-LOADOUT</label>
                                <select id="loadout-select"></select>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label>RUNDENZEIT (MIN): <span id="round-time-val">15</span></label>
                                    <input type="range" id="round-time" min="5" max="30" step="5" value="15">
                                </div>
                                <div class="input-group">
                                    <label>MAX. SPIELER: <span id="max-players-val">16</span></label>
                                    <input type="range" id="max-players" min="2" max="16" step="1" value="16">
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <label>RESPAWN-ZEIT (SEK): <span id="respawn-time-val">5</span></label>
                                    <input type="range" id="respawn-time" min="3" max="10" step="1" value="5">
                                </div>
                                <div class="input-group">
                                    <label>KILL-LIMIT: <span id="kill-limit-val">30</span></label>
                                    <input type="range" id="kill-limit" min="0" max="50" step="5" value="30">
                                </div>
                            </div>
                            <div class="toggle-group">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="vehicles-allowed">
                                    <span class="slider"></span>
                                    FAHRZEUGE ERLAUBT
                                </label>
                                <label class="toggle-switch">
                                    <input type="checkbox" id="friendly-fire">
                                    <span class="slider"></span>
                                    FREUNDLICHES FEUER
                                </label>
                            </div>
                            <div class="btn-group">
                                <button class="confirm-btn" id="btn-create-lobby">LOBBY ERSTELLEN</button>
                                <button class="cancel-btn" id="btn-cancel-create">ABBRECHEN</button>
                            </div>
                        </div>
                    </div>

                    <!-- FFA TAB Content -->
                    <div id="ffa-lobby-view" class="lobby-list"></div>
                </main>
            </div>
        </div>

        <!-- Waiting Area / Lobby Screen -->
        <div id="lobby-waiting-area" class="overlay" style="display: none;">
            <div class="lobby-card">
                <header class="lobby-card-header">
                    <h2>LOBBY: <span id="lobby-title">WARTEBEREICH</span></h2>
                </header>
                <div class="lobby-grid">
                    <div class="player-list-section">
                        <h3>SPIELER</h3>
                        <div id="player-list"></div>
                    </div>
                    <div class="settings-section">
                        <h3>EINSTELLUNGEN</h3>
                        <div id="lobby-info-summary" class="info-grid"></div>

                        <h3>TEAM-AUSWAHL</h3>
                        <div class="team-selection">
                            <button class="team-btn" data-team="blue" id="btn-team-blue">BLAU</button>
                            <button class="team-btn" data-team="red" id="btn-team-red">ROT</button>
                            <button class="team-btn" data-team="random" id="btn-team-random">ZUFALL</button>
                            <button class="team-btn" data-team="spectator" id="btn-team-spec">ZUSCHAUER</button>
                        </div>

                        <div class="lobby-chat">
                            <div id="chat-messages"></div>
                            <input type="text" id="chat-input" placeholder="NACHRICHT SENDEN...">
                        </div>

                        <div class="lobby-actions">
                            <button class="ready-btn" id="btn-ready-toggle">BEREIT</button>
                            <button class="start-btn" id="btn-start-game" style="display: none;">STARTEN</button>
                            <button class="leave-btn" id="btn-leave-lobby">VERLASSEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- In-Game HUD -->
    <div id="game-hud" style="display: none;">
        <div class="hud-top-right">
            <div class="hud-timer">
                <i class="fa-solid fa-clock"></i> <span id="hud-time">15:00</span>
            </div>
            <div class="hud-score-container" id="hud-tdm-scores" style="display: none;">
                <div class="score-box blue">BLAU: <span id="score-blue">0</span></div>
                <div class="score-box red">ROT: <span id="score-red">0</span></div>
            </div>
        </div>

        <div class="hud-bottom-right">
            <div class="hud-stat-item">
                <span class="label">KILLS:</span> <span id="hud-kills">0</span>
            </div>
            <div class="hud-stat-item">
                <span class="label">TODE:</span> <span id="hud-deaths">0</span>
            </div>
            <div class="hud-weapon-info">
                <div class="ammo-count"><span id="hud-ammo">100</span></div>
                <div class="weapon-label" id="hud-weapon-name">KARABINER</div>
            </div>
        </div>

        <div class="hud-bottom-left">
            <div class="bars-container">
                <div class="bar-wrapper">
                    <div class="bar-bg"></div>
                    <div class="bar-fill health" id="hud-health-bar"></div>
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="bar-wrapper">
                    <div class="bar-bg"></div>
                    <div class="bar-fill armor" id="hud-armor-bar"></div>
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
            </div>
        </div>

        <div id="hud-countdown" class="hud-center-msg" style="display: none;">
            START IN <span id="countdown-number">10</span>
        </div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay" style="display: none;">
        <div class="winner-card">
            <h1 id="winner-title">RUNDE BEENDET</h1>
            <h2 id="winner-name">SPIELER GEWINNT!</h2>

            <div class="stats-table-container">
                <table id="match-stats-table">
                    <thead>
                        <tr>
                            <th>NAME</th>
                            <th>KILLS</th>
                            <th>TODE</th>
                            <th>K/D</th>
                        </tr>
                    </thead>
                    <tbody id="stats-body"></tbody>
                </table>
            </div>

            <div class="btn-group">
                <button class="confirm-btn" id="btn-back-to-lobby">ZURÜCK ZUR LOBBY</button>
                <button class="cancel-btn" id="btn-back-to-menu">HAUPTMENÜ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
